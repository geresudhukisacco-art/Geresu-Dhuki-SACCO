<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --primary:#0f6b4a;--primary-dark:#0a4f36;--accent:#f0c96a;--gold:#c9962b;--gold-soft:#fbf2dd;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;--danger:#c43838;--danger-soft:#fdecec;--bg:#f4f7fb;
}
html,body{height:100%;}
body{
  min-height:100vh;font-family:"Inter","Noto Sans Ethiopic",sans-serif;
  background:
    radial-gradient(circle at 10% 20%, rgba(15,107,74,.14), transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(201,150,43,.14), transparent 30%),
    var(--bg);
  color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body.ethiopic{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
.background-shape{position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0;}
.shape-one{width:360px;height:360px;background:rgba(15,107,74,.10);top:-120px;left:-120px;}
.shape-two{width:300px;height:300px;background:rgba(201,150,43,.10);bottom:-100px;right:-80px;}
.page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}

.login-container{width:min(1120px,100%);min-height:690px;display:grid;grid-template-columns:1.05fr .95fr;
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:30px;overflow:hidden;
  box-shadow:0 30px 80px rgba(20,40,70,.15),0 10px 30px rgba(20,40,70,.06);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.welcome-panel{position:relative;padding:55px;display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;color:#fff;background:linear-gradient(145deg,#0a4f36 0%,#0f6b4a 55%,#148a5c 100%);}
.welcome-panel::before{content:"";position:absolute;width:450px;height:450px;border-radius:50%;
  border:1px solid rgba(255,255,255,.13);right:-220px;top:-150px;}
.welcome-panel::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;
  border:1px solid rgba(240,201,106,.16);left:-170px;bottom:-150px;}
.panel-content,.panel-footer{position:relative;z-index:2;}
.brand{display:flex;align-items:center;gap:18px;}
.brand-logo{width:76px;height:76px;padding:6px;border-radius:20px;background:rgba(255,255,255,.97);
  box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-logo img,.brand-logo svg{width:100%;height:100%;object-fit:contain;border-radius:14px;display:block;}
.brand-text h2{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.brand-text p{margin-top:5px;font-size:12px;opacity:.78;line-height:1.5;}
.welcome-content{margin-top:95px;max-width:520px;}
.welcome-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:600;margin-bottom:24px;}
.status-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent);}
.welcome-content h1{font-size:clamp(38px,4vw,56px);line-height:1.08;letter-spacing:-2px;font-weight:800;}
.welcome-content h1 span{display:block;color:#f5e3ac;}
.welcome-content p{margin-top:24px;max-width:470px;color:rgba(255,255,255,.80);line-height:1.8;font-size:15px;}
.features{margin-top:35px;display:flex;flex-wrap:wrap;gap:10px;}
.feature{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:12px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.9);}
.feature-icon{font-size:14px;}
.panel-footer{font-size:11px;color:rgba(255,255,255,.62);line-height:1.7;}
.panel-footer strong{color:rgba(255,255,255,.9);font-weight:700;}

.login-panel{padding:55px 60px;display:flex;flex-direction:column;justify-content:center;background:#fff;}
.login-header{margin-bottom:30px;}
.login-header h2{font-size:31px;font-weight:800;letter-spacing:-1px;color:#162033;}
.login-header p{margin-top:9px;font-size:14px;color:var(--muted);line-height:1.6;}
.language-switcher{display:flex;gap:7px;margin-bottom:24px;}
.language-btn{border:1px solid var(--border);background:#f8fafc;color:#667085;padding:7px 13px;
  border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;}
.language-btn:hover{border-color:#b9c7d9;}
.language-btn.active{background:#e6f4ee;color:var(--primary);border-color:#b8d9cb;}

.form-group{margin-bottom:20px;}
.form-label{display:block;margin-bottom:9px;font-size:13px;font-weight:700;color:var(--text-soft);}
.input-wrapper{position:relative;}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted-light);font-size:17px;pointer-events:none;}
.form-input{width:100%;height:54px;padding:0 48px;border:1px solid #d9dee7;border-radius:13px;outline:none;
  font-family:inherit;font-size:14px;color:var(--text);background:#fbfcfe;transition:all .2s;}
.form-input:focus{background:#fff;border-color:#70c9a2;box-shadow:0 0 0 4px rgba(15,107,74,.10);}
.form-input::placeholder{color:#a5adba;}
.form-input[aria-invalid="true"]{border-color:#f0a5ab;box-shadow:0 0 0 4px rgba(196,56,56,.06);}
.password-toggle{position:absolute;right:15px;top:50%;transform:translateY(-50%);border:none;background:none;
  cursor:pointer;color:var(--muted-light);font-size:17px;padding:4px;border-radius:6px;transition:background .15s;}
.password-toggle:hover{background:#f0f4f9;color:var(--text-soft);}
.form-options{display:flex;align-items:center;justify-content:space-between;margin:3px 0 24px;gap:15px;}
.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:#667085;cursor:pointer;user-select:none;opacity:.7;}
.forgot{border:none;background:none;color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.forgot:hover{text-decoration:underline;}

.login-button{width:100%;height:55px;border:none;border-radius:13px;
  background:linear-gradient(135deg,#0f6b4a,#148a5c);color:#fff;font-family:inherit;
  font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 12px 24px rgba(15,107,74,.22);
  transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;}
.login-button:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(15,107,74,.28);}
.login-button:active{transform:translateY(0);}
.login-button:disabled{opacity:.75;cursor:wait;transform:none;}
.btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .65s linear infinite;display:none;}
.login-button.loading .btn-spinner{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}

.message{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5;
  animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.message.error{display:block;color:#b42318;background:var(--danger-soft);border:1px solid #f3c5c5;}
.message.success{display:block;color:#067647;background:#e2f5ec;border:1px solid #a8e3c5;}
.message.info{display:block;color:var(--primary);background:#e6f4ee;border:1px solid #b8d9cb;}

.security-note{display:flex;align-items:center;gap:8px;margin-top:22px;color:var(--muted-light);font-size:11px;line-height:1.5;}
.security-icon{font-size:15px;}

@media (max-width:900px){
  .login-container{grid-template-columns:1fr;min-height:auto;}
  .welcome-panel{min-height:400px;padding:35px;}
  .welcome-content{margin-top:50px;}
  .welcome-content h1{font-size:38px;letter-spacing:-1.4px;}
  .login-panel{padding:45px 35px;}
}
@media (max-width:600px){
  .page{padding:14px;}
  .login-container{border-radius:22px;}
  .welcome-panel{padding:28px 24px;min-height:360px;}
  .brand-logo{width:60px;height:60px;border-radius:16px;}
  .brand-text h2{font-size:17px;}
  .welcome-content{margin-top:40px;}
  .welcome-content h1{font-size:32px;letter-spacing:-1.2px;}
  .welcome-content p{font-size:13px;margin-top:16px;}
  .features{margin-top:22px;}
  .login-panel{padding:35px 24px;}
  .login-header h2{font-size:26px;}
}
</style>

const DEFAULT_SESSION_MINUTES = 30;

function readSession(){
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.uid || !s.expiresAt) return null;
    return s;
  } catch(e){ return null; }
}
function writeSession(uid, minutes){
  const now = Date.now();
  const ms = Math.max(1, Number(minutes) || DEFAULT_SESSION_MINUTES) * 60 * 1000;
  const s = { uid, issuedAt: now, expiresAt: now + ms, minutes: ms / 60000 };
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e){}
  return s;
}

const SUPPORTED = ["en","am","om"];

let LANG = "en";
const t = (k) => (translations[LANG] && translations[LANG][k]) || translations[FALLBACK][k] || k;
function applyLanguage(lang){
  if (!SUPPORTED.includes(lang)) lang = FALLBACK;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle("ethiopic", lang === "am" || lang === "om");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = translations[lang]?.[el.dataset.i18n];
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-placeholder]").forEach(el => {
    const v = translations[lang]?.[el.dataset.placeholder];
    if (typeof v === "string") el.placeholder = v;
  });
  document.querySelectorAll(".language-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  const btn = document.getElementById("loginButton");
  if (btn && !btn.classList.contains("loading")) {
    btn.querySelector(".btn-label").textContent = t("login");
  }
}

/* ============ RESOLVE EMAIL FROM USERNAME OR EMAIL ============ */
async function resolveEmail(input){
  const trimmed = String(input || "").trim();
  if (!trimmed) return { email: "", source: "empty" };
  if (/^\S+@\S+\.\S+$/.test(trimmed)) return { email: trimmed, source: "email" };
  const uname = trimmed.toLowerCase();
  try {
    const snap = await getDoc(doc(db, "usernames", uname));
    if (snap.exists() && snap.data().email) {
      return { email: snap.data().email, source: "username" };
    }
  } catch(e) {
    console.warn("[username lookup]", e.code, e.message);
  }
  return { email: "", source: "notfound" };
}

/* ============================================================
   LOGIN AUDIT — writes a 'login' entry to the audit collection
   ============================================================ */
function getDeviceType(){
  const ua = navigator.userAgent;
  if (/Mobi|Android|iPhone|iPod/i.test(ua)) return "Mobile";
  if (/Tablet|iPad/i.test(ua)) return "Tablet";
  return "Desktop";
}

async function logLoginAudit(user, sessionMinutes){
  try {
    let profile = {};
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) profile = snap.data();
    } catch(e){ /* profile optional */ }

    const mins = Number(sessionMinutes) > 0 ? Number(sessionMinutes) : DEFAULT_SESSION_MINUTES;

    await addDoc(collection(db, "audit"), {
      action: 'login',
      collection: 'users',
      documentId: user.uid,
      userId: user.uid,
      userName: profile.fullName || profile.name || user.email || '',
      userEmail: user.email || '',
      userDisplayName: profile.fullName || profile.name || user.email?.split('@')[0] || 'User',
      userRole: profile.role || 'viewer',
      userPhoto: profile.photoURL || profile.photo || profile.avatar || user.photoURL || '',
      timestamp: serverTimestamp(),
      device: getDeviceType(),
      userAgent: navigator.userAgent,
      sessionMinutes: mins,
      details: `Login from ${getDeviceType()} · ${mins} min session`
    });
    console.log('[audit] login written');
  } catch(e) {
    console.warn('[audit] login write failed:', e.message);
  }
}

/* ============ BIND ============ */
function bindLogin(){
  const form      = document.getElementById("loginForm");
  const idEl      = document.getElementById("identity");
  const passEl    = document.getElementById("password");
  const loginBtn  = document.getElementById("loginButton");
  const btnLabel  = loginBtn.querySelector(".btn-label");
  const messageEl = document.getElementById("message");
  const togglePw  = document.getElementById("togglePassword");
  const forgotBtn = document.getElementById("forgotPassword");

  const showMessage = (text, type = "error") => {
    messageEl.textContent = text;
    messageEl.className = "message " + type;
  };
  const clearMessage = () => {
    messageEl.textContent = "";
    messageEl.className = "message";
  };
  const setLoading = (on, labelKey) => {
    loginBtn.disabled = on;
    loginBtn.classList.toggle("loading", on);
    btnLabel.textContent = on ? t(labelKey || "loggingIn") : t("login");
  };

  document.querySelectorAll(".language-btn").forEach(b => {
    b.addEventListener("click", () => applyLanguage(b.dataset.lang));
  });

  togglePw.addEventListener("click", () => {
    const showing = passEl.type === "text";
    passEl.type = showing ? "password" : "text";
    togglePw.textContent = showing ? "👁" : "🙈";
  });

  forgotBtn.addEventListener("click", async () => {
    clearMessage();
    const input = idEl.value.trim();
    if (!input) { showMessage(t("resetNeedsEmail"), "info"); idEl.focus(); return; }
    const r = await resolveEmail(input);
    if (!r.email) { showMessage(t("notFound"), "error"); return; }
    try {
      await sendPasswordResetEmail(auth, r.email);
      showMessage(t("resetSent"), "success");
    } catch (err) {
      console.warn("[forgot]", err.code, err.message);
      showMessage(t("resetFail"), "error");
    }
  });

  /*
   * AUTH ERROR MAP — every failure that means "wrong credentials" maps to
   * "invalid". Only auth/user-disabled maps to "inactive" because Firebase
   * has already told us the account exists but was disabled at Auth level.
   * Firestore-based inactive detection is handled separately after a
   * successful sign-in (see the profile check below).
   */
  const AUTH_ERROR_MAP = {
    "auth/invalid-email":        "invalid",
    "auth/wrong-password":       "invalid",
    "auth/user-not-found":       "invalid",
    "auth/invalid-credential":   "invalid",
    "auth/invalid-login-credentials": "invalid",
    "auth/missing-password":     "required",
    "auth/missing-email":        "required",
    "auth/too-many-requests":    "tooMany",
    "auth/network-request-failed":"networkError",
    "auth/user-disabled":        "inactive"
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessage();

    const input = idEl.value.trim();
    const password = passEl.value;
    let bad = false;
    if (!input)    { idEl.setAttribute("aria-invalid","true"); bad = true; } else { idEl.removeAttribute("aria-invalid"); }
    if (!password) { passEl.setAttribute("aria-invalid","true"); bad = true; } else { passEl.removeAttribute("aria-invalid"); }
    if (bad) { showMessage(t("required"), "error"); (!input ? idEl : passEl).focus(); return; }

    let emailToUse = input;
    if (!/^\S+@\S+\.\S+$/.test(input)) {
      setLoading(true, "resolving");
      const r = await resolveEmail(input);
      if (!r.email) {
        showMessage(t("notFound"), "error");
        setLoading(false);
        return;
      }
      emailToUse = r.email;
    }

    setLoading(true, "loggingIn");

    let cred;
    try {
      await setPersistence(auth, browserSessionPersistence);
      cred = await signInWithEmailAndPassword(auth, emailToUse, password);
    } catch (err) {
      // CREDENTIAL FAILURES → generic "invalid" (never leak that the account exists)
      console.warn("[login]", err.code, err.message);
      const key = AUTH_ERROR_MAP[err.code] || "invalid";
      showMessage(t(key), "error");
      setLoading(false);
      return;
    }

    // ---------- AUTH SUCCEEDED: now check Firestore status ----------
    // sessionMinutes
    let sessionMinutes = DEFAULT_SESSION_MINUTES;
    try {
      const cfg = await getDoc(doc(db, "system", "config"));
      if (cfg.exists()) {
        const data = cfg.data();
        if (Number(data.sessionMinutes) > 0) sessionMinutes = Number(data.sessionMinutes);
      }
    } catch (err) {
      console.warn("[session config]", err.code || err.message);
    }

    // Reject inactive / deactivated profile
    try {
      const snap = await getDoc(doc(db, "users", cred.user.uid));
      if (snap.exists()) {
        const d = snap.data();
        const status = String(d.status || '').toLowerCase();
        const inactiveStatuses = ['inactive', 'deactivated', 'disabled', 'suspended'];
        if (inactiveStatuses.includes(status)) {
          await signOut(auth);
          clearSession();
          showMessage(t("inactive"), "error");
          setLoading(false);
          return;
        }
      }
    } catch (err) {
      console.warn("[profile]", err.code || err.message);
    }

    // Store session
    writeSession(cred.user.uid, sessionMinutes);
    try { sessionStorage.setItem("sacco.uid", cred.user.uid); } catch(e){}

    // Login audit
    await logLoginAudit(cred.user, sessionMinutes);

    showMessage(t("success"), "success");
    setTimeout(() => { window.location.href = "pages/dashboard.html"; }, 400);
  });
}

/* ============ BOOT ============ */
(async function boot(){
  let saved = null, browser = "en";
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || "en").slice(0,2);
  browser = SUPPORTED.includes(b) ? b : "en";
  LANG = SUPPORTED.includes(saved) ? saved : browser;
  document.documentElement.lang = LANG;
  document.body.classList.toggle("ethiopic", LANG === "am" || LANG === "om");

  let redirectReason = null;
  try { redirectReason = sessionStorage.getItem("__redirectReason"); } catch(e){}
  if (redirectReason) { try { sessionStorage.removeItem("__redirectReason"); } catch(e){} }

  const existing = readSession();
  if (isSessionValid(existing)) {
    await auth.authStateReady?.();
    if (auth.currentUser && auth.currentUser.uid === existing.uid) {
      // Re-verify inactive status before auto-redirect
      try {
        const snap = await getDoc(doc(db, "users", auth.currentUser.uid));
        if (snap.exists()) {
          const status = String(snap.data().status || '').toLowerCase();
          if (['inactive','deactivated','disabled','suspended'].includes(status)) {
            await signOut(auth);
            clearSession();
          } else {
            window.location.replace("pages/dashboard.html");
            return;
          }
        } else {
          window.location.replace("pages/dashboard.html");
          return;
        }
      } catch (err) {
        // If we can't read the profile (offline, rules), let them through
        window.location.replace("pages/dashboard.html");
        return;
      }
    } else {
      clearSession();
    }
  } else if (existing) {
    clearSession();
  }

  renderLogin();

  if (redirectReason === "expired") {
    setTimeout(() => {
      const el = document.getElementById("message");
      if (el) { el.textContent = t("sessionExpired"); el.className = "message error"; }
    }, 100);
  }
})();

console.log("[sacco] login ready (session-based, email or username, audit-on-login, inactive-block)");
</script>
