<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>
<script type="importmap">
{ "imports": {
  "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --gold:#d4a845;--gold-light:#f0d68a;--gold-dark:#b8922f;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;--info:#2196f3;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;--violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px;--r-lg:20px;--r-full:999px;
  --radius:16px;--radius-sm:10px;--shadow:var(--sh-sm);
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
html.theme-dark body{background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.14),transparent 35%),radial-gradient(circle at 90% 80%,rgba(25,169,116,.14),transparent 35%),var(--bg);}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;pointer-events:none;}
#loader.hide{opacity:0;pointer-events:none;visibility:hidden;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar__brand{position:relative;display:flex;align-items:center;gap:14px;
  padding:22px;border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.97);
  display:grid;place-items:center;padding:5px;overflow:hidden;flex-shrink:0;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;transition:opacity .18s;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.sidebar__title .sacco-gold{color:#f0d68a;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);
  border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer;z-index:10;}
.sidebar__collapse i{font-size:10px;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;
  font-size:14px;font-weight:600;color:rgba(255,255,255,.78);
  margin-bottom:3px;white-space:nowrap;cursor:pointer;position:relative;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;text-align:center;flex-shrink:0;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);
  position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);
  background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
.sidebar__logout i{width:20px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);
  align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;
  border-radius:var(--r-full);background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);white-space:nowrap;}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
html.theme-dark .dropdown__panel{background:#0f172a;border-color:#1e293b;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);
  text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
html.theme-dark .main{background:#0b1220;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 20px;margin-bottom:20px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
html.theme-dark .breadcrumb{background:#0f172a;border-color:#1e293b;}
.breadcrumb__item{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb__item.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb__item.is-link{cursor:pointer;}
.breadcrumb__item.is-link:hover{background:#dbeafe;color:var(--primary);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:46px;padding:0 20px;border-radius:13px;
  border:1px solid #d9dee7;background:#fff;color:var(--text-soft);font-size:14px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:all .15s;}
html.theme-dark .btn{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--secondary{background:#fff;border:1px solid #d9dee7;color:var(--text-soft);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--warning{background:linear-gradient(135deg,#e67e22,#f39c12);border:none;color:#fff;}
.btn--success{background:linear-gradient(135deg,#2d7a3d,#1f5e2c);border:none;color:#fff;}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.settings-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:flex-start;}
.settings-nav{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);
  box-shadow:var(--sh-sm);padding:12px;position:sticky;top:90px;}
html.theme-dark .settings-nav{background:#0f172a;border-color:#1e293b;}
.settings-nav h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted-light);padding:8px 12px 4px;margin:0;}
.settings-nav ul{list-style:none;padding:0;margin:0;}
.settings-nav li{margin-bottom:2px;}
.settings-nav button{display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-radius:var(--radius-sm);color:var(--muted);background:transparent;border:none;
  font-weight:600;font-size:14px;cursor:pointer;width:100%;text-align:left;
  transition:.2s;font-family:inherit;position:relative;}
.settings-nav button i{width:20px;text-align:center;font-size:16px;color:var(--muted-light);transition:color .2s;}
.settings-nav button:hover{background:var(--bg-soft);color:var(--text);}
.settings-nav button:hover i{color:var(--primary);}
.settings-nav button.active{background:rgba(11,92,171,.12);color:var(--primary);font-weight:700;}
.settings-nav button.active i{color:var(--primary);}
.settings-nav .danger-nav-item button:hover{background:rgba(220,38,38,.1);color:var(--danger);}
.settings-nav .danger-nav-item button:hover i{color:var(--danger);}
.settings-nav .danger-nav-item button.active{background:rgba(220,38,38,.12);color:var(--danger);}
.settings-nav button .nav-lock{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted-light);display:none;}
.settings-nav button.locked .nav-lock{display:block;}
.settings-nav button.locked{opacity:.7;}
.settings-nav button.personal-allowed::after{content:'👤';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10px;opacity:.7;}
.settings-panels{min-width:0;}
.settings-panel{display:none;}
.settings-panel.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.settings-card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);
  box-shadow:var(--sh-sm);margin-bottom:20px;overflow:hidden;}
html.theme-dark .settings-card{background:#0f172a;border-color:#1e293b;}
.settings-card-header{padding:18px 24px 14px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:12px;background:var(--bg-soft);}
html.theme-dark .settings-card-header{background:#111a2c;border-bottom-color:#1e293b;}
.settings-card-header .card-icon{width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.settings-card-header .card-title-block{flex:1;min-width:0;}
.settings-card-header h3{font-size:16px;font-weight:800;margin-bottom:2px;}
.settings-card-header p{font-size:13px;color:var(--muted);}
.settings-card-body{padding:22px 24px;}
.settings-form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.settings-form-row.three{grid-template-columns:1fr 1fr 1fr;}
.settings-form-row.single{grid-template-columns:1fr;}
.settings-form-group{position:relative;}
.settings-form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text-soft);}
.settings-form-group label .required{color:var(--danger);margin-left:3px;}
.settings-form-group input, .settings-form-group select, .settings-form-group textarea{
  width:100%;padding:10px 14px;border:1px solid #d9dee7;border-radius:11px;
  font-size:14px;font-family:inherit;background:#fbfcfe;color:var(--text);transition:all .2s;}
html.theme-dark .settings-form-group input,html.theme-dark .settings-form-group select,html.theme-dark .settings-form-group textarea{background:#1a2433;border-color:#1e293b;color:#e4e8f0;}
.settings-form-group textarea{resize:vertical;min-height:80px;}
.settings-form-group input:focus, .settings-form-group select:focus, .settings-form-group textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(11,92,171,.10);background:#fff;}
html.theme-dark .settings-form-group input:focus,html.theme-dark .settings-form-group select:focus,html.theme-dark .settings-form-group textarea:focus{background:#0f172a;}
.settings-form-group input:disabled, .settings-form-group select:disabled{opacity:.55;cursor:not-allowed;background:var(--bg-soft);}
.settings-form-group .input-hint{font-size:11.5px;color:var(--muted);margin-top:4px;display:block;}
.settings-form-group .input-hint strong{color:var(--primary);font-weight:700;}
.input-with-unit{position:relative;}
.input-with-unit input{padding-right:60px;}
.input-with-unit .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:12px;font-weight:700;color:var(--muted);pointer-events:none;}
.share-summary-box{background:linear-gradient(135deg,rgba(11,92,171,.06),rgba(11,92,171,.02));
  border:1px solid rgba(11,92,171,.2);border-radius:var(--radius-sm);padding:14px 18px;
  margin-bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.share-summary-box .share-item{display:flex;flex-direction:column;gap:2px;}
.share-summary-box .share-item .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.share-summary-box .share-item .value{font-size:18px;font-weight:800;color:var(--primary);}
.share-summary-box .share-item .value .cur{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px;}
.toggle-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  padding:14px 0;border-bottom:1px solid var(--border-soft);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .toggle-text{flex:1;min-width:0;}
.toggle-row .toggle-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.toggle-row .toggle-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.toggle-switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-switch .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;
  background-color:#ccc;transition:.3s;border-radius:26px;}
.toggle-switch .slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;
  background-color:#fff;transition:.3s;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.toggle-switch input:checked + .slider{background-color:var(--primary);}
.toggle-switch input:checked + .slider:before{transform:translateX(22px);}
.toggle-switch input:disabled + .slider{opacity:.5;cursor:not-allowed;}
.theme-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
.theme-option{background:var(--bg-soft);border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.theme-option:hover{border-color:var(--primary);transform:translateY(-2px);}
.theme-option.selected{border-color:var(--primary);background:rgba(11,92,171,.08);}
.theme-option .theme-preview{width:100%;height:50px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--border);}
.theme-option .theme-preview .theme-preview-sidebar{width:30%;height:100%;}

const SESSION_KEY = "sacco.session";
const DEFAULT_SESSION_MINUTES = 30;
let SESSION_MINUTES = null;
let awayStartedAt = null, awayCheckInterval = null;

function readSession() { try { const r = sessionStorage.getItem(SESSION_KEY); if (!r) return null; const s = JSON.parse(r); return (s && s.uid) ? s : null; } catch (e) { return null; } }
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function isSessionRecordValid(s) { return !!(s && s.uid); }
function getSessionMs() {
  const s = readSession();
  const mins = (SESSION_MINUTES != null && SESSION_MINUTES > 0)
    ? SESSION_MINUTES
    : ((s && s.minutes) || DEFAULT_SESSION_MINUTES);
  return Math.max(1, mins) * 60 * 1000;
}
function readCachedProfile() { try { const raw = sessionStorage.getItem(PROFILE_CACHE_KEY); if (!raw) return null; const p = JSON.parse(raw); return (p && p.uid) ? p : null; } catch (e) { return null; } }

function forceLogout(reason) {
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  awayStartedAt = null;

  try { signOut(auth); } catch (e) {}

function isWindowActive() { return document.visibilityState === 'visible' && document.hasFocus(); }
function startAwayTimer() {
  if (awayStartedAt) return;
  awayStartedAt = Date.now();
  if (awayCheckInterval) clearInterval(awayCheckInterval);
  awayCheckInterval = setInterval(() => {
    if (!awayStartedAt) return;
    if (Date.now() - awayStartedAt >= getSessionMs()) { forceLogout('expired'); return; }
  }, 1000);
}
function stopAwayTimer() { awayStartedAt = null; if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; } }
function evaluateActivity() {
  if (isWindowActive()) {
    if (awayStartedAt) { const away = Date.now() - awayStartedAt; if (away >= getSessionMs()) { forceLogout('expired'); return; } }
    stopAwayTimer();
  } else { startAwayTimer(); }
}
function startSessionWatcher() {
  document.addEventListener('visibilitychange', evaluateActivity);
  window.addEventListener('focus', evaluateActivity);
  window.addEventListener('blur', evaluateActivity);
  evaluateActivity();
}
async function loadSessionTimeout() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const data = snap.data();
      let mins = DEFAULT_SESSION_MINUTES;
      if (data.sessionTimeout != null) mins = Number(data.sessionTimeout);
      else if (data.sessionTimeoutMinutes != null) mins = Number(data.sessionTimeoutMinutes);
      if (!isFinite(mins) || mins < 1) mins = DEFAULT_SESSION_MINUTES;
      if (mins > 1440) mins = 1440;
      SESSION_MINUTES = Math.round(mins);
    } else {
      SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
    }
  } catch (e) {
    if (SESSION_MINUTES == null) SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
  }
  try {
    const s = readSession();
    if (s) { s.minutes = SESSION_MINUTES; sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  } catch (e) {}

const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();

function toast(msg, type='success'){
  const wrap = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
  el.innerHTML = `<i class="fas ${icons[type] || 'fa-info-circle'}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3800);
  setTimeout(() => el.remove(), 4200);
}

function renderBrandTitle(name){
  const raw = (name && String(name).trim()) ? String(name).trim() : DEFAULT_SACCO_NAME;
  const words = raw.split(/\s+/);
  if (words.length < 2) return esc(raw);
  const tail = words.pop();
  const head = words.join(' ');
  return esc(head) + ' <span class="sacco-gold">' + esc(tail) + '</span>';
}

const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
  if (v) Object.keys(v).forEach(x => { s = s.replace('{'+x+'}', v[x]); });
  return s;
};

============================================================ */
function renderShell(){
  const navHtml = NAV_DEF.map(g => {
    const items = g.items.filter(canSeeNav);
    if (!items.length) return '';
    return `<div class="sidebar__section">${esc(t(g.section))}</div>` +
      items.map(it => {
        const active = it.key === 'settings' ? ' is-active' : '';
        return `<a class="nav-item${active}" href="${it.href}" data-tooltip="${esc(t(it.key))}">
          <i class="fas ${it.icon}"></i><span class="nav-item__label">${esc(t(it.key))}</span>
        </a>`;
      }).join('');
  }).join('');

  const saccoName = (currentSettings.saccoName && String(currentSettings.saccoName).trim()) || DEFAULT_SACCO_NAME;
  const avatarHtml = currentUserPhoto
    ? `<img src="${esc(currentUserPhoto)}" alt="">`
    : esc(initials(currentUserDisplayName));

  document.getElementById('app').innerHTML = `
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <div class="sidebar__logo">${LOGO_HTML}</div>
          <div class="sidebar__identity">
            <div class="sidebar__title" title="${esc(saccoName)}">${renderBrandTitle(saccoName)}</div>
            <div class="sidebar__subtitle">${esc(t('brandSub'))}</div>
          </div>
          <button class="sidebar__collapse" id="sbCollapseBtn" aria-label="Toggle sidebar">
            <i class="fas fa-chevron-left"></i>
          </button>
        </div>
        <nav class="sidebar__nav">${navHtml}</nav>
        <div class="sidebar__footer">
          <button class="sidebar__logout" id="sbLogout">
            <i class="fas fa-sign-out-alt"></i><span>${esc(t('logout'))}</span>
          </button>
        </div>
      </aside>
      <header class="topbar">
        <button class="topbar__menu" id="btnMenu"><i class="fas fa-bars"></i></button>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <div class="lang-toggle">
            <button data-lang="en" class="${LANG==='en'?'is-active':''}">EN</button>
            <button data-lang="am" class="${LANG==='am'?'is-active':''}">አማ</button>
            <button data-lang="om" class="${LANG==='om'?'is-active':''}">OM</button>
          </div>
          <div class="user-btn" id="userBtn">
            <div class="user-btn__avatar">${avatarHtml}</div>
            <div>
              <span class="user-btn__name">${esc(currentUserDisplayName)}</span>
              <span class="user-btn__role">${esc(roleLabel(currentUserRole))}</span>
            </div>
            <div class="dropdown__panel hidden" id="userMenu">
              <div class="dropdown__header">
                <strong>${esc(currentUserDisplayName)}</strong>
                <span>${esc(currentUserEmail)} · ${esc(roleLabel(currentUserRole))}</span>
              </div>
              <button class="dropdown__item dropdown__item--danger" id="menuLogout">
                <i class="fas fa-sign-out-alt"></i><span>${esc(t('logout'))}</span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <main class="main" id="mainContent"></main>
    </div>
  `;

  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  document.getElementById('sbCollapseBtn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const c = !document.body.classList.contains('sidebar-collapsed');
    document.body.classList.toggle('sidebar-collapsed', c);
    try { localStorage.setItem('sacco.sidebar', c ? 'collapsed' : 'expanded'); } catch(e){}
  });
  document.getElementById('btnMenu')?.addEventListener('click', () => document.body.classList.toggle('sb-open'));
  document.getElementById('overlayMobile')?.addEventListener('click', () => document.body.classList.remove('sb-open'));
  document.getElementById('sbLogout')?.addEventListener('click', showLogoutModal);
  document.getElementById('menuLogout')?.addEventListener('click', showLogoutModal);
  const ub = document.getElementById('userBtn');
  ub?.addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('userMenu')?.classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#userBtn')) document.getElementById('userMenu')?.classList.add('hidden');
  });
  try {
    if (localStorage.getItem('sacco.sidebar') === 'collapsed') document.body.classList.add('sidebar-collapsed');
  } catch(e){}
}
function setLang(lang){
  if (!SUPPORTED.includes(lang)) lang = 'en';
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

            <p>${esc(desc)}</p>
          </div>
        </div>
        <div class="settings-card-body">
          ${lock ? `<div class="role-locked-banner" id="lock-${section}">
            <i class="fas fa-lock"></i>
            <div><strong>${esc(t('readOnlyLabel'))}</strong> ${esc(t('roleAdminOnlySection'))}</div>
          </div>` : ''}
          ${body}
        </div>
        ${actions ? `

          <span class="save-state-hint" data-section="${section}"><i class="fas fa-check-circle"></i><span>${esc(t('allChangesSaved'))}</span></span>
          <button class="btn btn--secondary btn--sm" data-reset="${section}"><i class="fas fa-undo"></i> ${esc(t('reset'))}</button>
          <button class="btn btn--primary btn--sm" data-save="${section}"><i class="fas fa-save"></i> ${esc(t('save'))}</button>
        </div>` : ''}
      </div>
    </div>`;
}
function row2(a, b){ return `<div class="settings-form-row">${a}${b}</div>`; }
function row3(a, b, c){ return `<div class="settings-form-row three">${a}${b}${c}</div>`; }
function row1(a){ return `<div class="settings-form-row single">${a}</div>`; }
function fld(id, label, opts = {}){
  const { type='text', placeholder='', hint='', unit='', required=false, step='', min='', max='' } = opts;
  const req = required ? ' <span class="required">*</span>' : '';
  const attrs = `${step?`step="${step}"`:''} ${min!==''?`min="${min}"`:''} ${max!==''?`max="${max}"`:''}`;
  const input = unit
    ? `<div class="input-with-unit"><input type="number" id="${id}" ${attrs} placeholder="${esc(placeholder)}" /><span class="unit">${esc(unit)}</span></div>`
    : `<input type="${type}" id="${id}" ${attrs} placeholder="${esc(placeholder)}" />`;
  const hintHtml = hint ? `<span class="input-hint">${hint}</span>` : '';
  return `<div class="settings-form-group"><label>${esc(label)}${req}</label>${input}${hintHtml}</div>`;
}
function fldSel(id, label, opts, options){
  return `<div class="settings-form-group"><label>${esc(label)}</label>
    <select id="${id}">${options.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('')}</select>
  </div>`;
}
function fldToggle(id, title, desc){
  return `<div class="toggle-row">
    <div class="toggle-text"><div class="toggle-title">${esc(title)}</div><div class="toggle-desc">${esc(desc)}</div></div>
    <label class="toggle-switch"><input type="checkbox" id="${id}" /><span class="slider"></span></label>
  </div>`;
}

      if (panel) panel.classList.add('active');
    });
  });

  document.querySelectorAll('.theme-option').forEach(opt => {
    opt.addEventListener('click', function(){
      if (!canEditSection('appearance')) return;
      document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('selected'));
      this.classList.add('selected');
      document.getElementById('theme').value = this.dataset.theme;
      applyTheme(this.dataset.theme);
      updateDirtyIndicators();
    });
  });

  document.querySelectorAll('[data-save]').forEach(btn =>

    btn.addEventListener('click', function(){ resetSection(this.dataset.reset); }));

  document.getElementById('clearCacheBtn')?.addEventListener('click', clearCache);

  document.getElementById('exportAllDataBtn')?.addEventListener('click', exportAllData);
  document.getElementById('exportAllDataJsonBtn')?.addEventListener('click', exportAllDataJSON);
  document.getElementById('exportSettingsBtn')?.addEventListener('click', exportSettings);

    });

    if (bv) bv.textContent = mins;
    if (badge) badge.textContent = mins + ' min';
    document.querySelectorAll('#sessionPresets button').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.minutes) === mins);

    }
  });

    const el = document.getElementById(id);

      el.addEventListener('input', () => { updateRepaymentRulesPreview(); updateDirtyIndicators(); });
      el.addEventListener('change', () => { updateRepaymentRulesPreview(); updateDirtyIndicators(); });
    }
  });

    if (!isAdmin) { toast(t('unauthorized'), 'error'); return; }
    const formPrice = Number(document.getElementById('shareValue')?.value) || 0;
    if (formPrice <= 0) { toast(t('recalcSharesInvalidPrice'), 'warning'); return; }
    const savedPrice = Number(currentSettings.shareValue) || formPrice;
    const priceChanged = Math.abs(savedPrice - formPrice) > 0.0001;

    if (priceChanged) {
      try {
        await setDoc(doc(db, 'settings', 'system'),
          { shareValue: formPrice, sharePrice: formPrice },
          { merge: true });
        await logAudit('updated', 'settings', 'system',
          { shareValue: formPrice, sharePrice: formPrice }, 'Share value updated via recalculation');

        savedSettings   = { ...currentSettings };
        loadSettingsToForm(currentSettings);
        updateDirtyIndicators();

        toast(t('settingsSaveError') + e.message, 'error');
        return;
      }
    }
    await promptRecalcShares(savedPrice, formPrice, priceChanged);
  });

  wireProfileEditor();
  fillProfileForm();
}

async function loadUserProfile(){
  if (!auth.currentUser) return;
  try {
    const snap = await getDoc(doc(db, 'users', auth.currentUser.uid));
    if (snap.exists()){
      const d = snap.data();
      currentUserProfile = {
        fullName:     d.fullName || d.name || d.displayName || '',
        displayName:  d.displayName || d.fullName || d.name || '',
        phone:        d.phone || '',
        position:     d.position || d.title || '',
        department:   d.department || '',
        employeeId:   d.employeeId || '',
        bio:          d.bio || '',
        photoURL:     d.photoURL || ''
      };
      if (currentUserProfile.displayName || currentUserProfile.fullName){
        currentUserDisplayName = currentUserProfile.displayName || currentUserProfile.fullName;
      }
      if (currentUserProfile.photoURL) currentUserPhoto = currentUserProfile.photoURL;
    }
  } catch (e) { console.warn('[profile] load', e.message); }
}
function initialsFromName(name){
  return (name || 'U').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
}
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function fillProfileForm(){
  const set = (id,v) => { const e = document.getElementById(id); if (e) e.value = v ?? ''; };
  set('profileFullName',    currentUserProfile.fullName);
  set('profileDisplayName', currentUserProfile.displayName);
  set('profilePhone',       currentUserProfile.phone);
  set('profilePosition',    currentUserProfile.position);
  set('profileDepartment',  currentUserProfile.department);
  set('profileEmployeeId',  currentUserProfile.employeeId);
  set('profileBio',         currentUserProfile.bio);
  set('profileEmail',       currentUserEmail);
  set('profileUid',         auth.currentUser?.uid || '—');
  set('profileRoleChip',    roleLabel(currentUserRole));

  const circle   = document.getElementById('profilePhotoCircle');
  const preview  = document.getElementById('profilePhotoPreview');
  const initialsEl = document.getElementById('profileInitials');
  const nameForInitials = currentUserProfile.fullName || currentUserDisplayName || 'User';
  if (initialsEl) initialsEl.textContent = initialsFromName(nameForInitials);
  if (currentUserProfile.photoURL){
    if (preview) preview.src = currentUserProfile.photoURL;
    circle?.classList.add('has-img');
  } else {
    if (preview) preview.src = '';
    circle?.classList.remove('has-img');
  }
  _profilePhotoDataURL = null;
  markProfileDirty(false);
}
function markProfileDirty(isDirty){
  const hint = document.getElementById('profileStatusHint');
  if (!hint) return;
  if (isDirty){
    hint.innerHTML = `<i class="fas fa-circle" style="color:var(--warning)"></i><span style="color:var(--warning);font-weight:700">${esc(t('profileStatusDirty'))}</span>`;
    hint.classList.add('dirty');
  } else {
    hint.innerHTML = `<i class="fas fa-info-circle"></i><span>${esc(t('profileStatusUpToDate'))}</span>`;
    hint.classList.remove('dirty');
  }
}
function wireProfileEditor(){
  const circle   = document.getElementById('profilePhotoCircle');
  const input    = document.getElementById('profilePhotoInput');
  const preview  = document.getElementById('profilePhotoPreview');
  const initialsEl = document.getElementById('profileInitials');
  if (!circle || !input) return;

  const pick = () => input.click();
  circle.addEventListener('click', pick);
  document.getElementById('profilePhotoPickBtn')?.addEventListener('click', pick);
  document.getElementById('profilePhotoRemoveBtn')?.addEventListener('click', () => {
    _profilePhotoDataURL = null;
    currentUserProfile.photoURL = '';
    if (preview) preview.src = '';
    circle.classList.remove('has-img');
    markProfileDirty(true);
  });

  input.addEventListener('change', async () => {
    const f = input.files?.[0];
    if (!f) return;
    if (f.size > 3 * 1024 * 1024){ toast('Photo must be under 3 MB', 'error'); input.value = ''; return; }
    try {
      const url = await fileToDataURL(f);
      _profilePhotoDataURL = url;
      if (preview) preview.src = url;
      circle.classList.add('has-img');
      markProfileDirty(true);
    } catch (e) { toast('Could not read image', 'error'); }
  });

  document.getElementById('profileFullName')?.addEventListener('input', (e) => {
    if (initialsEl) initialsEl.textContent = initialsFromName(e.target.value || 'U');
    markProfileDirty(true);
  });
  ['profileDisplayName','profilePhone','profilePosition','profileDepartment','profileEmployeeId','profileBio'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', () => markProfileDirty(true));
  });

  document.getElementById('profileResetBtn')?.addEventListener('click', () => { fillProfileForm(); });
  document.getElementById('profileSaveBtn')?.addEventListener('click', saveUserProfile);
}
async function saveUserProfile(){
  const u = auth.currentUser;
  if (!u){ toast('Not signed in.', 'error'); return; }

  const g = (id) => document.getElementById(id)?.value.trim() || '';
  const fullName = g('profileFullName');
  if (!fullName || fullName.length < 2){
    toast('Full name is required (min 2 characters).', 'warning');
    return;
  }
  const payload = {
    fullName,
    displayName:  g('profileDisplayName') || fullName,
    phone:        g('profilePhone'),
    position:     g('profilePosition'),
    department:   g('profileDepartment'),
    employeeId:   g('profileEmployeeId'),
    bio:          g('profileBio'),
    photoURL:     _profilePhotoDataURL !== null ? _profilePhotoDataURL : (currentUserProfile.photoURL || ''),
    updatedAt:    serverTimestamp()
  };

  const btn = document.getElementById('profileSaveBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${esc(t('loading'))}`;

  try {
    await setDoc(doc(db, 'users', u.uid), payload, { merge: true });

    currentUserProfile = { ...currentUserProfile, ...payload };
    _profilePhotoDataURL = null;
    currentUserDisplayName = payload.displayName || payload.fullName;
    currentUserPhoto = payload.photoURL || '';

    await logAudit('updated', 'users', u.uid, { fields: Object.keys(payload) }, 'User updated own profile');

    renderShell();
    renderMain();
    toast('Profile updated successfully!', 'success');
  } catch (e) {
    console.error('[profile] save', e);
    toast(t('errorSave') + e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* ============================================================
   PERMISSIONS
============================================================ */
function applyPermissions(){
  const adminOnlySections = ['financial','loan','penalties','security','advanced','backup','danger'];
  Object.keys(SECTION_FIELDS).forEach(section => {
    const fields = SECTION_FIELDS[section] || [];
    const locked = adminOnlySections.includes(section) && !isAdmin;
    fields.forEach(fieldId => {
      const el = document.getElementById(fieldId);
      if (el) el.disabled = locked;
    });
    const lockBanner = document.getElementById('lock-' + section);
    if (lockBanner) lockBanner.classList.toggle('show', locked);
    document.querySelectorAll(`[data-save="${section}"], [data-reset="${section}"]`).forEach(btn => {
      btn.disabled = locked;
      btn.style.opacity = locked ? '0.5' : '';
    });
  });

  ['resetAllSettingsBtn','clearCacheBtn','deleteAllTransactionsBtn','importSettingsBtn',
   'exportAllDataBtn','exportAllDataJsonBtn','exportSettingsBtn','importFullBackupBtn','mergeFullBackupBtn',
   'recalcSharesBtn'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.disabled = !isAdmin; el.style.opacity = !isAdmin ? '0.5' : ''; }
  });

  document.querySelectorAll('.settings-nav button').forEach(btn => {
    const section = btn.dataset.section;
    if (section === 'profile') { btn.classList.remove('locked'); return; }
    const locked = adminOnlySections.includes(section) && !isAdmin;
    btn.classList.toggle('locked', locked);
  });
}
function canEditSection(section){
  if (isAdmin) return true;
  return USER_EDITABLE_SECTIONS.includes(section);
}

function isFieldDirty(fieldId){
  const el = document.getElementById(fieldId);
  if (!el) return false;
  const cur = currentSettings[fieldId];
  const val = el.type === 'checkbox' ? el.checked :
              el.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
  const curNorm = (cur === undefined || cur === null) ? '' : cur;
  return String(val) !== String(curNorm);
}
function countDirtyFields(){
  let c = 0;
  Object.values(SECTION_FIELDS).flat().forEach(f => { if (isFieldDirty(f)) c++; });
  return c;
}
function updateDirtyIndicators(){
  const n = countDirtyFields();
  const bar = document.getElementById('floatingSaveBar');
  const countEl = document.getElementById('unsavedCount');
  if (n > 0 && bar && countEl) { bar.classList.add('show'); countEl.textContent = n; }
  else if (bar) bar.classList.remove('show');

  Object.entries(SECTION_FIELDS).forEach(([section, fields]) => {
    const hint = document.querySelector(`.save-state-hint[data-section="${section}"]`);
    if (!hint) return;
    const has = fields.some(f => isFieldDirty(f));
    hint.classList.toggle('dirty', has);
    const span = hint.querySelector('span');
    const icon = hint.querySelector('i');
    if (has) {
      if (icon) icon.className = 'fas fa-circle';
      if (span) span.textContent = `${t('unsavedChanges')} ${fields.filter(f => isFieldDirty(f)).length} ${t('unsavedChangesSuffix')}`;
    } else {
      if (icon) icon.className = 'fas fa-check-circle';
      if (span) span.textContent = t('allChangesSaved');
    }
  });
}

/* ============================================================
   SHARE PRICE RECALCULATION
============================================================ */
async function recalculateSharesOnPriceChange(oldPrice, newPrice){
  if (!isAdmin) return { updated:0, printed:0 };
  if (!oldPrice || !newPrice || oldPrice <= 0 || newPrice <= 0) return { updated:0, printed:0 };
  if (Math.abs(oldPrice - newPrice) < 0.0001) return { updated:0, printed:0 };

  const snap = await getDocs(collection(db, 'shares'));
  const eligible = [];
  let printedCount = 0;

  snap.forEach(d => {
    const data = d.data();
    if (String(data.status || '').toLowerCase() !== 'approved') return;
    if (data.isMerged) return;
    const oldShares = Number(data.shares) || 0;
    const oldAmount = Number(data.amount) || (oldShares * oldPrice);
    if (oldShares <= 0 || oldAmount <= 0) return;

    const newShares = Math.max(1, Math.round(oldAmount / newPrice));
    const newAmount = Math.round(newShares * newPrice * 100) / 100;
    const wasPrinted = Number(data.printCount || 0) > 0;
    if (wasPrinted) printedCount++;

    eligible.push({ id:d.id, oldShares, oldAmount, newShares, newAmount, wasPrinted });
  });

  if (!eligible.length) return { updated:0, printed:0 };

  let oldTotal = 0, newTotal = 0;
  eligible.forEach(u => { oldTotal += u.oldAmount; newTotal += u.newAmount; });

  let written = 0;
  for (let i = 0; i < eligible.length; i += 400) {
    const chunk = eligible.slice(i, i + 400);
    const b = writeBatch(db);
    chunk.forEach(u => {
      const updates = {
        shares: u.newShares,
        pricePerShare: newPrice,
        amount: u.newAmount,
        updatedAt: serverTimestamp(),
        recalculatedAt: serverTimestamp(),
        recalculatedFrom: oldPrice,
        recalculatedTo: newPrice
      };
      if (u.wasPrinted) updates.needsReprint = true;
      b.update(doc(db, 'shares', u.id), updates);
    });
    await b.commit();
    written += chunk.length;
  }

  await logAudit('updated', 'shares', 'price_change', {
    oldPrice, newPrice,
    recordsUpdated: written,
    oldTotalValue: Math.round(oldTotal * 100) / 100,
    newTotalValue: Math.round(newTotal * 100) / 100,
    delta: Math.round((newTotal - oldTotal) * 100) / 100,
    printed: printedCount
  }, `Recalculated ${written} share records (${oldPrice} → ${newPrice} per share)`);

  return {
    updated: written,
    printed: printedCount,
    oldTotalValue: Math.round(oldTotal * 100) / 100,
    newTotalValue: Math.round(newTotal * 100) / 100,
    delta: Math.round((newTotal - oldTotal) * 100) / 100
  };
}

async function promptRecalcShares(oldPrice, newPrice, force = false){
  if (!isAdmin) { toast(t('unauthorized'), 'error'); return; }
  if (!force && Math.abs(oldPrice - newPrice) < 0.0001) {
    toast(t('recalcSharesSkipped'), 'info');
    return;
  }

  const snap = await getDocs(collection(db, 'shares'));
  const preview = { count:0, printed:0, oldTotal:0, newTotal:0 };
  snap.forEach(d => {
    const data = d.data();
    if (String(data.status || '').toLowerCase() !== 'approved') return;
    if (data.isMerged) return;
    const oldShares = Number(data.shares) || 0;
    const oldAmount = Number(data.amount) || (oldShares * oldPrice);
    if (oldShares <= 0 || oldAmount <= 0) return;
    const newShares = Math.max(1, Math.round(oldAmount / newPrice));
    const newAmount = Math.round(newShares * newPrice * 100) / 100;
    preview.count++;
    preview.oldTotal += oldAmount;
    preview.newTotal += newAmount;
    if (Number(data.printCount || 0) > 0) preview.printed++;
  });

  if (!preview.count) { toast(t('recalcSharesNone'), 'info'); return; }

  const delta = Math.round((preview.newTotal - preview.oldTotal) * 100) / 100;
  const deltaStr = (delta >= 0 ? '+' : '') + delta.toFixed(2);
  const newSharesExample = Math.max(1, Math.round(oldPrice / newPrice));

  const exampleLine = t('recalcSharesExample')
    .replace('{oldShares}', '1')
    .replace('{oldPrice}', Number(oldPrice).toFixed(2))
    .replace('{oldAmount}', Number(oldPrice).toFixed(2))
    .replace('{newShares}', String(newSharesExample))
    .replace('{newPrice}', Number(newPrice).toFixed(2))
    .replace('{newAmount}', (newSharesExample * newPrice).toFixed(2));

  const summaryLine = t('recalcSharesSummary')
    .replace('{n}', String(preview.count))
    .replace('{oldTotal}', preview.oldTotal.toFixed(2))
    .replace('{newTotal}', preview.newTotal.toFixed(2))
    .replace('{delta}', deltaStr);

  const msg =
    `${exampleLine}\n\n${summaryLine}` +
    (preview.printed > 0 ? `\n\n${t('recalcSharesPrintedWarn').replace('{n}', String(preview.printed))}` : '') +
    `\n\n${t('recalcSharesConfirm')}`;

  showConfirmModal(t('recalcSharesTitle'), msg, 'warning', async () => {
    const loader = document.getElementById('loader');
    if (loader) loader.classList.remove('hide');
    try {
      const result = await recalculateSharesOnPriceChange(oldPrice, newPrice);
      toast(t('recalcSharesSuccess').replace('{n}', String(result.updated)), 'success');
      if (result.printed > 0) {
        setTimeout(() => toast(t('recalcSharesReprintWarn').replace('{n}', String(result.printed)), 'warning'), 400);
      }
    } catch (e) {
      console.error('[recalc shares]', e);
      toast(t('recalcSharesError') + e.message, 'error');
    } finally {
      if (loader) loader.classList.add('hide');
    }
  });
}

async function saveSection(section){
  if (!canEditSection(section) && section !== 'general') { toast(t('unauthorized'), 'error'); return; }
  const data = collectFormData();
  if (section === 'general') {
    const name = String(data.saccoName || '').trim();
    if (name.length < 3) { toast('SACCO Name is required (min 3 characters).', 'warning'); return; }
  }

  const oldShareValue = Number(currentSettings.shareValue) || 0;
  const newShareValue = Number(data.shareValue) || 0;
  const priceChanged = section === 'financial'
    && oldShareValue > 0 && newShareValue > 0
    && Math.abs(oldShareValue - newShareValue) > 0.0001;

  try {
    await setDoc(doc(db, 'settings', 'system'), data, { merge: true });
    await logAudit('updated', 'settings', 'system', { section, changes: data }, `Settings updated (${section})`);
    currentSettings = { ...currentSettings, ...data };
    savedSettings = { ...currentSettings };
    if (section === 'appearance') applyTheme(currentSettings.theme);
    if (section === 'security') applySessionTimeoutFromSettings();

    if (priceChanged) {
      await promptRecalcShares(oldShareValue, newShareValue);
    }
  } catch (err) {
    console.error(err);
    toast(t('settingsSaveError') + err.message, 'error');
  }

function updatePasswordStrength(){
  const pw = document.getElementById('newPassword')?.value || '';
  const fill = document.getElementById('pwStrengthFill');
  const text = document.getElementById('pwStrengthText');
  if (!fill || !text) return;
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[!@#$%^&*(),.?":{}|<>_\-+=;'\[\]\\\/`~]/.test(pw)) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  fill.className = 'fill'; text.className = 'password-strength-text';
  if (!pw) { text.textContent = '—'; return; }
  if (score <= 1) { fill.classList.add('weak'); text.classList.add('weak'); text.textContent = 'Weak'; }
  else if (score === 2) { fill.classList.add('fair'); text.classList.add('fair'); text.textContent = 'Fair'; }
  else if (score <= 4) { fill.classList.add('good'); text.classList.add('good'); text.textContent = 'Good'; }
  else { fill.classList.add('strong'); text.classList.add('strong'); text.textContent = 'Strong'; }
}
function updatePasswordRequirements(){
  const cur = document.getElementById('currentPassword')?.value || '';
  const np = document.getElementById('newPassword')?.value || '';
  const cf = document.getElementById('confirmNewPassword')?.value || '';
  const minLen = currentSettings.passwordMinLength || 8;
  const needNum = currentSettings.passwordRequireNumber;
  const needSpec = currentSettings.passwordRequireSpecial;
  const lv = document.getElementById('pwReqLengthValue');
  if (lv) lv.textContent = minLen;
  const reqs = {
    length: np.length >= minLen,
    number: !needNum || /[0-9]/.test(np),
    special: !needSpec || /[!@#$%^&*(),.?":{}|<>_\-+=;'\[\]\\\/`~]/.test(np),
    match: np.length > 0 && np === cf
  };
  document.querySelectorAll('#pwRequirements .req-row').forEach(row => {
    const k = row.dataset.req;
    row.classList.toggle('met', !!reqs[k]);
    const i = row.querySelector('i');
    if (i) i.className = reqs[k] ? 'fas fa-check-circle' : 'fas fa-circle';
  });
  const hint = document.getElementById('pwStatusHint');
  if (hint) {
    if (!cur && !np && !cf) {
      hint.innerHTML = `<i class="fas fa-info-circle"></i><span>${esc(t('enterPasswordsToChange'))}</span>`;
      hint.classList.remove('dirty');
    } else if (Object.values(reqs).every(v => v) && cur) {
      hint.innerHTML = `<i class="fas fa-check-circle" style="color:var(--success)"></i><span style="color:var(--success);font-weight:700">Ready to change</span>`;
      hint.classList.remove('dirty');
    } else {
      hint.innerHTML = `<i class="fas fa-circle" style="color:var(--warning)"></i><span>Incomplete</span>`;
      hint.classList.add('dirty');
    }
  }
}
function clearPasswordForm(){
  ['currentPassword','newPassword','confirmNewPassword'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  updatePasswordStrength();
  updatePasswordRequirements();
}
async function changePassword(){
  const cur = document.getElementById('currentPassword')?.value || '';
  const np = document.getElementById('newPassword')?.value || '';
  const cf = document.getElementById('confirmNewPassword')?.value || '';
  const minLen = currentSettings.passwordMinLength || 8;
  if (!cur) { toast(t('currentPasswordRequired'), 'warning'); return; }
  if (!np) { toast(t('newPasswordRequired'), 'warning'); return; }
  if (np.length < minLen) { toast(t('newPasswordTooShort').replace('{n}', minLen), 'warning'); return; }
  if (currentSettings.passwordRequireNumber && !/[0-9]/.test(np)) { toast(t('newPasswordNeedsNumber'), 'warning'); return; }
  if (currentSettings.passwordRequireSpecial && !/[!@#$%^&*(),.?":{}|<>_\-+=;'\[\]\\\/`~]/.test(np)) { toast(t('newPasswordNeedsSpecial'), 'warning'); return; }
  if (np !== cf) { toast(t('passwordsDoNotMatch'), 'warning'); return; }

  const user = auth.currentUser;
  if (!user) { toast('Not signed in.', 'error'); return; }
  const btn = document.getElementById('changePasswordBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ...';
  try {
    const cred = EmailAuthProvider.credential(user.email, cur);
    await reauthenticateWithCredential(user, cred);
    await updatePassword(user, np);
    await logAudit('updated', 'users', user.uid, {}, 'User changed own password');
    toast(t('passwordChangeSuccess'), 'success');
    clearPasswordForm();
    if (currentSettings.forceLogoutOnPasswordChange) {
      setTimeout(() => signOut(auth).then(() => window.location.replace(LOGIN_URL)), 1500);
    }
  } catch (err) {
    console.error(err);
    let m = err.message;
    if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') m = t('wrongCurrentPassword');
    toast(t('passwordChangeError') + m, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

window.__confirmCb = null;
let escHandler = null;

function closeConfirmModal(){
  document.querySelectorAll('#confirmModal').forEach(el => el.remove());
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
  window.__confirmCb = null;
}

function showConfirmModal(title, message, type, cb){
  document.querySelectorAll('#confirmModal').forEach(el => el.remove());
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
  window.__confirmCb = null;

  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'confirmModal';
  const cls = type === 'danger' ? 'danger' : type === 'success' ? 'success' : 'warning';
  const icon = type === 'danger' ? 'fa-exclamation-triangle' : type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
  root.innerHTML = `
    <div class="modal modal--sm">
      <div class="modal__head">
        <div><div class="modal__title">${esc(title)}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body">
        <div class="modal__title-icon ${cls}"><i class="fas ${icon}"></i></div>
        <p style="text-align:center;color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-line;">${esc(message)}</p>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn ${type==='danger'?'btn--danger':type==='success'?'btn--success':'btn--warning'}" id="confirmOk">
          <i class="fas fa-check"></i> ${esc(t('confirm'))}
        </button>
      </div>
    </div>`;
  document.body.appendChild(root);

  escHandler = (e) => { if (e.key === 'Escape') closeConfirmModal(); };
  document.addEventListener('keydown', escHandler);
  root.addEventListener('click', (e) => { if (e.target === root) closeConfirmModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeConfirmModal));

  const okBtn = root.querySelector('#confirmOk');
  if (!okBtn) { console.error('[showConfirmModal] confirmOk button not found in modal'); return; }
  okBtn.addEventListener('click', () => {
    const captured = window.__confirmCb;
    window.__confirmCb = null;
    closeConfirmModal();
    if (typeof captured === 'function') {
      try {
        const res = captured();
        if (res && typeof res.catch === 'function') {
          res.catch(err => console.error('[confirm cb]', err));
        }
      } catch (err) {
        console.error('[confirm cb]', err);
      }
    }
  });

  window.__confirmCb = cb;
}

}
async function deleteAllTransactions(){
  if (!isAdmin) return;
  showConfirmModal(t('confirmDeleteAllTitle'), t('confirmDeleteAllMsg'), 'danger', async () => {
    const overlay = document.getElementById('loader');
    if (overlay) overlay.classList.remove('hide');
    try {
      const snap = await getDocs(collection(db, 'transactions'));
      const refs = snap.docs.map(d => d.ref);
      let total = 0;
      for (let i = 0; i < refs.length; i += 500) {
        const b = writeBatch(db);
        refs.slice(i, i + 500).forEach(r => b.delete(r));
        await b.commit();
        total += Math.min(500, refs.length - i);
      }
      await logAudit('deleted', 'transactions', 'ALL', { count: total }, `All transactions deleted (${total})`);
      toast(`${t('dataDeleted')} (${total})`, 'success');
    } catch (e) { toast(t('dataDeletedError') + e.message, 'error'); }
    finally { if (overlay) overlay.classList.add('hide'); }
  });
}

/* ============================================================
   EXPORT / IMPORT
============================================================ */
async function exportAllData(){
  if (!isAdmin) return;
  const overlay = document.getElementById('loader');
  if (overlay) overlay.classList.remove('hide');
  try {
    const types = ['savings','loan','repayment','profit_income','profit_withdrawal','withdrawal','penalty'];
    let csv = '';
    const snap = await getDocs(collection(db, 'transactions'));
    for (const ty of types) {
      csv += `\n=== ${ty.toUpperCase()} ===\n`;
      csv += 'id,customerId,customerName,amount,status,date,createdBy,note\n';
      snap.forEach(d => {
        const x = d.data();
        if (String(x.type || '').toLowerCase() !== ty) return;
        const date = x.date?.toDate ? x.date.toDate().toISOString() : (x.date || '');
        csv += [d.id, x.customerId || x.memberId || '', (x.customerName || x.memberName || '').replace(/,/g,' '),
          x.amount || 0, x.status || '', date, (x.createdByName || x.createdBy || '').replace(/,/g,' '),
          (x.note || '').replace(/,/g,' ').replace(/\n/g,' ')].join(',') + '\n';
      });
    }
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `GERESU_DHUKI_Backup_${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
    await logAudit('exported', 'settings', 'all_data', {}, 'CSV export');
    toast(t('settingsExported'), 'success');
  } catch (e) { toast(t('exportError') + e.message, 'error'); }
  finally { if (overlay) overlay.classList.add('hide'); }
}
function serializeForJSON(v){
  if (v === null || v === undefined) return v;
  if (typeof v === 'object') {
    if (typeof v.toDate === 'function') { try { return v.toDate().toISOString(); } catch { return null; } }
    if (v.latitude !== undefined && v.longitude !== undefined) return { _type:'geopoint', lat:v.latitude, lng:v.longitude };
    if (Array.isArray(v)) return v.map(serializeForJSON);
    const o = {};
    Object.keys(v).forEach(k => { o[k] = serializeForJSON(v[k]); });
    return o;
  }
  return v;
}
function deserializeFromJSON(v){
  if (v === null || v === undefined) return v;
  if (typeof v === 'object') {
    if (v._type === 'geopoint' && v.lat !== undefined) return new GeoPoint(v.lat, v.lng);
    if (Array.isArray(v)) return v.map(deserializeFromJSON);
    const o = {};
    Object.keys(v).forEach(k => { o[k] = deserializeFromJSON(v[k]); });
    return o;
  }
  return v;
}
async function exportAllDataJSON(){
  if (!isAdmin) return;
  const overlay = document.getElementById('loader');
  if (overlay) overlay.classList.remove('hide');
  try {
    const backup = {
      meta:{ saccoName: currentSettings.saccoName || DEFAULT_SACCO_NAME,
        exportedAt:new Date().toISOString(), exportedBy: currentUserEmail,
        appVersion:'1.0', format:'GERESU_DHUKI_FULL_BACKUP_v1' },
      settings:null, customers:[], users:[], transactions:[], audit:[], summary:{}
    };
    const sd = await getDoc(doc(db, 'settings', 'system'));
    backup.settings = sd.exists() ? sd.data() : { ...DEFAULT_SETTINGS };
    const cs = await getDocs(collection(db, 'customers'));
    cs.forEach(d => backup.customers.push({ _id:d.id, ...serializeForJSON(d.data()) }));
    try {
      const us = await getDocs(collection(db, 'users'));
      us.forEach(d => {
        const u = serializeForJSON(d.data());
        delete u.password; delete u.passwordHash; delete u.refreshToken;
        backup.users.push({ _id:d.id, ...u });
      });
    } catch(e){}
    const ts = await getDocs(collection(db, 'transactions'));
    ts.forEach(d => backup.transactions.push({ _id:d.id, ...serializeForJSON(d.data()) }));
    try {
      const as = await getDocs(query(collection(db, 'audit'), orderBy('timestamp','desc'), limit(5000)));
      as.forEach(d => backup.audit.push({ _id:d.id, ...serializeForJSON(d.data()) }));
    } catch(e){}
    backup.summary = {
      totalCustomers: backup.customers.length,
      totalUsers: backup.users.length,
      totalTransactions: backup.transactions.length,
      totalAuditRecords: backup.audit.length
    };
    const jsonStr = JSON.stringify(backup, null, 2);
    const blob = new Blob([jsonStr], { type:'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    a.download = `GERESU_DHUKI_FULL_BACKUP_${stamp}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast(t('settingsExported'), 'success');
  } catch (e) { toast(t('exportError') + e.message, 'error'); }

  if (!isAdmin) return;
  try {
    const data = collectFormData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);

  } catch (e) { toast('Export failed: ' + e.message, 'error'); }

async function handleImportSettings(e){
  if (!isAdmin) return;
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (typeof data !== 'object' || !data) throw new Error('Not an object');
    const merged = { ...DEFAULT_SETTINGS, ...data };
    await setDoc(doc(db, 'settings', 'system'), merged, { merge: true });
    currentSettings = { ...merged };
    savedSettings = { ...currentSettings };
    renderShell(); renderMain();
    await logAudit('imported', 'settings', 'system', {}, 'Settings imported');
    toast(t('settingsImported'), 'success');
  } catch (err) { toast(t('invalidSettingsFile') + ' ' + err.message, 'error'); }
  e.target.value = '';
}
async function writeCollectionBatch(coll, records, mode){
  if (!Array.isArray(records) || !records.length) return 0;
  const col = collection(db, coll);
  let written = 0;
  if (mode === 'replace') {
    const ex = await getDocs(col);
    const refs = ex.docs.map(d => d.ref);
    for (let i = 0; i < refs.length; i += 500) {
      const b = writeBatch(db);
      refs.slice(i, i + 500).forEach(r => b.delete(r));
      await b.commit();
    }
  }
  for (let i = 0; i < records.length; i += 400) {
    const chunk = records.slice(i, i + 400);
    const b = writeBatch(db);
    chunk.forEach(rec => {
      const id = rec._id || rec.id;
      const { _id, id:_ignored, ...data } = rec;
      const ref = id ? doc(col, String(id)) : doc(col);
      b.set(ref, data, { merge: mode === 'merge' });
    });
    await b.commit();
    written += chunk.length;
  }
  return written;
}
function triggerImportFullBackup(mode){
  if (!isAdmin) { toast(t('unauthorized'), 'error'); return; }
  const inp = document.getElementById('importFullBackupFile');
  inp.dataset.mode = mode; inp.value = ''; inp.click();
}
async function handleImportFullBackup(e){
  if (!isAdmin) return;
  const file = e.target.files?.[0];
  if (!file) return;
  const mode = e.target.dataset.mode === 'replace' ? 'replace' : 'merge';
  let backup;
  try { backup = JSON.parse(await file.text()); }
  catch (err) { toast(t('invalidBackupFormat') + ' ' + err.message, 'error'); e.target.value = ''; return; }
  const summary = {
    customers: Array.isArray(backup.customers) ? backup.customers.length : 0,
    transactions: Array.isArray(backup.transactions) ? backup.transactions.length : 0,
    users: Array.isArray(backup.users) ? backup.users.length : 0,
    audit: Array.isArray(backup.audit) ? backup.audit.length : 0
  };
  const summaryLine = `${t('backupSummaryLabel')}: ${summary.customers} ${t('backupSummaryCustomers')}, ` +
    `${summary.transactions} ${t('backupSummaryTransactions')}, ${summary.users} ${t('backupSummaryUsers')}, ` +
    `${summary.audit} ${t('backupSummaryAudit')}.`;
  showConfirmModal(
    mode === 'replace' ? t('confirmImportFullTitle') : t('confirmMergeFullTitle'),
    (mode === 'replace' ? t('confirmImportFullMsg') : t('confirmMergeFullMsg')) + '\n\n' + summaryLine,
    mode === 'replace' ? 'danger' : 'warning',
    async () => {
      const overlay = document.getElementById('loader');
      if (overlay) overlay.classList.remove('hide');
      try {
        if (backup.settings && typeof backup.settings === 'object') {
          await setDoc(doc(db, 'settings', 'system'),
            { ...DEFAULT_SETTINGS, ...deserializeFromJSON(backup.settings) }, { merge:true });
        }
        if (Array.isArray(backup.customers) && backup.customers.length)
          await writeCollectionBatch('customers', backup.customers.map(deserializeFromJSON), mode);
        if (Array.isArray(backup.users) && backup.users.length) {
          const clean = backup.users.map(u => { const r = deserializeFromJSON(u); delete r.password; delete r.passwordHash; return r; });
          await writeCollectionBatch('users', clean, mode);
        }
        if (Array.isArray(backup.transactions) && backup.transactions.length)
          await writeCollectionBatch('transactions', backup.transactions.map(deserializeFromJSON), mode);
        if (Array.isArray(backup.audit) && backup.audit.length)
          await writeCollectionBatch('audit', backup.audit.map(deserializeFromJSON), mode);
        await loadSettings();
        toast(mode === 'replace' ? t('importSuccess') : t('importMergeSuccess'), 'success');
      } catch (err) { toast(t('importFullError') + err.message, 'error'); }
      finally { if (overlay) overlay.classList.add('hide'); }
    }
  );
  e.target.value = '';
}

async function logAudit(action, collectionName, documentId, changes, details){
  try {
    if (!currentSettings.enableAuditLog) return;
    await setDoc(doc(collection(db, 'audit')), {
      action, collection: collectionName, documentId, changes,
      details: details || `${action} ${collectionName} ${documentId}`,
      timestamp: serverTimestamp(),
      userEmail: currentUserEmail || 'system',
      userName: currentUserDisplayName || 'System'
    });
  } catch (e) { console.error('Audit log error:', e); }
}

async function loadSettings(){
  const overlay = document.getElementById('loader');
  if (overlay) overlay.classList.remove('hide');
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const data = snap.data();
      const merged = { ...DEFAULT_SETTINGS };
      Object.keys(DEFAULT_SETTINGS).forEach(k => {
        if (data[k] !== undefined && data[k] !== null) merged[k] = data[k];
      });
      if (data.penaltyRate !== undefined && data.loansPenaltyRate === undefined) merged.loansPenaltyRate = Number(data.penaltyRate);
      if (data.sessionTimeoutMinutes !== undefined && data.sessionTimeout === undefined) merged.sessionTimeout = Number(data.sessionTimeoutMinutes);
      if ((data.shareValue === undefined || data.shareValue === null) && data.sharePrice !== undefined && data.sharePrice !== null) {
        merged.shareValue = Number(data.sharePrice);
      }
      currentSettings = merged;
      savedSettings = { ...merged };
    } else {
      await setDoc(doc(db, 'settings', 'system'), DEFAULT_SETTINGS);
      currentSettings = { ...DEFAULT_SETTINGS };
      savedSettings = { ...currentSettings };
    }
    applyTheme(currentSettings.theme);
  } catch (e) {
    console.error('Load settings error:', e);
    toast(t('settingsLoadError') + e.message, 'error');
  } finally { if (overlay) overlay.classList.add('hide'); }
}

function attachFloatingSaveBar(){
  const saveAllFloating = document.getElementById('saveAllFloatingBtn');
  const discardAllBtn = document.getElementById('discardAllBtn');
  saveAllFloating?.addEventListener('click', () => document.getElementById('saveAllBtn')?.click());
  discardAllBtn?.addEventListener('click', () => {
    loadSettingsToForm(currentSettings);
    applyTheme(currentSettings.theme);
    updateDirtyIndicators();
    toast(t('discard'), 'info');
  });
}

/* ============================================================
   BOOT
============================================================ */
(async function boot(){
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  const hasMis = sessionStorage.getItem('loggedIn') === 'true' && sessionStorage.getItem('uid');
  if (!isSessionRecordValid(sess) && !hasMis) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const cachedProfile = readCachedProfile();
  let rendered = false;
  if (cachedProfile && cachedProfile.uid) {
    currentUserRole = cachedProfile.role || 'loading';
    currentUserDisplayName = cachedProfile.name || 'User';
    currentUserEmail = cachedProfile.email || '';
    currentUserPhoto = cachedProfile.photoURL || '';
    isAdmin = currentUserRole === 'admin' || currentUserRole === 'super_admin';
    renderShell();
    renderMain();
    attachFloatingSaveBar();
    hideLoaderNow();
    rendered = true;
  } else if (hasMis) {
    currentUserRole = sessionStorage.getItem('role') || 'loading';
    currentUserDisplayName = sessionStorage.getItem('userName') || 'User';
    currentUserEmail = sessionStorage.getItem('email') || '';
    currentUserPhoto = '';
    isAdmin = currentUserRole === 'admin' || currentUserRole === 'super_admin';
    renderShell();
    renderMain();
    attachFloatingSaveBar();
    hideLoaderNow();
  }

  const user = await new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
  });
  if (!user) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  if (sess && user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }

  currentUserEmail = user.email || '';
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    const d = snap.data();
    if (d.status === 'inactive') throw new Error('inactive');
    currentUserRole = d.role || 'viewer';
    currentUserDisplayName = d.fullName || d.name || d.displayName || user.email?.split('@')[0] || 'User';
    currentUserPhoto = d.photoURL || '';
    isAdmin = currentUserRole === 'admin' || currentUserRole === 'super_admin';
    writeCachedProfile();
  } catch (e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e2){}
    clearSession(); clearCachedProfile();
    try { await signOut(auth); } catch(e2){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const profileChanged = !rendered ||
    (cachedProfile && (
      (cachedProfile.name !== currentUserDisplayName) ||
      cachedProfile.role !== currentUserRole ||
      cachedProfile.photoURL !== currentUserPhoto
    ));
  if (profileChanged) {
    renderShell();
    renderMain();
    attachFloatingSaveBar();
  }
  hideLoaderNow();

  await loadSessionTimeout();
  startSessionWatcher();

  await loadUserProfile();
  await loadSettings();

  if (rendered || profileChanged) {
    renderShell();
    renderMain();
    attachFloatingSaveBar();
  }

  setTimeout(() => document.getElementById('loader')?.classList.add('hide'), 100);
})();
