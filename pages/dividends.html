async function handleChildAction(action, id) {
  const tx = _childCache.rows.find(r => r.id === id);
  if (!tx) return;
  if (action === 'view')   return openViewChildModal(tx);
  if (action === 'approve') return approveChildFlow(tx);
  if (action === 'reject')  return openRejectModal(tx);
  if (action === 'edit')    return openManualDividendModal(tx);
  if (action === 'delete')  return openDeleteChildModal(tx);
  if (action === 'print')   return printVoucher(tx);
}
async function approveChildFlow(tx) {

/* MODALS */
let escHandler = null;
function closeModal() {
  const el = document.getElementById('modal-backdrop');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
}
function openModal({ size = '', head, body, foot }) {
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  root.innerHTML = `
    <div class="modal ${size ? 'modal--' + size : ''}">
      <div class="modal__head">
        <div>${head}</div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body">${body}</div>
      ${foot ? `<div class="modal__foot">${foot}</div>` : ''}
    </div>`;
  document.body.appendChild(root);
  escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  return root;
}

      <button class="btn" data-close>${esc(t('cancel'))}</button>
      <button class="btn btn--primary" id="mSave"><span class="spinner-sm hidden"></span>
        <span class="lbl"><i class="fas fa-save"></i> ${esc(t('save'))}</span></button>`
  });

  function readState() {
    state.payoutType = root.querySelector('.type-btn.is-on')?.dataset.ptype || 'cash';
    state.sharesHeld = num(root.querySelector('#mShares').value);
    state.ratePerShare = num(root.querySelector('#mRate').value);
    state.taxRate = num(root.querySelector('#mTax').value);
    state.amountOverride = root.querySelector('#mOv').value;
    state.status = root.querySelector('#mStatus').value;
  }
  function refreshPreview() {
    readState();
    const ovr = num(state.amountOverride);
    const gross = ovr > 0 ? ovr : (state.sharesHeld * state.ratePerShare);
    const tax = gross * (state.taxRate / 100);
    const net = Math.max(0, gross - tax);
    const isShares = state.payoutType === 'shares';
    const sharePrice = num(APP.settings.bonusSharePrice) || 1000;
    const sharesIssued = isShares && sharePrice > 0 ? Math.floor(net / sharePrice) : 0;
    root.querySelector('#mPreview').innerHTML = `
      <div class="payout-preview__cell">
        <div class="payout-preview__label">${esc(t('grossAmount'))}</div>
        <div class="payout-preview__value">${esc(money(gross))}</div>
      </div>
      <div class="payout-preview__cell">
        <div class="payout-preview__label">${esc(t('taxAmount'))}</div>
        <div class="payout-preview__value is-violet">${esc(money(tax))}</div>
      </div>
      <div class="payout-preview__cell">
        <div class="payout-preview__label">${esc(t('netAmount'))}</div>
        <div class="payout-preview__value is-green">${esc(money(net))}</div>
      </div>
      ${isShares ? `<div class="payout-preview__cell">
        <div class="payout-preview__label">${esc(t('typeShares'))}</div>
        <div class="payout-preview__value is-violet">${sharesIssued.toLocaleString()} sh</div>
      </div>` : ''}`;
  }

  root.querySelectorAll('[data-ptype]').forEach(b => b.addEventListener('click', () => {
    root.querySelectorAll('[data-ptype]').forEach(x => x.classList.remove('is-on'));
    b.classList.add('is-on');
    refreshPreview();
  }));
  ['#mShares','#mRate','#mTax','#mOv'].forEach(sel => {
    const el = root.querySelector(sel);
    el?.addEventListener('input', debounce(refreshPreview, 200));
  });
  refreshPreview();

  function wireCustomerPicker() {
    const search = root.querySelector('#mCustSearch');
    const list = root.querySelector('#mCustList');
    if (!search || !list) return;
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      list.querySelectorAll('.customer-pick__item').forEach(el => {
        const show = !q || el.textContent.toLowerCase().includes(q);
        el.style.display = show ? 'flex' : 'none';
      });
    });
    list.querySelectorAll('.customer-pick__item').forEach(el => {
      el.addEventListener('click', () => {
        state.customerId = el.dataset.cid;
        state.customerIdShort = el.dataset.ccode;
        state.customerName = el.dataset.cname;
        state.sharesHeld = num(el.dataset.cshares);
        const sharesEl = root.querySelector('#mShares');
        if (sharesEl) sharesEl.value = state.sharesHeld;
        list.querySelectorAll('.customer-pick__item').forEach(x => x.classList.remove('is-on'));
        el.classList.add('is-on');
        refreshPreview();
      });
    });
  }
  wireCustomerPicker();

  root.querySelector('#mSave').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    readState();
    if (!state.customerId) { toast(t('pickCustomer'), 'warning'); return; }
    if (state.sharesHeld <= 0) { toast('Shares must be greater than zero.', 'warning'); return; }
    const gross = num(state.amountOverride) > 0 ? num(state.amountOverride) : state.sharesHeld * state.ratePerShare;
    if (gross <= 0) { toast('Amount must be greater than zero.', 'warning'); return; }

    if (isEdit) {
      const reason = root.querySelector('#mReason').value.trim();
      if (reason.length < 5) { toast(t('invalidReason'), 'warning'); return; }
      btn.disabled = true; btn.querySelector('.spinner-sm').classList.remove('hidden');
      try {
        await overrideChild(existing.id, { grossAmount: gross, taxRate: state.taxRate }, reason, APP.user);
        toast(t('savedOk'), 'success');
        closeModal();
        await loadAndRenderOverview();
      } catch (err) {
        toast(t('errorSave') + err.message, 'error');
        btn.disabled = false; btn.querySelector('.spinner-sm').classList.add('hidden');
      }
      return;
    }

    btn.disabled = true; btn.querySelector('.spinner-sm').classList.remove('hidden');
    try {
      const year = APP.selectedYear;
      const uid = APP.user?.uid || null;
      const uname = APP.user?.displayName || (APP.user?.email ? APP.user.email.split('@')[0] : 'system');
      const refNo = makeBatchRef(year);
      const batchId = `batch_m_${year}_${refNo.split('-').pop()}`;
      const batchRef = doc(db, 'dividendBatches', batchId);
      const childRef = doc(collection(db, 'transactions'));
      const tax = round2(gross * state.taxRate / 100);
      const net = round2(gross - tax);
      const isShares = state.payoutType === 'shares';
      const sharePrice = num(APP.settings.bonusSharePrice) || 1000;
      const sharesIssued = isShares ? Math.floor(net / sharePrice) : 0;

      const wb = writeBatch(db);
      wb.set(batchRef, {
        year,
        fiscalLabel: root.querySelector('#mFY').value || String(year),
        mode: 'manual',
        status: state.status === 'paid' ? 'paid' : 'pending',
        profitFormula: { netProfit: 0, registrationFee: 0, otherIncome: 0, paidInterest: 0, paidPenalties: 0, serviceWithdrawals: 0, totalIncome: 0 },
        totalSharesClosing: 0,
        dividendPerShare: 0,
        totals: { count: 1, gross, tax, net },
        refNo,
        printCount: 0,
        createdBy: uid, createdByName: uname, createdAt: serverTimestamp()
      });
      wb.set(childRef, {
        type: 'dividend', batchId, year,
        fiscalYear: root.querySelector('#mFY').value || String(year),
        customerId: state.customerId, memberId: state.customerId, customerDocId: state.customerId,
        customerName: state.customerName, customerIdShort: state.customerIdShort || '',
        payoutType: state.payoutType,
        sharesHeld: state.sharesHeld,
        ratePerShare: state.ratePerShare,
        sharePercent: 0,
        grossAmount: round2(gross), taxRate: state.taxRate, taxAmount: tax, netAmount: net,
        sharesIssued,
        overridden: false, overrideReason: '', originalAmount: null,
        status: state.status,
        serialNumber: makeSerial(), refNo,
        printCount: 0, printStatus: 'not_printed',
        date: root.querySelector('#mDate').value ? new Date(root.querySelector('#mDate').value) : new Date(),
        reference: root.querySelector('#mRef').value || '',
        notes: root.querySelector('#mNotes').value || '',
        createdAt: serverTimestamp(),
        createdBy: uid, createdByName: uname,
        ...(state.status === 'paid' ? { paidAt: serverTimestamp(), paidBy: uid, paidByName: uname } : {})
      });
      await wb.commit();

      if (isShares && sharesIssued > 0 && state.status === 'paid') {
        await addDoc(collection(db, 'shares'), {
          type: 'dividend_bonus',
          customerId: state.customerId, memberId: state.customerId, customerDocId: state.customerId,
          customerName: state.customerName,
          shares: sharesIssued, pricePerShare: sharePrice, amount: 0,
          date: new Date(), paymentMethod: 'dividend', reference: makeSerial(),
          notes: `Manual bonus shares (${year})`,
          status: 'approved', source: 'dividend',
          dividendId: childRef.id, batchId,
          fiscalYear: String(year),
          createdAt: serverTimestamp(),
          createdBy: uid, createdByName: uname,
          approvedAt: serverTimestamp(), approvedBy: uid
        });
      }

      toast(t('createdOk'), 'success');
      closeModal();
      await loadAndRenderOverview();
    } catch (err) {
      toast(t('errorSave') + err.message, 'error');
      btn.disabled = false; btn.querySelector('.spinner-sm')?.classList.add('hidden');
    }
  });
}

/* ============================================================
 * PRINT — YEARLY REPORT
 * ============================================================ */
async function printYearlyReport() {
  const host = document.getElementById('slip-print-host');
  if (!host) return;

  const year = APP.selectedYear;
  const user = APP.profile || {};

  let allDivs = [];
  try {
    const snap = await getDocs(query(
      collection(db, 'transactions'),
      where('type', '==', 'dividend'),
      where('year', '==', year)
    ));
    allDivs = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(tx => String(tx.status || '').toLowerCase() !== 'rejected');
  } catch (e) { console.warn('printYearlyReport: fetch failed', e); }

  let rows = [];
  let refNo = '';
  let reportLabel = '';

  if (allDivs.length) {
    const byCustomer = new Map();
    allDivs.forEach(tx => {
      const cid = tx.customerId || tx.memberId;
      if (!cid) return;
      if (!byCustomer.has(cid)) {
        const c = customerById(cid);
        byCustomer.set(cid, {
          customerId: cid,
          customerName: tx.customerName || customerName(c),
          customerIdShort: tx.customerIdShort || c?.customerId || '',
          shares: 0, grossAmount: 0, taxAmount: 0, dividendAmount: 0
        });
      }
      const r = byCustomer.get(cid);
      r.shares = Math.max(r.shares, num(tx.sharesHeld));
      r.grossAmount   += num(tx.grossAmount);
      r.taxAmount     += num(tx.taxAmount);
      r.dividendAmount += num(tx.netAmount);
    });
    rows = Array.from(byCustomer.values()).sort((a,b) => b.shares - a.shares);
    refNo = allDivs[0]?.refNo || ('DIV-YR-' + year);
    reportLabel = 'Yearly Dividend Report';
  } else if (APP.overview?.preview?.length) {
    rows = APP.overview.preview.map(r => ({
      customerId: r.customerId,
      customerName: r.customerName,
      customerIdShort: r.customerIdShort,
      shares: num(r.shares),
      grossAmount: num(r.grossAmount),
      taxAmount: num(r.taxAmount),
      dividendAmount: num(r.netAmount)
    }));
    refNo = 'DIV-PREVIEW-' + year;
    reportLabel = 'Dividend Projection (not yet distributed)';
  } else {
    toast('No dividend data for ' + year, 'warning');
    return;
  }

  const ledger = APP.overview?.ledger;
  const byCust = ledger?.byCustomer || {};
  rows.forEach(r => {
    const l = byCust[r.customerId] || {};
    r.opening = num(l.opening);
    r.bought  = num(l.bought);
    r.sold    = num(l.sold);
  });

  const grandOpening  = num(ledger?.totals?.opening)  || rows.reduce((s,r) => s + r.opening, 0);
  const grandBought   = num(ledger?.totals?.bought)   || rows.reduce((s,r) => s + r.bought, 0);
  const grandSold     = num(ledger?.totals?.sold)     || rows.reduce((s,r) => s + r.sold, 0);
  const grandClosing  = num(ledger?.totals?.closing)  || rows.reduce((s,r) => s + r.shares, 0);
  const grandDividend = rows.reduce((s,r) => s + num(r.dividendAmount), 0);
  const dps = grandClosing > 0 ? grandDividend / grandClosing : 0;
  const printedAt = new Date().toLocaleString();

  const rowsHtml = rows.map((r, i) => `
    <tr>
      <td class="center">${i + 1}</td>
      <td>${esc(r.customerName)}</td>
      <td class="center">${esc(r.customerIdShort || '—')}</td>
      <td class="right">${r.opening.toFixed(2)}</td>
      <td class="right tx-buy">${r.bought > 0 ? '+' + r.bought.toFixed(2) : '—'}</td>
      <td class="right tx-sell">${r.sold > 0 ? '-' + r.sold.toFixed(2) : '—'}</td>
      <td class="right"><strong>${r.shares.toFixed(2)}</strong></td>
      <td class="right"><strong>${r.dividendAmount.toFixed(2)}</strong></td>
    </tr>`).join('');

  host.innerHTML = `
    <div class="report-doc">
      <div class="report-header">
        <div class="left">
          <div class="logo"><img src="${LOGO_URL}" onerror="this.style.display='none'"></div>
          <div>
            <h1>${esc(APP.saccoName.toUpperCase())}</h1>
            <p>${esc(reportLabel)} — ${year}</p>
          </div>
        </div>
        <div class="right">
          <div class="title">Shareholder Summary</div>
          <div>Ref: ${esc(refNo)}</div>
          <div>Printed: ${esc(printedAt)}</div>
          <div>By: ${esc(user.fullName || user.name || user.email || '—')}</div>
        </div>
      </div>

      <div class="a4-summary-strip">
        <div class="item"><span class="lbl">Financial Year</span><span class="val">${year}</span></div>
        <div class="item"><span class="lbl">Opening Shares</span><span class="val">${grandOpening.toFixed(2)}</span></div>
        <div class="item"><span class="lbl">Dividend / Share</span><span class="val">ETB ${num(dps).toFixed(4)}</span></div>
        <div class="item"><span class="lbl">Closing Shares</span><span class="val">${grandClosing.toFixed(2)}</span></div>
      </div>

      <table class="report-table">
        <thead>
          <tr>
            <th class="center" style="width:5%">#</th>
            <th style="width:26%">Customer</th>
            <th class="center" style="width:11%">Customer ID</th>
            <th class="right" style="width:11%">Opening</th>
            <th class="right" style="width:11%">Bought</th>
            <th class="right" style="width:11%">Sold</th>
            <th class="right" style="width:11%">Closing</th>
            <th class="right" style="width:14%">Dividend</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml || '<tr><td colspan="8" style="text-align:center;padding:20px;color:#666">No shareholders.</td></tr>'}
        </tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="3" class="right"><strong>GRAND TOTAL</strong></td>
            <td class="right"><strong>${grandOpening.toFixed(2)}</strong></td>
            <td class="right tx-buy"><strong>+${grandBought.toFixed(2)}</strong></td>
            <td class="right tx-sell"><strong>-${grandSold.toFixed(2)}</strong></td>
            <td class="right"><strong>${grandClosing.toFixed(2)}</strong></td>
            <td class="right"><strong>${grandDividend.toFixed(2)}</strong></td>
          </tr>
        </tfoot>
      </table>

      <div class="report-signatures">
        <div class="sig"><div class="sig-line">Prepared By (Accountant)</div></div>
        <div class="sig"><div class="sig-line">Approved By (Manager)</div></div>
      </div>

      <div class="report-footer">
        <div class="thanks">If We Work Together, We Grow Together!</div>
        <div>Year ${year} · Total shareholders: ${rows.length}</div>
      </div>
    </div>`;

  setTimeout(() => window.print(), 150);
}

/* ============================================================
 * PRINT — VOUCHER
 * ============================================================ */
async function printVoucher(tx) {
  if (!canPrint()) { toast(t('noPermission'), 'error'); return; }
  if (String(tx.status || '').toLowerCase() !== 'paid') {
    toast('Only paid dividends can be printed.', 'warning'); return;
  }
  const prevCount = Number(tx.printCount || 0);
  const newCount = prevCount + 1;
  const watermark = newCount === 1 ? t('printOriginal') : t('printCopy');

  try {
    await updateDoc(doc(db, 'transactions', tx.id), {
      printCount: newCount,
      printStatus: 'printed',
      lastPrintedAt: serverTimestamp(),
      lastPrintedByName: APP.profile?.fullName || APP.profile?.name || ''
    });
    tx.printCount = newCount;
  } catch (e) { console.warn(e); }

  const host = document.getElementById('slip-print-host');
  host.innerHTML = buildVoucherHtml(tx, watermark);

  const overlay = document.createElement('div');
  overlay.className = 'slip-overlay';
  overlay.id = 'slip-overlay';
  overlay.innerHTML = `
    <div class="slip-toolbar">
      <div class="slip-toolbar__title">
        <i class="fas fa-gift" style="color:#d4a017"></i> ${esc(t('voucher'))}
        <span class="tag tag--gold tag--no-dot" style="margin-left:8px">${esc(watermark)}</span>
      </div>
      <button class="primary" id="slipPrintBtn"><i class="fas fa-print"></i> ${esc(t('printBtn'))}</button>
      <button id="slipCloseBtn"><i class="fas fa-times"></i> ${esc(t('closeBtn'))}</button>
    </div>
    ${buildVoucherHtml(tx, watermark)}
  `;
  document.body.appendChild(overlay);
  document.getElementById('slipPrintBtn').addEventListener('click', () => {
    const h = document.getElementById('slip-print-host');
    h.innerHTML = buildVoucherHtml(tx, watermark);
    setTimeout(() => window.print(), 60);
  });
  document.getElementById('slipCloseBtn').addEventListener('click', closeSlipOverlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSlipOverlay(); });
  escHandler = (e) => { if (e.key === 'Escape') closeSlipOverlay(); };
  document.addEventListener('keydown', escHandler);
}
function closeSlipOverlay() {
  const el = document.getElementById('slip-overlay');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
  const host = document.getElementById('slip-print-host');
  if (host) host.innerHTML = '';
}

        <tbody><tr>
          <td><span class="user-name">${esc(recordedBy)}</span></td>
          <td><span class="sig-line"></span></td>
          <td><span class="sig-line"></span></td>
        </tr></tbody>

      <table class="slip__table" style="margin-top:12px">
        <thead><tr><th style="width:35%">Approved by</th><th style="width:30%">Signature</th><th style="width:35%">Date</th></tr></thead>
        <tbody><tr>
          <td><span class="user-name">${esc(paidBy)}</span></td>
          <td><span class="sig-line"></span></td>
          <td><span class="sig-line"></span></td>
        </tr></tbody>
      </table>

      <p style="text-align:center;margin-top:14px"><strong>${esc(t('officialStamp'))}: __________________________</strong></p>

        <div class="slip__slogan">“If We Work Together, We Grow Together!”</div>
        <div class="slip__footer-meta">
          <strong>${esc(APP.saccoName)}</strong> · Printed on ${esc(fmtDateTime(new Date()))}
          ${APP.profile?.fullName ? ' · Printed by ' + esc(APP.profile.fullName) : ''}
          ${printCount > 0 ? ' · Print #' + printCount : ''}
        </div>
      </div>
    </div>`;
}

/* ============================================================
 * LANGUAGE
 * ============================================================ */
function setLang(lang) {
  if (!SUPPORTED_LANGS.includes(lang)) lang = FALLBACK_LANG;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

/* ============================================================
 * LOADERS — WITH ROLE-AWARE FALLBACK
 * ============================================================ */
async function loadCustomers() {
  APP.bootIssues = APP.bootIssues.filter(x => !x.startsWith('Customers'));
  const role = APP.profile?.role || 'unknown';
  const conds = [];

  if (role === 'admin' && APP.profile?.districtId) {
    conds.push(where('districtId', '==', APP.profile.districtId));
  } else if (['manager','cashier','teller','accountant'].includes(role) && APP.profile?.branchId) {
    conds.push(where('branchId', '==', APP.profile.branchId));
  }

  // First attempt: role-filtered
  try {
    const q1 = conds.length
      ? query(collection(db, 'customers'), ...conds, limit(3000))
      : query(collection(db, 'customers'), limit(3000));
    const s1 = await getDocs(q1);
    if (s1.size > 0) {
      APP.customers = s1.docs.map(d => ({ id: d.id, ...d.data() }));
      console.log('[sacco] customers loaded (scoped):', APP.customers.length, 'role:', role);
      return;
    }
    // Scoped returned 0 — try unscoped fallback
    APP.bootIssues.push(`Customers query with role filter returned 0. Trying unscoped…`);
  } catch (e) {
    console.warn('[loadCustomers] scoped failed:', e.code || e.message);
    APP.bootIssues.push(`Customers query (scoped) failed: <code>${esc(e.code || e.message)}</code>. Trying unscoped…`);
  }

  // Second attempt: unscoped
  try {
    const s2 = await getDocs(query(collection(db, 'customers'), limit(3000)));
    APP.customers = s2.docs.map(d => ({ id: d.id, ...d.data() }));
    console.log('[sacco] customers loaded (unscoped):', APP.customers.length);
    if (APP.customers.length === 0) {
      APP.bootIssues.push(`Customers collection returned 0 records. Either the collection is empty or Firestore rules block reading it for role <code>${esc(role)}</code>.`);
    }
  } catch (e) {
    console.error('[loadCustomers] unscoped failed:', e);
    APP.customers = [];
    APP.bootIssues.push(`Customers query (unscoped) also failed: <code>${esc(e.code || e.message)}</code>. Firestore rules may block <code>/customers</code>.`);
  }
}

async function loadDistricts() {
  try {
    const s = await getDocs(query(collection(db, 'districts'), limit(500)));
    APP.districts = s.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.warn('[loadDistricts] failed:', e.message); }
}
async function loadBranches() {
  try {
    const s = await getDocs(query(collection(db, 'branches'), limit(2000)));
    APP.branches = s.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.warn('[loadBranches] failed:', e.message); }
}
async function loadLoansCollection() {
  try {
    const s = await getDocs(query(collection(db, 'loans'), limit(2000)));
    APP.loans = s.docs.map(d => ({ id: d.id, ...d.data() }));
    console.log('[sacco] loans loaded:', APP.loans.length);
  } catch (e) { console.warn('[loadLoansCollection] failed:', e.code || e.message); }
}
async function loadSettings() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const d = snap.data();
      if (d.currency) APP.currency = d.currency;
      if (d.saccoName) APP.saccoName = d.saccoName;
      if (d.shortName) APP.shortName = d.shortName;
      APP.settings = mergeDashboard(d.dashboard || d);
      if (d.dividends && typeof d.dividends === 'object') {
        APP.settings = { ...APP.settings, ...d.dividends };
      }
    } else {
      APP.settings = mergeDashboard(null);
    }
  } catch (e) { console.warn('settings', e.message); APP.settings = mergeDashboard(null); }
}
async function loadAvailableYears() {
  const currentYear = new Date().getFullYear();
  const set = new Set();
  try {
    const [bS, tS, cS] = await Promise.all([
      getDocs(collection(db, 'dividendBatches')),
      getDocs(collection(db, 'transactions')),
      getDocs(collection(db, 'shares'))
    ]);
    bS.forEach(d => { const y = d.data().year; if (y) set.add(Number(y)); });
    tS.forEach(d => {
      const dd = toDate(d.data().date || d.data().timestamp || d.data().createdAt);
      if (dd) set.add(dd.getFullYear());
      if (d.data().year) set.add(Number(d.data().year));
    });
    cS.forEach(d => {
      const dd = toDate(d.data().date || d.data().timestamp || d.data().createdAt);
      if (dd) set.add(dd.getFullYear());
    });
  } catch (e) { console.warn('year load', e); }
  for (let i = -3; i <= 3; i++) set.add(currentYear + i);
  APP.years = Array.from(set).filter(y => y >= 2020 && isFinite(y)).sort((a,b) => b - a);
  if (!APP.years.includes(APP.selectedYear)) APP.selectedYear = APP.years[0] || currentYear;
}

/* ============================================================
 * BOOT
 * ============================================================ */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED_LANGS.includes(saved) ? saved
       : (SUPPORTED_LANGS.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  if (!isSessionRecordValid(sess)) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const user = await new Promise(resolve => {
    const unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); });
  });
  if (!user || user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    APP.profile = { id: snap.id, ...snap.data(), email: user.email || '' };
    if (APP.profile.status === 'inactive') throw new Error('inactive');
  } catch (e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  console.log('[sacco] booting with role:', APP.profile.role, '| districtId:', APP.profile.districtId, '| branchId:', APP.profile.branchId);

  await Promise.all([
    loadSettings(),
    loadCustomers(),
    loadDistricts(),
    loadBranches(),
    loadLoansCollection()
  ]);
  await loadAvailableYears();

  renderShell();
  renderMain();

  setTimeout(() => document.getElementById('loader')?.classList.add('hide'), 150);
})();

console.log('[sacco] dividends page ready');
</script>
