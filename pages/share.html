<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>
<script type="importmap">
{ "imports": {
  "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;--info:#2196f3;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;--violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-lg:20px;--r-full:999px;
  --radius:16px;--radius-sm:10px;
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
html.theme-dark body{background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.14),transparent 35%),radial-gradient(circle at 90% 80%,rgba(25,169,116,.14),transparent 35%),var(--bg);}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;pointer-events:none;}
#loader.hide{opacity:0;pointer-events:none;visibility:hidden;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar__brand{position:relative;display:flex;align-items:center;gap:14px;
  padding:22px;border-bottom:1px solid rgba(255,255,255,.10);min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.97);
  display:grid;place-items:center;padding:5px;overflow:hidden;flex-shrink:0;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;transition:opacity .18s;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);
  border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer;z-index:10;}
.sidebar__collapse i{font-size:10px;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;
  font-size:14px;font-weight:600;color:rgba(255,255,255,.78);margin-bottom:3px;white-space:nowrap;
  cursor:pointer;position:relative;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;text-align:center;flex-shrink:0;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);
  position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);
  background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;
  white-space:nowrap;box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
.sidebar__logout i{width:20px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);
  align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;border-radius:var(--r-full);
  background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:800;
  font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);white-space:nowrap;}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;
  border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 60px rgba(20,40,70,.12);
  min-width:260px;padding:8px;z-index:50;}
html.theme-dark .dropdown__panel{background:#0f172a;border-color:#1e293b;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
html.theme-dark .main{background:#0b1220;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 20px;margin-bottom:20px;
  box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
html.theme-dark .breadcrumb{background:#0f172a;border-color:#1e293b;}
.breadcrumb__item{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb__item.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb__item.is-link{cursor:pointer;}
.breadcrumb__item.is-link:hover{background:#dbeafe;color:var(--primary);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .stat{background:#0f172a;border-color:#1e293b;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue{--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green{--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--gold{--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#5b21b6,#7c3aed);--ic:#f0eaff;--ifc:#5b21b6;}
.stat__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.stat__label{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.stat__icon{width:42px;height:42px;border-radius:12px;background:var(--ic);color:var(--ifc);
  display:grid;place-items:center;flex-shrink:0;font-size:16px;}
.stat__value{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:var(--text);}
.stat__hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);overflow:hidden;}
html.theme-dark .card{background:#0f172a;border-color:#1e293b;}
.card__head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;
  border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:320px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);
  font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);
  border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
html.theme-dark .toolbar__search input{background:#1a2433;border-color:#334155;color:#e4e8f0;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:11px;
  background:#fff;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;min-width:140px;font-family:inherit;}
html.theme-dark .toolbar select{background:#1a2433;border-color:#334155;color:#e4e8f0;}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.view-toggle{display:flex;gap:2px;padding:3px;border-radius:11px;background:#e8ecf1;}
html.theme-dark .view-toggle{background:#1a2433;}
.view-toggle button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.view-toggle button.is-active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(20,40,70,.08);}
html.theme-dark .view-toggle button.is-active{background:#0f172a;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;
  padding:0 20px;border-radius:13px;border:1px solid #d9dee7;background:#fff;color:var(--text-soft);
  font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;}
html.theme-dark .btn{background:#111a2c;border-color:#334155;color:#c5cdd9;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--violet{background:linear-gradient(135deg,#5b21b6,#7c3aed);border:none;color:#fff;box-shadow:0 10px 22px rgba(91,33,182,.22);}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.shares-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:22px;}
.share-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:16px;
  padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .share-card{background:#0f172a;border-color:#1e293b;}
.share-card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:#ddd2fb;}
.share-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#5b21b6,#7c3aed);}
.share-card--buy::before{background:linear-gradient(90deg,#19a974,#34c78e);}
.share-card--sell::before{background:linear-gradient(90deg,#dc2626,#e74c5c);}
.share-card--pending::before{background:linear-gradient(90deg,#d4a017,#e8b84b);}
.share-card--rejected::before{background:linear-gradient(90deg,#94a3b8,#64748b);}
.share-card--merged::before{background:linear-gradient(90deg,#94a3b8,#64748b);opacity:.5;}
.share-card__head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;margin-top:12px;}
.share-card__avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;font-weight:800;font-size:18px;
  display:grid;place-items:center;overflow:hidden;position:relative;}
.share-card__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.share-card__main{flex:1;min-width:0;}
.share-card__code-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.share-card__code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;font-weight:800;
  letter-spacing:.4px;color:#5b21b6;background:#f0eaff;padding:3px 9px;border-radius:6px;display:inline-block;}
.share-card__topup-tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;font-weight:800;
  letter-spacing:.4px;color:#fff;background:linear-gradient(135deg,#7c3aed,#5b21b6);
  padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;}
.share-card__reprint-tag{font-size:9.5px;font-weight:800;letter-spacing:.4px;color:#7a5210;
  background:#fdf5e0;border:1px solid #f0dcb0;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;}
.share-card__name{font-size:16px;font-weight:800;color:var(--text);line-height:1.3;word-break:break-word;}
.share-card__meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.share-card__actions{position:absolute;top:16px;right:16px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;}
.share-card__actions button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;color:var(--text-soft);background:#fff;border:1px solid var(--border);transition:.15s;}
html.theme-dark .share-card__actions button{background:#1a2433;border-color:#1e293b;color:#c5cdd9;}
.share-card__actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.share-card__actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.share-card__actions button.success:hover{background:#128a5c;border-color:#128a5c;}
.share-card__actions button.print:hover{background:#b8860b;border-color:#b8860b;}
.share-card__amounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;
  background:linear-gradient(135deg,#faf7ff,#fff);border:1px solid #e8dffb;border-radius:12px;margin-bottom:14px;}
html.theme-dark .share-card__amounts{background:linear-gradient(135deg,#1a1230,#0f172a);border-color:#2e2361;}
.share-card__amount-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.share-card__amount-value{font-size:16px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;

/* ============ SESSION ============ */
const SESSION_KEY = "sacco.session";
const DEFAULT_SESSION_MINUTES = 30;
let SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
let awayStartedAt = null, awayCheckInterval = null;

function readSession(){ try{ const r=sessionStorage.getItem(SESSION_KEY); if(!r) return null; const s=JSON.parse(r); return (s&&s.uid)?s:null; }catch(e){ return null; } }
function clearSession(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }
function isSessionRecordValid(s){ return !!(s && s.uid); }
function getSessionMs(){ const s=readSession(); const m=(SESSION_MINUTES!=null&&SESSION_MINUTES>0)?SESSION_MINUTES:((s&&s.minutes)||DEFAULT_SESSION_MINUTES); return Math.max(1,m)*60000; }
function readCachedProfile(){ try{ const r=sessionStorage.getItem(PROFILE_CACHE_KEY); if(!r) return null; const p=JSON.parse(r); return (p&&p.uid)?p:null; }catch(e){ return null; } }
function writeCachedProfile(){
  if(!APP.profile) return;
  try{
    const payload = {
      uid: APP.profile.id || APP.user?.uid || '',
      role: APP.profile.role || 'viewer',
      email: APP.profile.email || '',
      name: APP.profile.fullName || APP.profile.name || 'User',
      photoURL: APP.profile.photoURL || null,
      districtId: APP.profile.districtId || '',
      districtName: APP.profile.districtName || '',
      branchId: APP.profile.branchId || '',
      branchName: APP.profile.branchName || ''
    };
    if(payload.uid) sessionStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(payload));
  }catch(e){}
}
function clearCachedProfile(){ try{ sessionStorage.removeItem(PROFILE_CACHE_KEY); }catch(e){} }
function hideLoaderNow(){ const el=document.getElementById('loader'); if(el) el.classList.add('hide'); }
function forceLogout(reason){
  if(awayCheckInterval){ clearInterval(awayCheckInterval); awayCheckInterval=null; }
  awayStartedAt = null;
  try{ sessionStorage.clear(); }catch(e){}
  try{ sessionStorage.setItem('__redirectReason', reason || 'expired'); }catch(e){}
  clearSession(); clearCachedProfile();
  try{ signOut(auth); }catch(e){}
  window.location.replace(LOGIN_URL);
}
function isWindowActive(){ return document.visibilityState==='visible' && document.hasFocus(); }
function startAwayTimer(){
  if(awayStartedAt) return;
  awayStartedAt = Date.now();
  if(awayCheckInterval) clearInterval(awayCheckInterval);
  awayCheckInterval = setInterval(() => {
    if(!awayStartedAt) return;
    if(Date.now() - awayStartedAt >= getSessionMs()){ forceLogout('expired'); return; }
  }, 1000);
}
function stopAwayTimer(){ awayStartedAt=null; if(awayCheckInterval){ clearInterval(awayCheckInterval); awayCheckInterval=null; } }
function evaluateActivity(){
  if(isWindowActive()){
    if(awayStartedAt){ if(Date.now()-awayStartedAt >= getSessionMs()){ forceLogout('expired'); return; } }
    stopAwayTimer();
  } else startAwayTimer();
}
function startSessionWatcher(){
  document.addEventListener('visibilitychange', evaluateActivity);
  window.addEventListener('focus', evaluateActivity);
  window.addEventListener('blur', evaluateActivity);
  evaluateActivity();
}
async function loadSessionTimeout(){
  try{
    const snap = await getDoc(doc(db,'settings','system'));
    if(snap.exists()){
      const d = snap.data();
      let m = DEFAULT_SESSION_MINUTES;
      if(d.sessionTimeout != null) m = Number(d.sessionTimeout);
      else if(d.sessionTimeoutMinutes != null) m = Number(d.sessionTimeoutMinutes);
      if(!isFinite(m) || m < 1) m = DEFAULT_SESSION_MINUTES;
      if(m > 1440) m = 1440;
      SESSION_MINUTES = Math.round(m);
    }
  }catch(e){}
  try{ const s=readSession(); if(s){ s.minutes=SESSION_MINUTES; sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } }catch(e){}
}

const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N[FALLBACK][k] || k;
  if(v) Object.keys(v).forEach(x => { s = s.replace('{'+x+'}', v[x]); });

};

const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };
const money = (v) => 'ETB ' + num(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const moneyShort = (v) => {
  const n = num(v);
  if(!n) return 'ETB 0';
  if(n >= 1e9) return 'ETB ' + (n/1e9).toFixed(2) + 'B';
  if(n >= 1e6) return 'ETB ' + (n/1e6).toFixed(2) + 'M';
  if(n >= 1e3) return 'ETB ' + (n/1e3).toFixed(1) + 'K';
  return 'ETB ' + n.toLocaleString();
};
const fmtNum = (v) => num(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
const toDate = (v) => { if(!v) return null; if(v.toDate) return v.toDate(); if(typeof v === 'string') return new Date(v); return v; };
const fmtDate = (v) => {
  if(!v) return '—';
  const d = toDate(v);
  if(!d || isNaN(d)) return typeof v === 'string' ? v : '—';
  return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
};
const fmtDateTime = (v) => {
  const d = toDate(v);
  if(!d || isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
};
const customerName = (c) => {
  if(!c) return '—';
  if(LANG === 'am' && c.fullNameAm) return c.fullNameAm;
  if(c.fullName) return c.fullName;
  const en = [c.firstNameEn, c.middleNameEn, c.lastNameEn].filter(Boolean).join(' ').trim();
  if(en) return en;
  const am = [c.firstNameAm, c.middleNameAm, c.lastNameAm].filter(Boolean).join(' ').trim();
  return am || '—';
};
const normalizePhone = (v) => {
  let s = String(v || '').replace(/\D/g,'');
  if(s.startsWith('251') && s.length > 9) s = s.slice(3);
  if(s.startsWith('0')) s = s.slice(1);
  return s.slice(0,9);
};
const formatPhone = (v) => {
  const s = normalizePhone(v);
  if(s.length !== 9) return v || '';
  return '+251 ' + s.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
};
function toast(msg, type='success'){
  const wrap = document.getElementById('toast-container'); if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
  el.innerHTML = `<i class="fas ${icons[type] || 'fa-info-circle'}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3800);
  setTimeout(() => el.remove(), 4200);
}

/* ============ SCOPE ============ */
function scopeCustomers(){
  if(!APP.profile) return [];
  const role = APP.profile.role;
  if(role === 'super_admin' || role === 'auditor' || role === 'loading') return APP.customers.slice();
  if(['admin','manager','cashier','teller','accountant'].includes(role)){
    if(APP.profile.region) return APP.customers.filter(c => c.region === APP.profile.region);
    return APP.customers.slice();
  }
  if(role === 'member'){
    const cid = APP.profile.customerId || APP.profile.memberId;
    return APP.customers.filter(c => c.userId === APP.profile.id || c.customerId === cid || c.id === cid);
  }
  return APP.customers.slice();
}
function scopeShares(){
  if(!APP.profile) return [];
  const role = APP.profile.role;
  if(role === 'member'){
    const cid = APP.profile.customerId || APP.profile.memberId;
    return APP.shares.filter(s => s.customerId === cid || s.customerDocId === cid || s.memberId === cid);
  }
  const ids = new Set(scopeCustomers().map(c => c.id));
  const cids = new Set(scopeCustomers().map(c => c.customerId).filter(Boolean));
  return APP.shares.filter(s => {
    const mId = s.customerId || s.memberId;
    const dId = s.customerDocId;
    return ids.has(mId) || ids.has(dId) || cids.has(mId) || !mId;
  });
}
function customerById(id){ if(!id) return null; return APP.customers.find(c => c.id === id || c.customerId === id) || null; }
function districtById(id){ return APP.districts.find(d => d.id === id) || null; }
function branchById(id){ return APP.branches.find(b => b.id === id) || null; }
function generateSerialNumber(){
  const yr = new Date().getFullYear();
  const rnd = Math.floor(100000 + Math.random() * 900000);
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let suf = '';
  for(let i = 0; i < 3; i++) suf += chars[Math.floor(Math.random() * chars.length)];
  return `SH-${yr}-${rnd}-${suf}`;
}

/* ============ SHARE MODEL ============ */
function findCustomerCard(customer, excludeId){
  if(!customer) return null;
  const cid = customer.customerId || customer.id;
  return APP.shares.find(sh => {
    if(excludeId && sh.id === excludeId) return false;
    const isOwn = sh.customerId === cid || sh.memberId === cid ||
                  sh.customerId === customer.id || sh.memberId === customer.id ||
                  sh.customerDocId === customer.id;
    if(!isOwn) return false;
    if(String(sh.status || '').toLowerCase() !== 'approved') return false;
    if(sh.isMerged) return false;
    const type = String(sh.type || '').toLowerCase();
    return type === 'buy' || type === 'share_buy';
  }) || null;
}
function customerShares(customer, excludeShareId){
  if(!customer) return 0;
  const cid = customer.customerId || customer.id;
  let total = 0;
  APP.shares.forEach(sh => {
    if(excludeShareId && sh.id === excludeShareId) return;
    const isOwn = sh.customerId === cid || sh.memberId === cid ||
                  sh.customerId === customer.id || sh.memberId === customer.id ||
                  sh.customerDocId === customer.id;
    if(!isOwn) return;
    if(String(sh.status || '').toLowerCase() !== 'approved') return;
    if(sh.isMerged) return;
    const type = String(sh.type || '').toLowerCase();
    const n = num(sh.shares);
    if(type === 'buy' || type === 'share_buy') total += n;
    else if(type === 'sell' || type === 'share_sell') total -= n;
  });
  return Math.max(0, total);
}
function customerSharesValue(customer, excludeShareId){
  if(!customer) return 0;
  const cid = customer.customerId || customer.id;
  let total = 0;
  APP.shares.forEach(sh => {
    if(excludeShareId && sh.id === excludeShareId) return;
    const isOwn = sh.customerId === cid || sh.memberId === cid ||
                  sh.customerId === customer.id || sh.memberId === customer.id ||
                  sh.customerDocId === customer.id;
    if(!isOwn) return;
    if(String(sh.status || '').toLowerCase() !== 'approved') return;
    if(sh.isMerged) return;
    const type = String(sh.type || '').toLowerCase();
    const amt = num(sh.amount);
    if(type === 'buy' || type === 'share_buy') total += amt;
    else if(type === 'sell' || type === 'share_sell') total -= amt;
  });
  return Math.max(0, total);
}

/* ============ FILTERS ============ */
function filteredShares(){
  let list = scopeShares();
  if(APP.filters.status !== 'merged'){
    list = list.filter(s => !s.isMerged);
  }
  const s = APP.filters.search.trim().toLowerCase();
  if(s){
    list = list.filter(sh => {
      const c = customerById(sh.customerId || sh.customerDocId);
      const name = customerName(c).toLowerCase();
      return name.includes(s)
          || (sh.serialNumber || '').toLowerCase().includes(s)
          || (sh.customerId || '').toLowerCase().includes(s)
          || (sh.reference || '').toLowerCase().includes(s)
          || (sh.notes || '').toLowerCase().includes(s)
          || (c?.phone || '').toLowerCase().includes(s)
          || (c?.customerId || '').toLowerCase().includes(s);
    });
  }
  if(APP.filters.districtId){
    const ids = new Set(scopeCustomers().filter(c => c.districtId === APP.filters.districtId).map(c => c.id));
    list = list.filter(sh => ids.has(sh.customerDocId) || ids.has(sh.customerId));
  }
  if(APP.filters.branchId){
    const ids = new Set(scopeCustomers().filter(c => c.branchId === APP.filters.branchId).map(c => c.id));
    list = list.filter(sh => ids.has(sh.customerDocId) || ids.has(sh.customerId));
  }
  if(APP.filters.type){
    list = list.filter(sh => {
      const type = String(sh.type || '').toLowerCase().replace('share_','');
      return type === APP.filters.type;
    });
  }
  if(APP.filters.status && APP.filters.status !== 'merged'){
    list = list.filter(sh => (sh.status || '') === APP.filters.status);
  }
  return list.slice().sort((a, b) => {
    const da = toDate(b.createdAt || b.date)?.getTime() || 0;
    const db2 = toDate(a.createdAt || a.date)?.getTime() || 0;
    return db2 - da;
  });
}
function renderContent(){
  const host = document.getElementById('contentHost');
  if(!host) return;
  const list = filteredShares();
  if(!list.length){
    const isFiltered = APP.filters.search || APP.filters.districtId || APP.filters.branchId || APP.filters.type || APP.filters.status;
    host.innerHTML = `<div class="empty">
      <i class="fas ${isFiltered ? 'fa-search' : 'fa-chart-pie'}"></i>
      <div class="empty__title">${isFiltered ? esc(t('noMatch')) : esc(t('noShares'))}</div>
      <div class="empty__text">${isFiltered ? esc(t('noMatchText')) : esc(t('noSharesText'))}</div>
    </div>`;
    return;
  }
  if(APP.view === 'table') renderTableView(host, list);
  else renderGridView(host, list);
}

/* ============ HELPERS ============ */
function shareTypeKey(type){
  const s = String(type || '').toLowerCase();
  if(s === 'buy' || s === 'share_buy') return 'buy';
  if(s === 'sell' || s === 'share_sell') return 'sell';
  return 'buy';
}
function shareTypeLabel(type){ return shareTypeKey(type) === 'buy' ? t('typeBuy') : t('typeSell'); }
function shareTypeCls(type){ return shareTypeKey(type) === 'buy' ? 'tag--green' : 'tag--red'; }
function shareCardClass(sh){
  if(sh.isMerged) return 'share-card--merged';
  const status = String(sh.status || '').toLowerCase();
  if(status === 'pending') return 'share-card--pending';
  if(status === 'rejected') return 'share-card--rejected';
  return 'share-card--' + shareTypeKey(sh.type);
}
function shareStatusLabel(status){
  const s = String(status || '').toLowerCase();
  if(s === 'pending') return t('statusPending');
  if(s === 'approved') return t('statusApproved');
  if(s === 'rejected') return t('statusRejected');
  if(s === 'merged') return t('statusMerged');
  return status || '—';
}
function shareStatusBadgeCls(sh){
  if(sh && sh.isMerged) return 'status-badge--merged';
  const s = String((sh && sh.status) || '').toLowerCase();
  if(s === 'approved') return 'status-badge--approved';
  if(s === 'rejected') return 'status-badge--rejected';
  return 'status-badge--pending';
}
function methodLabel(method){
  const m = String(method || '').toLowerCase();
  if(m === 'cash') return t('methodCash');
  if(m === 'bank') return t('methodBank');
  if(m === 'mobile') return t('methodMobile');
  if(m === 'cheque' || m === 'check') return t('methodCheque');
  return method || '—';
}

/* ============ GRID ============ */
function renderGridView(host, list){
  const pages = Math.max(1, Math.ceil(list.length / APP.pageSize));
  if(APP.page > pages) APP.page = pages;
  const start = (APP.page - 1) * APP.pageSize;
  const pageList = list.slice(start, start + APP.pageSize);
  host.innerHTML = `<div class="shares-grid">${pageList.map(sh => renderShareCard(sh)).join('')}</div>
    ${renderPagination(list.length, pages, start, pageList.length)}`;
  host.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => handleRowAction(btn.dataset.action, btn.dataset.id)));
  host.querySelectorAll('[data-page]').forEach(btn => btn.addEventListener('click', () => {
    const p = Number(btn.dataset.page);
    if(p >= 1 && p <= pages){ APP.page = p; renderContent(); }
  }));
}
function renderShareCard(sh){
  const c = customerById(sh.customerId || sh.customerDocId);
  const avatar = c?.photoURL ? `<img src="${esc(c.photoURL)}" alt="">` : esc(initials(customerName(c)));
  const status = String(sh.status || '').toLowerCase();
  const isPending = status === 'pending';
  const isApproved = status === 'approved';
  const isMerged = !!sh.isMerged;
  const canA = canApprove() && isPending;
  const canE = canEdit() && !isMerged;
  const canD = canDelete() && !isMerged;
  const canP = canPrint() && isApproved && !isMerged;
  const isTopUp = !!sh.isTopUp;
  const parentSerial = isTopUp ? (sh.parentSerial || '') : '';
  const needsReprint = !!sh.needsReprint && isApproved && !isMerged;

  return `<div class="share-card ${shareCardClass(sh)}">
    <span class="status-badge ${shareStatusBadgeCls(sh)}">${esc(isMerged ? t('statusMerged') : shareStatusLabel(status))}</span>
    <div class="share-card__head">
      <div class="share-card__avatar">${avatar}</div>
      <div class="share-card__main">
        <div class="share-card__code-row">
          <span class="share-card__code">${esc(sh.serialNumber || '—')}</span>
          ${isTopUp && !isMerged ? `<span class="share-card__topup-tag"><i class="fas fa-layer-group" style="font-size:8px"></i>${esc(t('newPurchase'))}</span>` : ''}
          ${needsReprint ? `<span class="share-card__reprint-tag"><i class="fas fa-exclamation-triangle" style="font-size:8px"></i>${esc(t('needsReprint'))}</span>` : ''}
        </div>
        <div class="share-card__name">${esc(customerName(c))}</div>
        <div class="share-card__meta">
          <span class="tag ${shareTypeCls(sh.type)}" style="font-size:10px">${esc(shareTypeLabel(sh.type))}</span>
          <span style="font-size:11px"><i class="fas fa-calendar" style="font-size:10px;margin-right:3px"></i>${esc(fmtDate(sh.date || sh.createdAt))}</span>
          ${parentSerial ? `<span style="font-size:10px;color:var(--muted);font-weight:700">${esc(t('topupOf'))}: <span style="font-family:ui-monospace,monospace">${esc(parentSerial)}</span></span>` : ''}
        </div>
      </div>
    </div>

function renderPagination(total, pages, start, shown){
  if(total <= APP.pageSize){
    return `<div class="pagination"><div class="pagination__info">${esc(t('showing'))} <strong>${total}</strong> ${esc(t('sharesWord'))}</div></div>`;
  }
  const range = [];
  const startPage = Math.max(1, APP.page - 2);
  const endPage = Math.min(pages, startPage + 4);
  for(let i = startPage; i <= endPage; i++) range.push(i);
  return `<div class="pagination">
    <div class="pagination__info">${esc(t('showing'))} <strong>${start + 1}–${start + shown}</strong> ${esc(t('of'))} <strong>${total}</strong> ${esc(t('sharesWord'))}</div>

      <button data-page="${APP.page - 1}" ${APP.page===1?'disabled':''}><i class="fas fa-chevron-left"></i></button>
      ${range.map(p => `<button data-page="${p}" class="${p===APP.page?'is-current':''}">${p}</button>`).join('')}
      <button data-page="${APP.page + 1}" ${APP.page===pages?'disabled':''}><i class="fas fa-chevron-right"></i></button>
    </div></div>`;
}

let _debTimer;
function debounce(fn, ms){
  return function(...args){
    clearTimeout(_debTimer);
    _debTimer = setTimeout(() => fn.apply(this, args), ms);
  };
}
function handleRowAction(action, id){
  const sh = APP.shares.find(x => x.id === id);
  if(!sh) return;
  if(action === 'view')      openViewModal(sh);
  if(action === 'edit')      { if(!canEdit()){ toast(t('noPermission'),'error'); return; } openShareWizard(sh); }
  if(action === 'delete')    openDeleteModal(sh);
  if(action === 'approve')   approveShare(sh);
  if(action === 'reject')    rejectShare(sh);
  if(action === 'print')     printSlip(sh);
}

/* ============ APPROVE / REJECT ============ */
async function approveShare(sh){
  if(!canApprove()){ toast(t('noPermission'),'error'); return; }
  const userName = APP.profile?.fullName || APP.profile?.name || APP.user?.email || 'User';
  const currentPrice = num(APP.settings.sharePrice) || num(sh.pricePerShare);
  const oldPrice = num(sh.pricePerShare);
  const priceDiff = oldPrice > 0 && currentPrice > 0 && Math.abs(oldPrice - currentPrice) > 0.0001;

  const confirmMsg = t('approveConfirmMsg')
    .replace('{sh}', fmtNum(sh.shares))
    .replace('{amt}', money(sh.amount))
    + (priceDiff ? `\n\n${t('priceChangedWarning').replace('{old}', money(oldPrice)).replace('{cur}', money(currentPrice))}` : '');
  if(!confirm(`${t('approveConfirmTitle')}\n\n${confirmMsg}`)) return;

  try {
    let updates = {
      status: 'approved', approvedAt: serverTimestamp(),
      approvedBy: APP.profile.id, approvedByName: userName
    };
    let approvedShares = num(sh.shares);
    let approvedAmount = num(sh.amount);

    if(priceDiff){
      const newShares = Math.max(1, Math.round(approvedAmount / currentPrice));
      const newAmount = Math.round(newShares * currentPrice * 100) / 100;
      updates.shares = newShares;
      updates.amount = newAmount;
      updates.pricePerShare = currentPrice;
      updates.recalculatedFrom = oldPrice;
      updates.recalculatedTo = currentPrice;
      updates.recalculatedAt = serverTimestamp();
      if(Number(sh.printCount || 0) > 0) updates.needsReprint = true;
      approvedShares = newShares;
      approvedAmount = newAmount;
    }

    await updateDoc(doc(db, 'shares', sh.id), updates);

    if(sh.isTopUp && sh.parentShareId){
      const parent = APP.shares.find(x => x.id === sh.parentShareId);
      if(parent){
        const newShares = num(parent.shares) + approvedShares;
        const newAmount = num(parent.amount) + approvedAmount;
        const parentLog = Array.isArray(parent.topUpLog) ? parent.topUpLog : [];
        await updateDoc(doc(db, 'shares', parent.id), {
          shares: newShares,
          amount: newAmount,
          topUpLog: [...parentLog, {
            shares: approvedShares,
            amount: approvedAmount,
            at: new Date().toISOString(),
            by: userName,
            fromSerial: sh.serialNumber,
            priceAtMerge: currentPrice
          }],
          lastToppedUpAt: serverTimestamp(),
          lastToppedUpByName: userName,
          topUpCount: Number(parent.topUpCount || 0) + 1
        });
        await updateDoc(doc(db, 'shares', sh.id), {
          isMerged: true,
          mergedAt: serverTimestamp(),
          mergedBy: APP.profile.id,
          mergedByName: userName,
          mergedIntoId: parent.id,
          mergedIntoSerial: parent.serialNumber || ''
        });
      }
    }
    toast(priceDiff
      ? t('approvedOk') + ' ' + t('adjustedOnApprove').replace('{price}', money(currentPrice))
      : t('approvedOk'), 'success');
  }catch(e){
    toast(t('errorSave') + (e.code === 'permission-denied' ? t('noPermission') : e.message), 'error');
  }
}
async function rejectShare(sh){
  if(!canApprove()){ toast(t('noPermission'),'error'); return; }
  if(!confirm(t('rejecting'))) return;
  const userName = APP.profile?.fullName || APP.profile?.name || APP.user?.email || 'User';
  try{
    await updateDoc(doc(db, 'shares', sh.id), {
      status: 'rejected', rejectedAt: serverTimestamp(),
      approvedBy: APP.profile.id, approvedByName: userName
    });
    toast(t('rejectedOk'), 'success');
  }catch(e){
    toast(t('errorSave') + (e.code === 'permission-denied' ? t('noPermission') : e.message), 'error');
  }
}

        collect();
        data._customerDocId = el.dataset.customerId;
        data.customerId = el.dataset.customerCode;
        draw();
      });
    });
    root.querySelectorAll('[data-set-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        collect(); data.type = btn.dataset.setType; draw();
      });
    });
    root.querySelector('#wiz-shares')?.addEventListener('blur', () => { collect(); draw(); });
    root.querySelector('#wiz-price')?.addEventListener('blur', () => { collect(); draw(); });
    root.querySelector('#wiz-shares')?.addEventListener('input', (e) => { data.shares = e.target.value; });
    root.querySelector('#wiz-price')?.addEventListener('input', (e) => { data.pricePerShare = e.target.value; });

    root.querySelector('#wiz-save').addEventListener('click', async (e) => {
      collect();
      const errBox = root.querySelector('#wizErr');
      const c = customerById(data.customerId);
      const shares = Math.floor(num(data.shares));
      const price = num(data.pricePerShare);
      errBox.style.display = 'none';
      let err = '';
      if(!c) err = t('chooseCustomer');
      else if(shares <= 0) err = t('invalidShares');
      else if(price <= 0) err = t('invalidPrice');
      else if((data.type === 'sell') && shares > customerShares(c, isEdit ? s0.id : null)) err = t('insufficientShares');
      if(err){
        errBox.innerHTML = `<i class="fas fa-exclamation-circle"></i><div>${esc(err)}</div>`;
        errBox.style.display = 'flex'; return;
      }
      const btn = e.currentTarget;
      const sp = btn.querySelector('.spinner-sm');
      const lbl = btn.querySelector('.btn-label');
      btn.disabled = true; sp.classList.remove('hidden'); lbl.textContent = t('loading');
      const amount = shares * price;
      const userName = APP.profile?.fullName || APP.profile?.name || APP.user?.email || 'User';

      const finalStatus = isEdit ? (data.status || 'pending') : 'pending';
      const existingCard = (data.type === 'buy' && !isEdit) ? findCustomerCard(c) : null;

      const payload = {
        type: data.type,
        customerId: c.customerId || c.id, memberId: c.customerId || c.id,
        customerDocId: c.id, customerName: customerName(c),
        shares, pricePerShare: price, amount,
        date: data.date || new Date().toISOString().slice(0,10),
        paymentMethod: data.paymentMethod || 'cash',
        reference: (data.reference || '').trim(),
        notes: (data.notes || '').trim(),
        status: finalStatus,
        updatedAt: serverTimestamp()
      };
      if(existingCard){
        payload.isTopUp = true;
        payload.parentShareId = existingCard.id;
        payload.parentSerial = existingCard.serialNumber || '';
      }
      if(finalStatus === 'approved'){
        payload.approvedBy = APP.profile.id;
        payload.approvedByName = userName;
        payload.approvedAt = serverTimestamp();
      } else {
        payload.approvedBy = null;
        payload.approvedByName = null;
      }
      try{
        if(isEdit){
          payload.serialNumber = s0.serialNumber || generateSerialNumber();
          if(s0.isTopUp){
            payload.isTopUp = true;
            payload.parentShareId = s0.parentShareId || null;
            payload.parentSerial = s0.parentSerial || '';
          }
          await updateDoc(doc(db, 'shares', s0.id), payload);
          toast(t('savedOk'), 'success');
        } else {
          payload.serialNumber = generateSerialNumber();
          payload.createdAt = serverTimestamp();
          payload.createdBy = APP.profile.id;
          payload.createdByName = userName;
          payload.printCount = 0;
          await setDoc(doc(collection(db, 'shares')), payload);
          toast(t('createdOk'), 'success');
        }
        closeModal();
      }catch(e2){
        errBox.innerHTML = `<i class="fas fa-exclamation-circle"></i><div>${esc(e2.code === 'permission-denied' ? t('noPermission') : e2.message)}</div>`;
        errBox.style.display = 'flex';
        btn.disabled = false; sp.classList.add('hidden'); lbl.textContent = isEdit ? t('update') : t('create');
      }
    });
  }
  draw();
}

async function printSlip(sh){
  if(!sh) return;
  if(!canPrint()){ toast(t('noPermission'),'error'); return; }
  if(String(sh.status || '').toLowerCase() !== 'approved'){ toast('Only approved share transactions can be printed.', 'warning'); return; }

  const prevCount = Number(sh.printCount || 0);
  const newCount = prevCount + 1;
  const watermarkText = newCount === 1 ? t('original') : t('copy');

  if(!sh.serialNumber){
    sh.serialNumber = generateSerialNumber();
    try{ await updateDoc(doc(db, 'shares', sh.id), { serialNumber: sh.serialNumber }); }catch(e){}
  }
  try{
    await updateDoc(doc(db, 'shares', sh.id), {
      printCount: newCount, printStatus: 'printed',
      lastPrintedAt: serverTimestamp(), lastPrintedBy: APP.profile.id,
      lastPrintedByName: APP.profile.fullName || APP.profile.name || '',
      needsReprint: false
    });
    sh.printCount = newCount;
    sh.needsReprint = false;
    if(newCount === 1) toast(t('firstPrint'), 'info');
    else toast(t('reprint') + ' ×' + newCount, 'warning');
  }catch(e){ toast(t('printError'), 'error'); }

  const host = document.getElementById('slip-print-host');
  host.innerHTML = buildSlipHtml(sh, watermarkText);

  closeSlipOverlay();
  const overlay = document.createElement('div');
  overlay.className = 'slip-overlay';
  overlay.id = 'slip-overlay';
  overlay.innerHTML = `<div class="slip-toolbar">
    <div class="slip-toolbar__title">
      <i class="fas fa-chart-pie" style="color:#5b21b6"></i>
      ${esc(t('slipPreview'))}
    </div>
    <button class="primary" id="slip-print-btn"><i class="fas fa-print"></i> ${esc(t('printSlip'))}</button>
    <button id="slip-close-btn"><i class="fas fa-times"></i> Close</button>
  </div>
  <div class="slip-preview-wrap">
    ${buildSlipHtml(sh, watermarkText)}
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('slip-print-btn').addEventListener('click', () => {
    host.innerHTML = buildSlipHtml(sh, watermarkText);
    setTimeout(() => window.print(), 60);
  });
  document.getElementById('slip-close-btn').addEventListener('click', closeSlipOverlay);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeSlipOverlay(); });
  escHandler = (e) => { if(e.key === 'Escape') closeSlipOverlay(); };
  document.addEventListener('keydown', escHandler);
}
function closeSlipOverlay(){
  const el = document.getElementById('slip-overlay');
  if(el) el.remove();
  if(escHandler){ document.removeEventListener('keydown', escHandler); escHandler = null; }
}

/* ============ LISTENERS ============ */
function attachListeners(){
  stopListeners();
  const watch = (coll, key, orderField) => {
    let ref = collection(db, coll);
    if(orderField) ref = query(ref, orderBy(orderField, 'desc'), limit(1000));
    const unsub = onSnapshot(ref,
      (snap) => {
        APP[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        scheduleRefresh();
      },
      (err) => {
        console.warn('[listen]', coll, err.code, err.message);
        getDocs(collection(db, coll)).then(s2 => {
          APP[key] = s2.docs.map(d => ({ id: d.id, ...d.data() }));
        }).catch(() => { APP[key] = []; })
          .finally(() => scheduleRefresh());
      }
    );
    APP.unsubs.push(unsub);
  };
  watch('customers', 'customers');
  watch('districts', 'districts');
  watch('branches',  'branches');
  watch('shares',    'shares', 'createdAt');

  // Live settings — prefer `shareValue` (new field), fall back to legacy `sharePrice`.
  const unsubSettings = onSnapshot(doc(db, 'settings', 'system'),
    (snap) => {
      if(snap.exists()){
        const d = snap.data();
        const rawPrice = (d.shareValue != null) ? d.shareValue
                       : (d.sharePrice != null ? d.sharePrice : null);
        const newPrice = num(rawPrice) > 0 ? num(rawPrice) : APP.settings.sharePrice;
        const newName = (d.saccoName && String(d.saccoName).trim()) || SACCO_NAME;
        const priceChanged = Math.abs(num(APP.settings.sharePrice) - newPrice) > 0.0001;
        const nameChanged = APP.settings.saccoName !== newName;
        APP.settings.sharePrice = newPrice;
        APP.settings.saccoName = newName;
        if(priceChanged || nameChanged){
          renderShell();
          scheduleRefresh();
        }
      }
    },
    (err) => { console.warn('[listen settings]', err.code, err.message); }
  );
  APP.unsubs.push(unsubSettings);
}
function stopListeners(){
  APP.unsubs.forEach(u => { try{ u(); }catch(e){} });
  APP.unsubs = [];
}
let _refreshTimer = null;
function scheduleRefresh(){
  if(_refreshTimer) return;
  _refreshTimer = setTimeout(() => { _refreshTimer = null; if(APP.profile) renderMain(); }, 250);
}

/* ============ SETTINGS ONE-SHOT (initial boot) ============ */
async function loadSettingsOnce(){
  try{
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if(snap.exists()){
      const d = snap.data();
      const rawPrice = (d.shareValue != null) ? d.shareValue
                     : (d.sharePrice != null ? d.sharePrice : null);
      const price = num(rawPrice);
      if(price > 0) APP.settings.sharePrice = price;
      if(d.saccoName && String(d.saccoName).trim()) APP.settings.saccoName = String(d.saccoName).trim();
    }
  }catch(e){}
}

/* ============ BOOT ============ */
(async function boot(){
  let saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  const hasMis = sessionStorage.getItem('loggedIn') === 'true' && sessionStorage.getItem('uid');
  if(!isSessionRecordValid(sess) && !hasMis){
    try{ sessionStorage.setItem('__redirectReason', 'expired'); }catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const cachedProfile = readCachedProfile();
  let rendered = false;
  if(cachedProfile && cachedProfile.uid){
    APP.profile = {
      id: cachedProfile.uid,
      role: cachedProfile.role || 'viewer',
      email: cachedProfile.email || '',
      fullName: cachedProfile.name || 'User',
      photoURL: cachedProfile.photoURL || null,
      districtId: cachedProfile.districtId || '',
      districtName: cachedProfile.districtName || '',
      branchId: cachedProfile.branchId || '',
      branchName: cachedProfile.branchName || ''
    };
    renderShell();
    renderMain();
    hideLoaderNow();
    rendered = true;
  } else if(hasMis){
    APP.profile = {
      id: sessionStorage.getItem('uid'),
      role: sessionStorage.getItem('role') || 'viewer',
      email: sessionStorage.getItem('email') || '',
      fullName: sessionStorage.getItem('userName') || 'User',
      photoURL: null,
      districtId: '', districtName: '', branchId: '', branchName: ''
    };
    renderShell();
    renderMain();
    hideLoaderNow();
    rendered = true;
  }

  let user;
  try{
    user = await new Promise((resolve) => {
      const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
    });
  }catch(e){
    user = null;
  }
  if(!user){
    try{ sessionStorage.setItem('__redirectReason', 'expired'); }catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  if(sess && user.uid !== sess.uid){
    try{ sessionStorage.setItem('__redirectReason', 'expired'); }catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try{
    const snap = await getDoc(doc(db, 'users', user.uid));
    if(!snap.exists()) throw new Error('no-user-doc');
    const d = snap.data();
    if(d.status === 'inactive') throw new Error('inactive');
    APP.profile = { id: snap.id, ...d, email: user.email || '' };
    writeCachedProfile();
  }catch(e){
    try{ sessionStorage.setItem('__redirectReason', 'expired'); }catch(e2){}
    clearSession(); clearCachedProfile();
    try{ await signOut(auth); }catch(e2){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const allowed = ['super_admin','admin','manager','cashier','teller','accountant','auditor','member'];
  if(!allowed.includes(APP.profile.role)){
    window.location.replace('dashboard.html');
    return;
  }

  await loadSessionTimeout();
  await loadSettingsOnce();

  const profileChanged = !rendered ||
    (cachedProfile && (
      (cachedProfile.name !== (APP.profile.fullName || APP.profile.name)) ||
      cachedProfile.role !== APP.profile.role ||
      cachedProfile.photoURL !== (APP.profile.photoURL || null)
    ));
  if(profileChanged){
    renderShell();
    renderMain();
  }
  hideLoaderNow();

  attachListeners();
  startSessionWatcher();
})();

console.log('[sacco] shares page ready — reads shareValue from settings, honest totals, live sync');
