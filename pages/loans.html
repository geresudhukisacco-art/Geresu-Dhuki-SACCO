<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loans — Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>
<script type="importmap">
{ "imports": {
  "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-lg:20px;--r-full:999px;
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
html.theme-dark body{background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.14),transparent 35%),radial-gradient(circle at 90% 80%,rgba(25,169,116,.14),transparent 35%),var(--bg);}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar::before{content:"";position:absolute;width:450px;height:450px;border-radius:50%;border:1px solid rgba(255,255,255,.10);right:-220px;top:-150px;pointer-events:none;}
.sidebar__brand{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:22px;border-bottom:1px solid rgba(255,255,255,.10);min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 10px 24px rgba(0,0,0,.18);display:grid;place-items:center;padding:5px;overflow:hidden;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;opacity:1;transition:opacity .18s ease 60ms;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);border:3px solid var(--bg);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.15);z-index:10;cursor:pointer;}
.sidebar__collapse i{font-size:10px;font-weight:900;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{position:relative;z-index:2;flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;font-size:14px;font-weight:600;color:rgba(255,255,255,.78);margin-bottom:3px;transition:background .15s, color .15s;white-space:nowrap;cursor:pointer;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;flex-shrink:0;text-align:center;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{position:relative;z-index:2;padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap;}
.sidebar__logout i{width:20px;font-size:15px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;border-radius:var(--r-full);background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 20px;margin-bottom:22px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
.breadcrumb span.crumb{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb span.crumb.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb span.crumb.is-link{cursor:pointer;}
.breadcrumb span.crumb.is-link:hover{background:#dbeafe;color:var(--primary);}
.breadcrumb span.arrow{color:#cbd5e1;font-weight:400;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue  {--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green {--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--red   {--c1:linear-gradient(90deg,#dc2626,#e74c5c);--ic:#fef3f2;--ifc:#b42318;}
.stat--gold  {--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#5b21b6,#7c3aed);--ic:#f0eaff;--ifc:#5b21b6;}
.stat__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.stat__label{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.stat__icon{width:42px;height:42px;border-radius:12px;background:var(--ic);color:var(--ifc);display:grid;place-items:center;flex-shrink:0;font-size:16px;}
.stat__value{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:var(--text);}
.stat__hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
.stat__split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-soft);}
.stat__split-item{min-width:0;}
.stat__split-label{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;line-height:1.2;}
.stat__split-value{font-size:13.5px;font-weight:800;letter-spacing:-.3px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-word;}
.stat__split-value--pr{color:#128a5c;}
.stat__split-value--int{color:#b8860b;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;}
.card__head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:320px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:11px;background:#fff;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;min-width:140px;font-family:inherit;}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.view-toggle{display:flex;gap:2px;padding:3px;border-radius:11px;background:#e8ecf1;}
.view-toggle button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.view-toggle button:hover{color:var(--primary);}
.view-toggle button.is-active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(20,40,70,.08);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:13px;border:1px solid #d9dee7;background:#fff;color:var(--text-soft);font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--success{background:linear-gradient(135deg,#128a5c,#19a974);border:none;color:#fff;box-shadow:0 10px 22px rgba(18,138,92,.2);}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.loans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding:22px;}
.loan-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
.loan-card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:#d8c8f5;}
.loan-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#5b21b6,#7c3aed);}
.loan-card--active::before{background:linear-gradient(90deg,#19a974,#34c78e);}
.loan-card--pending::before{background:linear-gradient(90deg,#d4a017,#e8b84b);}
.loan-card--repaid::before{background:linear-gradient(90deg,#0b5cab,#0e7490);}
.loan-card--overdue::before{background:linear-gradient(90deg,#dc2626,#e74c5c);}
.loan-card--rejected::before{background:linear-gradient(90deg,#94a3b8,#64748b);}
.loan-card__head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;margin-top:12px;}
.loan-card__avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:800;font-size:18px;letter-spacing:-.5px;display:grid;place-items:center;overflow:hidden;position:relative;}
.loan-card__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.loan-card__main{flex:1;min-width:0;}
.loan-card__code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:#5b21b6;background:#f0eaff;padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.loan-card__name{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.2px;line-height:1.3;word-break:break-word;}
.loan-card__meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.loan-card__type{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#5b21b6;background:#f0eaff;padding:3px 9px;border-radius:var(--r-full);}
.loan-card__actions{position:absolute;top:16px;right:16px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;}
.loan-card__actions button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;color:var(--text-soft);background:#fff;border:1px solid var(--border);transition:.15s;}
.loan-card__actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.loan-card__actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.loan-card__actions button.success:hover{background:#128a5c;border-color:#128a5c;}
.loan-card__actions button.print:hover{background:#b8860b;border-color:#b8860b;}
.loan-card__amounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#faf7ff,#fff);border:1px solid #e8dffb;border-radius:12px;margin-bottom:14px;}
.loan-card__amount-block{min-width:0;}
.loan-card__amount-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.loan-card__amount-value{font-size:15px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.loan-card__amount-value--principal{color:#5b21b6;}
.loan-card__amount-value--outstanding{color:#b42318;}
.loan-card__amount-value--outstanding.is-clear{color:#067647;}
.loan-card__progress{margin-bottom:12px;}

/* ============ LOAN MATH ============ */
function calcLoan(principal, ratePct, months, interestType='simple'){
  const p=num(principal),r=num(ratePct),m=Math.max(0,Math.floor(num(months)));
  const type=String(interestType||'simple').toLowerCase();
  let interest=0;
  if(type==='compound'){const mr=(r/100)/12;if(m>0&&mr>0)interest=p*(Math.pow(1+mr,m)-1);}
  else if(type==='reducing'){const mr=(r/100)/12;if(m>0&&mr>0){const f=Math.pow(1+mr,m);const emi=p*mr*f/(f-1);interest=(emi*m)-p;}}
  else if(type==='fixed'){interest=p*(r/100);}
  else{interest=p*(r/100)*(m/12);}
  interest=Math.max(0,Math.round(interest*100)/100);
  const total=Math.round((p+interest)*100)/100;
  const monthly=m>0?Math.round((total/m)*100)/100:total;
  return {principal:p,rate:r,months:m,type,interest,total,monthly};
}
function loanRepaid(loan){return num(loan.amountRepaid);}
function loanOutstanding(loan){const {total}=calcLoan(loan.principal,loan.interestRate,loan.duration,loan.interestType);return Math.max(0,total-loanRepaid(loan));}
function loanProgress(loan){const {total}=calcLoan(loan.principal,loan.interestRate,loan.duration,loan.interestType);if(total<=0)return 0;return Math.min(100,Math.round((loanRepaid(loan)/total)*100));}
function isOverdue(loan){if(!['active','approved'].includes(String(loan.status||'').toLowerCase()))return false;const mat=toDateSafe(loan.maturityDate);if(!mat)return false;return mat.getTime()<Date.now();}
function isDueSoon(loan){if(!['active','approved'].includes(String(loan.status||'').toLowerCase()))return false;const mat=toDateSafe(loan.maturityDate);if(!mat)return false;const diff=mat.getTime()-Date.now();return diff>0&&diff<=30*86400000;}
function computeMaturityDate(disbDate,months){if(!disbDate)return '';const d=new Date(disbDate);if(isNaN(d))return '';d.setMonth(d.getMonth()+Math.max(0,Math.floor(num(months))));return d.toISOString().slice(0,10);}
function generateSerialNumber(){const yr=new Date().getFullYear();const rnd=Math.floor(100000+Math.random()*900000);const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let suf='';for(let i=0;i<3;i++)suf+=chars[Math.floor(Math.random()*chars.length)];return `GD-${yr}-${rnd}-${suf}`;}
function customerLoanContext(customer,excludeLoanId){
  if(!customer)return {total:0,active:0,pending:0,paid:0,outstanding:0,exposure:0,loans:[]};
  const cid=customer.customerId||customer.id;
  const loans=APP.loans.filter(l=>{if(excludeLoanId&&l.id===excludeLoanId)return false;return l.customerId===cid||l.customerDocId===customer.id||l.memberId===cid;});
  let active=0,pending=0,paid=0,outstanding=0,exposure=0;
  loans.forEach(l=>{const s=String(l.status||'').toLowerCase();if(s==='active')active++;else if(s==='pending')pending++;else if(s==='repaid'||s==='paid')paid++;if(['active','approved','pending'].includes(s))exposure+=num(l.principal);if(['active','approved'].includes(s))outstanding+=loanOutstanding(l);});
  return {total:loans.length,active,pending,paid,outstanding:round2(outstanding),exposure:round2(exposure),loans};
}
function countActiveOrPending(customer,excludeLoanId){const ctx=customerLoanContext(customer,excludeLoanId);return ctx.active+ctx.pending;}
function activeOrPendingLoans(customer,excludeLoanId){
  if(!customer)return [];
  const cid=customer.customerId||customer.id;
  return APP.loans.filter(l=>{if(excludeLoanId&&l.id===excludeLoanId)return false;if(!(l.customerId===cid||l.customerDocId===customer.id||l.memberId===cid))return false;const s=String(l.status||'').toLowerCase();return ['active','pending','approved'].includes(s);});
}
function calcMonthlyPayment(loan){return calcLoan(loan.principal,loan.interestRate,loan.duration,loan.interestType).monthly;}
function computeRepaymentSplit(amount,loan,remaining){
  const p=num(loan?.principal),rate=num(loan?.interestRate);
  const period=num(loan?.duration),type=loan?.interestType||'simple';
  const amt=num(amount);
  if(period<=0||amt<=0)return {principal:amt,interest:0,monthlyInterest:0};
  let monthlyInterest;
  if(type==='reducing')monthlyInterest=num(remaining)*(rate/100/12);
  else monthlyInterest=calcLoan(p,rate,period,type).interest/period;
  const interest=Math.min(amt,monthlyInterest);
  const principal=Math.max(0,amt-interest);
  return {principal:round2(principal),interest:round2(interest),monthlyInterest:round2(monthlyInterest)};
}
function getRepaymentPrincipal(r,loan){
  if(typeof r.principalPortion==='number')return num(r.principalPortion);
  const amount=num(r.amount);
  if(!loan)return amount;
  const period=num(loan.duration);
  if(period<=0)return amount;
  const totalInterest=calcLoan(loan.principal,loan.interestRate,period,loan.interestType).interest;
  const monthlyInterest=totalInterest/period;
  const interestPart=Math.min(amount,monthlyInterest);
  return Math.max(0,amount-interestPart);
}

/* ============ PENALTY ============ */
async function checkAndCreatePenalty(loanId,memberId){
  try{
    const loanDoc=await getDoc(doc(db,'transactions',loanId));
    if(!loanDoc.exists())return {penaltyAmount:0,unpaidMonths:0};
    const loanData=loanDoc.data();
    if(!loanData.date||!loanData.principal||!loanData.duration)return {penaltyAmount:0,unpaidMonths:0};
    const loanDate=toDateSafe(loanData.date);
    const now=new Date();
    const monthsDiff=(now.getFullYear()-loanDate.getFullYear())*12+(now.getMonth()-loanDate.getMonth());
    if(monthsDiff<=0)return {penaltyAmount:0,unpaidMonths:0};
    const reps=await fetchLoanRepayments(loanId);
    const paidMonths=reps.filter(r=>r.status==='approved'||r.status==='printed').length;
    const penSnap=await getDocs(query(collection(db,'transactions'),where('loanId','==',loanId),where('type','==','penalty'),where('status','==','paid')));
    let covered=0;penSnap.forEach(d=>{covered+=num(d.data().unpaidMonths);});
    const unpaidMonths=Math.max(0,monthsDiff-paidMonths-covered);
    if(unpaidMonths===0)return {penaltyAmount:0,unpaidMonths:0};
    const monthlyPayment=calcLoan(loanData.principal,loanData.interestRate,loanData.duration,loanData.interestType||'simple').monthly;
    const penaltyAmount=round2(monthlyPayment*unpaidMonths*APP.settings.loansPenaltyRate);
    if(penaltyAmount<=0)return {penaltyAmount:0,unpaidMonths};
    const existing=await getDocs(query(collection(db,'transactions'),where('loanId','==',loanId),where('type','==','penalty'),where('status','==','pending')));
    if(!existing.empty){let t2=0;existing.forEach(d=>t2+=num(d.data().amount));return {penaltyAmount:t2,unpaidMonths};}
    await setDoc(doc(collection(db,'transactions')),{memberId,loanId,type:'penalty',amount:penaltyAmount,unpaidMonths,monthlyPayment,penaltyRate:APP.settings.loansPenaltyRate,status:'pending',date:serverTimestamp(),createdAt:serverTimestamp(),description:`Penalty for ${unpaidMonths} unpaid month(s) — (${monthlyPayment.toFixed(2)} × ${unpaidMonths}) × ${(APP.settings.loansPenaltyRate*100).toFixed(1)}%`,createdBy:'system-auto'});
    toast(`⚠️ Penalty ETB ${penaltyAmount.toFixed(2)} generated for ${unpaidMonths} unpaid month(s).`,'warning');
    return {penaltyAmount,unpaidMonths};
  }catch(e){console.error('Penalty check error:',e);return {penaltyAmount:0,unpaidMonths:0};}
}

}

/* ============ PAYMENT HISTORY ============ */
async function generatePaymentHistory(loanId){
  try{
    const loanDoc=await getDoc(doc(db,'transactions',loanId));
    if(!loanDoc.exists())return `<p style="color:var(--muted)">Loan not found.</p>`;
    const loan=loanDoc.data();
    const startDate=toDateSafe(loan.date);
    if(!startDate)return `<p style="color:var(--muted)">Invalid loan start date.</p>`;
    const now=new Date();
    const totalMonths=(now.getFullYear()-startDate.getFullYear())*12+(now.getMonth()-startDate.getMonth())+1;
    if(totalMonths<=0)return `<p style="color:var(--muted)">Loan just started — no history yet.</p>`;
    const txSnap=await getDocs(query(collection(db,'transactions'),where('loanId','==',loanId),where('type','in',['repayment','penalty'])));
    const principal0=num(loan.principal),rate=num(loan.interestRate);
    const period=num(loan.duration),loanType=loan.interestType||'simple';
    const totalInterest=calcLoan(principal0,rate,period,loanType).interest;
    const fixedMonthlyInterest=period>0?(totalInterest/period):0;
    const monthMap={};
    txSnap.forEach(d=>{
      const data=d.data();
      const date=toDateSafe(data.date);
      if(!date)return;
      const idx=(date.getFullYear()-startDate.getFullYear())*12+(date.getMonth()-startDate.getMonth());
      if(data.type==='repayment'){
        const status=data.status||'pending';
        const amount=num(data.amount);
        let pP,iP;
        if(typeof data.principalPortion==='number'&&typeof data.interestPortion==='number'){pP=num(data.principalPortion);iP=num(data.interestPortion);}
        else{iP=Math.min(amount,fixedMonthlyInterest);pP=Math.max(0,amount-iP);}
        const isApproved=status==='approved'||status==='printed';
        if(!monthMap[idx])monthMap[idx]={principal:0,interest:0,total:0,status:'pending',waived:false};
        monthMap[idx].principal+=pP;monthMap[idx].interest+=iP;monthMap[idx].total+=amount;
        if(data.interestWaived)monthMap[idx].waived=true;
        if(isApproved)monthMap[idx].status='paid';
        else if(monthMap[idx].status!=='paid')monthMap[idx].status='pending';
      }else if(data.type==='penalty'){
        const ps=data.status||'pending';
        const covered=num(data.unpaidMonths);
        if(ps==='paid'||ps==='approved'){for(let i=0;i<covered;i++){const ii=idx-i;if(ii>=0){if(!monthMap[ii])monthMap[ii]={principal:0,interest:0,total:0,status:'pending',waived:false};if(monthMap[ii].status!=='paid')monthMap[ii].status='penalty-paid';}}}
        else if(ps==='pending'){for(let i=0;i<covered;i++){const ii=idx-i;if(ii>=0){if(!monthMap[ii])monthMap[ii]={principal:0,interest:0,total:0,status:'pending',waived:false};if(monthMap[ii].status==='pending')monthMap[ii].status='penalized';}}}
      }
    });
    const fmt=(n)=>num(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    let tPrincipal=0,tInterest=0,tRepaid=0;
    let rowsHtml=`<div class="history-row header"><span>${esc(t('month'))}</span><span>Status</span><span style="text-align:right">${esc(t('colPrincipal'))}</span><span style="text-align:right">${esc(t('colInterest'))}</span><span style="text-align:right">Total</span></div>`;
    for(let i=0;i<totalMonths;i++){
      const mDate=new Date(startDate);mDate.setMonth(mDate.getMonth()+i);
      const mLabel=mDate.toLocaleDateString('en-US',{month:'short',year:'numeric'});
      const isFuture=mDate>now&&i>0;
      const entry=monthMap[i]||{principal:0,interest:0,total:0,status:'pending',waived:false};
      let st=entry.status;
      if(isFuture&&st==='pending'&&entry.total===0)st='future';
      let sLabel,sCls;
      switch(st){case 'paid':sLabel=t('paid');sCls='paid';break;case 'penalty-paid':sLabel=t('penaltyPaid');sCls='penalty-paid';break;case 'penalized':sLabel=t('penalized');sCls='penalized';break;case 'future':sLabel=t('future');sCls='future';break;default:sLabel=t('pendingLc');sCls='pending';}
      if(st==='paid'||st==='penalty-paid'){tPrincipal+=entry.principal;tInterest+=entry.interest;tRepaid+=entry.total;}
      const show=entry.total>0;
      const pTxt=show?fmt(entry.principal):'—';
      const iTxt=show?(entry.waived?`0.00 (${t('waived')})`:fmt(entry.interest)):'—';
      const tTxt=show?fmt(entry.total):'—';
      rowsHtml+=`<div class="history-row ${entry.waived?'waived':''}"><span class="month">${mLabel}</span><span class="status-cell ${sCls}">${sLabel}</span><span class="principal">${pTxt}</span><span class="interest">${iTxt}</span><span class="total-amount">${tTxt}</span></div>`;
    }
    const totalsHtml=`<div class="history-totals"><div class="tot-item"><span class="tot-label">${esc(t('totalPrincipalPaid'))}</span><span class="tot-value principal"><span class="cur">ETB</span>${fmt(tPrincipal)}</span></div><div class="tot-item"><span class="tot-label">${esc(t('totalInterestPaid'))}</span><span class="tot-value interest"><span class="cur">ETB</span>${fmt(tInterest)}</span></div><div class="tot-item"><span class="tot-label">${esc(t('totalRepaid'))}</span><span class="tot-value total"><span class="cur">ETB</span>${fmt(tRepaid)}</span></div></div>`;
    return `<h5><i class="fas fa-calendar-alt" style="color:var(--primary)"></i> ${esc(t('paymentHistory'))} (${totalMonths} ${t('month').toLowerCase()})</h5><div class="history-list">${rowsHtml}</div>${totalsHtml}`;
  }catch(e){console.error(e);return `<p style="color:var(--muted)">Error loading payment history.</p>`;}
}

/* ============ FILTER / CONTENT ============ */
function filteredLoans(){
  let list=scopeLoans();
  const s=APP.filters.search.trim().toLowerCase();
  if(s){list=list.filter(l=>{const c=customerById(l.customerId||l.customerDocId);const name=customerName(c).toLowerCase();return name.includes(s)||(l.loanNumber||'').toLowerCase().includes(s)||(l.serialNumber||'').toLowerCase().includes(s)||(l.customerId||'').toLowerCase().includes(s)||(l.purpose||'').toLowerCase().includes(s)||(l.collateral||'').toLowerCase().includes(s)||(c?.phone||'').toLowerCase().includes(s);});}
  if(APP.filters.type)list=list.filter(l=>(l.loanType||'')===APP.filters.type);
  if(APP.filters.status)list=list.filter(l=>(l.status||'')===APP.filters.status);
  if(APP.filters.overdue==='overdue')list=list.filter(isOverdue);else if(APP.filters.overdue==='soon')list=list.filter(isDueSoon);
  return list.slice().sort((a,b)=>{const da=toDateSafe(b.createdAt||b.disbursementDate)?.getTime()||0;const db2=toDateSafe(a.createdAt||a.disbursementDate)?.getTime()||0;return db2-da;});
}
function renderContent(){
  const host=document.getElementById('contentHost');if(!host)return;
  const list=filteredLoans();
  if(!list.length){
    const isFiltered=APP.filters.search||APP.filters.type||APP.filters.status||APP.filters.overdue;
    host.innerHTML=`<div class="empty"><i class="fas ${isFiltered?'fa-search':'fa-file-invoice'}"></i><div class="empty__title">${isFiltered?esc(t('noMatch')):esc(t('noLoans'))}</div><div class="empty__text">${isFiltered?esc(t('noMatchText')):esc(t('noLoansText'))}</div></div>`;
    return;
  }
  if(APP.view==='table')renderTableView(host,list);else renderGridView(host,list);
}

/* ============ GRID ============ */
function loanStatusLabel(status){const map={pending:'Pending',approved:'Approved',active:'Active',repaid:'Repaid',defaulted:'Defaulted',rejected:'Rejected'};return map[String(status||'').toLowerCase()]||status||'—';}
function loanStatusCls(status){const s=String(status||'').toLowerCase();if(s==='repaid')return 'tag--blue';if(s==='active'||s==='approved')return 'tag--green';if(s==='pending')return 'tag--gold';if(s==='defaulted'||s==='rejected')return 'tag--red';return 'tag--gray';}
function loanCardClass(l){if(isOverdue(l))return 'loan-card--overdue';const s=String(l.status||'').toLowerCase();if(s==='active'||s==='approved')return 'loan-card--active';if(s==='pending')return 'loan-card--pending';if(s==='repaid')return 'loan-card--repaid';if(s==='rejected'||s==='defaulted')return 'loan-card--rejected';return '';}
function loanStatusBadgeClass(status){const s=String(status||'').toLowerCase();if(s==='active')return 'status-badge--active';if(s==='approved')return 'status-badge--approved';if(s==='pending')return 'status-badge--pending';if(s==='repaid')return 'status-badge--repaid';if(s==='rejected')return 'status-badge--rejected';if(s==='defaulted')return 'status-badge--defaulted';return 'status-badge--pending';}
function renderGridView(host,list){
  const pages=Math.max(1,Math.ceil(list.length/APP.pageSize));if(APP.page>pages)APP.page=pages;
  const start=(APP.page-1)*APP.pageSize;const pageList=list.slice(start,start+APP.pageSize);
  host.innerHTML=`<div class="loans-grid">${pageList.map(l=>renderLoanCard(l)).join('')}</div>${renderPagination(list.length,pages,start,pageList.length)}`;
  host.querySelectorAll('[data-action]').forEach(btn=>{btn.addEventListener('click',()=>handleRowAction(btn.dataset.action,btn.dataset.id));});
  host.querySelectorAll('[data-page]').forEach(btn=>{btn.addEventListener('click',()=>{const p=Number(btn.dataset.page);if(p>=1&&p<=pages){APP.page=p;renderContent();}});});
}
function renderLoanCard(l){
  const c=customerById(l.customerId||l.customerDocId);
  const avatar=c?.photoURL?`<img src="${esc(c.photoURL)}" alt="">`:esc(initials(customerName(c)));
  const {monthly}=calcLoan(l.principal,l.interestRate,l.duration,l.interestType);
  const outstanding=loanOutstanding(l);
  const progress=loanProgress(l);
  const overdue=isOverdue(l);const soon=isDueSoon(l);
  const status=String(l.status||'').toLowerCase();
  const progressCls=overdue?'is-danger':(soon?'is-warn':'');
  const isPending=status==='pending';const isActive=status==='active'||status==='approved';
  const canR=canRepay()&&outstanding>0&&isActive;const canP=canPrint();const canA=canApprove()&&isPending;const canE=canEdit();const canD=canDelete();
  const pendingReps=pendingRepaymentsForLoan(l.id).length;

function renderPagination(total,pages,start,shown){
  if(total<=APP.pageSize){return `<div class="pagination"><div class="pagination__info">${esc(t('showing'))} <strong>${total}</strong> ${esc(t('loansWord'))}</div></div>`;}

  return `<div class="pagination">

    </div></div>`;
}

let _debTimer;
function debounce(fn,ms){return function(...a){clearTimeout(_debTimer);_debTimer=setTimeout(()=>fn.apply(this,a),ms);};}
function handleRowAction(action,id){
  const l=APP.loans.find(x=>x.id===id);
  if(!l)return;
  if(action==='view')openViewModal(l);
  if(action==='edit')openLoanWizard(l);
  if(action==='delete')openDeleteModal(l);
  if(action==='approve')approveLoan(l);
  if(action==='reject')rejectLoan(l);
  if(action==='print')printSlip(l);
  if(action==='repay')openRepaymentModal(l);
}

/* ============ REPAYMENT APPROVAL ============ */
async function approveRepayment(txId){
  if(!canApprove()){toast(t('noPermission'),'error');return;}
  const tx=APP.repayments.find(r=>r.id===txId);
  if(!tx){toast(t('repNotFound'),'error');return;}
  if(String(tx.status||'pending').toLowerCase()!=='pending'){toast(t('repAlreadyProcessed'),'warning');return;}
  const loan=APP.loans.find(l=>l.id===tx.loanId);
  if(!loan){toast(t('loanNotFoundMsg'),'error');return;}
  try{
    await updateDoc(doc(db,'transactions',txId),{status:'approved',approvedAt:serverTimestamp(),approvedBy:S.uid,approvedByName:S.name});
    const amount=num(tx.amount);
    const newRepaid=round2(loanRepaid(loan)+amount);
    const totalPayable=calcLoan(loan.principal,loan.interestRate,loan.duration,loan.interestType).total;
    const newOutstanding=Math.max(0,round2(totalPayable-newRepaid));
    const newStatus=newOutstanding<=0.01?'repaid':(loan.status||'active');
    await updateDoc(doc(db,'loans',loan.id),{amountRepaid:newRepaid,status:newStatus,updatedAt:serverTimestamp(),lastRepaymentAt:serverTimestamp(),lastRepaymentBy:S.uid,lastRepaymentByName:S.name});
    try{await setDoc(doc(collection(db,'audit')),{action:'approved',collection:'transactions',documentId:txId,changes:{status:{old:'pending',new:'approved'},amount},details:`Repayment approved for loan ${loan.serialNumber||loan.loanNumber||loan.id}`,timestamp:serverTimestamp(),userEmail:S.email,userName:S.name});}catch(e){}
    toast(t('repApprovedOk'),'success');
    await loadAllData();renderMain();
  }catch(err){toast(t('errorSave')+(err.code==='permission-denied'?t('noPermission'):err.message),'error');}
}
async function rejectRepayment(txId){
  if(!canApprove()){toast(t('noPermission'),'error');return;}
  const tx=APP.repayments.find(r=>r.id===txId);
  if(!tx){toast(t('repNotFound'),'error');return;}
  if(String(tx.status||'pending').toLowerCase()!=='pending'){toast(t('repAlreadyProcessed'),'warning');return;}
  try{
    await updateDoc(doc(db,'transactions',txId),{status:'rejected',rejectedAt:serverTimestamp(),rejectedBy:S.uid,rejectedByName:S.name});
    try{await setDoc(doc(collection(db,'audit')),{action:'rejected',collection:'transactions',documentId:txId,changes:{status:{old:'pending',new:'rejected'}},details:`Repayment rejected for loan ${tx.loanId||'—'}`,timestamp:serverTimestamp(),userEmail:S.email,userName:S.name});}catch(e){}
    toast(t('repRejectedOk'),'success');
    await loadAllData();renderMain();
  }catch(err){toast(t('errorSave')+(err.code==='permission-denied'?t('noPermission'):err.message),'error');}
}
/* ============ MODAL FRAMEWORK ============ */
let escHandler=null;
function closeModal(){
  const el=document.getElementById('modal-backdrop');if(el)el.remove();
  if(escHandler){document.removeEventListener('keydown',escHandler);escHandler=null;}
}
function openWizard({title,subtitle,finishLabel,steps,initial={},onFinish,successMessage,size='lg'}){
  const data={...initial};let idx=0,busy=false;
  closeModal();
  const root=document.createElement('div');root.className='modal-backdrop';root.id='modal-backdrop';
  document.body.appendChild(root);
  escHandler=(e)=>{if(e.key==='Escape')closeModal();};
  document.addEventListener('keydown',escHandler);
  root.addEventListener('click',(e)=>{if(e.target===root)closeModal();});
  function collect(){root.querySelectorAll('[data-field]').forEach(el=>{const k=el.dataset.field;if(el.type==='checkbox')data[k]=el.checked;else data[k]=el.value;});}
  function showErr(msg){const el=root.querySelector('#wizErr');if(!el)return;if(!msg){el.style.display='none';el.textContent='';return;}el.innerHTML=`<i class="fas fa-exclamation-circle"></i><div>${esc(msg)}</div>`;el.style.display='flex';}
  function draw(){
    const step=steps[idx];
    root.innerHTML=`
      <div class="modal modal--${size}">
        <div class="modal__head"><div><div class="modal__title">${esc(title)}</div>${subtitle?`<div class="modal__sub">${esc(subtitle)}</div>`:''}</div><button class="modal__close" data-close><i class="fas fa-times"></i></button></div>
        <div class="steps">${steps.map((s,i)=>`<div class="step ${i<idx?'is-done':''} ${i===idx?'is-active':''}"><span class="step__num">${i<idx?'✓':i+1}</span><span class="step__label">${esc(s.label)}</span></div>${i<steps.length-1?`<div class="step__line"></div>`:''}`).join('')}</div>
        <div class="modal__body">
          <div class="step-header"><span class="step-header__badge">${idx+1}</span>${esc(step.title||step.label)}</div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-close>${esc(t('cancel'))}</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx===0?'disabled':''}>${esc(t('back'))}</button>
          <button class="btn btn--primary" data-wiz="next"><span class="spinner-sm hidden"></span><span class="btn-label">${idx===steps.length-1?esc(finishLabel||t('save')):esc(t('next'))}</span></button>
        </div>
      </div>`;
    root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
    root.querySelectorAll('[data-field]').forEach(el=>{const v=data[el.dataset.field];if(v===undefined||v===null)return;if(el.type==='checkbox')el.checked=!!v;else el.value=v;});
    root.querySelector('[data-wiz="prev"]').addEventListener('click',()=>{if(idx>0){collect();idx--;draw();}});
    root.querySelector('[data-wiz="next"]').addEventListener('click',async()=>{
      const step=steps[idx];collect();
      const err=step.validate?await step.validate(data):null;
      if(err){showErr(err);return;}
      if(idx===steps.length-1){
        if(busy)return;busy=true;
        const btn=root.querySelector('[data-wiz="next"]');const sp=btn.querySelector('.spinner-sm');const lbl=btn.querySelector('.btn-label');
        btn.disabled=true;sp.classList.remove('hidden');lbl.textContent=t('loading');
        try{await onFinish(data);closeModal();toast(successMessage||'Saved','success');}
        catch(e){busy=false;btn.disabled=false;sp.classList.add('hidden');lbl.textContent=finishLabel||t('save');showErr(e?.message||'Something went wrong.');}
      }else{idx++;draw();}
    });
    if(typeof step.after==='function')step.after(root,data,()=>{collect();draw();});
  }
  draw();
}

/* ============ LOAN WIZARD ============ */
function openLoanWizard(loan){
  const isEdit=!!loan;const l0=loan||{};
  const initial={
    customerId:l0.customerId||'',_customerDocId:l0.customerDocId||'',loanType:l0.loanType||'personal',
    interestType:l0.interestType||APP.settings.defaultLoanType||'simple',
    principal:l0.principal!=null?String(num(l0.principal)):'',
    interestRate:l0.interestRate!=null?String(num(l0.interestRate)):String(APP.settings.defaultInterestRate),
    duration:l0.duration!=null?String(num(l0.duration)):'12',
    purpose:l0.purpose||'',collateral:l0.collateral||'',
    disbursementDate:l0.disbursementDate||new Date().toISOString().slice(0,10),
    maturityDate:l0.maturityDate||computeMaturityDate(l0.disbursementDate||new Date().toISOString().slice(0,10),l0.duration||12),
    status:l0.status||'pending',reference:l0.reference||'',notes:l0.notes||'',_attachment:l0.attachment||null
  };
  if(initial.customerId){const c=customerById(initial.customerId);if(c)initial._customerDocId=c.id;}
  const searchState={q:''};const guarantees=Array.isArray(l0.guarantees)?[...l0.guarantees]:[];
  openWizard({
    title:isEdit?t('editLoanTitle'):t('newLoanTitle'),
    subtitle:isEdit?t('editLoanSub'):t('newLoanSub'),
    finishLabel:isEdit?t('update'):t('create'),
    successMessage:isEdit?t('savedOk'):t('createdOk'),
    size:'lg',initial,
    steps:[
      { label:t('stepCustomer'),title:t('stepCustomerTitle'),
        render:(d)=>{
          const list=scopeCustomers().slice().sort((a,b)=>customerName(a).localeCompare(customerName(b)));
          const q=searchState.q.toLowerCase();
          const filtered=q?list.filter(c=>customerName(c).toLowerCase().includes(q)||(c.customerId||'').toLowerCase().includes(q)||(c.phone||'').toLowerCase().includes(q)):list;
          const rows=filtered.length?filtered.map(c=>{
            const ctx=customerLoanContext(c,isEdit?l0.id:null);
            const isOn=d.customerId===(c.customerId||c.id);
            const avatar=c.photoURL?`<img src="${esc(c.photoURL)}" alt="">`:esc(initials(customerName(c)));
            const activeCount=ctx.active+ctx.pending;const maxPer=APP.settings.maxLoansPerCustomer;
            const blocked=!isEdit&&activeCount>=maxPer;const blockText=blocked?t('ctxMaxReached').replace('{max}',maxPer):'';
            const badgeHtml=blocked?`<span class="customer-pick__block-tag"><i class="fas fa-ban"></i> ${esc(t('ctxBlocked'))}</span>`:(activeCount>0?`<span class="customer-pick__block-tag" style="background:#fdf5e0;color:#b8860b;border:1px solid #f0dcb0"><i class="fas fa-clock"></i> ${esc(t('ctxActiveCount').replace('{n}',activeCount))}</span>`:'');
            return `<div class="customer-pick__item ${isOn?'is-on':''} ${blocked?'is-blocked':''}" data-customer-id="${esc(c.id)}" data-customer-code="${esc(c.customerId||c.id)}" data-blocked="${blocked?'1':'0'}" data-block-text="${esc(blockText)}">
              <div class="customer-pick__avatar">${avatar}</div>
              <div class="customer-pick__main"><div class="customer-pick__name">${esc(customerName(c))} ${c.customerId?`<span class="customer-pick__bal">${esc(c.customerId)}</span>`:''}${badgeHtml}</div>
              <div class="customer-pick__meta">${c.branchName?`<span><i class="fas fa-code-branch" style="margin-right:3px"></i>${esc(c.branchName)}</span>`:''} ${c.phone?`<span>· ${esc(formatPhone(c.phone))}</span>`:''}</div></div>
              <div class="customer-pick__radio"></div>
            </div>`;
          }).join(''):`<div style="padding:28px;text-align:center;color:var(--muted);font-size:13px">No customers match your search.</div>`;
          return `<div class="field" style="margin-bottom:14px"><input id="wiz-cust-search" type="text" placeholder="${esc(t('customerSearch'))}" value="${esc(searchState.q)}"></div><div class="customer-pick" id="wiz-cust-list">${rows}</div>`;
        },

          <div class="review__row"><span class="review__k">${esc(t('colRate'))}</span><span class="review__v">${num(l.interestRate).toFixed(2)}%</span></div>
          <div class="review__row"><span class="review__k">${esc(t('colDuration'))}</span><span class="review__v">${num(l.duration)} mo</span></div>

          <div class="review__row"><span class="review__k">${esc(t('recordedBy'))}</span><span class="review__v">${esc(l.createdByName||'—')}</span></div>
          <div class="review__row"><span class="review__k">${esc(t('approvedBy'))}</span><span class="review__v">${l.approvedByName?esc(l.approvedByName):`<span style="color:var(--muted)">${esc(t('notApprovedYet'))}</span>`}</span></div>
        </div>

        <div style="font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
          <span><i class="fas fa-undo-alt" style="color:var(--primary);margin-right:6px"></i>${esc(t('repaymentHistory'))} (${loanReps.length})</span>
          ${totalPendingAmount>0?`<span class="tag tag--gold" style="font-size:10px"><i class="fas fa-hourglass-half"></i> ETB ${totalPendingAmount.toLocaleString()} pending</span>`:''}
        </div>
        <div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;max-height:380px;overflow-y:auto">
          ${repsHtml}
        </div>

        <button class="btn" data-close>${esc(t('close'))}</button>
        <div class="spacer"></div>
        ${canRepay()&&outstanding>0&&['active','approved'].includes(String(l.status||'').toLowerCase())?`<button class="btn btn--success" id="view-repay-btn"><i class="fas fa-hand-holding-usd"></i> ${esc(t('rowRepay'))}</button>`:''}
        ${canPrint()?`<button class="btn" id="view-print-btn" style="border-color:#f0dcb0;color:#b8860b"><i class="fas fa-print"></i> ${esc(t('printSlip'))}</button>`:''}
        ${canEdit()?`<button class="btn btn--primary" id="view-edit-btn"><i class="fas fa-pen"></i> ${esc(t('rowEdit'))}</button>`:''}
      </div>
    </div>`;
  document.body.appendChild(root);
  escHandler=(e)=>{if(e.key==='Escape')closeModal();};
  document.addEventListener('keydown',escHandler);
  root.addEventListener('click',(e)=>{if(e.target===root)closeModal();});
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  document.getElementById('view-edit-btn')?.addEventListener('click',()=>{closeModal();setTimeout(()=>openLoanWizard(l),100);});
  document.getElementById('view-print-btn')?.addEventListener('click',()=>{closeModal();setTimeout(()=>printSlip(l),120);});
  document.getElementById('view-repay-btn')?.addEventListener('click',()=>{closeModal();setTimeout(()=>openRepaymentModal(l),120);});
  root.querySelectorAll('[data-approve-rep]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm(t('approveRepTitle')+'\n\n'+t('approveRepMsg')))return;
      await approveRepayment(btn.dataset.approveRep);
      closeModal();
      const fresh=APP.loans.find(x=>x.id===l.id);
      if(fresh)setTimeout(()=>openViewModal(fresh),200);
    });
  });
  root.querySelectorAll('[data-reject-rep]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm(t('rejectRepTitle')+'\n\n'+t('rejectRepMsg')))return;
      await rejectRepayment(btn.dataset.rejectRep);
      closeModal();
      const fresh=APP.loans.find(x=>x.id===l.id);
      if(fresh)setTimeout(()=>openViewModal(fresh),200);
    });
  });
  root.querySelectorAll('[data-print-rep]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const tx=APP.repayments.find(x=>x.id===btn.dataset.printRep);
      if(!tx){toast(t('repNotFound'),'error');return;}
      printRepaymentReceipt(tx,l);
    });
  });
}

/* ============================================================
   REPAYMENT MODAL — 3-step wizard
   ============================================================ */
async function openRepaymentModal(loan){
  if(!canRepay()){toast(t('noPermission'),'error');return;}
  if(!loan){toast(t('pleaseSelectLoan'),'warning');return;}
  closeModal();
  const outstanding0=loanOutstanding(loan);
  if(outstanding0<=0){toast('Nothing to repay.','info');return;}
  await checkAndCreatePenalty(loan.id,loan.customerId||loan.memberId);
  const [allPending0,historyHtml,list0]=await Promise.all([
    getMemberPenaltiesWithDetails(loan.customerId||loan.memberId),
    generatePaymentHistory(loan.id),
    fetchLoanRepayments(loan.id).catch(()=>[])
  ]);
  const monthly0=calcMonthlyPayment(loan);
  const minPayment0=Math.min(monthly0,outstanding0);
  const approvedCount0=list0.filter(r=>r.status==='approved'||r.status==='printed').length;
  const c=customerById(loan.customerId||loan.customerDocId);
  const initSplit=computeRepaymentSplit(minPayment0,loan,outstanding0);
  const initial={
    amount:minPayment0.toFixed(2),date:new Date().toISOString().slice(0,10),
    method:['super_admin','admin','manager'].includes(S.role)?'cash':'bank',
    ttNumber:'',transferDate:'',bankName:'',bankOther:'',note:'',
    principalPortion:initSplit.principal,interestPortion:initSplit.interest,isRepayAll:false,
    _outstanding:outstanding0,_monthly:monthly0,_minPayment:minPayment0,_approvedCount:approvedCount0,
    _historyHtml:historyHtml,_customer:c,_pending:allPending0,_list0:list0
  };
  openWizard({
    title:t('repaymentTitle'),subtitle:t('repaymentSub'),
    finishLabel:t('rowRepay'),successMessage:t('repaymentOk'),
    size:'lg',initial,
    steps:[
      { label:'Amount',title:'Loan & Amount',
        render:(d)=>{
          const pending=d._pending;const gate=d._approvedCount<APP.settings.minMonthsForRepayAll;
          return `
            ${pending.total>0?`<div class="alert alert--error"><i class="fas fa-lock"></i><div>${esc(t('penaltyBlockedTitle'))} <strong>ETB ${pending.total.toFixed(2)}</strong>. ${esc(t('penaltyBlockPay'))}</div></div>`:''}
            <div class="alert alert--info"><i class="fas fa-info-circle"></i><div>This repayment will be saved as <strong>pending</strong>. It only affects the loan balance after approval.</div></div>
            <div class="info-panel show">
              <button type="button" class="info-panel__refresh" id="rpRefreshPenalty" title="${esc(t('refreshPenalty'))}"><i class="fas fa-sync-alt"></i></button>
              <div class="info-panel__grid">
                <div class="info-row"><span class="k">${esc(t('customer'))}</span><span class="v">${esc(customerName(d._customer))}</span></div>
                <div class="info-row"><span class="k">${esc(t('loanAmount'))}</span><span class="v">${esc(money(loan.principal))}</span></div>
                <div class="info-row"><span class="k">${esc(t('totalPayable'))}</span><span class="v">${esc(money(calcLoan(loan.principal,loan.interestRate,loan.duration,loan.interestType).total))}</span></div>
                <div class="info-row"><span class="k">${esc(t('totalPaid'))}</span><span class="v" style="color:#128a5c">${esc(money(loanRepaid(loan)))}</span></div>
                <div class="info-row"><span class="k">${esc(t('remaining'))}</span><span class="v" style="color:#b42318">${esc(money(d._outstanding))}</span></div>
                <div class="info-row"><span class="k">${esc(t('monthlyInstallment'))}</span><span class="v">${esc(money(d._monthly))}</span></div>
                <div class="info-row"><span class="k">${esc(t('minRepaymentStatus'))}</span><span class="v">Min: ${esc(money(d._minPayment))}</span></div>
                <div class="info-row"><span class="k">${esc(t('approvedMonthsPaid'))}</span><span class="v">${d._approvedCount} / ${APP.settings.minMonthsForRepayAll}</span></div>
              </div>
            </div>
            <div class="field">
              <label class="field__required">${esc(t('repaymentAmount'))}</label>
              <div class="amount-row">
                <input type="number" id="rpAmount" data-field="amount" class="amount-input" step="0.01" min="0.01" placeholder="0.00" value="${esc(d.amount)}" />
                <button type="button" class="btn-repay-all" id="rpRepayAllBtn" ${gate?'disabled style="opacity:.5"':''}><i class="fas fa-check-double"></i> ${esc(t('repayAll'))}</button>
              </div>
              <small class="field__hint">${esc(t('minRepayHint'))}: <strong>${esc(money(d._minPayment))}</strong> ETB</small>
            </div>
            ${gate?`<div class="alert alert--warning"><i class="fas fa-lock"></i><div>${esc(t('repayAllBlocked').replace('{n}',APP.settings.minMonthsForRepayAll).replace('{paid}',d._approvedCount))}</div></div>`:''}
            <div class="alert alert--success" id="rpWaiverNote" style="display:none"><i class="fas fa-gift"></i><div id="rpWaiverText"></div></div>
            <div class="field-row" id="rpSplitRow">
              <div class="field"><label><i class="fas fa-landmark"></i> ${esc(t('principalPortion'))}</label><input type="text" id="rpPrincipalPortion" data-field="principalPortion" class="field__readonly principal" readonly value="${num(d.principalPortion).toFixed(2)}" /></div>
              <div class="field"><label><i class="fas fa-percent"></i> ${esc(t('interestPortion'))}</label><input type="text" id="rpInterestPortion" data-field="interestPortion" class="field__readonly interest" readonly value="${num(d.interestPortion).toFixed(2)}" /></div>
            </div>
            <div class="payment-history">${d._historyHtml}</div>`;
        },
        validate:(d)=>{
          if(d._pending.total>0)return `${t('penaltyBlockedTitle')} ETB ${d._pending.total.toFixed(2)}`;
          const amt=num(d.amount);
          if(amt<=0)return t('invalidAmountMsg');
          if(amt>d._outstanding+0.01)return t('cannotExceedRemaining');
          if(!d.isRepayAll&&amt+0.01<d._minPayment)return `${t('minPaymentNotMet')} (Min: ${d._minPayment.toFixed(2)})`;
          return null;
        },
        after:(root,data,refresh)=>{
          const amtIn=root.querySelector('#rpAmount');
          const repayAllBtn=root.querySelector('#rpRepayAllBtn');
          const principalIn=root.querySelector('#rpPrincipalPortion');
          const interestIn=root.querySelector('#rpInterestPortion');
          const waiverNote=root.querySelector('#rpWaiverNote');
          const waiverText=root.querySelector('#rpWaiverText');
          const updateSplit=()=>{
            const amt=num(amtIn.value);
            if(amt<=0){principalIn.value='';interestIn.value='';return;}
            if(data.isRepayAll&&APP.settings.allowInterestWaiver){principalIn.value=amt.toFixed(2);interestIn.value='0.00';return;}
            const sp=computeRepaymentSplit(amt,loan,data._outstanding);
            principalIn.value=sp.principal.toFixed(2);interestIn.value=sp.interest.toFixed(2);
          };
          amtIn.addEventListener('input',()=>{data.amount=amtIn.value;if(data.isRepayAll){data.isRepayAll=false;if(waiverNote)waiverNote.style.display='none';}updateSplit();});
          repayAllBtn?.addEventListener('click',()=>{
            if(data._approvedCount<APP.settings.minMonthsForRepayAll){toast(t('repayAllBlocked').replace('{n}',APP.settings.minMonthsForRepayAll).replace('{paid}',data._approvedCount),'warning');return;}
            if(APP.settings.allowInterestWaiver){
              const paidPrincipal=data._list0.filter(r=>r.status==='approved'||r.status==='printed').reduce((s,r)=>s+getRepaymentPrincipal(r,loan),0);
              const outstandingPrincipal=Math.max(0,round2(num(loan.principal)-paidPrincipal));
              const waived=Math.max(0,round2(data._outstanding-outstandingPrincipal));
              amtIn.value=outstandingPrincipal.toFixed(2);data.amount=outstandingPrincipal.toFixed(2);data.isRepayAll=true;
              if(waived>0&&waiverNote&&waiverText){waiverNote.style.display='flex';waiverText.textContent=t('interestWaiverNote').replace('{paid}',data._approvedCount).replace('{waived}',waived.toFixed(2));}
            }else{amtIn.value=data._outstanding.toFixed(2);data.amount=data._outstanding.toFixed(2);data.isRepayAll=false;}
            updateSplit();
          });
          root.querySelector('#rpRefreshPenalty')?.addEventListener('click',async(e)=>{
            const btn=e.currentTarget;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';btn.disabled=true;
            try{await checkAndCreatePenalty(loan.id,loan.customerId||loan.memberId);data._pending=await getMemberPenaltiesWithDetails(loan.customerId||loan.memberId);toast('Penalty status refreshed.','success');refresh();}
            catch(err){toast('Could not refresh penalty.','error');btn.innerHTML='<i class="fas fa-sync-alt"></i>';btn.disabled=false;}
          });
        }
      },
      { label:'Payment',title:'Payment details',
        render:(d)=>{
          const isCash=d.method==='cash';
          const bankOpts=(BANKS_LIST[d.method]||[]).map(name=>`<option value="${esc(name)}" ${d.bankName===name?'selected':''}>${esc(name)}</option>`).join('');
          return `
            <div class="field-row">
              <div class="field"><label class="field__required">${esc(t('repaymentMethod'))}</label>
                <select data-field="method" id="rpMethod">
                  ${['super_admin','admin','manager'].includes(S.role)?`<option value="cash" ${d.method==='cash'?'selected':''}>${esc(t('methodCash'))}</option>`:''}
                  <option value="bank" ${d.method==='bank'?'selected':''}>${esc(t('methodBank'))}</option>
                  <option value="mobile" ${d.method==='mobile'?'selected':''}>${esc(t('methodMobile'))}</option>
                </select>
              </div>
              <div class="field"><label class="field__required">${esc(t('repaymentDate'))}</label><input type="date" data-field="date" value="${esc(d.date)}" /></div>
            </div>
            ${!isCash?`
              <div class="field-row">
                <div class="field"><label class="field__required">${esc(t('ttNumber'))}</label><input type="text" data-field="ttNumber" id="rpTT" placeholder="Enter TT number" value="${esc(d.ttNumber)}" /></div>
                <div class="field"><label class="field__required">${esc(t('transferDate'))}</label><input type="date" data-field="transferDate" id="rpTransferDate" value="${esc(d.transferDate)}" /></div>
              </div>
              <div class="field"><label class="field__required">${esc(t('bankProvider'))}</label>
                <select data-field="bankName" id="rpBankName">
                  <option value="">${esc(t('bankPlaceholder'))}</option>${bankOpts}
                  <option value="other" ${d.bankName==='other'?'selected':''}>➕ Other</option>
                </select>
                <input type="text" data-field="bankOther" id="rpBankOther" placeholder="${esc(t('otherBankName'))}" value="${esc(d.bankOther)}" style="display:${d.bankName==='other'?'block':'none'};margin-top:6px" />
              </div>`:''}
            <div class="field"><label>${esc(t('repaymentNotes'))}</label><input type="text" data-field="note" placeholder="${esc(t('notePlaceholder'))}" value="${esc(d.note)}" /></div>
            <div class="alert alert--warning" id="rpDupWarn" style="display:none"><i class="fas fa-exclamation-triangle"></i><div>${esc(t('duplicateWarn'))}</div></div>`;
        },
        validate:(d)=>{
          if(!d.date)return t('pleaseSelectDate');
          if(d.method!=='cash'){
            if(!d.ttNumber||!d.ttNumber.trim())return t('ttRequired');
            if(!d.transferDate)return t('transferRequired');
            const bank=d.bankName==='other'?d.bankOther:d.bankName;
            if(!bank||!bank.trim())return t('bankRequired');
          }
          return null;
        },
        after:(root,data,refresh)=>{
          const methodSel=root.querySelector('#rpMethod');
          methodSel?.addEventListener('change',()=>{data.method=methodSel.value;if(data.method==='cash'){data.ttNumber='';data.transferDate='';data.bankName='';data.bankOther='';}refresh();});
          const bankSel=root.querySelector('#rpBankName');const bankOther=root.querySelector('#rpBankOther');
          bankSel?.addEventListener('change',()=>{data.bankName=bankSel.value;if(bankSel.value==='other')bankOther.style.display='block';else{bankOther.style.display='none';data.bankOther='';}});
          bankOther?.addEventListener('input',()=>{data.bankOther=bankOther.value;});
          const ttIn=root.querySelector('#rpTT');const tdIn=root.querySelector('#rpTransferDate');const dupWarn=root.querySelector('#rpDupWarn');
          const checkDup=async()=>{
            const tt=(data.ttNumber||'').trim();const td=data.transferDate;
            if(!tt||!td||!dupWarn)return;
            const cid=loan.customerId||loan.memberId;
            try{
              const parts=td.split('-').map(Number);
              const start=new Date(Date.UTC(parts[0],parts[1]-1,parts[2],0,0,0));
              const end=new Date(Date.UTC(parts[0],parts[1]-1,parts[2],23,59,59,999));
              const snap=await getDocs(query(collection(db,'transactions'),where('customerId','==',cid),where('ttNumber','==',tt),where('transferDate','>=',start),where('transferDate','<=',end)));
              dupWarn.style.display=snap.empty?'none':'flex';
            }catch(e){dupWarn.style.display='none';}
          };
          ttIn?.addEventListener('input',()=>{data.ttNumber=ttIn.value;});

          tdIn?.addEventListener('change',()=>{data.transferDate=tdIn.value;checkDup();});

              <div style="width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#128a5c,#19a974);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px">${d._customer?.photoURL?`<img src="${esc(d._customer.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc(initials(customerName(d._customer)))}</div>
              <div style="min-width:0"><div style="font-size:16px;font-weight:800">${esc(customerName(d._customer))}</div>${d._customer?.customerId?`<div style="font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px">${esc(d._customer.customerId)}</div>`:''}<div style="margin-top:6px"><span class="tag tag--gold">${esc(t('repPending'))}</span> <span class="tag tag--green">${esc(methodLabel)}</span></div></div>
              <div style="margin-left:auto;text-align:right"><div style="font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em">Repayment</div><div style="font-size:24px;font-weight:800;font-family:ui-monospace,monospace;color:#128a5c">${esc(money(amt))}</div></div>
            </div>
            <div class="review">
              <div class="review__row"><span class="review__k">Loan No.</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(loan.serialNumber||loan.loanNumber||loan.id.slice(0,8))}</span></div>
              <div class="review__row"><span class="review__k">Outstanding (unchanged)</span><span class="review__v" style="font-family:ui-monospace,monospace;color:#b42318">${esc(money(d._outstanding))}</span></div>

              <div class="review__row"><span class="review__k">${esc(t('principalPortion'))}</span><span class="review__v" style="font-family:ui-monospace,monospace;color:#128a5c">${esc(money(d.principalPortion))}</span></div>

              ${d.method!=='cash'?`

      APP.settings.gracePeriod=num(d.gracePeriod)||7;
      APP.settings.minMonthsForRepayAll=(d.minMonthsForRepayAll!==undefined&&num(d.minMonthsForRepayAll)>=0)?num(d.minMonthsForRepayAll):6;
      APP.settings.allowInterestWaiver=d.allowInterestWaiver!==undefined?!!d.allowInterestWaiver:true;
      APP.settings.waiverRequiresMinMonths=d.waiverRequiresMinMonths!==undefined?!!d.waiverRequiresMinMonths:true;
      if(d.defaultLoanType)APP.settings.defaultLoanType=String(d.defaultLoanType);
      const rawMaxLoans=d.maxLoansPerCustomer??d.maxLoansToBorrow;
      if(rawMaxLoans!==undefined&&rawMaxLoans!==null&&rawMaxLoans!==''){
        const n=Number(rawMaxLoans);
        if(!isNaN(n)&&n>=1)APP.settings.maxLoansPerCustomer=Math.floor(n);
      }
      if(d.currency)APP.currency=d.currency;
      if(d.saccoName&&String(d.saccoName).trim())APP.saccoName=String(d.saccoName).trim();
      if(d.shortName)APP.shortName=String(d.shortName).trim();
    }
  }catch(e){console.warn('settings',e.message);}
}
async function loadAllData(){
  const [districts,branches,customers]=await Promise.all([
    (async()=>{try{const snap=await getDocs(collection(db,'districts'));return snap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return [];}})(),
    (async()=>{try{const snap=await getDocs(collection(db,'branches'));return snap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return [];}})(),
    (async()=>{try{const snap=await getDocs(collection(db,'customers'));return snap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return [];}})()
  ]);
  APP.districts=districts;APP.branches=branches;APP.customers=customers;
  CUSTOMER_MAP.clear();
  customers.forEach(c=>{
    const name=c.fullName||c.name||[c.firstName,c.lastName].filter(Boolean).join(' ')||null;
    const rec={name,districtId:c.districtId||'',branchId:c.branchId||'',raw:c};
    if(c.id)CUSTOMER_MAP.set(c.id,rec);
    if(c.customerId)CUSTOMER_MAP.set(c.customerId,rec);
    if(c.memberId)CUSTOMER_MAP.set(c.memberId,rec);
  });
  try{const loansSnap=await getDocs(collection(db,'loans'));APP.loans=loansSnap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){APP.loans=[];}
  try{const rSnap=await getDocs(query(collection(db,'transactions'),where('type','==','repayment')));APP.repayments=rSnap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){APP.repayments=[];}
  APP.dataLoaded=true;
}

/* ============ BOOT ============ */
(async function boot(){
  let saved=null;
  try{saved=localStorage.getItem(LANG_KEY);}catch(e){}
  const b=(navigator.language||'en').slice(0,2);
  LANG=SUPPORTED.includes(saved)?saved:(SUPPORTED.includes(b)?b:'en');
  document.documentElement.lang=LANG;
  document.body.classList.toggle('lang-am',LANG==='am');
  const sess=readSession();
  if(!isSessionRecordValid(sess)){
    try{sessionStorage.setItem('__redirectReason','expired');}catch(e){}
    window.location.replace(LOGIN_URL);return;
  }
  const user=await new Promise((resolve)=>{
    const unsub=onAuthStateChanged(auth,(u)=>{unsub();resolve(u);});
  });
  if(!user||user.uid!==sess.uid){
    try{sessionStorage.setItem('__redirectReason','expired');}catch(e){}
    clearSession();window.location.replace(LOGIN_URL);return;
  }
  try{
    const snap=await getDoc(doc(db,'users',user.uid));
    if(!snap.exists())throw new Error('no-user-doc');
    const d=snap.data();
    if(d.status==='inactive')throw new Error('inactive');
    S={
      uid:user.uid,role:d.role||'viewer',email:user.email||'',
      name:d.fullName||d.name||user.email?.split('@')[0]||'User',
      photoURL:d.photoURL||null,
      districtId:d.districtId||'',districtName:d.districtName||'',
      branchId:d.branchId||'',branchName:d.branchName||'',
      customerId:d.customerId||d.memberId||'',
      customerCode:d.customerCode||d.memberCode||''
    };
  }catch(e){
    try{sessionStorage.setItem('__redirectReason','expired');}catch(e2){}
    clearSession();
    try{await signOut(auth);}catch(e2){}
    window.location.replace(LOGIN_URL);return;
  }
  await loadSessionTimeout();
  await loadSettings();
  renderShell();
  renderMain();
  setTimeout(()=>document.getElementById('loader')?.classList.add('hide'),150);
  try{
    await loadAllData();
    renderMain();
    startSessionWatcher();
  }catch(e){console.error(e);}
})();

window.viewLoan=openViewModal;
window.openRepaymentModal=openRepaymentModal;
window.approveRepayment=approveRepayment;
window.rejectRepayment=rejectRepayment;
window.printRepaymentReceipt=printRepaymentReceipt;
</script>
