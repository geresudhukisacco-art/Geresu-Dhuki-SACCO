<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>
<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
  }
}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --gold:#d4a845;--gold-light:#f0d68a;--gold-dark:#b8922f;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;--info:#2196f3;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;--violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px;--r-lg:20px;--r-full:999px;
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
html.theme-dark body{background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.14),transparent 35%),radial-gradient(circle at 90% 80%,rgba(25,169,116,.14),transparent 35%),var(--bg);}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar__brand{position:relative;display:flex;align-items:center;gap:14px;
  padding:22px;border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.97);
  display:grid;place-items:center;padding:5px;overflow:hidden;flex-shrink:0;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;transition:opacity .18s;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.sidebar__title .sacco-gold{color:#f0d68a;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);
  border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer;z-index:10;}
.sidebar__collapse i{font-size:10px;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;
  font-size:14px;font-weight:600;color:rgba(255,255,255,.78);
  margin-bottom:3px;white-space:nowrap;cursor:pointer;position:relative;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;text-align:center;flex-shrink:0;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);
  position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);
  background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
.sidebar__logout i{width:20px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);
  align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;
  border-radius:var(--r-full);background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);white-space:nowrap;}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
html.theme-dark .dropdown__panel{background:#0f172a;border-color:#1e293b;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);
  text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
html.theme-dark .main{background:#0b1220;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 20px;margin-bottom:20px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
html.theme-dark .breadcrumb{background:#0f172a;border-color:#1e293b;}
.breadcrumb__item{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb__item.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb__item.is-link{cursor:pointer;}
.breadcrumb__item.is-link:hover{background:#dbeafe;color:var(--primary);}
.section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:"";flex:1;height:1px;background:var(--border);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .stat{background:#0f172a;border-color:#1e293b;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue  {--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green {--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--gold  {--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#7c3aed,#a78bfa);--ic:#f0eaff;--ifc:#6d28d9;}
.stat--teal  {--c1:linear-gradient(90deg,#0e7490,#4dd4c4);--ic:#e0f5f7;--ifc:#0e7490;}
.stat__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.stat__label{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.stat__icon{width:42px;height:42px;border-radius:12px;background:var(--ic);color:var(--ifc);
  display:grid;place-items:center;flex-shrink:0;font-size:16px;}
.stat__value{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:var(--text);}
.stat__hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
.card{background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;}
html.theme-dark .card{background:#0f172a;border-color:#1e293b;}
.card__head{display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
html.theme-dark .card__head{border-bottom-color:#1e293b;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
html.theme-dark .toolbar{background:#111a2c;border-bottom-color:#1e293b;}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:340px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);
  border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
html.theme-dark .toolbar__search input{background:#1a2433;color:#e4e8f0;border-color:#1e293b;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.view-toggle{display:flex;gap:2px;padding:3px;border-radius:11px;background:#e8ecf1;}
html.theme-dark .view-toggle{background:#1a2433;}
.view-toggle button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.view-toggle button:hover{color:var(--primary);}
.view-toggle button.is-active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(20,40,70,.08);}
html.theme-dark .view-toggle button.is-active{background:#0f172a;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:46px;padding:0 20px;border-radius:13px;
  border:1px solid #d9dee7;background:#fff;
  color:var(--text-soft);font-size:14px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:all .15s;}
html.theme-dark .btn{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.districts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:22px;}
.district-card{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:16px;padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .district-card{background:#0f172a;border-color:#1e293b;}
.district-card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:#bdd7f2;}
.district-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#0b5cab,#0e7490);}
.district-card__head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
.district-card__icon{width:52px;height:52px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#eaf3fc,#d8e8fa);color:#0b5cab;
  display:grid;place-items:center;font-size:22px;}
.district-card__main{flex:1;min-width:0;}
.district-card__code{font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px;font-weight:800;letter-spacing:.6px;color:#0b5cab;
  background:#eaf3fc;padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.district-card__name{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px;
  line-height:1.25;word-break:break-word;}
.district-card__meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;}
.district-card__actions{position:absolute;top:16px;right:16px;display:flex;gap:4px;opacity:0;transition:.15s;}
.district-card:hover .district-card__actions{opacity:1;}
.district-card__actions button{width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;font-size:12px;color:var(--text-soft);
  background:#fff;border:1px solid var(--border);transition:.15s;}
html.theme-dark .district-card__actions button{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.district-card__actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.district-card__actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.district-card__stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  padding-top:14px;border-top:1px solid var(--border-soft);}
.mini-stat{display:flex;align-items:center;gap:10px;}
.mini-stat__icon{width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;font-size:13px;}
.mini-stat__icon--branch{background:#e0f5f7;color:#0e7490;}
.mini-stat__icon--customer{background:#e7f7f0;color:#128a5c;}
.mini-stat__value{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1;}
.mini-stat__label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;margin-top:3px;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;min-width:720px;}
.tbl thead th{background:#f8fafc;font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);padding:13px 20px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap;}
html.theme-dark .tbl thead th{background:#111a2c;border-bottom-color:#1e293b;}
.tbl thead th.num{text-align:right;}
.tbl tbody td{padding:14px 20px;border-bottom:1px solid var(--border-soft);
  font-size:13px;color:var(--text-soft);vertical-align:middle;}
html.theme-dark .tbl tbody td{border-bottom-color:#1a2433;}

const SESSION_KEY = "sacco.session";
const DEFAULT_SESSION_MINUTES = 30;
let SESSION_MINUTES = null;
let awayStartedAt = null, awayCheckInterval = null;

function readSession() {
  try {
    const r = sessionStorage.getItem(SESSION_KEY);
    if (!r) return null;
    const s = JSON.parse(r);
    return (s && s.uid) ? s : null;
  } catch (e) { return null; }
}
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function isSessionRecordValid(s) { return !!(s && s.uid); }
function getSessionMs() {
  const s = readSession();
  const mins = (SESSION_MINUTES != null && SESSION_MINUTES > 0)
    ? SESSION_MINUTES
    : ((s && s.minutes) || DEFAULT_SESSION_MINUTES);
  return Math.max(1, mins) * 60 * 1000;
}
function readCachedProfile() {
  try {
    const raw = sessionStorage.getItem(PROFILE_CACHE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return (p && p.uid) ? p : null;
  } catch (e) { return null; }
}
function writeCachedProfile() {
  if (!APP.profile) return;
  try {
    const payload = {
      uid: APP.profile.id || APP.user?.uid || '',
      role: APP.profile.role || 'viewer',
      email: APP.profile.email || '',
      name: APP.profile.fullName || APP.profile.name || 'User',

      districtId: APP.profile.districtId || '',
      districtName: APP.profile.districtName || '',
      branchId: APP.profile.branchId || '',
      branchName: APP.profile.branchName || ''
    };
    if (payload.uid) sessionStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(payload));
  } catch (e) {}
}
function clearCachedProfile() { try { sessionStorage.removeItem(PROFILE_CACHE_KEY); } catch (e) {} }
function hideLoaderNow() { const el = document.getElementById('loader'); if (el) el.classList.add('hide'); }
function forceLogout(reason) {
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  awayStartedAt = null;
  try { sessionStorage.clear(); sessionStorage.setItem('__redirectReason', reason || 'expired'); } catch (e) {}
  clearSession(); clearCachedProfile();
  try { signOut(auth); } catch (e) {}
  window.location.replace(LOGIN_URL);
}
function isWindowActive() { return document.visibilityState === 'visible' && document.hasFocus(); }
function startAwayTimer() {
  if (awayStartedAt) return;
  awayStartedAt = Date.now();
  if (awayCheckInterval) clearInterval(awayCheckInterval);
  awayCheckInterval = setInterval(() => {
    if (!awayStartedAt) return;
    if (Date.now() - awayStartedAt >= getSessionMs()) { forceLogout('expired'); return; }
  }, 1000);
}
function stopAwayTimer() { awayStartedAt = null; if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; } }
function evaluateActivity() {
  if (isWindowActive()) {
    if (awayStartedAt) { const away = Date.now() - awayStartedAt; if (away >= getSessionMs()) { forceLogout('expired'); return; } }
    stopAwayTimer();
  } else { startAwayTimer(); }
}
function startSessionWatcher() {
  document.addEventListener('visibilitychange', evaluateActivity);
  window.addEventListener('focus', evaluateActivity);
  window.addEventListener('blur', evaluateActivity);
  evaluateActivity();
}
async function loadSessionTimeout() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const data = snap.data();
      let mins = DEFAULT_SESSION_MINUTES;
      if (data.sessionTimeout != null) mins = Number(data.sessionTimeout);
      else if (data.sessionTimeoutMinutes != null) mins = Number(data.sessionTimeoutMinutes);
      if (!isFinite(mins) || mins < 1) mins = DEFAULT_SESSION_MINUTES;
      if (mins > 1440) mins = 1440;
      SESSION_MINUTES = Math.round(mins);
    } else {
      SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
    }
  } catch (e) {
    if (SESSION_MINUTES == null) SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
  }
  try {
    const s = readSession();
    if (s) { s.minutes = SESSION_MINUTES; sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  } catch (e) {}
}

const SUPPORTED = ['en','am','om'];
const FALLBACK = 'en';
const LANG_KEY = 'sacco.lang';
let LANG = 'en';
const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N[FALLBACK][k] || k;
  if (v) Object.keys(v).forEach(x => { s = s.replace('{'+x+'}', v[x]); });
  return s;
};

const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
const toDate = (v) => {
  if (!v) return null;
  if (v.toDate) return v.toDate();
  if (typeof v === 'string') return new Date(v);
  if (typeof v === 'number') return new Date(v);
  if (typeof v === 'object' && v.seconds != null) return new Date(v.seconds * 1000);
  return v;
};
const fmtDate = (v) => {
  const d = toDate(v);
  if (!d || isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
};
function toast(msg, type = 'success') {
  const wrap = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
  el.innerHTML = `<i class="fas ${icons[type] || 'fa-info-circle'}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3800);
  setTimeout(() => el.remove(), 4200);
}
const LOGO_FALLBACK = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0b5cab"/><circle cx="50" cy="47" r="25" fill="none" stroke="#f0c96a" stroke-width="3.5"/><text x="50" y="59" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#f0c96a" text-anchor="middle">G</text></svg>`;
const LOGO_HTML = `<img src="${LOGO_URL}" alt="SACCO" onerror="this.onerror=null; this.outerHTML=this.dataset.fallback;" data-fallback="${LOGO_FALLBACK.replace(/"/g, '&quot;')}">`;
function renderBrandTitle(name){
  const raw = (name && String(name).trim()) ? String(name).trim() : DEFAULT_SACCO_NAME;
  const words = raw.split(/\s+/);
  if (words.length < 2) return esc(raw);
  const tail = words.pop();
  const head = words.join(' ');
  return esc(head) + ' <span class="sacco-gold">' + esc(tail) + '</span>';
}

function _matchesDistrict(record, district) {
  if (!record || !district) return false;
  const keys = [district.id, district.code, district.name].filter(Boolean);
  if (!keys.length) return false;
  return keys.includes(record.districtId)
      || keys.includes(record.districtCode)
      || keys.includes(record.district);
}
function scopeDistricts() {
  if (isSuper() || isAuditor()) return APP.districts.slice();
  if (!isAdmin()) return [];
  const p = APP.profile || {};
  const target = p.districtId || p.districtCode || p.districtName;
  if (!target) return [];
  return APP.districts.filter(d =>
    d.id === target || d.code === target || d.name === target
  );
}
function branchCount(district)   { return APP.branches .filter(b => _matchesDistrict(b, district)).length; }
function customerCount(district) { return APP.customers.filter(c => _matchesDistrict(c, district)).length; }

function filteredDistricts() {
  let list = scopeDistricts();
  const s = APP.filters.search.trim().toLowerCase();
  if (s) {
    list = list.filter(d =>
      (d.name || '').toLowerCase().includes(s) ||
      (d.code || '').toLowerCase().includes(s) ||
      (d.notes || '').toLowerCase().includes(s)
    );
  }
  return list.slice().sort((a, b) => {
    const ca = (a.code || '').toString();
    const cb = (b.code || '').toString();
    if (ca && cb) return ca.localeCompare(cb, undefined, { numeric: true });
    if (ca && !cb) return -1;
    if (!ca && cb) return 1;
    return (a.name || '').localeCompare(b.name || '');
  });
}

function renderContent() {
  const host = document.getElementById('contentHost');
  if (!host) return;

  const list = filteredDistricts();
  if (!list.length) {
    const isFiltered = !!APP.filters.search;
    host.innerHTML = `
      <div class="empty">
        <i class="fas ${isFiltered ? 'fa-search' : 'fa-map-marked-alt'}"></i>
        <div class="empty__title">${isFiltered ? esc(t('noMatch')) : esc(t('noDistricts'))}</div>
        <div class="empty__text">${isFiltered ? esc(t('noMatchText')) : esc(t('noDistrictsText'))}</div>
      </div>`;
    return;
  }

  if (APP.view === 'table') renderTableView(host, list);
  else renderGridView(host, list);
}

function renderGridView(host, list) {
  const pages = Math.max(1, Math.ceil(list.length / APP.pageSize));
  if (APP.page > pages) APP.page = pages;
  const start = (APP.page - 1) * APP.pageSize;
  const pageList = list.slice(start, start + APP.pageSize);

  host.innerHTML = `
    <div class="districts-grid">
      ${pageList.map(d => renderDistrictCard(d)).join('')}
    </div>
    ${renderPagination(list.length, pages, start, pageList.length)}
  `;

  host.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handleRowAction(btn.dataset.action, btn.dataset.id));
  });
  host.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = Number(btn.dataset.page);
      if (p >= 1 && p <= pages) { APP.page = p; renderContent(); }
    });
  });
}

function renderPagination(total, pages, start, shown) {
  if (total <= APP.pageSize) {
    return `<div class="pagination"><div class="pagination__info">
      ${esc(t('showing'))} <strong>${total}</strong> ${esc(t('districtsWord'))}
    </div></div>`;
  }
  const range = [];
  const startPage = Math.max(1, APP.page - 2);
  const endPage = Math.min(pages, startPage + 4);
  for (let i = startPage; i <= endPage; i++) range.push(i);

  return `
    <div class="pagination">
      <div class="pagination__info">
        ${esc(t('showing'))} <strong>${start + 1}–${start + shown}</strong>
        ${esc(t('of'))} <strong>${total}</strong> ${esc(t('districtsWord'))}
      </div>
      <div class="pagination__controls">
        <button data-page="${APP.page - 1}" ${APP.page === 1 ? 'disabled' : ''}>
          <i class="fas fa-chevron-left"></i>
        </button>
        ${range.map(p => `
          <button data-page="${p}" class="${p === APP.page ? 'is-current' : ''}">${p}</button>
        `).join('')}
        <button data-page="${APP.page + 1}" ${APP.page === pages ? 'disabled' : ''}>
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  `;
}

function wireMainEvents() {
  document.getElementById('addDistrictBtn')?.addEventListener('click', () => {
    if (!canCreateDistrict()) { toast(t('noPermission'), 'error'); return; }
    openDistrictModal(null);
  });
  document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
    APP.filters = { search: '' };
    APP.page = 1;
    renderMain();
  });

  const s = document.getElementById('fltSearch');
  s?.addEventListener('input', debounce(() => {
    APP.filters.search = s.value;
    APP.page = 1;
    renderContent();
  }, 220));

  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.view = btn.dataset.view;
      APP.page = 1;
      renderMain();
    });
  });
}

let _debTimer;
function debounce(fn, ms) {
  return function (...args) {
    clearTimeout(_debTimer);
    _debTimer = setTimeout(() => fn.apply(this, args), ms);
  };
}

function handleRowAction(action, id) {
  const d = APP.districts.find(x => x.id === id);
  if (!d) return;
  if (action === 'edit') {
    if (!canEditDistrict(d)) { toast(t('noPermission'), 'error'); return; }
    openDistrictModal(d);
  }
  if (action === 'delete') {
    if (!canDeleteDistrict(d)) { toast(t('noPermission'), 'error'); return; }
    openDeleteModal(d);
  }
}

let escHandler = null;
function closeModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  m.classList.remove('active');
  setTimeout(() => { try { m.remove(); } catch(e){} }, 200);
  if (id === 'districtModal') APP.editingId = null;
  if (id === 'deleteModal') APP.deletingId = null;
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
}
function attachEscape() {
  escHandler = (e) => { if (e.key === 'Escape') ['districtModal','deleteModal','logoutModal'].forEach(closeModal); };
  document.addEventListener('keydown', escHandler);
}

async function saveDistrict() {
  const $ = (id) => document.getElementById(id);
  const name = $('dName').value.trim();
  const code = $('dCode').value.trim().toUpperCase();
  const notes = $('dNotes').value.trim();

  if (!name || !code) { toast(t('requiredFields'), 'warning'); return; }

  const dup = APP.districts.find(d =>
    (d.code || '').toString().toUpperCase() === code && d.id !== APP.editingId
  );
  if (dup) { toast(t('duplicateCode'), 'warning'); return; }

  if (APP.editingId) {
    const target = APP.districts.find(x => x.id === APP.editingId);
    if (!canEditDistrict(target)) { toast(t('noPermission'), 'error'); return; }
  } else if (!canCreateDistrict()) {
    toast(t('noPermission'), 'error'); return;
  }

  const saveBtn = $('saveDistrictBtn');
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + esc(t('loading'));
  }

  try {
    const payload = { name, code, notes, updatedAt: serverTimestamp() };
    if (APP.editingId) {
      await updateDoc(doc(db, 'districts', APP.editingId), payload);
      toast(t('savedOk'), 'success');
    } else {
      payload.createdAt = serverTimestamp();
      const docId = /^[A-Za-z0-9_-]{1,60}$/.test(code) ? code : undefined;
      if (docId) {
        const ref = doc(db, 'districts', docId);
        const existing = await getDoc(ref);
        if (existing.exists()) {
          if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fas fa-save"></i> ' + esc(t('create')); }
          toast(t('duplicateCode'), 'error');
          return;
        }
        await setDoc(ref, payload);
      } else {
        await setDoc(doc(collection(db, 'districts')), payload);
      }
      toast(t('createdOk'), 'success');
    }
    closeModal('districtModal');
  } catch (e) {
    console.error('[saveDistrict]', e);
    const msg = e.code === 'permission-denied' ? t('noPermission') : (e.message || 'Unknown error');
    toast(t('errorSave') + msg, 'error');
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fas fa-save"></i> ' + esc(APP.editingId ? t('update') : t('create')); }
  }
}

/* ── Delete modal ─────────────────────────────────────── */
function openDeleteModal(district) {
  closeModal('deleteModal');
  if (!canDeleteDistrict(district)) { toast(t('noPermission'), 'error'); return; }
  APP.deletingId = district.id;
  const bc = branchCount(district);
  const cc = customerCount(district);
  const hasRefs = bc > 0 || cc > 0;

  const warnings = [];
  if (bc > 0) warnings.push(t('hasBranchesWarning', { n: bc }));
  if (cc > 0) warnings.push(t('hasCustomersWarning', { n: cc }));

  const blockMessage = hasRefs ? `
    <div class="warn-banner" style="text-align:left;margin-top:14px">
      <i class="fas fa-exclamation-triangle"></i>
      <div>
        <strong>${esc(t('cannotDeleteText'))}</strong>
        <div style="margin-top:6px">${warnings.map(w => esc(w)).join('<br>')}</div>
      </div>
    </div>
    <label class="confirm-check">
      <input type="checkbox" id="forceDeleteCheck">
      <span>${esc(t('forceDeleteLabel', { b: bc, c: cc }))}</span>
    </label>
  ` : '';

  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'deleteModal';
  root.innerHTML = `
    <div class="modal modal--sm">
      <div class="modal__head">
        <div><div class="modal__title">${esc(t('deleteTitle'))}</div><div class="modal__sub">${esc(t('deleteText'))}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body">
        <div class="modal__title-icon danger"><i class="fas fa-trash"></i></div>
        <p style="text-align:center;font-weight:800;color:var(--text);font-size:15px;margin-bottom:4px;">
          ${esc(district.name || '—')}
          ${district.code ? ` <span style="color:var(--muted);font-weight:600;font-size:13px;">(${esc(district.code)})</span>` : ''}
        </p>
        ${blockMessage}
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="confirmDeleteBtn" ${hasRefs ? 'disabled' : ''}>
          <i class="fas fa-trash"></i> ${esc(t('rowDelete'))}
        </button>
      </div>
    </div>`;
  document.body.appendChild(root);
  attachEscape();
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal('deleteModal')));
  root.addEventListener('click', (e) => { if (e.target === root) closeModal('deleteModal'); });

  const check = document.getElementById('forceDeleteCheck');
  const btn = document.getElementById('confirmDeleteBtn');
  check?.addEventListener('change', () => { if (btn) btn.disabled = !check.checked; });

  btn?.addEventListener('click', async () => {
    if (hasRefs && !check?.checked) return;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + esc(t('loading'));
    try {
      await deleteDoc(doc(db, 'districts', APP.deletingId));
      toast(t('deletedOk'), 'success');
      closeModal('deleteModal');
    } catch (e) {
      console.error('[deleteDistrict]', e);
      const msg = e.code === 'permission-denied' ? t('noPermission') : e.message;
      toast(t('errorDelete') + msg, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-trash"></i> ' + esc(t('rowDelete'));
    }
  });
}

/* ── Logout modal ─────────────────────────────────────── */
function showLogoutModal() {
  closeModal('logoutModal');
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'logoutModal';
  root.innerHTML = `
    <div class="modal modal--sm">
      <div class="modal__head">
        <div><div class="modal__title">${esc(t('logoutTitle'))}</div><div class="modal__sub">${esc(t('logoutText'))}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="confirmLogoutBtn"><i class="fas fa-sign-out-alt"></i> ${esc(t('logout'))}</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  attachEscape();
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal('logoutModal')));
  root.addEventListener('click', (e) => { if (e.target === root) closeModal('logoutModal'); });
  document.getElementById('confirmLogoutBtn')?.addEventListener('click', async () => {
    if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
    awayStartedAt = null;
    try { sessionStorage.clear(); } catch(e){}
    clearCachedProfile();
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
  });
}

function setLang(lang) {
  if (!SUPPORTED.includes(lang)) lang = FALLBACK;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

function scopedListenQuery(coll) {
  const base = collection(db, coll);
  if (isSuper() || isAuditor()) return base;
  if (isAdmin()) {
    const p = APP.profile || {};
    const target = p.districtId || p.districtCode;
    if (!target) return base;
    return query(base, where('districtId', '==', target));
  }
  return base;
}
function attachListeners() {
  stopListeners();
  const watch = (coll, key, orderField, scoped = false) => {
    let ref = scoped ? scopedListenQuery(coll) : collection(db, coll);
    if (orderField) ref = query(ref, orderBy(orderField, 'desc'), limit(500));
    const unsub = onSnapshot(ref,
      (snap) => {
        APP[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMain();
      },
      (err) => {
        console.warn('[listen]', coll, err.code, err.message);
        if (scoped) {
          const ref2 = collection(db, coll);
          getDocs(ref2).then(s2 => {
            APP[key] = s2.docs.map(d => ({ id: d.id, ...d.data() }));
            renderMain();
          }).catch(() => {});
        }
        renderMain();
      }
    );
    APP.unsubs.push(unsub);
  };
  watch('districts', 'districts');
  const scopeRef = !isSuper() && !isAuditor();
  watch('branches',  'branches', null, scopeRef);
  watch('customers', 'customers', null, scopeRef);
}
function stopListeners() {
  APP.unsubs.forEach(u => { try { u(); } catch(e){} });
  APP.unsubs = [];
}

/* ════════════════════════════════════════════════════════════
   BOOT — instant render from cache, then auth + background load
════════════════════════════════════════════════════════════ */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  const hasMis = sessionStorage.getItem('loggedIn') === 'true' && sessionStorage.getItem('uid');
  if (!isSessionRecordValid(sess) && !hasMis) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const cachedProfile = readCachedProfile();
  let rendered = false;
  if (cachedProfile && cachedProfile.uid) {
    APP.profile = {
      id: cachedProfile.uid,
      role: cachedProfile.role || 'viewer',
      email: cachedProfile.email || '',
      fullName: cachedProfile.name || 'User',
      photoURL: cachedProfile.photoURL || null,
      districtId: cachedProfile.districtId || '',
      districtName: cachedProfile.districtName || '',
      branchId: cachedProfile.branchId || '',
      branchName: cachedProfile.branchName || ''
    };
    renderShell();
    renderMain();
    hideLoaderNow();
    rendered = true;
  } else if (hasMis) {
    APP.profile = {
      id: sessionStorage.getItem('uid'),
      role: sessionStorage.getItem('role') || 'viewer',
      email: sessionStorage.getItem('email') || '',
      fullName: sessionStorage.getItem('userName') || 'User',
      photoURL: null,
      districtId: '', districtName: '', branchId: '', branchName: ''
    };
    renderShell();
    renderMain();
    hideLoaderNow();
  }

  const user = await new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
  });
  if (!user) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  if (sess && user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    const d = snap.data();
    if (d.status === 'inactive') throw new Error('inactive');
    APP.profile = { id: snap.id, ...d, email: user.email || '' };
    writeCachedProfile();
  } catch (e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e2){}
    clearSession(); clearCachedProfile();
    try { await signOut(auth); } catch(e2){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const profileChanged = !rendered ||
    (cachedProfile && (
      (cachedProfile.name !== (APP.profile.fullName || APP.profile.name)) ||
      cachedProfile.role !== APP.profile.role ||
      cachedProfile.photoURL !== APP.profile.photoURL
    ));
  if (profileChanged) { renderShell(); renderMain(); }
  hideLoaderNow();

  await loadSessionTimeout();
  startSessionWatcher();

  try {
    const cfg = await getDoc(doc(db, 'settings', 'system'));
    if (cfg.exists()) {
      const dd = cfg.data();
      if (dd.saccoName && String(dd.saccoName).trim()) APP.saccoName = String(dd.saccoName).trim();
      if (dd.shortName && String(dd.shortName).trim()) APP.shortName = String(dd.shortName).trim();
    }
  } catch(e){}

  attachListeners();
})();

console.log('[sacco] districts page ready — session fix, cached render, full translations');
</script>
