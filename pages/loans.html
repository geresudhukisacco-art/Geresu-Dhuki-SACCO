<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loans — Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
  }
}
</script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;--violet-soft:#f0eaff;
  --gold:#d4a017;--gold-soft:#fdf5e0;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px;--r-lg:20px;--r-full:999px;
  --sidebar-w:272px;--topbar-h:76px;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
.sidebar::before{content:"";position:absolute;width:450px;height:450px;border-radius:50%;
  border:1px solid rgba(255,255,255,.10);right:-220px;top:-150px;pointer-events:none;}
.sidebar__brand{position:relative;z-index:2;display:flex;align-items:center;gap:14px;
  padding:22px;border-bottom:1px solid rgba(255,255,255,.10);min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;flex-shrink:0;border-radius:14px;
  background:rgba(255,255,255,.97);box-shadow:0 10px 24px rgba(0,0,0,.18);
  display:grid;place-items:center;padding:5px;overflow:hidden;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;opacity:1;transition:opacity .18s ease 60ms;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);
  border:3px solid var(--bg);display:grid;place-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,.15);z-index:10;cursor:pointer;}
.sidebar__collapse i{font-size:10px;font-weight:900;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{position:relative;z-index:2;flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;
  font-size:14px;font-weight:600;color:rgba(255,255,255,.78);
  margin-bottom:3px;transition:background .15s, color .15s;
  white-space:nowrap;cursor:pointer;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;flex-shrink:0;text-align:center;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);
  position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);
  background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{position:relative;z-index:2;padding:16px 20px;
  border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;
  transition:all .15s;white-space:nowrap;}
.sidebar__logout i{width:20px;font-size:15px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);
  align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.session-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;
  border-radius:var(--r-full);background:#ecfdf3;color:#067647;
  font-size:11.5px;font-weight:800;transition:all .2s;}
.session-pill i{font-size:12px;}
.session-pill.is-critical{background:#fef3f2;color:#b42318;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;
  padding:4px 14px 4px 4px;border-radius:var(--r-full);
  background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff;font-weight:800;font-size:13px;
  display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);
  background:#fff;border:1px solid var(--border);border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__session{padding:10px 14px 12px;font-size:11.5px;color:var(--muted);
  border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__session strong{color:var(--primary-dark);font-weight:800;}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;
  color:var(--text-soft);text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 20px;margin-bottom:22px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
.breadcrumb span.crumb{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb span.crumb.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb span.crumb.is-link{cursor:pointer;}
.breadcrumb span.crumb.is-link:hover{background:#dbeafe;color:var(--primary);}
.breadcrumb span.arrow{color:#cbd5e1;font-weight:400;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue  {--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green {--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--red   {--c1:linear-gradient(90deg,#dc2626,#e74c5c);--ic:#fef3f2;--ifc:#b42318;}
.stat--gold  {--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#5b21b6,#7c3aed);--ic:#f0eaff;--ifc:#5b21b6;}
.stat__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.stat__label{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.stat__icon{width:42px;height:42px;border-radius:12px;background:var(--ic);color:var(--ifc);
  display:grid;place-items:center;flex-shrink:0;font-size:16px;}
.stat__value{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:var(--text);}
.stat__hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
.card{background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;}
.card__head{display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:320px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);
  border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:11px;
  background:#fff;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;min-width:140px;font-family:inherit;}
.toolbar select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.view-toggle{display:flex;gap:2px;padding:3px;border-radius:11px;background:#e8ecf1;}
.view-toggle button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.view-toggle button:hover{color:var(--primary);}
.view-toggle button.is-active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(20,40,70,.08);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:46px;padding:0 20px;border-radius:13px;
  border:1px solid #d9dee7;background:#fff;
  color:var(--text-soft);font-size:14px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--success{background:linear-gradient(135deg,#128a5c,#19a974);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(18,138,92,.2);}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}

/* ========== LOANS GRID ========== */
.loans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding:22px;}
.loan-card{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:16px;padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
.loan-card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:#d8c8f5;}
.loan-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#5b21b6,#7c3aed);}
.loan-card--active::before{background:linear-gradient(90deg,#19a974,#34c78e);}
.loan-card--pending::before{background:linear-gradient(90deg,#d4a017,#e8b84b);}
.loan-card--repaid::before{background:linear-gradient(90deg,#0b5cab,#0e7490);}
.loan-card--overdue::before{background:linear-gradient(90deg,#dc2626,#e74c5c);}
.loan-card--rejected::before{background:linear-gradient(90deg,#94a3b8,#64748b);}
.loan-card__head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;margin-top:12px;}
.loan-card__avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;font-weight:800;font-size:18px;letter-spacing:-.5px;
  display:grid;place-items:center;overflow:hidden;position:relative;}
.loan-card__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.loan-card__main{flex:1;min-width:0;}
.loan-card__code{font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:10.5px;font-weight:800;letter-spacing:.4px;color:#5b21b6;
  background:#f0eaff;padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.loan-card__name{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.2px;
  line-height:1.3;word-break:break-word;}
.loan-card__meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.loan-card__type{display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;color:#5b21b6;
  background:#f0eaff;padding:3px 9px;border-radius:var(--r-full);}
.loan-card__actions{position:absolute;top:16px;right:16px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;}
.loan-card__actions button{width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;font-size:12px;color:var(--text-soft);
  background:#fff;border:1px solid var(--border);transition:.15s;}
.loan-card__actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.loan-card__actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.loan-card__actions button.success:hover{background:#128a5c;border-color:#128a5c;}
.loan-card__actions button.print:hover{background:#b8860b;border-color:#b8860b;}
.loan-card__amounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:12px 14px;background:linear-gradient(135deg,#faf7ff,#fff);
  border:1px solid #e8dffb;border-radius:12px;margin-bottom:14px;}
.loan-card__amount-block{min-width:0;}
.loan-card__amount-label{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted);}
.loan-card__amount-value{font-size:15px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:-.3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.loan-card__amount-value--principal{color:#5b21b6;}
.loan-card__amount-value--outstanding{color:#b42318;}
.loan-card__amount-value--outstanding.is-clear{color:#067647;}
.loan-card__progress{margin-bottom:12px;}
.loan-card__progress-head{display:flex;justify-content:space-between;
  font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;
  font-family:ui-monospace,monospace;}
.progress-bar{position:relative;width:100%;height:7px;background:#eef1f5;border-radius:99px;overflow:hidden;}

@media print {

    display: block !important; position: static !important; float: none !important;
    width: 210mm !important; min-height: 297mm !important;
    padding: 0 !important; margin: 0 !important; overflow: hidden !important;
  }
  #slip-print-host .slip {
    display: block !important;
    width: 210mm !important; min-height: 297mm !important;
    padding: 12mm 14mm !important; margin: 0 !important;
    border: none !important; border-radius: 0 !important; box-shadow: none !important;
    overflow: visible !important; box-sizing: border-box !important;
  }
  #slip-print-host, #slip-print-host * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
}

function readSession() {
  try { const raw = sessionStorage.getItem(SESSION_KEY); if (!raw) return null;
    const s = JSON.parse(raw); return (s && s.uid) ? s : null; } catch (e) { return null; }
}

function isSessionRecordValid(s) { return !!(s && s.uid); }
function getSessionMs() {
  const s = readSession();
  const mins = (s && s.minutes) || SESSION_MINUTES || DEFAULT_SESSION_MINUTES;
  return Math.max(1, mins) * 60 * 1000;
}
function forceLogout(reason) {
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  awayStartedAt = null;
  try { sessionStorage.clear(); } catch (e) {}
  try { sessionStorage.setItem('__redirectReason', reason || 'expired'); } catch (e) {}
  clearSession();
  try { signOut(auth); } catch (e) {}
  window.location.replace(LOGIN_URL);

function isWindowActive() { return document.visibilityState === 'visible' && document.hasFocus(); }
function startAwayTimer() {
  if (awayStartedAt) return;
  awayStartedAt = Date.now();
  if (awayCheckInterval) clearInterval(awayCheckInterval);
  awayCheckInterval = setInterval(() => {
    if (!awayStartedAt) return;
    const away = Date.now() - awayStartedAt;
    if (away >= getSessionMs()) { forceLogout('expired'); return; }
    renderSessionPill();
  }, 1000);
  renderSessionPill();
}
function stopAwayTimer() {
  awayStartedAt = null;
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  renderSessionPill();
}
function evaluateActivity() {
  if (isWindowActive()) {
    if (awayStartedAt) {
      const away = Date.now() - awayStartedAt;
      if (away >= getSessionMs()) { forceLogout('expired'); return; }
    }
    stopAwayTimer();
  } else { startAwayTimer(); }
}
function startSessionWatcher() {
  document.addEventListener('visibilitychange', evaluateActivity);

  window.addEventListener('blur', evaluateActivity);
  evaluateActivity();
}
async function loadSessionTimeout() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));

      let mins = DEFAULT_SESSION_MINUTES;
      if (data.sessionTimeout != null) mins = Number(data.sessionTimeout);
      else if (data.sessionTimeoutMinutes != null) mins = Number(data.sessionTimeoutMinutes);
      if (!isFinite(mins) || mins < 1) mins = DEFAULT_SESSION_MINUTES;
      if (mins > 1440) mins = 1440;
      SESSION_MINUTES = Math.round(mins);

  } catch (e) { console.warn(e.message); }
}
function renderSessionPill() {
  const p = document.getElementById('sessionPill');
  const mr = document.getElementById('menuRemaining');

  if (isWindowActive()) {
    const mins = Math.round(getSessionMs() / 60000);

    p.querySelector('[data-session-text]').textContent = 'Active · ' + mins + ' min';

  if (!awayStartedAt) { p.style.display = 'none'; return; }
  const away = Date.now() - awayStartedAt;
  const left = Math.max(0, getSessionMs() - away);
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  const txt = m + ':' + String(s).padStart(2, '0');
  p.style.display = '';
  p.classList.toggle('is-critical', left <= 60000);
  p.querySelector('[data-session-text]').textContent = txt;

/* ============ SCOPE ============ */
function scopeCustomers() {
  if (!APP.profile) return [];
  const role = APP.profile.role;
  if (role === 'super_admin' || role === 'auditor') return APP.customers.slice();
  if (role === 'admin' || role === 'manager' || role === 'cashier' || role === 'teller' || role === 'accountant') {
    if (APP.profile.region) return APP.customers.filter(c => c.region === APP.profile.region);
    return APP.customers.slice();
  }
  if (role === 'member') {
    const cid = APP.profile.customerId || APP.profile.memberId;
    return APP.customers.filter(c =>
      c.userId === APP.profile.id || c.customerId === cid || c.id === cid
    );
  }
  return [];
}
function scopeLoans() {
  if (!APP.profile) return [];
  const role = APP.profile.role;
  if (role === 'member') {
    const cid = APP.profile.customerId || APP.profile.memberId;
    return APP.loans.filter(l =>
      l.customerId === cid || l.customerDocId === cid || l.memberId === cid
    );
  }
  const ids = new Set(scopeCustomers().map(c => c.id));
  const cids = new Set(scopeCustomers().map(c => c.customerId).filter(Boolean));
  return APP.loans.filter(l => {
    const mId = l.customerId || l.memberId;
    const dId = l.customerDocId;
    return ids.has(mId) || ids.has(dId) || cids.has(mId);
  });
}
function customerById(id) {
  if (!id) return null;
  return APP.customers.find(c => c.id === id || c.customerId === id) || null;
}
function districtById(id) { return APP.districts.find(d => d.id === id) || null; }
function branchById(id) { return APP.branches.find(b => b.id === id) || null; }

/* ============ LOAN CALC (with interest types) ============ */
function calcLoan(principal, ratePct, months, interestType = 'simple') {
  const p = num(principal);
  const r = num(ratePct);
  const m = Math.max(0, Math.floor(num(months)));
  const type = String(interestType || 'simple').toLowerCase();
  let interest = 0;

  if (type === 'compound') {
    // A = P(1 + r/n)^(nt); n = 12 (monthly compounding)
    const monthlyRate = (r / 100) / 12;
    if (m > 0 && monthlyRate > 0) interest = p * (Math.pow(1 + monthlyRate, m) - 1);
  } else if (type === 'reducing') {
    // EMI = P × i × (1+i)^n / ((1+i)^n − 1); interest = EMI×n − P
    const monthlyRate = (r / 100) / 12;
    if (m > 0 && monthlyRate > 0) {
      const factor = Math.pow(1 + monthlyRate, m);
      const emi = p * monthlyRate * factor / (factor - 1);
      interest = (emi * m) - p;
    }
  } else if (type === 'fixed') {
    // Flat one-time interest (independent of duration)
    interest = p * (r / 100);
  } else {
    // simple (default): P × R × T(years)
    interest = p * (r / 100) * (m / 12);
  }

  interest = Math.max(0, Math.round(interest * 100) / 100);
  const total   = Math.round((p + interest) * 100) / 100;
  const monthly = m > 0 ? Math.round((total / m) * 100) / 100 : total;
  return { principal: p, rate: r, months: m, type, interest, total, monthly };
}
function loanRepaid(loan) { return num(loan.amountRepaid); }
function loanOutstanding(loan) {
  const { total } = calcLoan(loan.principal, loan.interestRate, loan.duration, loan.interestType);
  return Math.max(0, total - loanRepaid(loan));
}
function loanProgress(loan) {
  const { total } = calcLoan(loan.principal, loan.interestRate, loan.duration, loan.interestType);
  if (total <= 0) return 0;
  return Math.min(100, Math.round((loanRepaid(loan) / total) * 100));
}
function isOverdue(loan) {
  if (!['active','approved'].includes(String(loan.status || '').toLowerCase())) return false;
  if (!loan.maturityDate) return false;
  const mat = toDate(loan.maturityDate);
  if (!mat) return false;
  return mat.getTime() < Date.now();
}
function isDueSoon(loan) {
  if (!['active','approved'].includes(String(loan.status || '').toLowerCase())) return false;
  if (!loan.maturityDate) return false;
  const mat = toDate(loan.maturityDate);
  if (!mat) return false;
  const diff = mat.getTime() - Date.now();
  return diff > 0 && diff <= 30 * 86400000;
}
function computeMaturityDate(disbDate, months) {
  if (!disbDate) return '';
  const d = new Date(disbDate);
  if (isNaN(d)) return '';
  d.setMonth(d.getMonth() + Math.max(0, Math.floor(num(months))));
  return d.toISOString().slice(0,10);
}
function generateSerialNumber() {
  const yr = new Date().getFullYear();
  const rnd = Math.floor(100000 + Math.random() * 900000);
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let suf = '';
  for (let i = 0; i < 3; i++) suf += chars[Math.floor(Math.random() * chars.length)];
  return `GD-${yr}-${rnd}-${suf}`;
}
function customerSavingsBalance(customer) {
  if (!customer) return 0;
  const cid = customer.customerId || customer.id;
  let total = 0;
  APP.transactions.forEach(tx => {
    const type = String(tx.type || '').toLowerCase();
    if (!['savings','deposit','withdrawal','leaving_withdrawal'].includes(type)) return;
    const match = tx.customerId === cid || tx.memberId === cid ||
                  tx.customerId === customer.id || tx.memberId === customer.id;
    if (!match) return;
    const status = String(tx.status || '').toLowerCase();
    if (!['approved','completed','paid','printed','done'].includes(status)) return;
    if (type === 'savings' || type === 'deposit') total += num(tx.amount);
    else if (type === 'withdrawal' || type === 'leaving_withdrawal') total -= num(tx.amount);
  });
  return Math.max(0, total);
}
function customerLoanContext(customer, excludeLoanId) {
  if (!customer) return { total:0, active:0, pending:0, paid:0, outstanding:0, exposure:0, loans:[] };
  const cid = customer.customerId || customer.id;
  const loans = APP.loans.filter(l => {
    if (excludeLoanId && l.id === excludeLoanId) return false;
    return l.customerId === cid || l.customerDocId === customer.id || l.memberId === cid;
  });
  let active = 0, pending = 0, paid = 0, outstanding = 0, exposure = 0;
  loans.forEach(l => {
    const s = String(l.status || '').toLowerCase();
    if (s === 'active') active++;
    else if (s === 'pending') pending++;
    else if (s === 'repaid' || s === 'paid') paid++;
    if (s === 'active' || s === 'approved' || s === 'pending') exposure += num(l.principal);
    if (s === 'active' || s === 'approved') outstanding += loanOutstanding(l);
  });
  return {
    total: loans.length,
    active, pending, paid,
    outstanding: Math.round(outstanding * 100) / 100,
    exposure: Math.round(exposure * 100) / 100,
    loans
  };
}
function countActiveOrPending(customer, excludeLoanId) {
  const ctx = customerLoanContext(customer, excludeLoanId);
  return ctx.active + ctx.pending;
}
function activeOrPendingLoans(customer, excludeLoanId) {
  if (!customer) return [];
  const cid = customer.customerId || customer.id;
  return APP.loans.filter(l => {
    if (excludeLoanId && l.id === excludeLoanId) return false;
    if (!(l.customerId === cid || l.customerDocId === customer.id || l.memberId === cid)) return false;
    const s = String(l.status || '').toLowerCase();
    return s === 'active' || s === 'pending' || s === 'approved';
  });
}

      const c = customerById(l.customerId || l.customerDocId);
      const name = customerName(c).toLowerCase();
      return name.includes(s)
          || (l.loanNumber || '').toLowerCase().includes(s)
          || (l.serialNumber || '').toLowerCase().includes(s)
          || (l.customerId || '').toLowerCase().includes(s)
          || (l.purpose || '').toLowerCase().includes(s)
          || (l.collateral || '').toLowerCase().includes(s)
          || (l.reference || '').toLowerCase().includes(s)
          || (c?.phone || '').toLowerCase().includes(s)
          || (c?.customerId || '').toLowerCase().includes(s);
    });
  }
  if (APP.filters.districtId) {
    const ids = new Set(scopeCustomers().filter(c => c.districtId === APP.filters.districtId).map(c => c.id));
    list = list.filter(l => ids.has(l.customerDocId) || ids.has(l.customerId));
  }
  if (APP.filters.branchId) {
    const ids = new Set(scopeCustomers().filter(c => c.branchId === APP.filters.branchId).map(c => c.id));
    list = list.filter(l => ids.has(l.customerDocId) || ids.has(l.customerId));
  }
  if (APP.filters.type) list = list.filter(l => (l.loanType || '') === APP.filters.type);
  if (APP.filters.status) list = list.filter(l => (l.status || '') === APP.filters.status);
  if (APP.filters.overdue === 'overdue') list = list.filter(isOverdue);
  else if (APP.filters.overdue === 'soon') list = list.filter(isDueSoon);

  return list.slice().sort((a, b) => {
    const da = toDate(b.createdAt || b.disbursementDate)?.getTime() || 0;
    const db2 = toDate(a.createdAt || a.disbursementDate)?.getTime() || 0;
    return db2 - da;
  });
}
function renderContent() {
  const host = document.getElementById('contentHost');
  if (!host) return;
  const list = filteredLoans();
  if (!list.length) {
    const isFiltered = APP.filters.search || APP.filters.districtId || APP.filters.branchId || APP.filters.type || APP.filters.status || APP.filters.overdue;
    host.innerHTML = `
      <div class="empty">
        <i class="fas ${isFiltered ? 'fa-search' : 'fa-file-invoice'}"></i>
        <div class="empty__title">${isFiltered ? esc(t('noMatch')) : esc(t('noLoans'))}</div>
        <div class="empty__text">${isFiltered ? esc(t('noMatchText')) : esc(t('noLoansText'))}</div>
      </div>`;
    return;
  }
  if (APP.view === 'table') renderTableView(host, list);
  else renderGridView(host, list);
}

/* ============ GRID VIEW ============ */
function loanStatusLabel(status) {
  const map = {
    pending:t('statusPending'), approved:t('statusApproved'), active:t('statusActive'),
    repaid:t('statusRepaid'), defaulted:t('statusDefaulted'), rejected:t('statusRejected')
  };
  return map[String(status||'').toLowerCase()] || status || '—';
}
function loanStatusCls(status) {
  const s = String(status || '').toLowerCase();
  if (s === 'repaid') return 'tag--blue';
  if (s === 'active' || s === 'approved') return 'tag--green';
  if (s === 'pending') return 'tag--gold';
  if (s === 'defaulted' || s === 'rejected') return 'tag--red';
  return 'tag--gray';
}
function loanCardClass(l) {
  if (isOverdue(l)) return 'loan-card--overdue';
  const s = String(l.status || '').toLowerCase();
  if (s === 'active' || s === 'approved') return 'loan-card--active';
  if (s === 'pending') return 'loan-card--pending';
  if (s === 'repaid') return 'loan-card--repaid';
  if (s === 'rejected' || s === 'defaulted') return 'loan-card--rejected';
  return '';
}
function loanStatusBadgeClass(status) {
  const s = String(status || '').toLowerCase();
  if (s === 'active') return 'status-badge--active';
  if (s === 'approved') return 'status-badge--approved';
  if (s === 'pending') return 'status-badge--pending';
  if (s === 'repaid') return 'status-badge--repaid';
  if (s === 'rejected') return 'status-badge--rejected';
  if (s === 'defaulted') return 'status-badge--defaulted';
  return 'status-badge--pending';
}
function renderGridView(host, list) {
  const pages = Math.max(1, Math.ceil(list.length / APP.pageSize));
  if (APP.page > pages) APP.page = pages;
  const start = (APP.page - 1) * APP.pageSize;
  const pageList = list.slice(start, start + APP.pageSize);
  host.innerHTML = `
    <div class="loans-grid">${pageList.map(l => renderLoanCard(l)).join('')}</div>
    ${renderPagination(list.length, pages, start, pageList.length)}
  `;
  host.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handleRowAction(btn.dataset.action, btn.dataset.id));
  });
  host.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = Number(btn.dataset.page);
      if (p >= 1 && p <= pages) { APP.page = p; renderContent(); }
    });
  });
}

function renderPagination(total, pages, start, shown) {

      ${esc(t('showing'))} <strong>${total}</strong> ${esc(t('loansWord'))}
    </div></div>`;

  const startPage = Math.max(1, APP.page - 2);
  const endPage = Math.min(pages, startPage + 4);
  for (let i = startPage; i <= endPage; i++) range.push(i);
  return `
    <div class="pagination">
      <div class="pagination__info">
        ${esc(t('showing'))} <strong>${start + 1}–${start + shown}</strong>
        ${esc(t('of'))} <strong>${total}</strong> ${esc(t('loansWord'))}
      </div>
      <div class="pagination__controls">
        <button data-page="${APP.page - 1}" ${APP.page === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>
        ${range.map(p => `<button data-page="${p}" class="${p === APP.page ? 'is-current' : ''}">${p}</button>`).join('')}
        <button data-page="${APP.page + 1}" ${APP.page === pages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  `;
}

  });

    APP.filters.branchId = e.target.value; APP.page = 1; renderContent();
  });
  document.getElementById('fltType')?.addEventListener('change', (e) => {

  });

      APP.view = btn.dataset.view;

    });

let _debTimer;
function debounce(fn, ms) {
  return function (...args) {
    clearTimeout(_debTimer);
    _debTimer = setTimeout(() => fn.apply(this, args), ms);
  };
}
function handleRowAction(action, id) {
  const l = APP.loans.find(x => x.id === id);
  if (!l) return;
  if (action === 'view')    openViewModal(l);
  if (action === 'edit')    openLoanWizard(l);
  if (action === 'delete')  openDeleteModal(l);
  if (action === 'approve') approveLoan(l);
  if (action === 'reject')  rejectLoan(l);
  if (action === 'print')   printSlip(l);
  if (action === 'repay')   openRepaymentModal(l);
}

/* ============ APPROVE / REJECT ============ */
async function approveLoan(l) {
  if (!canApprove()) { toast(t('noPermission'), 'error'); return; }
  const userName = APP.profile?.fullName || APP.profile?.name || APP.user?.email || 'User';
  try {
    await updateDoc(doc(db, 'loans', l.id), {
      status: 'active',
      loanProgress: 'agreement_on_progress',
      approvedAt: serverTimestamp(),
      approvedBy: APP.profile.id,
      approvedByName: userName
    });
    toast(t('approvedOk'), 'success');
  } catch (e) {
    const msg = e.code === 'permission-denied' ? t('noPermission') : e.message;
    toast(t('errorSave') + msg, 'error');
  }
}
async function rejectLoan(l) {
  if (!canApprove()) { toast(t('noPermission'), 'error'); return; }
  const userName = APP.profile?.fullName || APP.profile?.name || APP.user?.email || 'User';
  try {
    await updateDoc(doc(db, 'loans', l.id), {
      status: 'rejected',
      rejectedAt: serverTimestamp(),
      approvedBy: APP.profile.id,
      approvedByName: userName
    });
    toast(t('rejectedOk'), 'success');
  } catch (e) {
    const msg = e.code === 'permission-denied' ? t('noPermission') : e.message;
    toast(t('errorSave') + msg, 'error');
  }
}

/* ============ MODAL FRAMEWORK ============ */
let escHandler = null;
function closeModal() {
  const el = document.getElementById('modal-backdrop');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
}
function openWizard({ title, subtitle, finishLabel, steps, initial = {}, onFinish, successMessage, size = 'lg' }) {
  const data = { ...initial };
  let idx = 0, busy = false;
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  document.body.appendChild(root);
  escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });

  function collect() {
    root.querySelectorAll('[data-field]').forEach(el => {
      const k = el.dataset.field;
      if (el.type === 'checkbox') data[k] = el.checked;
      else data[k] = el.value;
    });
  }
  function showErr(msg) {
    const el = root.querySelector('#wizErr');
    if (!el) return;
    if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
    el.innerHTML = `<i class="fas fa-exclamation-circle"></i><div>${esc(msg)}</div>`;
    el.style.display = 'flex';
  }
  function draw() {
    const step = steps[idx];
    root.innerHTML = `
      <div class="modal modal--${size}">
        <div class="modal__head">
          <div>
            <div class="modal__title">${esc(title)}</div>
            ${subtitle ? `<div class="modal__sub">${esc(subtitle)}</div>` : ''}
          </div>
          <button class="modal__close" data-close aria-label="Close"><i class="fas fa-times"></i></button>
        </div>
        <div class="steps">
          ${steps.map((s, i) => `
            <div class="step ${i < idx ? 'is-done' : ''} ${i === idx ? 'is-active' : ''}">
              <span class="step__num">${i < idx ? '✓' : i + 1}</span>
              <span class="step__label">${esc(s.label)}</span>
            </div>
            ${i < steps.length - 1 ? `<div class="step__line"></div>` : ''}
          `).join('')}
        </div>
        <div class="modal__body">
          <div class="step-header">
            <span class="step-header__badge">${idx + 1}</span>
            ${esc(step.title || step.label)}
          </div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-close>${esc(t('cancel'))}</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx === 0 ? 'disabled' : ''}>${esc(t('back'))}</button>
          <button class="btn btn--primary" data-wiz="next">
            <span class="spinner-sm hidden"></span>
            <span class="btn-label">${idx === steps.length - 1 ? esc(finishLabel || t('save')) : esc(t('next'))}</span>
          </button>
        </div>
      </div>`;
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
    root.querySelectorAll('[data-field]').forEach(el => {
      const v = data[el.dataset.field];
      if (v === undefined || v === null) return;
      if (el.type === 'checkbox') el.checked = !!v;
      else el.value = v;
    });
    root.querySelector('[data-wiz="prev"]').addEventListener('click', () => {
      if (idx > 0) { collect(); idx--; draw(); }
    });
    root.querySelector('[data-wiz="next"]').addEventListener('click', async () => {
      const step = steps[idx];
      collect();
      const err = step.validate ? await step.validate(data) : null;
      if (err) { showErr(err); return; }
      if (idx === steps.length - 1) {
        if (busy) return;
        busy = true;
        const btn = root.querySelector('[data-wiz="next"]');
        const sp = btn.querySelector('.spinner-sm');
        const lbl = btn.querySelector('.btn-label');
        btn.disabled = true; sp.classList.remove('hidden'); lbl.textContent = t('loading');
        try {
          await onFinish(data);
          closeModal();
          toast(successMessage || 'Saved', 'success');
        } catch (e) {
          console.error(e);
          busy = false;
          btn.disabled = false; sp.classList.add('hidden');
          lbl.textContent = finishLabel || t('save');
          showErr(e?.message || 'Something went wrong.');
        }
      } else { idx++; draw(); }
    });
    if (typeof step.after === 'function') step.after(root, data, () => { collect(); draw(); });
  }
  draw();
}

/* ============ LOAN WIZARD ============ */
function openLoanWizard(loan) {
  const isEdit = !!loan;
  const l0 = loan || {};

  const initial = {
    customerId: l0.customerId || '',
    _customerDocId: l0.customerDocId || '',
    loanType: l0.loanType || 'personal',
    interestType: l0.interestType || APP.settings.defaultLoanType || 'simple',
    principal: l0.principal != null ? String(num(l0.principal)) : '',
    interestRate: l0.interestRate != null ? String(num(l0.interestRate)) : String(APP.settings.defaultInterestRate),
    duration: l0.duration != null ? String(num(l0.duration)) : '12',
    purpose: l0.purpose || '',
    collateral: l0.collateral || '',
    disbursementDate: l0.disbursementDate || new Date().toISOString().slice(0,10),
    maturityDate: l0.maturityDate || computeMaturityDate(l0.disbursementDate || new Date().toISOString().slice(0,10), l0.duration || 12),
    status: l0.status || 'pending',
    reference: l0.reference || '',
    notes: l0.notes || '',
    _attachment: l0.attachment || null
  };
  if (initial.customerId) {
    const c = customerById(initial.customerId);
    if (c) initial._customerDocId = c.id;
  }
  const searchState = { q: '' };
  const guarantees = Array.isArray(l0.guarantees) ? [...l0.guarantees] : [];

  openWizard({
    title: isEdit ? t('editLoanTitle') : t('newLoanTitle'),
    subtitle: isEdit ? t('editLoanSub') : t('newLoanSub'),
    finishLabel: isEdit ? t('update') : t('create'),
    successMessage: isEdit ? t('savedOk') : t('createdOk'),
    size: 'lg',
    initial,
    steps: [
      /* ---------- CUSTOMER + HISTORY ---------- */
      {
        label: t('stepCustomer'), title: t('stepCustomerTitle'),
        render: (d) => {
          const list = scopeCustomers().slice().sort((a,b) =>
            customerName(a).localeCompare(customerName(b))
          );
          const q = searchState.q.toLowerCase();
          const filtered = q
            ? list.filter(c => {
                const name = customerName(c).toLowerCase();
                return name.includes(q)
                  || (c.customerId || '').toLowerCase().includes(q)
                  || (c.phone || '').toLowerCase().includes(q)
                  || (c.nid || '').toLowerCase().includes(q);
              })
            : list;

          const rows = filtered.length ? filtered.map(c => {
            const bal = customerSavingsBalance(c);
            const ctx = customerLoanContext(c, isEdit ? l0.id : null);
            const isOn = d.customerId === (c.customerId || c.id);
            const avatar = c.photoURL
              ? `<img src="${esc(c.photoURL)}" alt="">`
              : esc(initials(customerName(c)));
            const bName = c.branchName || branchById(c.branchId)?.name || '';
            const dName = c.districtName || districtById(c.districtId)?.name || '';
            const activeCount = ctx.active + ctx.pending;
            const maxPer = APP.settings.maxLoansPerCustomer;
            const blocked = !isEdit && activeCount >= maxPer;
            const blockText = blocked
              ? t('maxLoansReached').replace('{max}', maxPer)
              : '';
            const badgeHtml = blocked
              ? `<span class="customer-pick__block-tag"><i class="fas fa-ban"></i> ${esc(t('ctxBlocked'))}</span>`
              : (activeCount > 0
                  ? `<span class="customer-pick__block-tag" style="background:#fdf5e0;color:#b8860b;border:1px solid #f0dcb0">
                       <i class="fas fa-clock"></i> ${esc(t('ctxActiveCount').replace('{n}', activeCount))}
                     </span>`
                  : '');
            return `
              <div class="customer-pick__item ${isOn ? 'is-on' : ''} ${blocked ? 'is-blocked' : ''}"
                   data-customer-id="${esc(c.id)}"
                   data-customer-code="${esc(c.customerId || c.id)}"
                   data-blocked="${blocked ? '1' : '0'}"
                   data-block-text="${esc(blockText)}">
                <div class="customer-pick__avatar">${avatar}</div>
                <div class="customer-pick__main">
                  <div class="customer-pick__name">${esc(customerName(c))}
                    ${c.customerId ? `<span class="customer-pick__bal">${esc(c.customerId)}</span>` : ''}
                    ${badgeHtml}
                  </div>
                  <div class="customer-pick__meta">
                    ${bName ? `<span><i class="fas fa-code-branch" style="margin-right:3px"></i>${esc(bName)}</span>` : ''}
                    ${dName ? `<span>· ${esc(dName)}</span>` : ''}
                    ${c.phone ? `<span>· ${esc(formatPhone(c.phone))}</span>` : ''}
                  </div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <div style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">${esc(t('customerSavings'))}</div>
                  <div class="customer-pick__bal" style="margin-top:3px">${esc(moneyShort(bal))}</div>
                </div>
                <div class="customer-pick__radio"></div>
              </div>`;
          }).join('') : `<div style="padding:28px;text-align:center;color:var(--muted);font-size:13px">No customers match your search.</div>`;

          const sel = customerById(d.customerId);
          let ctxHtml = '';
          if (sel) {
            const savings = customerSavingsBalance(sel);
            const ctx = customerLoanContext(sel, isEdit ? l0.id : null);
            const maxBySavings = Math.round(savings * APP.settings.maxLoanMultiplier * 100) / 100;
            const absoluteMax = Math.min(maxBySavings, APP.settings.maxLoanAmount);
            const available = Math.max(0, Math.round((absoluteMax - ctx.exposure) * 100) / 100);
            const activeLoans = activeOrPendingLoans(sel, isEdit ? l0.id : null);

              const da = toDate(b.createdAt || b.disbursementDate)?.getTime() || 0;

            ctxHtml = `
              <div class="loan-context">
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxSavings'))}</div>
                  <div class="loan-context__value is-blue">${esc(moneyShort(savings))}</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxMultiplier'))}</div>
                  <div class="loan-context__value is-blue">${APP.settings.maxLoanMultiplier}×</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxMaxLoan'))}</div>
                  <div class="loan-context__value is-warn">${esc(moneyShort(absoluteMax))}</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxExposure'))}</div>
                  <div class="loan-context__value is-danger">${esc(moneyShort(ctx.exposure))}</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxAvailable'))}</div>
                  <div class="loan-context__value is-success">${esc(moneyShort(available))}</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxOutstanding'))}</div>
                  <div class="loan-context__value is-danger">${esc(moneyShort(ctx.outstanding))}</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxTotal'))}</div>
                  <div class="loan-context__value is-blue">${ctx.total}</div>
                </div>
                <div class="loan-context__cell">
                  <div class="loan-context__label">${esc(t('ctxActive'))} / ${esc(t('ctxPending'))} / ${esc(t('ctxPaid'))}</div>
                  <div class="loan-context__value is-blue">${ctx.active} / ${ctx.pending} / ${ctx.paid}</div>
                </div>
              </div>
              ${activeLoans.length ? `
                <div class="alert alert--warning" style="margin-top:0">
                  <i class="fas fa-exclamation-triangle"></i>
                  <div>
                    <strong>${esc(t('ctxBlocked'))}</strong>
                    <div style="margin-top:6px;font-size:12.5px">
                      ${activeLoans.map(al => `
                        <div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #f0dcb0">
                          <span style="font-family:ui-monospace,monospace;font-weight:800">${esc(al.serialNumber || al.loanNumber || '—')}</span>
                          <span>${esc(loanTypeLabel(al.loanType))}</span>
                          <span style="font-family:ui-monospace,monospace;font-weight:800">${esc(moneyShort(al.principal))}</span>
                        </div>`).join('')}
                    </div>
                  </div>
                </div>
              ` : ''}
              ${historyList.length ? `
                <div style="margin-top:14px;padding:12px 14px;background:#f8fafc;border:1px solid var(--border);border-radius:12px">
                  <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px">
                    <i class="fas fa-history" style="margin-right:6px"></i>Recent Loans
                  </div>
                  ${historyList.map(al => {
                    const st = String(al.status || '').toLowerCase();
                    const cls = st === 'active' || st === 'approved' ? 'tag--green'
                              : st === 'pending' ? 'tag--gold'
                              : st === 'repaid' ? 'tag--blue'
                              : 'tag--red';
                    return `
                      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px">
                        <span style="font-family:ui-monospace,monospace;font-weight:800;font-size:11.5px">${esc(al.serialNumber || al.loanNumber || '—')}</span>
                        <span>${esc(loanTypeLabel(al.loanType))}</span>
                        <span style="font-family:ui-monospace,monospace;font-weight:800">${esc(moneyShort(al.principal))}</span>
                        <span class="tag ${cls}" style="font-size:9.5px">${esc(loanStatusLabel(al.status))}</span>
                      </div>`;
                  }).join('')}
                </div>` : ''}
            `;
          }

          return `
            <div class="field" style="margin-bottom:14px">
              <input id="wiz-cust-search" type="text" placeholder="${esc(t('customerSearch'))}" value="${esc(searchState.q)}">

            <div class="customer-pick" id="wiz-cust-list">${rows}</div>
            ${ctxHtml}
          `;
        },
        validate: (d) => {
          if (!d.customerId) return t('chooseCustomer');
          const c = customerById(d.customerId);
          if (!c) return t('chooseCustomer');
          const maxPer = APP.settings.maxLoansPerCustomer;
          const n = isEdit ? countActiveOrPending(c, l0.id) : countActiveOrPending(c);
          if (n >= maxPer) {
            const blocking = activeOrPendingLoans(c, isEdit ? l0.id : null);
            const lines = blocking.slice(0, 3).map(al =>
              `${al.serialNumber || al.loanNumber || '—'} · ${loanTypeLabel(al.loanType)} · ${moneyShort(al.principal)} · ${loanStatusLabel(al.status)}`
            ).join('  |  ');
            return `${t('maxLoansReached').replace('{max}', maxPer)}${lines ? '  —  ' + lines : ''}`;
          }
          return null;
        },
        after: (root, data, refresh) => {
          const s = root.querySelector('#wiz-cust-search');

            const list = root.querySelector('#wiz-cust-list');

            const q = searchState.q.toLowerCase();
            list.querySelectorAll('.customer-pick__item').forEach(el => {

              const show = !q || name.includes(q) || code.includes(q) || meta.includes(q);

              data.customerId = el.dataset.customerCode;
              refresh();

          });
        }

      /* ---------- LOAN DETAILS ---------- */

        label: t('stepDetails'), title: t('stepDetailsTitle'),

          const { interest, total, monthly, type } = calcLoan(
            d.principal, d.interestRate, d.duration, d.interestType
          );
          const typeOptions = LOAN_TYPES.map(lt =>
            `<option value="${esc(lt.code)}" ${d.loanType === lt.code ? 'selected' : ''}>${esc(lt.name)}</option>`

          ).join('');

                <div class="guarantee-chip">
                  <div class="guarantee-chip__main">
                    <div class="guarantee-chip__name">${esc(g.name || '—')}
                      <span class="guarantee-chip__type">${esc(g.type || 'other')}</span></div>
                    <div class="guarantee-chip__meta">
                      ${g.value ? `Value: ${esc(money(g.value))} · ` : ''}
                      ${g.contact ? `Contact: ${esc(g.contact)}` : ''}
                      ${g.description ? ` · ${esc(g.description)}` : ''}
                    </div>
                  </div>
                  <button type="button" class="guarantee-chip__del" data-guarantee-del="${i}">
                    <i class="fas fa-times"></i>
                  </button>
                </div>`).join('')
            : `<div style="font-size:12.5px;color:var(--muted);padding:8px 0">${esc(t('guaranteesHint'))}</div>`;
          return `
            <div class="field-row-3">
              <div class="field"><label class="field__required">${esc(t('loanTypeLabel'))}</label>
                <select data-field="loanType">${typeOptions}</select>

              <div class="field"><label class="field__required">${esc(t('interestTypeLabel'))}</label>
                <select data-field="interestType" id="wiz-itype">${itypeOptions}</select>
                <p class="field__hint" id="wiz-itype-hint">${esc(interestTypeHint(d.interestType))}</p>
              </div>
              <div class="field"><label>${esc(t('statusLabel'))}</label>
                <select data-field="status">
                  <option value="pending"   ${d.status === 'pending'   ? 'selected' : ''}>${esc(t('statusPending'))}</option>
                  <option value="approved"  ${d.status === 'approved'  ? 'selected' : ''}>${esc(t('statusApproved'))}</option>
                  <option value="active"    ${d.status === 'active'    ? 'selected' : ''}>${esc(t('statusActive'))}</option>
                  <option value="repaid"    ${d.status === 'repaid'    ? 'selected' : ''}>${esc(t('statusRepaid'))}</option>
                  <option value="defaulted" ${d.status === 'defaulted' ? 'selected' : ''}>${esc(t('statusDefaulted'))}</option>
                  <option value="rejected"  ${d.status === 'rejected'  ? 'selected' : ''}>${esc(t('statusRejected'))}</option>
                </select>
              </div>
            </div>

              <div class="field"><label class="field__required">${esc(t('principalLabel'))}</label>
                <input id="wiz-principal" data-field="principal" type="number" min="0" step="0.01"
                       class="amount-input" value="${esc(d.principal || '')}" placeholder="0.00"></div>
              <div class="field"><label class="field__required">${esc(t('rateLabel'))}</label>
                <input id="wiz-rate" data-field="interestRate" type="number" min="0" step="0.01"
                       class="amount-input" value="${esc(d.interestRate || '')}" placeholder="10"></div>
              <div class="field"><label class="field__required">${esc(t('durationLabel'))}</label>
                <input id="wiz-duration" data-field="duration" type="number" min="1" step="1"
                       class="amount-input" value="${esc(d.duration || '')}" placeholder="12"></div>
            </div>
            <div class="loan-preview">
              <div class="loan-preview__cell">

                <div class="loan-preview__value" style="font-size:13px;color:#0b5cab">${esc(interestTypeLabel(type))}</div>
              </div>
              <div class="loan-preview__cell">
                <div class="loan-preview__label">${esc(t('interestAmount'))}</div>
                <div class="loan-preview__value is-warn">${esc(money(interest))}</div>
              </div>
              <div class="loan-preview__cell">
                <div class="loan-preview__label">${esc(t('totalPayable'))}</div>
                <div class="loan-preview__value">${esc(money(total))}</div>
              </div>
              <div class="loan-preview__cell">
                <div class="loan-preview__label">${esc(t('monthlyPayment'))}</div>
                <div class="loan-preview__value is-danger">${esc(money(monthly))}</div>
              </div>
            </div>
            <div class="field-row">
              <div class="field"><label class="field__required">${esc(t('disbursementDateLabel'))}</label>

              <div class="field"><label>${esc(t('maturityDateLabel'))}</label>
                <input data-field="maturityDate" id="wiz-matdate" type="date" value="${esc(d.maturityDate || '')}"></div>

            <div class="field"><label>${esc(t('purposeLabel'))}</label>
              <textarea data-field="purpose" placeholder="${esc(t('purposePlaceholder'))}">${esc(d.purpose || '')}</textarea></div>
            <div class="field"><label>${esc(t('collateralLabel'))}</label>
              <textarea data-field="collateral" placeholder="${esc(t('collateralPlaceholder'))}">${esc(d.collateral || '')}</textarea></div>
            <div class="field">
              <label class="field__required">${esc(t('guaranteesLabel'))}</label>
              <div class="guarantee-wrap" id="wiz-guarantee-list">${guaranteesHtml}</div>
              <button type="button" class="guarantee-add-btn" id="wiz-guarantee-add">
                <i class="fas fa-plus-circle"></i> ${esc(t('addGuarantee'))}
              </button>
            </div>
            <div class="field">
              <label>${esc(t('receiptPhoto'))}</label>
              <div class="receipt-upload ${d._attachment ? 'has-img' : ''}" id="wiz-receipt-upload">
                <div class="receipt-upload__preview">
                  ${d._attachment ? `<img src="${esc(d._attachment)}" alt="">` : ''}
                  <i class="fas fa-file-invoice"></i>
                </div>
                <div class="receipt-upload__main">
                  <div class="receipt-upload__title">
                    ${d._attachment ? esc(t('receiptAdded')) : esc(t('receiptTitle'))}
                  </div>
                  <div class="receipt-upload__hint">${esc(t('receiptHint'))}</div>
                </div>
                <button type="button" class="btn btn--sm" id="wiz-receipt-btn">
                  <i class="fas fa-camera"></i> ${d._attachment ? esc(t('receiptReplace')) : esc(t('upload'))}

                ${d._attachment ? `<button type="button" class="btn btn--sm" id="wiz-receipt-clear" style="color:var(--danger);border-color:#fecdca">

          if (num(d.interestRate) < 0 || !isFinite(num(d.interestRate))) return t('invalidRate');
          if (num(d.duration) < 1) return t('invalidDuration');
          if (!d.loanType) return t('loanTypeRequired');
          if (!d.interestType) return t('interestTypeRequired');
          if (!guarantees.length) return t('guaranteesRequired');
          return null;
        },
        after: (root, data, refresh) => {
          const principalIn = root.querySelector('#wiz-principal');
          const rateIn = root.querySelector('#wiz-rate');
          const durIn = root.querySelector('#wiz-duration');
          const disbIn = root.querySelector('#wiz-disbdate');
          const matIn = root.querySelector('#wiz-matdate');
          const itypeSel = root.querySelector('#wiz-itype');
          const itypeHint = root.querySelector('#wiz-itype-hint');
          let timer = null;
          const recalc = () => {
            data.principal = principalIn.value;
            data.interestRate = rateIn.value;
            data.duration = durIn.value;
            data.interestType = itypeSel?.value || data.interestType;
            clearTimeout(timer);
            timer = setTimeout(refresh, 350);
          };
          principalIn?.addEventListener('input', recalc);
          rateIn?.addEventListener('input', recalc);
          durIn?.addEventListener('input', () => {
            data.duration = durIn.value;
            if (disbIn && matIn) {
              const mat = computeMaturityDate(disbIn.value, durIn.value);
              if (mat) { matIn.value = mat; data.maturityDate = mat; }
            }
            recalc();
          });
          disbIn?.addEventListener('change', () => {
            data.disbursementDate = disbIn.value;
            if (matIn && durIn) {
              const mat = computeMaturityDate(disbIn.value, durIn.value);
              if (mat) { matIn.value = mat; data.maturityDate = mat; }
            }
          });
          matIn?.addEventListener('change', () => { data.maturityDate = matIn.value; });
          itypeSel?.addEventListener('change', () => {
            data.interestType = itypeSel.value;
            if (itypeHint) itypeHint.textContent = interestTypeHint(itypeSel.value);
            recalc();
          });

          root.querySelectorAll('[data-guarantee-del]').forEach(b => {
            b.addEventListener('click', (e) => {
              e.stopPropagation();
              guarantees.splice(Number(b.dataset.guaranteeDel), 1);
              refresh();
            });
          });

          const addBtn = root.querySelector('#wiz-guarantee-add');
          const gList  = root.querySelector('#wiz-guarantee-list');
          addBtn?.addEventListener('click', () => {
            if (root.querySelector('#wiz-guarantee-form')) return;
            const form = document.createElement('div');
            form.className = 'guarantee-form';
            form.id = 'wiz-guarantee-form';
            form.innerHTML = `
              <div class="field-row-3" style="margin-bottom:10px">
                <div class="field" style="margin-bottom:0">
                  <label>${esc(t('guaranteeTypeLabel'))}</label>
                  <select id="wiz-gtype">${GUARANTEE_TYPES.map(g => `<option value="${esc(g.code)}">${esc(g.name)}</option>`).join('')}</select>
                </div>
                <div class="field" style="margin-bottom:0">
                  <label class="field__required">${esc(t('guaranteeNameLabel'))}</label>
                  <input id="wiz-gname" placeholder="e.g., John Doe">
                </div>
                <div class="field" style="margin-bottom:0">
                  <label class="field__required">${esc(t('guaranteeValueLabel'))}</label>
                  <input id="wiz-gvalue" type="number" min="0" step="0.01" placeholder="50000">

                </span></div>

    onFinish: async (d) => {
      const c = customerById(d.customerId);
      if (!c) throw new Error('Customer no longer exists.');
      const principal = num(d.principal);
      if (principal <= 0) throw new Error(t('invalidAmount'));
      const rate = num(d.interestRate);
      if (rate < 0) throw new Error(t('invalidRate'));
      const months = Math.floor(num(d.duration));
      if (months < 1) throw new Error(t('invalidDuration'));
      if (!guarantees.length) throw new Error(t('guaranteesRequired'));
      const interestType = d.interestType || 'simple';

      /* --- Duplicate active/pending guard (hard) --- */
      const maxPer = APP.settings.maxLoansPerCustomer;
      const existingCount = isEdit
        ? countActiveOrPending(c, l0.id)
        : countActiveOrPending(c);
      const incomingStatus = String(d.status || 'pending').toLowerCase();
      const countsTowardLimit = ['pending','active','approved'].includes(incomingStatus);
      if (countsTowardLimit && existingCount >= maxPer) {
        const blocking = activeOrPendingLoans(c, isEdit ? l0.id : null);
        const lines = blocking.slice(0, 3).map(al =>
          `${al.serialNumber || al.loanNumber || '—'} (${loanTypeLabel(al.loanType)}, ${loanStatusLabel(al.status)}, ${moneyShort(al.principal)})`
        ).join(' · ');
        throw new Error(
          `${t('maxLoansReached').replace('{max}', maxPer)}` +
          (lines ? ` — ${lines}` : '')
        );
      }

      const { total } = calcLoan(principal, rate, months, interestType);
      const status = d.status || 'pending';
      const userName = APP.profile?.fullName || APP.profile?.name || APP.user?.email || 'User';

      const payload = {
        customerId: c.customerId || c.id,
        memberId: c.customerId || c.id,
        customerDocId: c.id,
        customerName: customerName(c),
        loanType: d.loanType || 'personal',
        interestType,
        principal,
        interestRate: rate,
        duration: months,
        totalPayable: total,
        purpose: (d.purpose || '').trim(),
        collateral: (d.collateral || '').trim(),
        guarantees,
        disbursementDate: d.disbursementDate || new Date().toISOString().slice(0,10),
        maturityDate: d.maturityDate || computeMaturityDate(d.disbursementDate, months),
        status,
        reference: (d.reference || '').trim(),
        notes: (d.notes || '').trim(),
        attachment: d._attachment || null,
        districtId: c.districtId || null,
        districtName: c.districtName || districtById(c.districtId)?.name || null,
        branchId: c.branchId || null,
        branchName: c.branchName || branchById(c.branchId)?.name || null,
        updatedAt: serverTimestamp()
      };

      if (status === 'approved' || status === 'active') {
        if (isEdit) {
          if (!l0.approvedByName) {
            payload.approvedBy = APP.profile.id;
            payload.approvedByName = userName;
            payload.approvedAt = serverTimestamp();
          }
        } else {
          payload.approvedBy = APP.profile.id;
          payload.approvedByName = userName;
          payload.approvedAt = serverTimestamp();
        }
        if (status === 'active') payload.loanProgress = 'agreement_on_progress';
      } else {
        payload.approvedBy = null;
        payload.approvedByName = null;
      }

      if (isEdit) {
        payload.serialNumber = l0.serialNumber || generateSerialNumber();
        payload.loanNumber = l0.loanNumber || payload.serialNumber;
        await updateDoc(doc(db, 'loans', l0.id), payload);
      } else {
        payload.serialNumber = generateSerialNumber();
        payload.loanNumber = payload.serialNumber;
        payload.amountRepaid = 0;
        payload.createdAt = serverTimestamp();
        payload.createdBy = APP.profile.id;
        payload.createdByName = userName;
        payload.printCount = 0;
        payload.printStatus = 'not_printed';
        await setDoc(doc(collection(db, 'loans')), payload);
      }
    }
  });
}

      });

        amount: amt,
        principalPortion,
        interestPortion,
        loanId: l.id,
        loanNumber: l.serialNumber || l.loanNumber || '',
        customerId: c?.customerId || l.customerId,
        memberId: c?.customerId || l.customerId,

        reference: (root.querySelector('#rp-ref').value || '').trim(),
        notes: (root.querySelector('#rp-notes').value || '').trim(),
        status: 'approved',
        balanceAfter: newOutstanding,
        districtId: c?.districtId || l.districtId || null,
        districtName: c?.districtName || l.districtName || null,
        branchId: c?.branchId || l.branchId || null,
        branchName: c?.branchName || l.branchName || null,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        createdBy: APP.profile.id,

        printStatus: 'not_printed'

      toast(t('repaymentOk'), 'success');

    }

/* ============ NUMBER TO WORDS ============ */
const ONES = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
  'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen',
  'Eighteen','Nineteen'];
const TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function numberToWords(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'Zero';
  const chunk = (x) => {
    let s = '';
    if (x >= 100) { s += ONES[Math.floor(x/100)] + ' Hundred'; x %= 100; if (x) s += ' '; }
    if (x >= 20) { s += TENS[Math.floor(x/10)]; x %= 10; if (x) s += '-' + ONES[x]; }
    else if (x > 0) s += ONES[x];
    return s;
  };
  const units = [
    { v: 1e9, n: 'Billion' }, { v: 1e6, n: 'Million' },
    { v: 1e3, n: 'Thousand' }, { v: 1, n: '' }
  ];
  const parts = [];
  for (const u of units) {
    if (n >= u.v) {
      const c = Math.floor(n / u.v);
      n %= u.v;
      parts.push(chunk(c) + (u.n ? ' ' + u.n : ''));
    }
  }
  return parts.join(' ').replace(/\s+/g, ' ').trim();
}
function amountInWords(amount, currency) {
  const n = Number(amount) || 0;
  const birr = Math.floor(n);
  const cents = Math.round((n - birr) * 100);
  let s = numberToWords(birr) + ' ' + (currency || 'ETB');
  if (cents > 0) s += ' and ' + numberToWords(cents) + ' Cents';
  return s + ' Only';
}

async function printSlip(l) {
  if (!l) return;
  if (!canPrint()) { toast(t('noPermission'), 'error'); return; }

  const prevCount = Number(l.printCount || 0);
  const newCount = prevCount + 1;
  const watermarkText = newCount === 1 ? t('original') : t('copy');

  let serial = l.serialNumber;
  if (!serial) {
    serial = generateSerialNumber();
    try {
      await updateDoc(doc(db, 'loans', l.id), { serialNumber: serial, loanNumber: serial });
      l.serialNumber = serial;
      l.loanNumber = serial;
    } catch (e) { console.warn('[serial backfill]', e); }
  }

  try {
    await updateDoc(doc(db, 'loans', l.id), {
      printCount: newCount,
      printStatus: 'printed',
      lastPrintedAt: serverTimestamp(),
      lastPrintedBy: APP.profile.id,
      lastPrintedByName: APP.profile.fullName || APP.profile.name || ''
    });
    l.printCount = newCount;
    l.printStatus = 'printed';
    l.lastPrintedByName = APP.profile.fullName || APP.profile.name || '';
    l.lastPrintedAt = new Date();
    if (newCount === 1) toast(t('firstPrint'), 'info');
    else toast(t('reprint') + ' ×' + newCount, 'warning');
  } catch (e) {
    console.warn('[print update]', e);
    toast(t('printError'), 'error');
  }

  closeSlipOverlay();
  const host = document.getElementById('slip-print-host');
  host.innerHTML = buildSlipHtml(l, watermarkText);
  const overlay = document.createElement('div');
  overlay.className = 'slip-overlay';
  overlay.id = 'slip-overlay';
  overlay.innerHTML = `
    <div class="slip-toolbar">
      <div class="slip-toolbar__title">
        <i class="fas fa-file-invoice" style="color:var(--primary)"></i>
        ${esc(t('slipPreview'))}
        <span class="tag ${newCount === 1 ? 'tag--print-orig' : 'tag--print-copy'}" style="margin-left:6px">
          ${esc(watermarkText)}
        </span>
      </div>
      <button class="primary" id="slip-print-btn">
        <i class="fas fa-print"></i> ${esc(t('printSlip'))}
      </button>
      <button id="slip-close-btn">
        <i class="fas fa-times"></i> Close
      </button>
    </div>
    ${buildSlipHtml(l, watermarkText)}
  `;
  document.body.appendChild(overlay);
  document.getElementById('slip-print-btn').addEventListener('click', () => {
    const h = document.getElementById('slip-print-host');
    h.innerHTML = buildSlipHtml(l, watermarkText);
    setTimeout(() => window.print(), 60);
  });
  document.getElementById('slip-close-btn').addEventListener('click', closeSlipOverlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSlipOverlay(); });
  escHandler = (e) => { if (e.key === 'Escape') closeSlipOverlay(); };
  document.addEventListener('keydown', escHandler);
}
function closeSlipOverlay() {
  const el = document.getElementById('slip-overlay');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
  const host = document.getElementById('slip-print-host');
  if (host) host.innerHTML = '';
}
