<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deposits — Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-lg:20px;--r-full:999px;
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.09),transparent 35%),
             radial-gradient(circle at 90% 80%,rgba(25,169,116,.09),transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar::before{content:"";position:absolute;width:450px;height:450px;border-radius:50%;border:1px solid rgba(255,255,255,.10);right:-220px;top:-150px;pointer-events:none;}
.sidebar__brand{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:22px;border-bottom:1px solid rgba(255,255,255,.10);min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 10px 24px rgba(0,0,0,.18);display:grid;place-items:center;padding:5px;overflow:hidden;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;opacity:1;transition:opacity .18s ease 60ms;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);border:3px solid var(--bg);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.15);z-index:10;cursor:pointer;}
.sidebar__collapse i{font-size:10px;font-weight:900;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{position:relative;z-index:2;flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;font-size:14px;font-weight:600;color:rgba(255,255,255,.78);margin-bottom:3px;transition:background .15s, color .15s;white-space:nowrap;cursor:pointer;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;flex-shrink:0;text-align:center;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{position:relative;z-index:2;padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap;}
.sidebar__logout i{width:20px;font-size:15px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;border-radius:var(--r-full);background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 20px;margin-bottom:22px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
html.theme-dark .breadcrumb{background:#0f172a;border-color:#1e293b;}
.breadcrumb span.crumb{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb span.crumb.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb span.crumb.is-link{cursor:pointer;}
.breadcrumb span.crumb.is-link:hover{background:#dbeafe;color:var(--primary);}
.breadcrumb span.arrow{color:#cbd5e1;font-weight:400;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .stat{background:#0f172a;border-color:#1e293b;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue{--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green{--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--gold{--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#6d28d9,#a78bfa);--ic:#f0eaff;--ifc:#5b21b6;}
.stat--orange{--c1:linear-gradient(90deg,#e65100,#f57c00);--ic:#fff1e6;--ifc:#bf360c;}
.stat__head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px;}
.stat__label{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.35;}
.stat__icon{width:44px;height:44px;border-radius:13px;background:var(--ic);color:var(--ifc);display:grid;place-items:center;flex-shrink:0;font-size:18px;}
.stat__value{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--text);word-break:break-word;}
.stat__hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;}
html.theme-dark .card{background:#0f172a;border-color:#1e293b;}
.card__head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:340px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;color:var(--text);}
html.theme-dark .toolbar__search input{background:#1a2433;border-color:#1e293b;color:#e4e8f0;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:11px;background:#fff;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;min-width:140px;font-family:inherit;}
html.theme-dark .toolbar select{background:#1a2433;border-color:#1e293b;color:#e4e8f0;}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:13px;border:1px solid #d9dee7;background:#fff;color:var(--text-soft);font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;min-width:1180px;}
.tbl thead th{background:#f8fafc;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:13px 20px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
html.theme-dark .tbl thead th{background:#0b1220;}
.tbl tbody td{padding:14px 20px;border-bottom:1px solid var(--border-soft);font-size:13px;color:var(--text-soft);vertical-align:middle;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:#f8fafc;}
html.theme-dark .tbl tbody tr:hover td{background:#111a2c;}
.tbl td.num{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
.tbl .name{font-weight:800;color:var(--text);}
.tbl .muted{font-size:11.5px;color:var(--muted);}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r-full);font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
.tag--green{background:#e7f7f0;color:#067647;}
.tag--red{background:#fef3f2;color:#b42318;}
.tag--gold{background:#fdf5e0;color:#b8860b;}
.tag--blue{background:#eaf3fc;color:#0b5cab;}
.tag--gray{background:#eef1f5;color:#566075;}
.tag--violet{background:#f0eaff;color:#5b21b6;}
.tag--teal{background:#e0f5f7;color:#0e7490;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
.row-actions button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-soft);background:var(--bg-soft);border:1px solid var(--border);transition:.15s;font-size:13px;}
.row-actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.row-actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.row-actions button.approve:hover{background:var(--success);border-color:var(--success);}
.row-actions button.print:hover{background:#b8860b;border-color:#b8860b;}
.empty{padding:56px 24px;text-align:center;}
.empty i{font-size:44px;color:#cbd5e1;margin-bottom:14px;}
.empty__title{font-size:16px;font-weight:800;margin-bottom:6px;}
.empty__text{font-size:13.5px;color:var(--muted);max-width:420px;margin:0 auto;line-height:1.6;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--border-soft);gap:14px;flex-wrap:wrap;}
.pagination__info{font-size:12.5px;color:var(--muted);font-weight:600;}
.pagination__controls{display:flex;gap:6px;align-items:center;}
.pagination__controls button{height:34px;padding:0 12px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--text-soft);transition:.15s;min-width:34px;}
.pagination__controls button:hover:not(:disabled){background:var(--bg-soft);border-color:var(--primary);color:var(--primary);}
.pagination__controls button:disabled{opacity:.4;cursor:not-allowed;}
.pagination__controls button.is-current{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-color:transparent;}
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;overflow-y:auto;}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:0 30px 60px rgba(20,40,70,.12);width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;margin:auto;}
html.theme-dark .modal{background:#0f172a;}
.modal--lg{max-width:760px;}
.modal__head{padding:24px 28px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.modal__title{font-size:20px;font-weight:800;letter-spacing:-.4px;}
.modal__sub{font-size:13.5px;color:var(--muted);margin-top:6px;}
.modal__close{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex-shrink:0;}
.modal__close:hover{background:var(--border-soft);}
.modal__body{padding:24px 28px;overflow-y:auto;flex:1;}
.modal__foot{padding:18px 28px;border-top:1px solid var(--border-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;position:relative;}
.field > label{font-size:13px;font-weight:700;color:var(--text-soft);}
.field__required::after{content:" *";color:var(--danger);}

html.theme-dark .field input:focus,html.theme-dark .field select:focus,html.theme-dark .field textarea:focus{background:#0b1220;}
.field__hint{font-size:12px;color:var(--muted);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

.alert{display:flex;gap:12px;padding:13px 16px;border-radius:11px;font-size:13px;line-height:1.55;margin-bottom:18px;border:1px solid transparent;}
.alert i{font-size:16px;flex-shrink:0;margin-top:2px;}
.alert--warning{background:#fdf5e0;color:#7a5210;border-color:#f0dcb0;}
.alert--info{background:#eaf3fc;color:#0b5cab;border-color:#bdd7f2;}
.suggestions{position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-lg);max-height:240px;overflow-y:auto;display:none;}

.suggestions div{padding:11px 16px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--border-soft);color:var(--text);transition:.15s;}
.suggestions div:last-child{border-bottom:none;}
.suggestions div:hover{background:var(--bg-soft);color:var(--primary);}
.view-row{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.view-row:last-child{border-bottom:none;}
.view-row .k{color:var(--muted);width:170px;flex-shrink:0;font-weight:700;}
.view-row .v{font-weight:600;word-break:break-word;flex:1;}
.toasts{position:fixed;top:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 48px);}
.toast{background:var(--text);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 12px 32px rgba(20,40,70,.2);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:12px;pointer-events:auto;animation:toastIn .22s cubic-bezier(.4,0,.2,1);max-width:400px;}

.toast--success{background:#067647;}

.toast--warning{background:#b8860b;}
.toast--info{background:#0b5cab;}
.toast i{font-size:16px;flex-shrink:0;}

const toDateSafe = (v) => {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v)?null:v;
  if (typeof v.toDate === 'function') { try { return v.toDate(); } catch(e){} }
  if (typeof v === 'object' && v.seconds != null) return new Date(v.seconds*1000);
  if (typeof v === 'number') { const d = new Date(v); return isNaN(d)?null:d; }
  const d = new Date(v); return isNaN(d)?null:d;
};

function toast(msg, type='success') {
  const wrap = document.getElementById('toast-container'); if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  const icons = {success:'fa-check-circle',error:'fa-exclamation-circle',warning:'fa-exclamation-triangle',info:'fa-info-circle'};
  el.innerHTML = `<i class="fas ${icons[type]||'fa-info-circle'}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; }, 3800);
  setTimeout(() => el.remove(), 4200);
}

/* ============================================================
   SESSION TIMER
   ============================================================ */
let SESSION_TIMEOUT_MINUTES = 5;
let SESSION_TIMEOUT = SESSION_TIMEOUT_MINUTES * 60 * 1000;
let SESSION_WARNING_TIMEOUT = Math.max(SESSION_TIMEOUT - 30 * 1000, SESSION_TIMEOUT * 0.9);
let sessionTimer = null, sessionWarningTimer = null, sessionWarningToast = null, sessionCountdownInterval = null;
let sessionTimerStarted = false;
const SESSION_EVENTS = ['mousemove','click','keydown','scroll','touchstart'];

function sessionResetTimer() {
  if (sessionTimer) clearTimeout(sessionTimer);
  if (sessionWarningTimer) clearTimeout(sessionWarningTimer);
  if (sessionCountdownInterval) clearInterval(sessionCountdownInterval);
  if (sessionWarningToast) { sessionWarningToast.remove(); sessionWarningToast = null; }
  sessionWarningTimer = setTimeout(sessionShowWarning, SESSION_WARNING_TIMEOUT);
  sessionTimer = setTimeout(sessionForceLogout, SESSION_TIMEOUT);
}
function sessionShowWarning() {
  let seconds = 30;
  sessionWarningToast = document.createElement('div');
  sessionWarningToast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#b8860b;color:#fff;padding:16px 24px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.2);z-index:99999;max-width:520px;text-align:center;display:flex;align-items:center;gap:12px;`;
  sessionWarningToast.innerHTML = `<i class="fas fa-clock"></i> <span id="sessionWarningText">${t('sessionExpiring',{n:seconds})}</span>`;
  document.body.appendChild(sessionWarningToast);
  sessionCountdownInterval = setInterval(() => {
    seconds--;
    const textEl = document.getElementById('sessionWarningText');
    if (textEl) textEl.textContent = t('sessionExpiring',{n:seconds});
    if (seconds <= 0) clearInterval(sessionCountdownInterval);
  }, 1000);
}
function sessionForceLogout() {
  if (sessionCountdownInterval) clearInterval(sessionCountdownInterval);
  if (sessionWarningToast) { sessionWarningToast.remove(); sessionWarningToast = null; }
  if (auth) auth.signOut().then(() => window.location.href = LOGIN_URL).catch(() => window.location.href = LOGIN_URL);
  else window.location.href = LOGIN_URL;
}
function sessionHandleActivity() { sessionResetTimer(); }
function startSessionTimer() {
  if (sessionTimerStarted) return;
  sessionTimerStarted = true;
  SESSION_EVENTS.forEach(evt => document.addEventListener(evt, sessionHandleActivity));
  sessionResetTimer();
}
function applySessionSettings() {
  SESSION_TIMEOUT = SESSION_TIMEOUT_MINUTES * 60 * 1000;
  SESSION_WARNING_TIMEOUT = Math.max(SESSION_TIMEOUT - 30 * 1000, SESSION_TIMEOUT * 0.9);
  if (sessionTimerStarted) sessionResetTimer();
}
async function loadSessionTimeoutFromSettings() {
  try {
    const doc = await db.collection('settings').doc('system').get();
    if (doc.exists) {
      const d = doc.data();
      let m = 5;
      if (d.sessionTimeout != null) m = Number(d.sessionTimeout);
      else if (d.sessionTimeoutMinutes != null) m = Number(d.sessionTimeoutMinutes);
      if (!isFinite(m) || m < 1) m = 1;
      if (m > 1440) m = 1440;
      SESSION_TIMEOUT_MINUTES = Math.round(m);
    }
  } catch(e){}
  applySessionSettings();
}

function numberToWords(n) {
  if (n === 0) return 'Zero';
  const units = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const th = ['','Thousand','Million','Billion','Trillion'];
  function h(x){let r='';if(x>=100){r+=units[Math.floor(x/100)]+' Hundred ';x%=100;}if(x>=20){r+=tens[Math.floor(x/10)]+' ';x%=10;}if(x>0)r+=units[x]+' ';return r.trim();}
  if (n<0) return 'Minus '+numberToWords(-n);
  let w='',c=0;
  while(n>0){const ch=n%1000;if(ch!==0){const cw=h(ch);w=cw+(th[c]?' '+th[c]+' ':' ')+w;}n=Math.floor(n/1000);c++;}
  return w.trim()||'Zero';
}

function doLogout() {
  if (sessionCountdownInterval) clearInterval(sessionCountdownInterval);
  if (sessionTimer) clearTimeout(sessionTimer);
  if (sessionWarningTimer) clearTimeout(sessionWarningTimer);
  auth.signOut().catch(()=>{}).finally(() => window.location.href = LOGIN_URL);
}
function setLang(lang) {
  if (!['en','am','om'].includes(lang)) lang = 'en';
  LANG = lang;
  try { localStorage.setItem('sacco.lang', lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

function renderContent() {
  const host = document.getElementById('contentHost'); if (!host) return;
  const list = filteredDeposits;
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageList = list.slice(start, start + PAGE_SIZE);

  if (!total) {
    const filtered = searchQuery || filterYear !== 'all';
    host.innerHTML = `<div class="empty"><i class="fas ${filtered ? 'fa-search' : 'fa-vault'}"></i>

  }

  host.innerHTML = `
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>#</th>
        <th>${esc(t('customer'))}</th>
        <th>${esc(t('incomeType'))}</th>
        <th class="num">${esc(t('amount'))}</th>
        <th>${esc(t('method'))}</th>
        <th>${esc(t('description'))}</th>
        <th>${esc(t('status'))}</th>
        <th>${esc(t('date'))}</th>
        <th>${esc(t('by'))}</th>
        <th class="num">${esc(t('actions'))}</th>
      </tr></thead>
      <tbody>
        ${pageList.map((d, i) => {
          const isSacco = !d.customerId || d.isSaccoIncome;
          const cust = d.customerId ? customersList.find(c => c.id === d.customerId) : null;
          const custName = cust ? cust.fullName : (d.customerName || t('saccIncome'));
          const custCell = isSacco
            ? `<span class="tag tag--teal"><i class="fas fa-vault"></i> ${esc(t('saccIncome'))}</span>`
            : `<div><div class="name">${esc(custName)}</div><div class="muted">${esc(cust?.customerId || d.customerIdCustom || '')}</div></div>`;
          const st = String(d.status || 'pending').toLowerCase();
          const stCls = st === 'approved' ? 'tag--green' : st === 'completed' || st === 'done' || st === 'paid' ? 'tag--blue' : st === 'printed' ? 'tag--gold' : 'tag--gold';
          const stLabel = st === 'approved' ? t('approved') : st === 'printed' ? t('printed') : st === 'completed' ? t('completed') : t('pending');
          const methodMap = {cash:t('cash'),bank:t('bankTransfer'),mobile:t('mobileMoney')};
          const by = d.createdByName || d.createdBy || d.createdByEmail || '—';
          const byName = by.includes('@') ? by.split('@')[0] : by;
          return `<tr>
            <td>${start + i + 1}</td>
            <td>${custCell}</td>
            <td><span class="tag tag--violet">${esc(d.incomeType || 'Other')}</span></td>
            <td class="num">${esc(money(d.amount))}</td>
            <td><span class="tag tag--gray" style="font-size:10px;">${esc(methodMap[d.paymentMethod] || d.paymentMethod || 'Cash')}</span></td>
            <td>${esc(d.note || d.description || '—')}</td>
            <td><span class="tag ${stCls}">${esc(stLabel)}</span></td>
            <td>${esc(fmtDate(d.date || d.createdAt))}</td>
            <td>${esc(byName)}</td>
            <td class="num"><div class="row-actions">
              <button title="${esc(t('rowView'))}" data-action="view" data-id="${esc(d.id)}"><i class="fas fa-eye"></i></button>
              ${canPrintDeposit() ? `<button class="print" title="${esc(t('rowPrint'))}" data-action="print" data-id="${esc(d.id)}"><i class="fas fa-print"></i></button>` : ''}
              ${canApproveDeposit() && st === 'pending' ? `<button class="approve" title="${esc(t('rowApprove'))}" data-action="approve" data-id="${esc(d.id)}"><i class="fas fa-check"></i></button>` : ''}
              ${canEditDeposit() ? `<button title="${esc(t('rowEdit'))}" data-action="edit" data-id="${esc(d.id)}"><i class="fas fa-pen"></i></button>` : ''}
              ${canDeleteDeposit() ? `<button class="danger" title="${esc(t('rowDelete'))}" data-action="delete" data-id="${esc(d.id)}"><i class="fas fa-trash"></i></button>` : ''}
            </div></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
    <div class="pagination">
      <div class="pagination__info">${esc(t('showing'))} <strong>${start+1}–${start+pageList.length}</strong> ${esc(t('of'))} <strong>${total}</strong> ${esc(t('depositsWord'))}</div>
      <div class="pagination__controls">
        <button data-page="${currentPage-1}" ${currentPage===1?'disabled':''}><i class="fas fa-chevron-left"></i></button>
        ${rangePages(currentPage, pages).map(p => `<button data-page="${p}" class="${p===currentPage?'is-current':''}">${p}</button>`).join('')}
        <button data-page="${currentPage+1}" ${currentPage===pages?'disabled':''}><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  `;
  host.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => handleRow(btn.dataset.action, btn.dataset.id)));
  host.querySelectorAll('[data-page]').forEach(btn => btn.addEventListener('click', () => {
    const p = Number(btn.dataset.page);
    if (p >= 1 && p <= pages) { currentPage = p; renderContent(); }
  }));
}
function rangePages(cur, total) {
  const arr = []; const start = Math.max(1, cur-2); const end = Math.min(total, start+4);
  for (let i = start; i <= end; i++) arr.push(i);
  return arr;
}

function wireMainEvents() {
  document.getElementById('addDepositBtn')?.addEventListener('click', () => openDepositModal(null));
  const s = document.getElementById('fltSearch');
  s?.addEventListener('input', debounce(() => { searchQuery = s.value; applyFilters(); }, 220));
  document.getElementById('fltYear')?.addEventListener('change', (e) => { filterYear = e.target.value; applyFilters(); });
}
let _deb;
function debounce(fn, ms){ return function(...a){ clearTimeout(_deb); _deb = setTimeout(()=>fn.apply(this,a), ms); }; }

function populateYearFilter() {
  const sel = document.getElementById('fltYear'); if (!sel) return;
  const years = new Set();
  allDeposits.forEach(d => {
    const dt = toDateSafe(d.date || d.createdAt);
    if (dt) years.add(dt.getFullYear());
  });
  const sorted = Array.from(years).sort((a,b)=>b-a);
  sel.innerHTML = `<option value="all">${esc(t('filterAllYears'))}</option>` + sorted.map(y=>`<option value="${y}">${y}</option>`).join('');
  sel.value = filterYear;
}
function applyFilters() {
  let list = [...allDeposits];
  const q = searchQuery.trim().toLowerCase();
  if (q) {
    list = list.filter(d => {
      const cust = d.customerId ? customersList.find(c => c.id === d.customerId) : null;
      const custName = cust ? cust.fullName : (d.customerName || '');
      return (custName || '').toLowerCase().includes(q)
        || (d.incomeType || '').toLowerCase().includes(q)
        || (d.note || d.description || '').toLowerCase().includes(q)
        || (d.ttNumber || '').toLowerCase().includes(q)
        || (d.paymentMethod || '').toLowerCase().includes(q);
    });
  }
  if (filterYear !== 'all') {
    const y = Number(filterYear);
    list = list.filter(d => {
      const dt = toDateSafe(d.date || d.createdAt);
      return dt && dt.getFullYear() === y;
    });
  }
  filteredDeposits = list;
  currentPage = 1;
  renderContent();
}

function handleRow(action, id) {
  const d = allDeposits.find(x => x.id === id); if (!d) return;
  if (action === 'view') openViewModal(d);
  if (action === 'edit') openDepositModal(d);
  if (action === 'delete') openDeleteModal(d);
  if (action === 'approve') approveDeposit(d);
  if (action === 'print') printDepositSlip(d);
}

function closeModal() { document.getElementById('modal-backdrop')?.remove(); }

function openModal(html) {
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop'; root.id = 'modal-backdrop';
  root.innerHTML = html;
  document.body.appendChild(root);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  return root;
}

          if (label.toLowerCase() === dep.bankName.toLowerCase()) { bankSel.value = opt.value; matched = true; break; }
        }
        if (!matched && dep.bankName) { bankSel.value = 'other'; bankOther.style.display = 'block'; bankOther.value = dep.bankName; }
      }
    }
  };
  root.querySelector('#depMethod').addEventListener('change', setupConditional);
  root.querySelector('#depBank').addEventListener('change', (e) => handleBankOtherToggle(e.target, root.querySelector('#depBankOther')));
  setupConditional();

  // Customer search
  const search = root.querySelector('#depCustSearch');
  const hidden = root.querySelector('#depCustId');
  const sugg = root.querySelector('#depCustSuggest');
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase().trim();
    if (!q) { hidden.value = ''; sugg.classList.remove('show'); return; }
    const matches = customersList.filter(c =>
      (c.fullName||'').toLowerCase().includes(q) || (c.customerId||'').toLowerCase().includes(q)
    ).slice(0, 8);
    if (!matches.length) { sugg.classList.remove('show'); return; }
    sugg.innerHTML = matches.map(c => `<div data-id="${esc(c.id)}" data-name="${esc(c.fullName)}" data-code="${esc(c.customerId||'')}">${esc(c.fullName)} <span style="color:var(--muted);font-size:11px">${esc(c.customerId||'')}</span></div>`).join('');
    sugg.classList.add('show');
    sugg.querySelectorAll('div').forEach(el => {
      el.addEventListener('click', () => {
        hidden.value = el.dataset.id;
        search.value = `${el.dataset.name} (${el.dataset.code})`;
        sugg.classList.remove('show');
      });
    });
  });
  search.addEventListener('blur', () => setTimeout(() => sugg.classList.remove('show'), 200));

  root.querySelector('#depSave').addEventListener('click', async () => {
    const customerId = hidden.value.trim();
    const incomeType = root.querySelector('#depIncomeType').value;
    const amount = num(root.querySelector('#depAmount').value);
    const dateVal = root.querySelector('#depDate').value;
    const method = root.querySelector('#depMethod').value;
    const ttNumber = root.querySelector('#depTT').value.trim();
    const transferDate = root.querySelector('#depTransferDate').value;
    const bankName = method === 'cash' ? '' : getFinalBankName(root.querySelector('#depBank'), root.querySelector('#depBankOther'));
    const description = root.querySelector('#depDesc').value.trim();

    if (!amount || amount <= 0) { toast(t('invalidAmount'), 'warning'); return; }
    if (!dateVal) { toast(t('pleaseDate'), 'warning'); return; }
    if (method !== 'cash') {
      if (!ttNumber) { toast(t('ttRequired'), 'warning'); return; }
      if (!transferDate) { toast(t('transferRequired'), 'warning'); return; }
      if (!bankName) { toast(t('bankRequired'), 'warning'); return; }
    }
    // Duplicate check only when a customer is selected
    if (method !== 'cash' && ttNumber && transferDate && customerId) {
      try {
        const parts = transferDate.split('-').map(Number);
        const startD = new Date(Date.UTC(parts[0],parts[1]-1,parts[2],0,0,0));
        const endD   = new Date(Date.UTC(parts[0],parts[1]-1,parts[2],23,59,59,999));
        const snap = await db.collection('transactions')
          .where('customerId','==',customerId).where('ttNumber','==',ttNumber)
          .where('transferDate','>=',startD).where('transferDate','<=',endD)
          .where('type','in',['savings','profit_income','repayment']).get();
        const dup = snap.docs.some(x => x.id !== dep?.id);
        if (dup) { root.querySelector('#depDupWarn').classList.remove('hidden'); toast(t('duplicateTT'), 'warning'); return; }
      } catch(e){}
    }

    const cust = customerId ? customersList.find(c => c.id === customerId) : null;
    const payload = {
      type: 'profit_income',
      transactionType: 'income',
      customerId: cust ? customerId : null,
      customerIdCustom: cust?.customerId || null,
      customerName: cust ? cust.fullName : t('saccIncome'),
      isSaccoIncome: !cust,
      incomeType, amount: round2(amount),
      date: new Date(dateVal),
      paymentMethod: method,
      ttNumber: method === 'cash' ? '' : ttNumber,
      bankName: method === 'cash' ? '' : bankName,
      note: description, description,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    payload.transferDate = (method !== 'cash' && transferDate) ? new Date(transferDate) : null;

    const btn = root.querySelector('#depSave');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spin" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;"></span> Saving…`;
    try {
      if (isEdit) {
        await db.collection('transactions').doc(dep.id).update(payload);
        toast(t('depositUpdated'), 'success');
      } else {
        payload.status = 'pending';
        payload.createdByName = currentUserName;
        payload.createdBy = currentUserId || currentUserName;
        payload.createdByEmail = auth.currentUser?.email || '';
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('transactions').add(payload);
        toast(t('depositRecorded'), 'success');
      }
      closeModal();
      await loadDeposits();
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.innerHTML = orig;
    }
  });
}

/* ---- Delete Modal ---- */
function openDeleteModal(d) {
  if (!canDeleteDeposit()) { toast('Unauthorized', 'error'); return; }
  const root = openModal(`
    <div class="modal" style="max-width:440px">
      <div class="modal__head">
        <div><div class="modal__title">${esc(t('deleteTitle'))}</div><div class="modal__sub">${esc(t('deleteText'))}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body">
        <div style="padding:14px;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px">
          <div style="font-weight:800;margin-bottom:4px">${esc(d.incomeType || 'Other')}</div>
          <div style="font-family:ui-monospace,monospace;font-weight:800;color:#067647;font-size:18px">${esc(money(d.amount))}</div>
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="delConfirm"><i class="fas fa-trash"></i> ${esc(t('confirm'))}</button>
      </div>
    </div>
  `);
  root.querySelector('#delConfirm').addEventListener('click', async () => {
    try {
      await db.collection('transactions').doc(d.id).delete();
      toast(t('depositDeleted'), 'success');
      closeModal();
      await loadDeposits();
    } catch(e) { toast(e.message, 'error'); }
  });
}

/* ---- Approve ---- */
async function approveDeposit(d) {
  if (!canApproveDeposit()) { toast('Unauthorized', 'error'); return; }
  if (!confirm(t('confirmApprove'))) return;
  try {
    await db.collection('transactions').doc(d.id).update({
      status: 'approved',
      approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      approvedBy: auth.currentUser?.uid || '',
      approvedByName: currentUserName
    });
    toast(t('approveSuccessMsg'), 'success');
    await loadDeposits();
  } catch(e) { toast(t('approvalErr') + e.message, 'error'); }
}

/* ---- Print Slip ---- */
async function printDepositSlip(d) {
  if (!canPrintDeposit()) { toast('Unauthorized', 'error'); return; }
  try {
    if (d.printed !== true) {
      await db.collection('transactions').doc(d.id).update({
        printed: true,
        printedAt: firebase.firestore.FieldValue.serverTimestamp(),
        printedBy: currentUserName
      });
      d.printed = true;
    }
  } catch(e){}
  const cust = d.customerId ? customersList.find(c => c.id === d.customerId) : null;
  const custName = cust ? cust.fullName : t('saccIncome');
  const methodMap = {cash:t('cash'),bank:t('bankTransfer'),mobile:t('mobileMoney')};
  const amount = num(d.amount);
  const amountWords = numberToWords(Math.floor(amount)) + ' ETB';

  const host = document.getElementById('slip-print-host');
  host.innerHTML = `
    <div class="slip">
      <div class="slip__head">
        <div class="slip__logo"><img src="${LOGO_URL}" alt=""></div>
        <div class="slip__brand">
          <div class="slip__sacco-name">WALDAA LIQII FI QUSANNAA GARASUU DHUKII</div>
          <div class="slip__sacco-sub">GERESU DHUKI SACCO · Tel: +251-91028-5252</div>
        </div>
      </div>
      <div class="slip__title">${esc(t('paymentReceipt'))}</div>
      <div class="slip__grid">
        <div>
          <div class="slip__kv"><span class="k">${esc(t('customer'))}</span><span class="v">${esc(custName)}</span></div>
          <div class="slip__kv"><span class="k">${esc(t('incomeType'))}</span><span class="v">${esc(d.incomeType || 'Other')}</span></div>
          <div class="slip__kv"><span class="k">${esc(t('methodLabel'))}</span><span class="v">${esc(methodMap[d.paymentMethod] || 'Cash')}</span></div>
        </div>
        <div>
          <div class="slip__kv"><span class="k">Receipt No.</span><span class="v" style="font-family:ui-monospace,monospace">RCP-${esc((d.id||'').slice(-8).toUpperCase())}</span></div>
          <div class="slip__kv"><span class="k">${esc(t('date'))}</span><span class="v">${esc(fmtDate(d.date || d.createdAt))}</span></div>
          <div class="slip__kv"><span class="k">${esc(t('status'))}</span><span class="v">${esc(d.status || 'pending')}</span></div>
        </div>
      </div>
      <table class="slip__table">
        <thead><tr><th>Description</th><th class="num" style="width:30%">Amount (ETB)</th></tr></thead>
        <tbody>
          <tr><td>${esc(d.note || d.description || d.incomeType || 'Income')}</td><td class="num" style="color:#067647;font-weight:800">${amount.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td></tr>
          <tr class="total-row"><td>TOTAL</td><td class="num" style="color:#0b5cab">${amount.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td></tr>
        </tbody>
      </table>
      <div class="slip__kv"><span class="k">${esc(t('amountInWords'))}</span><span class="v" style="font-weight:500;font-style:italic">${esc(amountWords)}</span></div>
      <div class="slip__sign">
        <div class="sig-block"><div class="sig-line"></div><div class="sig-label">Customer / Officer</div></div>
        <div class="sig-block"><div class="sig-line"></div><div class="sig-label">Stamp</div></div>
      </div>
      <div class="slip__footer">
        <div><strong>GERESU DHUKI SACCO</strong> · ${esc(t('generatedBy'))} ${esc(currentUserName)} · ${esc(fmtDateTime(new Date()))}</div>
        <div>If We Work Together, We Grow Together!</div>
      </div>
    </div>
  `;
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'slip-overlay'; overlay.id = 'slip-overlay';
  overlay.innerHTML = `
    <div class="slip-toolbar">
      <span style="font-weight:800;font-size:13px;margin-right:10px"><i class="fas fa-receipt" style="color:var(--primary)"></i> ${esc(t('paymentReceipt'))} · A5</span>
      <button class="primary" id="slipPrintBtn"><i class="fas fa-print"></i> ${esc(t('printReceipt'))}</button>
      <button id="slipCloseBtn"><i class="fas fa-times"></i> ${esc(t('close'))}</button>
    </div>
    ${host.innerHTML}
  `;
  document.body.appendChild(overlay);
  document.getElementById('slipPrintBtn').addEventListener('click', () => setTimeout(() => window.print(), 60));
  document.getElementById('slipCloseBtn').addEventListener('click', () => { overlay.remove(); host.innerHTML = ''; });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.remove(); host.innerHTML = ''; } });
}

/* ============================================================
   DATA
   ============================================================ */
async function loadCustomers() {
  try {
    const snap = await db.collection('customers').get();
    customersList = snap.docs.map(d => {
      const x = d.data();
      return { id: d.id, fullName: x.fullName || x.name || 'Unknown', customerId: x.customerId || x.memberId || '' };
    });
  } catch(e){}
}
async function loadDeposits() {
  try {
    const snap = await db.collection('transactions').where('type','==','profit_income').get();
    allDeposits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allDeposits.sort((a,b) => {
      const da = toDateSafe(b.date || b.createdAt)?.getTime() || 0;
      const db2 = toDateSafe(a.date || a.createdAt)?.getTime() || 0;
      return da - db2;
    });
    applyFilters();
  } catch(e) { toast(e.message, 'error'); }
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem('sacco.lang'); } catch(e){}
  const b = (navigator.language||'en').slice(0,2);
  LANG = ['en','am','om'].includes(saved) ? saved : (['en','am','om'].includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = LOGIN_URL; return; }
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      if (snap.exists) {
        const d = snap.data();
        S = {
          uid: user.uid, role: d.role || 'viewer', email: user.email || '',
          name: d.fullName || d.name || user.email?.split('@')[0] || 'User',
          photoURL: d.photoURL || null
        };
      } else {
        S = { uid: user.uid, role: 'viewer', email: user.email || '', name: user.email?.split('@')[0] || 'User', photoURL: null };
      }
    } catch(e) {
      S = { uid: user.uid, role: 'viewer', email: user.email || '', name: 'User', photoURL: null };
    }
    currentUserRole = S.role;
    currentUserName = S.name;
    currentUserId = S.uid;

    renderShell();
    renderMain();
    setTimeout(() => document.getElementById('loader')?.classList.add('hide'), 150);

    await loadSessionTimeoutFromSettings();
    startSessionTimer();

    await Promise.all([loadCustomers(), loadDeposits()]);
  });
})();
</script>
