let escHandler = null;
function closeModal() {
  const el = document.getElementById('modal-backdrop');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
}
function openWizard({ title, subtitle, finishLabel, steps, initial = {}, onFinish, successMessage, size = 'lg' }) {
  const data = { ...initial };
  let idx = 0, busy = false;
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  document.body.appendChild(root);
  escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });

  function collect() {
    root.querySelectorAll('[data-field]').forEach(el => {
      const k = el.dataset.field;
      if (el.type === 'checkbox') data[k] = el.checked;
      else data[k] = el.value;
    });
  }
  function showErr(msg) {
    const el = root.querySelector('#wizErr');
    if (!el) return;
    if (!msg) { el.style.display='none'; el.textContent=''; return; }
    el.innerHTML = `<i class="fas fa-exclamation-circle"></i><div>${esc(msg)}</div>`;
    el.style.display = 'flex';
  }
  function draw() {
    const step = steps[idx];
    root.innerHTML = `
      <div class="modal modal--${size}">
        <div class="modal__head">
          <div>
            <div class="modal__title">${esc(title)}</div>
            ${subtitle ? `<div class="modal__sub">${esc(subtitle)}</div>` : ''}
          </div>
          <button class="modal__close" data-close><i class="fas fa-times"></i></button>
        </div>
        <div class="steps">
          ${steps.map((s,i) => `
            <div class="step ${i < idx ? 'is-done' : ''} ${i === idx ? 'is-active' : ''}">
              <span class="step__num">${i < idx ? '✓' : i+1}</span>
              <span class="step__label">${esc(s.label)}</span>
            </div>
            ${i < steps.length - 1 ? `<div class="step__line"></div>` : ''}
          `).join('')}
        </div>
        <div class="modal__body">
          <div class="step-header"><span class="step-header__badge">${idx+1}</span>${esc(step.title || step.label)}</div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-close>${esc(t('cancel'))}</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx === 0 ? 'disabled' : ''}>${esc(t('back'))}</button>
          <button class="btn btn--primary" data-wiz="next">
            <span class="spinner-sm hidden"></span>
            <span class="btn-label">${idx === steps.length - 1 ? esc(finishLabel || t('save')) : esc(t('next'))}</span>
          </button>
        </div>
      </div>`;
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
    root.querySelectorAll('[data-field]').forEach(el => {
      const v = data[el.dataset.field];
      if (v === undefined || v === null) return;
      if (el.type === 'checkbox') el.checked = !!v;
      else el.value = v;
    });
    root.querySelector('[data-wiz="prev"]').addEventListener('click', () => {
      if (idx > 0) { collect(); idx--; draw(); }
    });
    root.querySelector('[data-wiz="next"]').addEventListener('click', async () => {
      const step = steps[idx];
      collect();
      const err = step.validate ? await step.validate(data) : null;
      if (err) { showErr(err); return; }
      if (idx === steps.length - 1) {
        if (busy) return;
        busy = true;
        const btn = root.querySelector('[data-wiz="next"]');
        const sp = btn.querySelector('.spinner-sm');
        const lbl = btn.querySelector('.btn-label');
        btn.disabled = true; sp.classList.remove('hidden'); lbl.textContent = t('loading');
        try {
          await onFinish(data);
          closeModal();
          toast(successMessage || 'Saved', 'success');
        } catch(e) {
          console.error(e);
          busy = false; btn.disabled = false; sp.classList.add('hidden');
          lbl.textContent = finishLabel || t('save');
          showErr(e?.message || 'Something went wrong.');
        }
      } else { idx++; draw(); }
    });
    if (typeof step.after === 'function') step.after(root, data, () => { collect(); draw(); });
  }
  draw();
}

            gList.appendChild(form);
            form.querySelector('#wiz-gname').focus();
            form.querySelector('#wiz-gcancel').addEventListener('click', () => form.remove());
            form.querySelector('#wiz-gsave').addEventListener('click', () => {
              const gt = form.querySelector('#wiz-gtype').value;
              const gn = form.querySelector('#wiz-gname').value.trim();
              const gv = num(form.querySelector('#wiz-gvalue').value);
              const gc = form.querySelector('#wiz-gcontact').value.trim();
              const gd = form.querySelector('#wiz-gdesc').value.trim();
              if (!gn || gv <= 0 || !gc) { toast(t('guaranteeFillRequired'), 'warning'); return; }
              guarantees.push({ type:gt, name:gn, value:gv, contact:gc, description:gd });
              refresh();
            });
          });
          const upload = root.querySelector('#wiz-receipt-upload');
          const fileIn = root.querySelector('#wiz-receipt-input');
          if (upload && fileIn) {
            upload.addEventListener('click', (e) => { e.stopPropagation(); fileIn.click(); });
            fileIn.addEventListener('change', async () => {
              const f = fileIn.files?.[0];
              if (!f) return;
              if (f.size > 3 * 1024 * 1024) { toast(t('fileTooLarge'), 'error'); return; }
              try {
                data._attachment = await fileToDataURL(f);
                refresh();
              } catch(e) { toast(t('couldNotReadImage'), 'error'); }
            });
          }
        }
      },
      {
        label: t('stepReview'), title: t('stepReviewTitle'),
        render: (d) => {
          const c = customerById(d.customerId);
          const { interest, total, monthly } = calcLoan(d.principal, d.interestRate, d.duration, d.interestType);
          const recBy = isEdit ? (l0.createdByName || '—') : (APP.profile?.fullName || '—');
          const appBy = (d.status === 'approved' || d.status === 'active') ? (isEdit ? (l0.approvedByName || recBy) : recBy) : '';
          const gList = guarantees.length ? guarantees.map(g => `<div style="padding:4px 0;border-bottom:1px dashed #e5e7eb">${esc(g.name||'—')} <span class="tag tag--gray" style="font-size:9.5px">${esc(g.type||'other')}</span> ${g.value?`· ${esc(money(g.value))}`:''}${g.contact?` · ${esc(g.contact)}`:''}</div>`).join('') : `<div style="color:var(--muted)">—</div>`;
          return `
            <div style="padding:16px;background:linear-gradient(135deg,#f5f0ff,#fff);border:1px solid #d8c8f5;border-radius:14px;margin-bottom:18px;display:flex;align-items:center;gap:16px">
              <div style="width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px">${c?.photoURL?`<img src="${esc(c.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc(initials(customerName(c)))}</div>
              <div style="min-width:0"><div style="font-size:16px;font-weight:800">${esc(customerName(c))}</div>${c?.customerId?`<div style="font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px">${esc(c.customerId)}</div>`:''}<div style="margin-top:6px"><span class="tag tag--violet">${esc(loanTypeLabel(d.loanType))}</span></div></div>
              <div style="margin-left:auto;text-align:right"><div style="font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em">${esc(t('reviewTotal'))}</div><div style="font-size:22px;font-weight:800;font-family:ui-monospace,monospace;color:#5b21b6">${esc(money(total))}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(t('reviewMonthly'))}: ${esc(money(monthly))}</div></div>
            </div>
            <div class="review">
              <div class="review__row"><span class="review__k">${esc(t('reviewCustomer'))}</span><span class="review__v">${esc(customerName(c))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewType'))}</span><span class="review__v">${esc(loanTypeLabel(d.loanType))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('interestTypeLabel'))}</span><span class="review__v">${esc(interestTypeLabel(d.interestType))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewPrincipal'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(money(d.principal))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewRate'))}</span><span class="review__v">${num(d.interestRate).toFixed(2)}%</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewDuration'))}</span><span class="review__v">${num(d.duration)} ${esc(t('moShort'))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewInterest'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(money(interest))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewTotal'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(money(total))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewDisbursement'))}</span><span class="review__v">${esc(fmtDate(d.disbursementDate))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewMaturity'))}</span><span class="review__v">${esc(fmtDate(d.maturityDate || computeMaturityDate(d.disbursementDate, d.duration)))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('agrLetterNo'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc((d.letterNumber||'').trim() || t('autoGeneratedOnSave'))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewGuarantees'))}</span><span class="review__v">${gList}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewStatus'))}</span><span class="review__v"><span class="tag ${loanStatusCls(d.status)}">${esc(loanStatusLabel(d.status))}</span></span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewRecordedBy'))}</span><span class="review__v" style="font-weight:800;color:#0b5cab">${esc(recBy)}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewApprovedBy'))}</span><span class="review__v" style="font-weight:800;color:${appBy?'#067647':'var(--muted)'}">${appBy?esc(appBy):esc(t('notApprovedYet'))}</span></div>
            </div>`;
        }
      }
    ],
    onFinish: async (d) => {
      const c = customerById(d.customerId);
      if (!c) throw new Error(t('customerNoLongerExists'));
      const status = String(c.status || 'active').toLowerCase();
      if (status !== 'active') throw new Error(t('customerInactiveCreating', { status }));
      const principal = num(d.principal);
      if (principal <= 0) throw new Error(t('invalidAmount'));
      if (minLoanAmount > 0 && principal < minLoanAmount) throw new Error(`${t('principalMustBeAtLeast')} ${money(minLoanAmount)}.`);
      if (maxLoanAmount > 0 && principal > maxLoanAmount) throw new Error(`${t('principalCannotExceed')} ${money(maxLoanAmount)}.`);
      const rate = num(d.interestRate);
      const months = Math.floor(num(d.duration));
      if (months < 1) throw new Error(t('invalidDuration'));
      if (!guarantees.length) throw new Error(t('guaranteesRequired'));
      const interestType = d.interestType || 'simple';
      const existingCount = isEdit ? countActiveOrPending(c, l0.id) : countActiveOrPending(c);
      const incomingStatus = String(d.status || 'pending').toLowerCase();
      if (['pending','active','approved'].includes(incomingStatus) && existingCount >= maxLoansPerCustomer) {
        throw new Error(t('maxLoansReached', { max: maxLoansPerCustomer }));
      }
      const { total } = calcLoan(principal, rate, months, interestType);
      const statusFinal = d.status || (requireApprovalLoans ? 'pending' : 'active');
      const payload = {
        customerId: c.customerId || c.id,
        memberId: c.customerId || c.id,
        customerDocId: c.id,
        customerName: customerName(c),
        loanType: d.loanType || 'personal',
        interestType,
        principal,
        interestRate: rate,
        duration: months,
        totalPayable: total,
        purpose: (d.purpose||'').trim(),
        collateral: (d.collateral||'').trim(),
        reference: (d.reference||'').trim(),
        guarantees,
        disbursementDate: d.disbursementDate || new Date().toISOString().slice(0,10),
        maturityDate: d.maturityDate || computeMaturityDate(d.disbursementDate, months),
        status: statusFinal,
        notes: (d.notes||'').trim(),
        attachment: d._attachment || null,
        districtId: c.districtId || null,
        districtName: c.districtName || districtById(c.districtId)?.name || null,
        branchId: c.branchId || null,
        branchName: c.branchName || branchById(c.branchId)?.name || null,
        updatedAt: serverTimestamp()
      };
      if (['approved','active'].includes(statusFinal)) {
        if (!isEdit || !l0.approvedByName) {
          payload.approvedBy = APP.profile.id;
          payload.approvedByName = APP.profile.fullName || APP.profile.name || '';
          payload.approvedAt = serverTimestamp();
        }
      }
      if (isEdit) {
        payload.serialNumber = l0.serialNumber || generateSerialNumber();
        payload.loanNumber = l0.loanNumber || payload.serialNumber;
        payload.letterNumber = (d.letterNumber||'').trim() || l0.letterNumber || '';
        await updateDoc(doc(db,'loans', l0.id), payload);
      } else {
        payload.serialNumber = generateSerialNumber();
        payload.loanNumber = payload.serialNumber;
        payload.letterNumber = (d.letterNumber||'').trim() || '';
        payload.amountRepaid = 0;
        payload.createdAt = serverTimestamp();
        payload.createdBy = APP.profile.id;
        payload.createdByName = APP.profile.fullName || APP.profile.name || '';
        payload.printCount = 0;
        payload.printStatus = 'not_printed';
        await setDoc(doc(collection(db,'loans')), payload);
      }
    }
  });
}

function openViewModal(l) {
  closeModal();
  const c = customerById(l.customerId || l.customerDocId);
  const { interest, total, monthly } = calcLoan(l.principal, l.interestRate, l.duration, l.interestType);

      const recordedBy = r.createdByName || r.createdBy || '—';
      const approvedBy = r.approvedByName || r.rejectedByName || '—';
      let actions = '';
      if (rst === 'pending' && canApprove()) {
        actions = `<button class="approve-btn" data-approve-rep="${esc(r.id)}" title="${esc(t('approve'))}"><i class="fas fa-check"></i></button>
                   <button class="reject-btn" data-reject-rep="${esc(r.id)}" title="${esc(t('reject'))}"><i class="fas fa-times"></i></button>`;
      }
      actions += `<button class="print-btn" data-print-rep="${esc(r.id)}" title="${esc(t('printReceipt'))}"><i class="fas fa-print"></i></button>`;
      return `<div class="rep-row">
        <span class="date">${esc(fmtDate(r.date))}</span>
        <span class="amt">${esc(money(r.amount))}</span>

        <span class="by">${esc(recordedBy)}</span>
        <span class="by">${esc(approvedBy)}</span>
        <span class="status-cell ${stCls}">${stLabel}</span>
        <span class="actions">${actions}</span>

    }).join('');

  root.innerHTML = `

      <div class="modal__head">

      <div class="modal__body">

          <div style="width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px">${c?.photoURL?`<img src="${esc(c.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc(initials(customerName(c)))}</div>
          <div style="min-width:0"><div style="font-size:17px;font-weight:800">${esc(customerName(c))}</div>${c?.customerId?`<div style="font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:3px">${esc(c.customerId)}</div>`:''}</div>
          <div style="margin-left:auto;text-align:right"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.05em">${esc(t('outstandingLabel'))}</div><div style="font-size:22px;font-weight:800;font-family:ui-monospace,monospace;color:${outstanding>0?'#b42318':'#067647'}">${esc(money(outstanding))}</div><div style="margin-top:6px"><span class="tag ${loanStatusCls(l.status)}">${esc(loanStatusLabel(l.status))}</span></div></div>

        <div class="review" style="margin-bottom:20px">

          <div class="review__row"><span class="review__k">${esc(t('colType'))}</span><span class="review__v">${esc(loanTypeLabel(l.loanType))}</span></div>

          <span><i class="fas fa-undo-alt" style="color:var(--primary);margin-right:6px"></i>${esc(t('repaymentHistory'))} (${loanReps.length})</span>

      await rejectRepayment(btn.dataset.rejectRep);
      closeModal();
      const fresh = APP.loans.find(x => x.id === l.id);
      if (fresh) setTimeout(() => openViewModal(fresh), 200);
    });
  });
}

/* ============================================================
   REPAYMENT MODAL — opens instantly, loads async data inside
============================================================ */
function openRepaymentModal(loan) {
  if (!canRepay()) { toast(t('noPermission'), 'error'); return; }
  if (!loan) { toast(t('pleaseSelectLoan'), 'warning'); return; }
  closeModal();

  const outstanding0 = loanOutstanding(loan);
  if (outstanding0 <= 0) { toast('Nothing to repay.', 'info'); return; }

  const monthly0         = calcLoan(loan.principal, loan.interestRate, loan.duration, loan.interestType).monthly;
  const allowPartial     = allowPartialRepayment !== false;
  const start0           = loanStartDate(loan);
  let   monthsDue0       = 0;
  if (start0) {
    const nowShifted = new Date(Date.now() - GRACE_MS());
    monthsDue0 = (nowShifted.getFullYear() - start0.getFullYear()) * 12
               + (nowShifted.getMonth()   - start0.getMonth());
    if (nowShifted.getDate() < start0.getDate()) monthsDue0 -= 1;
    monthsDue0 = Math.max(0, monthsDue0);
  }
  const totalMonths0     = Math.max(1, Math.floor(num(loan.duration) || 1));
  const paidSoFar0       = loanRepaid(loan);
  const totalPayable0    = calcLoan(loan.principal, loan.interestRate, loan.duration, loan.interestType).total;
  const expectedSoFar0   = Math.min(totalPayable0, Math.min(monthsDue0, totalMonths0) * monthly0);
  const arrearsAmount0   = Math.max(0, round2(expectedSoFar0 - paidSoFar0));
  const monthsBehind0    = monthly0 > 0 ? Math.ceil(arrearsAmount0 / monthly0) : 0;

  let minPayment0;
  if (!allowPartial) minPayment0 = outstanding0;
  else if (arrearsAmount0 > 0) {
    minPayment0 = Math.min(outstanding0, arrearsAmount0);
    if (minPayment0 <= 0) minPayment0 = Math.min(monthly0, outstanding0);
  } else minPayment0 = Math.min(monthly0, outstanding0);

  const c = customerById(loan.customerId || loan.customerDocId);
  const initSplit = computeRepaymentSplit(minPayment0, loan, outstanding0);

  const cachedReps     = (APP.repayments || []).filter(r => r.loanId === loan.id);
  const approvedCount0 = cachedReps.filter(r => r.status === 'approved' || r.printed === true).length;

  const initial = {
    amount: minPayment0.toFixed(2),
    date: new Date().toISOString().slice(0,10),
    method: ['super_admin','admin','manager'].includes(APP.profile.role) ? 'cash' : 'bank',
    ttNumber: '', transferDate: '', bankName: '', bankOther: '', note: '',
    principalPortion: initSplit.principal,
    interestPortion:  initSplit.interest,
    isRepayAll: false,
    _outstanding:  outstanding0,
    _monthly:      monthly0,
    _minPayment:   minPayment0,
    _approvedCount: approvedCount0,
    _allowPartial: allowPartial,
    _monthsBehind: monthsBehind0,
    _arrearsAmount: arrearsAmount0,
    _monthsDue:    monthsDue0,
    _historyHtml:  `<div style="padding:22px;text-align:center;color:var(--muted);font-size:12.5px"><i class="fas fa-spinner fa-spin" style="margin-right:6px"></i>${esc(t('loadingHistory'))}</div>`,
    _customer:     c,
    _pending:      { total: 0, details: [] },
    _list0:        cachedReps,
    _totalPayable: totalPayable0,
    _totalMonths:  totalMonths0
  };

  openWizard({
    title: t('repaymentTitle'),
    subtitle: t('repaymentSub'),
    finishLabel: t('rowRepay'),
    successMessage: t('repaymentOk'),
    size: 'lg',
    initial,
    steps: [
      {
        label: 'Amount', title: 'Loan & Amount',
        render: (d) => {
          const gateMonths    = waiverRequiresMinMonths !== false ? minMonthsForRepayAll : 0;
          const gate          = d._approvedCount < gateMonths;
          const partialLocked = d._allowPartial === false;
          const arrearsBanner = d._monthsBehind > 0
            ? `<div class="alert alert--warning"><i class="fas fa-exclamation-triangle"></i><div>${esc(t('unpaidWarningText'))} <strong>${d._monthsBehind}</strong> ${d._monthsBehind===1?t('monthSingular'):t('monthPlural')} — ${esc(t('arrearsLabel'))}: <strong>${esc(money(d._arrearsAmount))}</strong>.</div></div>`
            : `<div class="alert alert--success"><i class="fas fa-check-circle"></i><div>${esc(t('upToDate'))}</div></div>`;
          return `
            ${d._pending.total > 0 ? `<div class="alert alert--error"><i class="fas fa-lock"></i><div>${esc(t('penaltyBlockedTitle'))} <strong>ETB ${d._pending.total.toFixed(2)}</strong>. ${esc(t('penaltyBlockPay'))}</div></div>` : ''}
            ${arrearsBanner}
            <div class="alert alert--info"><i class="fas fa-info-circle"></i><div>${esc(t('repaymentWillBePending'))}</div></div>
            ${partialLocked ? `<div class="alert alert--warning"><i class="fas fa-lock"></i><div>${esc(t('partialRepaymentDisabled', { amount: money(d._outstanding) }))}</div></div>` : ''}
            <div class="info-panel">
              <div class="info-panel__grid">
                <div class="info-row"><span class="k">${esc(t('customer'))}</span><span class="v">${esc(customerName(d._customer))}</span></div>
                <div class="info-row"><span class="k">${esc(t('loanAmount'))}</span><span class="v">${esc(money(loan.principal))}</span></div>
                <div class="info-row"><span class="k">${esc(t('totalLabel'))}</span><span class="v">${esc(money(d._totalPayable))}</span></div>
                <div class="info-row"><span class="k">${esc(t('totalPaid'))}</span><span class="v positive">${esc(money(loanRepaid(loan)))}</span></div>
                <div class="info-row"><span class="k">${esc(t('remaining'))}</span><span class="v warning">${esc(money(d._outstanding))}</span></div>
                <div class="info-row"><span class="k">${esc(t('monthlyInstallment'))}</span><span class="v">${esc(money(d._monthly))}</span></div>
                <div class="info-row"><span class="k">${esc(t('approvedMonthsPaid'))}</span><span class="v">${d._approvedCount} / ${gateMonths}</span></div>
                <div class="info-row"><span class="k">${esc(t('uninspMonthLabel'))}</span><span class="v" style="color:${d._monthsBehind>0?'#b42318':'#067647'}">${d._monthsBehind}</span></div>
                <div class="info-row"><span class="k">${esc(t('arrearsLabel'))}</span><span class="v" style="color:${d._arrearsAmount>0?'#b42318':'#067647'}">${esc(money(d._arrearsAmount))}</span></div>
                <div class="info-row"><span class="k">${esc(t('minRepaymentStatus'))}</span><span class="v">${esc(t('minAmountShort', { v: money(d._minPayment) }))}</span></div>
              </div>
            </div>
            <div class="field">
              <label class="field__required">${esc(t('repaymentAmount'))}</label>
              <div class="amount-row">
                <input type="number" id="rpAmount" data-field="amount" class="amount-input" step="0.01" min="0.01" placeholder="0.00" value="${esc(d.amount)}" ${partialLocked?'readonly':''}/>
                <button type="button" class="btn-repay-all" id="rpRepayAllBtn" ${gate?'disabled':''}><i class="fas fa-check-double"></i> ${esc(t('repayAll'))}</button>
              </div>
              <small class="field__hint">${esc(t('minRepayHint'))}: <strong>${esc(money(d._minPayment))}</strong></small>
            </div>
            ${gate?`<div class="alert alert--warning"><i class="fas fa-lock"></i><div>${esc(t('repayAllGateMsg', { n: gateMonths, paid: d._approvedCount }))}</div></div>`:''}
            <div class="alert alert--success" id="rpWaiverNote" style="display:none"><i class="fas fa-gift"></i><div id="rpWaiverText"></div></div>
            <div class="field-row" id="rpSplitRow">
              <div class="field"><label><i class="fas fa-landmark"></i> ${esc(t('principalPortion'))}</label><input type="text" id="rpPrincipalPortion" data-field="principalPortion" readonly value="${num(d.principalPortion).toFixed(2)}" style="background:#f0fdf4;font-weight:800;color:#128a5c" /></div>
              <div class="field"><label><i class="fas fa-percent"></i> ${esc(t('interestPortion'))}</label><input type="text" id="rpInterestPortion" data-field="interestPortion" readonly value="${num(d.interestPortion).toFixed(2)}" style="background:#fffbeb;font-weight:800;color:#b8860b" /></div>
            </div>
            <div class="payment-history">${d._historyHtml}</div>`;
        },
        validate: (d) => {
          if (d._pending.total > 0) return `${t('penaltyBlockedTitle')} ETB ${d._pending.total.toFixed(2)}`;
          const amt = num(d.amount);
          if (amt <= 0) return t('invalidAmountMsg');
          if (amt > d._outstanding + 0.01) return t('cannotExceedRemaining');
          if (d._allowPartial === false && amt + 0.01 < d._outstanding)
            return t('partialRepaymentDisabled', { amount: money(d._outstanding) });
          if (d._allowPartial !== false && d._monthsBehind > 0 && !d.isRepayAll && amt + 0.01 < d._arrearsAmount)
            return t('arrearsMustPay', { amount: money(d._arrearsAmount) });
          if (d._allowPartial !== false && !d.isRepayAll && amt + 0.01 < d._minPayment)
            return `${t('minPaymentNotMet')} (${money(d._minPayment)})`;
          return null;
        },
        after: (root, data, refresh) => {
          const amtIn         = root.querySelector('#rpAmount');
          const repayAllBtn   = root.querySelector('#rpRepayAllBtn');
          const principalIn   = root.querySelector('#rpPrincipalPortion');
          const interestIn    = root.querySelector('#rpInterestPortion');
          const waiverNote    = root.querySelector('#rpWaiverNote');
          const waiverText    = root.querySelector('#rpWaiverText');

          const updateSplit = () => {
            const amt = num(amtIn.value);
            if (amt <= 0) { principalIn.value = ''; interestIn.value = ''; return; }
            if (data.isRepayAll && allowInterestWaiver) { principalIn.value = amt.toFixed(2); interestIn.value = '0.00'; return; }
            const sp = computeRepaymentSplit(amt, loan, data._outstanding);
            principalIn.value = sp.principal.toFixed(2);
            interestIn.value  = sp.interest.toFixed(2);
          };
          amtIn.addEventListener('input', () => {
            data.amount = amtIn.value;
            if (data.isRepayAll) { data.isRepayAll = false; if (waiverNote) waiverNote.style.display = 'none'; }
            updateSplit();
          });
          repayAllBtn?.addEventListener('click', () => {
            const gateMonths = waiverRequiresMinMonths !== false ? minMonthsForRepayAll : 0;
            if (data._approvedCount < gateMonths) {
              toast(t('repayAllGateMsg', { n: gateMonths, paid: data._approvedCount }), 'warning');
              return;
            }
            if (allowInterestWaiver) {
              const paidPrincipal = data._list0
                .filter(r => r.status === 'approved' || r.printed === true)
                .reduce((s, r) => s + getRepaymentPrincipal(r, loan), 0);
              const outstandingPrincipal = Math.max(0, round2(num(loan.principal) - paidPrincipal));
              const waived = Math.max(0, round2(data._outstanding - outstandingPrincipal));
              amtIn.value = outstandingPrincipal.toFixed(2);
              data.amount = outstandingPrincipal.toFixed(2);
              data.isRepayAll = true;
              if (waived > 0 && waiverNote && waiverText) {
                waiverNote.style.display = 'flex';
                waiverText.textContent = t('interestWaiverNote', { paid: data._approvedCount, waived: waived.toFixed(2) });
              }
            } else {
              amtIn.value = data._outstanding.toFixed(2);
              data.amount = data._outstanding.toFixed(2);
              data.isRepayAll = false;
            }
            updateSplit();
          });

          (async () => {
            try {
              await checkAndCreateLoanPenalty(loan.id, loan.customerId || loan.memberId);
              const [freshPending, freshHistory, freshList] = await Promise.all([
                getMemberLoanPenalties(loan.customerId || loan.memberId),
                generatePaymentHistory(loan.id),
                getDocs(query(collection(db,'transactions'),
                  where('loanId','==',loan.id),
                  where('type','==','repayment')))
                  .then(s => s.docs.map(d => ({ id:d.id, ...d.data() })))
                  .catch(() => [])
              ]);
              data._pending      = freshPending;
              data._historyHtml  = freshHistory;
              data._list0        = freshList;
              data._approvedCount = freshList.filter(r => r.status === 'approved' || r.printed === true).length;
              refresh();
            } catch (e) {
              console.error('[repayment async load]', e);
              data._historyHtml = `<div style="padding:20px;text-align:center;color:var(--danger);font-size:12.5px">${esc(t('historyLoadError'))}</div>`;
              refresh();
            }
          })();
        }
      },
      {
        label: 'Payment', title: 'Payment details',
        render: (d) => {
          const isCash = d.method === 'cash';
          const bankOpts = BANKS.map(b => `<option value="${esc(b.code)}" ${d.bankName===b.code?'selected':''}>${esc(b.name)}</option>`).join('');
          return `
            <div class="field-row">
              <div class="field"><label class="field__required">${esc(t('repaymentMethod'))}</label>
                <select data-field="method" id="rpMethod">
                  ${['super_admin','admin','manager'].includes(APP.profile.role) ? `<option value="cash" ${d.method==='cash'?'selected':''}>${esc(t('methodCash'))}</option>` : ''}
                  <option value="bank" ${d.method==='bank'?'selected':''}>${esc(t('methodBank'))}</option>
                  <option value="mobile" ${d.method==='mobile'?'selected':''}>${esc(t('methodMobile'))}</option>
                </select>
              </div>
              <div class="field"><label class="field__required">${esc(t('repaymentDate'))}</label><input type="date" data-field="date" value="${esc(d.date)}" /></div>
            </div>
            ${!isCash ? `
              <div class="field-row">
                <div class="field"><label class="field__required">${esc(t('ttNumber'))}</label><input type="text" data-field="ttNumber" id="rpTT" placeholder="Enter TT number" value="${esc(d.ttNumber)}" /></div>
                <div class="field"><label class="field__required">${esc(t('transferDate'))}</label><input type="date" data-field="transferDate" id="rpTransferDate" value="${esc(d.transferDate)}" /></div>
              </div>
              <div class="field"><label class="field__required">${esc(t('bankProvider'))}</label>
                <select data-field="bankName" id="rpBankName">
                  <option value="">${esc(t('bankPlaceholder'))}</option>${bankOpts}
                  <option value="other" ${d.bankName==='other'?'selected':''}>➕ ${esc(t('methodOther'))}</option>
                </select>
                <input type="text" data-field="bankOther" id="rpBankOther" placeholder="${esc(t('otherBankName'))}" value="${esc(d.bankOther)}" style="display:${d.bankName==='other'?'block':'none'};margin-top:6px" />
              </div>` : ''}
            <div class="field"><label>${esc(t('repaymentNotes'))}</label><input type="text" data-field="note" placeholder="${esc(t('notePlaceholder'))}" value="${esc(d.note)}" /></div>
            <div class="alert alert--warning" id="rpDupWarn" style="display:none"><i class="fas fa-exclamation-triangle"></i><div>${esc(t('duplicateWarn'))}</div></div>`;
        },
        validate: (d) => {
          if (!d.date) return t('pleaseSelectDate');
          if (d.method !== 'cash') {
            if (!d.ttNumber || !d.ttNumber.trim()) return t('ttRequired');
            if (!d.transferDate) return t('transferRequired');
            const bank = d.bankName === 'other' ? d.bankOther : d.bankName;
            if (!bank || !bank.trim()) return t('bankRequired');
          }
          return null;
        },
        after: (root, data, refresh) => {
          const methodSel = root.querySelector('#rpMethod');
          methodSel?.addEventListener('change', () => {
            data.method = methodSel.value;
            if (data.method === 'cash') { data.ttNumber=''; data.transferDate=''; data.bankName=''; data.bankOther=''; }
            refresh();
          });
          const bankSel = root.querySelector('#rpBankName');
          const bankOther = root.querySelector('#rpBankOther');
          bankSel?.addEventListener('change', () => {
            data.bankName = bankSel.value;
            if (bankSel.value === 'other') bankOther.style.display = 'block';
            else { bankOther.style.display = 'none'; data.bankOther = ''; }
          });
          bankOther?.addEventListener('input', () => { data.bankOther = bankOther.value; });
          const ttIn = root.querySelector('#rpTT');
          const tdIn = root.querySelector('#rpTransferDate');
          const dupWarn = root.querySelector('#rpDupWarn');
          const checkDup = async () => {
            if (!enableDuplicateCheck) { if (dupWarn) dupWarn.style.display='none'; return; }
            const tt = (data.ttNumber||'').trim();
            const td = data.transferDate;
            if (!tt || !td || !dupWarn) return;
            const cid = loan.customerId || loan.memberId;
            try {
              const parts = td.split('-').map(Number);
              const start = new Date(Date.UTC(parts[0], parts[1]-1, parts[2], 0,0,0));
              const end   = new Date(Date.UTC(parts[0], parts[1]-1, parts[2], 23,59,59,999));
              const snap = await getDocs(query(collection(db,'transactions'),
                where('customerId','==',cid),
                where('ttNumber','==',tt),
                where('transferDate','>=',start),
                where('transferDate','<=',end)));
              dupWarn.style.display = snap.empty ? 'none' : 'flex';
            } catch(e) { dupWarn.style.display = 'none'; }
          };
          ttIn?.addEventListener('input', () => { data.ttNumber = ttIn.value; });
          ttIn?.addEventListener('blur', checkDup);
          tdIn?.addEventListener('change', () => { data.transferDate = tdIn.value; checkDup(); });
        }
      },
      {
        label: 'Review', title: 'Review and confirm',
        render: (d) => {
          const amt = num(d.amount);
          const methodLabelStr = { cash:t('methodCash'), bank:t('methodBank'), mobile:t('methodMobile') }[d.method] || d.method;
          const bankDisplay = d.method === 'cash' ? '—' : (d.bankName === 'other' ? d.bankOther : (bankLabel(d.bankName) || d.bankName));
          const remainingAfter = Math.max(0, round2(d._outstanding - amt));
          const coversArrears = d._monthsBehind === 0 || amt >= d._arrearsAmount;
          return `
            <div class="alert alert--warning"><i class="fas fa-hourglass-half"></i><div>${esc(t('afterSavingPending'))}</div></div>
            ${d._monthsBehind > 0 ? `<div class="alert alert--${coversArrears?'success':'error'}"><i class="fas fa-${coversArrears?'check-circle':'exclamation-triangle'}"></i><div>${coversArrears ? t('arrearsClearMsg', { n: d._monthsBehind, amount: money(d._arrearsAmount) }) : `${esc(t('unpaidWarningText'))} ${esc(t('arrearsMustPay', { amount: money(d._arrearsAmount) }))}`}</div></div>` : ''}
            <div style="padding:16px;background:linear-gradient(135deg,#f0fdf4,#fff);border:1px solid #a7f3d0;border-radius:14px;margin-bottom:18px;display:flex;align-items:center;gap:16px">
              <div style="width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#128a5c,#19a974);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px">${d._customer?.photoURL?`<img src="${esc(d._customer.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc(initials(customerName(d._customer)))}</div>
              <div style="min-width:0"><div style="font-size:16px;font-weight:800">${esc(customerName(d._customer))}</div>${d._customer?.customerId?`<div style="font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px">${esc(d._customer.customerId)}</div>`:''}<div style="margin-top:6px"><span class="tag tag--gold">${esc(t('repPending'))}</span> <span class="tag tag--green">${esc(methodLabelStr)}</span></div></div>
              <div style="margin-left:auto;text-align:right"><div style="font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em">${esc(t('repaymentHeader'))}</div><div style="font-size:24px;font-weight:800;font-family:ui-monospace,monospace;color:#128a5c">${esc(money(amt))}</div></div>
            </div>
            <div class="review">
              <div class="review__row"><span class="review__k">${esc(t('loanNoShort'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(loan.serialNumber||loan.loanNumber||loan.id.slice(0,8))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('outstandingUnchanged'))}</span><span class="review__v" style="font-family:ui-monospace,monospace;color:#b42318">${esc(money(d._outstanding))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('repaymentAmountShort'))}</span><span class="review__v" style="font-family:ui-monospace,monospace;font-weight:800;color:#128a5c">${esc(money(amt))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('principalPortion'))}</span><span class="review__v" style="font-family:ui-monospace,monospace;color:#128a5c">${esc(money(d.principalPortion))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('interestPortion'))}</span><span class="review__v" style="font-family:ui-monospace,monospace;color:#b8860b">${esc(money(d.interestPortion))}${d.isRepayAll&&allowInterestWaiver?` <em style="color:#128a5c">(${esc(t('waived'))})</em>`:''}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('outstandingAfterApproval'))}</span><span class="review__v" style="font-family:ui-monospace,monospace;font-weight:800;color:${remainingAfter<=0?'#067647':'#b42318'}">${esc(money(remainingAfter))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('repaymentMethod'))}</span><span class="review__v">${esc(methodLabelStr)}</span></div>
              ${d.method !== 'cash' ? `
                <div class="review__row"><span class="review__k">${esc(t('bankProvider'))}</span><span class="review__v">${esc(bankDisplay||'—')}</span></div>
                <div class="review__row"><span class="review__k">${esc(t('ttNumber'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(d.ttNumber||'—')}</span></div>
                <div class="review__row"><span class="review__k">${esc(t('transferDate'))}</span><span class="review__v">${esc(fmtDate(d.transferDate))}</span></div>` : ''}
              <div class="review__row"><span class="review__k">${esc(t('repaymentDate'))}</span><span class="review__v">${esc(fmtDate(d.date))}</span></div>
              ${d.note ? `<div class="review__row"><span class="review__k">${esc(t('repaymentNotes'))}</span><span class="review__v">${esc(d.note)}</span></div>` : ''}
              <div class="review__row"><span class="review__k">${esc(t('recordedBy'))}</span><span class="review__v" style="font-weight:800;color:#0b5cab">${esc(APP.profile.fullName || APP.profile.name)}</span></div>
            </div>`;
        }
      }
    ],
    onFinish: async (d) => {
      const freshPending = await getMemberLoanPenalties(loan.customerId || loan.memberId);
      if (freshPending.total > 0) throw new Error(`${t('penaltyBlockedTitle')} ETB ${freshPending.total.toFixed(2)}`);

      const amount = num(d.amount);
      if (amount <= 0) throw new Error(t('invalidAmountMsg'));
      if (amount > d._outstanding + 0.01) throw new Error(t('cannotExceedRemaining'));
      if (d._allowPartial !== false && d._monthsBehind > 0 && !d.isRepayAll && amount + 0.01 < d._arrearsAmount) {
        throw new Error(t('arrearsMustPay', { amount: money(d._arrearsAmount) }));
      }

      const bankName = d.method === 'cash' ? '' : (d.bankName === 'other' ? d.bankOther : (bankLabel(d.bankName) || d.bankName));
      const txData = {
        type: 'repayment', loanId: loan.id,
        customerId: loan.customerId || loan.memberId,
        memberId:   loan.customerId || loan.memberId,
        customerDocId: loan.customerDocId || null,
        customerName: loan.customerName || customerName(d._customer) || '',
        amount,
        principalPortion: num(d.principalPortion),
        interestPortion:  num(d.interestPortion),
        interestWaived:   !!d.isRepayAll && allowInterestWaiver,
        waivedInterest:   d.isRepayAll ? Math.max(0, round2(amount - num(d.principalPortion))) : 0,
        date: new Date(d.date),
        note: (d.note||'').trim(),
        status: 'pending',
        paymentMethod: d.method,
        ttNumber: d.method === 'cash' ? '' : (d.ttNumber||'').trim(),
        bankName,
        districtId:   loan.districtId   || null,
        districtName: loan.districtName || null,
        branchId:     loan.branchId     || null,
        branchName:   loan.branchName   || null,
        createdByName: APP.profile.fullName || APP.profile.name,
        createdBy:     APP.profile.id,
        createdByEmail: APP.profile.email || '',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
      if (d.method !== 'cash' && d.transferDate) txData.transferDate = new Date(d.transferDate);
      await setDoc(doc(collection(db,'transactions')), txData);
    }
  });
}

/* ============================================================
   PRINT — A4 AGREEMENT
============================================================ */
function buildSlipHtml(l, watermarkText) {
  const c = customerById(l.customerId || l.customerDocId);
  const cName = customerName(c);
  const serial = l.serialNumber || l.loanNumber || ('GD-' + (l.id||'').slice(-12).toUpperCase());
  const dateStr = fmtDate(l.disbursementDate || l.createdAt || new Date());
  const guarantors = Array.isArray(l.guarantees) ? l.guarantees : [];
  const recordedByName = l.createdByName || '—';
  const approvedByName = l.approvedByName || '—';

  const residence = buildResidence(c);
  const purposeText = (l.purpose || '').trim() || 'personal financial need';
  const refs = (l.reference || '').trim() || t('agrReference');

  const gListInline = guarantors.length ? guarantors.map(g => esc(g.name||'—')).join(', ') : '____________________';

      <div class="slip__logo"><img src="${esc(LOGO_URL)}" alt=""></div>
    </div>
    <div class="slip__doc-row">
      <div><strong>${esc(t('agrLetterNo'))}:</strong> <span style="font-family:monospace;font-weight:800;">GD/______/${new Date().getFullYear()}</span></div>
      <div><strong>${esc(t('agrSerial'))}:</strong> <span style="font-family:monospace;font-weight:800">${esc(serial)}</span></div>

      <div><span style="display:inline-block;padding:1px 8px;border-radius:3px;font-size:9pt;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:${watermarkText===t('original')?'#e7f7f0':'#fdf5e0'};color:${watermarkText===t('original')?'#065f46':'#7a5210'};border:1px solid ${watermarkText===t('original')?'#a7f3d0':'#f0dcb0'}">${esc(watermarkText)}</span></div>
    </div>
    <div class="slip__title">${esc(t('agrTitle'))}</div>
    <div class="slip__subject">${esc(t('agrSubject'))}</div>
    <div class="slip__body">
      <p>I, Mr./Ms. <strong style="border-bottom:1px dotted #666;display:inline-block;min-width:90px;padding:0 6px;">${esc(cName)}</strong>, a member of ${esc(t('agrSacco'))}, residing in <strong style="border-bottom:1px dotted #666;display:inline-block;min-width:60px;padding:0 6px;">${esc(residence)}</strong>, hereby acknowledge that I have received a loan of:</p>
      <div class="slip__amount-line">ETB ${esc(num(l.principal).toLocaleString())}<br><span style="font-size:11pt;font-weight:600;">( ${esc(principalWords)} )</span></div>
      <p>from ${esc(t('agrSacco'))} for my <strong>${esc(purposeText)}</strong>, in accordance with the applicable Cooperative rules and the relevant references <strong>${esc(refs)}</strong>.</p>
      <p>I undertake to repay the loan together with applicable interest and charges in accordance with the Cooperative's approved repayment terms.</p>

      <p>${t('agrBreachClause')}</p>

async function printSlip(l) {
  if (!l || !canPrint()) { toast(t('noPermission'), 'error'); return; }
  const prevCount = num(l.printCount);
  const newCount = prevCount + 1;
  const watermarkText = newCount === 1 ? t('original') : t('copy');
  try {
    await updateDoc(doc(db,'loans',l.id), {
      printCount: newCount, printStatus: 'printed',
      lastPrintedAt: serverTimestamp(),
      lastPrintedBy: APP.profile.id,
      lastPrintedByName: APP.profile.fullName || APP.profile.name || ''
    });
    l.printCount = newCount; l.printStatus = 'printed';
    if (newCount === 1) toast(t('firstPrint'), 'info');
    else toast(t('reprint') + ' ×' + newCount, 'warning');
  } catch(e) { toast(t('printError'), 'error'); }
  closeSlipOverlay();
  const host = document.getElementById('slip-print-host');
  host.innerHTML = buildSlipHtml(l, watermarkText);
  const overlay = document.createElement('div');
  overlay.className = 'slip-overlay';
  overlay.id = 'slip-overlay';
  overlay.innerHTML = `
    <div class="slip-toolbar">
      <div style="font-weight:800;font-size:14px;margin-right:12px;display:inline-flex;align-items:center;gap:8px">
        <i class="fas fa-file-invoice" style="color:var(--primary)"></i>${esc(t('slipPreview'))}
        <span class="tag ${newCount===1?'tag--print-orig':'tag--print-copy'}" style="margin-left:6px">${esc(watermarkText)}</span>
      </div>
      <button class="primary" id="slip-print-btn"><i class="fas fa-print"></i> ${esc(t('printSlip'))}</button>
      <button id="slip-close-btn"><i class="fas fa-times"></i> ${esc(t('close'))}</button>
    </div>
    ${buildSlipHtml(l, watermarkText)}`;
  document.body.appendChild(overlay);
  document.getElementById('slip-print-btn').addEventListener('click', () => { host.innerHTML = buildSlipHtml(l, watermarkText); setTimeout(() => window.print(), 60); });
  document.getElementById('slip-close-btn').addEventListener('click', closeSlipOverlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSlipOverlay(); });
  escHandler = (e) => { if (e.key === 'Escape') closeSlipOverlay(); };
  document.addEventListener('keydown', escHandler);
}
function closeSlipOverlay() {
  const el = document.getElementById('slip-overlay');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
  const host = document.getElementById('slip-print-host');
  if (host) host.innerHTML = '';
}

/* ============================================================
   DELETE MODAL
============================================================ */
function openDeleteModal(l) {
  closeModal();
  if (!canDelete()) { toast(t('noPermission'), 'error'); return; }
  const c = customerById(l.customerId || l.customerDocId);
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  root.innerHTML = `
    <div class="modal" style="max-width:440px">
      <div class="modal__head">
        <div>
          <div class="modal__title">${esc(t('deleteTitle'))}</div>
          <div class="modal__sub">${esc(t('deleteText'))}</div>
        </div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body" style="padding-top:14px">
        <div style="font-weight:800;color:var(--text);font-size:15px;margin-bottom:4px">${esc(customerName(c))}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px">
          <span class="tag tag--violet">${esc(loanTypeLabel(l.loanType))}</span>
          <span style="font-family:ui-monospace,monospace;font-weight:800;color:#5b21b6;margin-left:8px">${esc(money(l.principal))}</span>
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="confirm-del"><span class="spinner-sm hidden"></span><span class="btn-label">${esc(t('rowDelete'))}</span></button>
      </div>
    </div>`;
  document.body.appendChild(root);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  document.getElementById('confirm-del').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const sp = btn.querySelector('.spinner-sm');
    const lbl = btn.querySelector('.btn-label');
    btn.disabled = true; sp.classList.remove('hidden'); lbl.textContent = t('loading');
    try {
      await deleteDoc(doc(db,'loans', l.id));
      toast(t('deletedOk'), 'success');
      closeModal();
    } catch(err) {
      const msg = err.code === 'permission-denied' ? t('noPermission') : err.message;
      toast(t('errorDelete') + msg, 'error');
      btn.disabled = false; sp.classList.add('hidden'); lbl.textContent = t('rowDelete');
    }
  });
}

/* ============================================================

function showLogoutModal() {
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  root.innerHTML = `
    <div class="modal" style="max-width:420px">
      <div class="modal__head">
        <div><div class="modal__title">${esc(t('logoutTitle'))}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body" style="padding-top:14px">
        <p style="color:var(--text-soft);font-size:14px">${esc(t('logoutText'))}</p>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="confirm-logout"><i class="fas fa-sign-out-alt"></i> ${esc(t('logout'))}</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  document.getElementById('confirm-logout').addEventListener('click', async () => {
    if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
    awayStartedAt = null;
    try { sessionStorage.removeItem(PROFILE_CACHE_KEY); } catch(e){}
    try { sessionStorage.clear(); } catch(e){}
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
  });
}

/* ============================================================
   LISTENERS
============================================================ */
function attachListeners() {
  stopListeners();
  const watch = (coll, key) => {
    const unsub = onSnapshot(collection(db, coll),
      (snap) => {
        APP[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMain();
      },
      (err) => { console.warn('[listen]', coll, err.code, err.message); renderMain(); }
    );
    APP.unsubs.push(unsub);
  };
  watch('customers', 'customers');
  watch('districts', 'districts');
  watch('branches', 'branches');
  watch('loans', 'loans');

  const unsubReps = onSnapshot(query(collection(db,'transactions'), where('type','==','repayment')),
    (snap) => { APP.repayments = snap.docs.map(d => ({id:d.id, ...d.data()})); renderMain(); },
    (err) => console.warn('[listen reps]', err.code)
  );
  APP.unsubs.push(unsubReps);

  const unsubPen = onSnapshot(query(collection(db,'transactions'), where('type','==','penalty')),
    (snap) => { APP.penalties = snap.docs.map(d => ({id:d.id, ...d.data()})); renderMain(); },
    (err) => console.warn('[listen pen]', err.code)
  );
  APP.unsubs.push(unsubPen);
}
function stopListeners() {
  APP.unsubs.forEach(u => { try { u(); } catch(e){} });
  APP.unsubs = [];
}

/* ============================================================
   BOOT — cache-first render, then auth, then live listeners
============================================================ */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  const hasMis = sessionStorage.getItem('loggedIn') === 'true' && sessionStorage.getItem('uid');
  if (!isSessionRecordValid(sess) && !hasMis) {
    try { sessionStorage.setItem('__redirectReason','expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const cachedProfile = readCachedProfile();
  let rendered = false;
  if (cachedProfile && cachedProfile.uid) {
    APP.profile = {
      id: cachedProfile.uid,
      role: cachedProfile.role || 'viewer',
      email: cachedProfile.email || '',
      fullName: cachedProfile.name || 'User',
      photoURL: cachedProfile.photoURL || null,
      districtId: cachedProfile.districtId || '',
      districtName: cachedProfile.districtName || '',
      branchId: cachedProfile.branchId || '',
      branchName: cachedProfile.branchName || ''
    };
    initWorkarea();
    renderShell();
    renderMain();
    hideLoaderNow();
    rendered = true;
  } else if (hasMis) {
    APP.profile = {
      id: sessionStorage.getItem('uid'),
      role: sessionStorage.getItem('role') || 'viewer',
      email: sessionStorage.getItem('email') || '',
      fullName: sessionStorage.getItem('userName') || 'User',
      photoURL: null,
      districtId: '', districtName: '', branchId: '', branchName: ''
    };
    initWorkarea();
    renderShell();
    renderMain();
    hideLoaderNow();
  }

  const user = await new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
  });
  if (!user) {
    try { sessionStorage.setItem('__redirectReason','expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  if (sess && user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason','expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    const d = snap.data();
    if (d.status === 'inactive') throw new Error('inactive');
    APP.profile = { id: snap.id, ...d, email: user.email || '' };
    writeCachedProfile();
  } catch(e) {
    try { sessionStorage.setItem('__redirectReason','expired'); } catch(e2){}
    clearSession(); clearCachedProfile();
    try { await signOut(auth); } catch(e2){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const allowed = ['super_admin','admin','manager','cashier','teller','accountant','auditor','member'];
  if (!allowed.includes(APP.profile.role)) {
    window.location.replace('dashboard.html');
    return;
  }

  /* Session watcher starts immediately — not blocked by data */
  await loadSessionTimeout();
  startSessionWatcher();

  /* Settings */
  try {
    const cfg = await getDoc(doc(db, 'settings', 'system'));
    if (cfg.exists()) {
      const d = cfg.data();
      if (d.currency) APP.currency = d.currency;
      if (d.saccoName && String(d.saccoName).trim()) APP.saccoName = String(d.saccoName).trim();
      defaultInterestRate = num(d.defaultLoanInterestRate) || num(d.defaultInterestRate) || 10;
      if (d.defaultLoanType) defaultLoanType = String(d.defaultLoanType);
      maxLoanAmount = num(d.maxLoanAmount) || 50000;
      minLoanAmount = num(d.minLoanAmount) || 0;
      maxLoanMultiplier = num(d.maxLoanMultiplier) || 3;
      loansPenaltyRate = d.loansPenaltyRate !== undefined ? num(d.loansPenaltyRate)/100 : (num(d.penaltyRate)||5)/100;
      gracePeriod = (d.gracePeriod !== undefined && num(d.gracePeriod) >= 0) ? num(d.gracePeriod) : 7;
      minMonthsForRepayAll = (d.minMonthsForRepayAll !== undefined && num(d.minMonthsForRepayAll) >= 0) ? num(d.minMonthsForRepayAll) : 6;
      allowInterestWaiver = d.allowInterestWaiver !== undefined ? !!d.allowInterestWaiver : true;
      waiverRequiresMinMonths = d.waiverRequiresMinMonths !== undefined ? !!d.waiverRequiresMinMonths : true;
      penaltiesEnabled = d.penaltiesEnabled !== undefined ? !!d.penaltiesEnabled : true;
      penaltyAutoGenerate = d.penaltyAutoGenerate !== undefined ? !!d.penaltyAutoGenerate : true;
      penaltiesApplyLoans = d.penaltiesApplyLoans !== undefined ? !!d.penaltiesApplyLoans : true;
      penaltiesMinAmount = num(d.penaltiesMinAmount) || 0;
      penaltiesMaxAmount = num(d.penaltiesMaxAmount) || 0;
      requireApprovalLoans = d.requireApprovalLoans !== undefined ? !!d.requireApprovalLoans : true;
      allowPartialRepayment = d.allowPartialRepayment !== undefined ? !!d.allowPartialRepayment : true;
      enableDuplicateCheck = d.enableDuplicateCheck !== undefined ? !!d.enableDuplicateCheck : true;
      const rawMaxLoans = d.maxLoansPerCustomer ?? d.maxLoansToBorrow;
      if (rawMaxLoans !== undefined && rawMaxLoans !== null && rawMaxLoans !== '') {
        const n = Number(rawMaxLoans);
        if (!isNaN(n) && n >= 1) maxLoansPerCustomer = Math.floor(n);
      }
    }
  } catch(e) {}

  const profileChanged = !rendered ||
    (cachedProfile && (
      (cachedProfile.name !== (APP.profile.fullName || APP.profile.name)) ||
      cachedProfile.role !== APP.profile.role ||
      cachedProfile.photoURL !== APP.profile.photoURL
    ));
  if (profileChanged) {
    initWorkarea();
    renderShell();
    renderMain();
  }
  hideLoaderNow();

  attachListeners();
})();

window.viewLoan = openViewModal;
window.openRepaymentModal = openRepaymentModal;
window.approveRepayment = approveRepayment;
window.rejectRepayment = rejectRepayment;
window.printSlip = printSlip;

console.log('[sacco] loans page ready — session fix, cached render, full translations');
</script>
