async function printSlip(tx){
  if(!tx) return;
  if(!canPrint()){toast(t('noPermission'),'error');return;}
  const prevCount=Number(tx.printCount||0);
  const newCount=prevCount+1;
  const wm=newCount===1?t('original'):t('copy');
  try{
    await updateDoc(doc(db,'transactions',tx.id),{printCount:newCount,printStatus:'printed',lastPrintedAt:serverTimestamp(),lastPrintedBy:APP.profile.id,lastPrintedByName:APP.profile.fullName||APP.profile.name||''});
    tx.printCount=newCount; tx.printStatus='printed';
    tx.lastPrintedByName=APP.profile.fullName||APP.profile.name||'';
    tx.lastPrintedAt=new Date();
    if(newCount===1) toast(t('firstPrint'),'info'); else toast(t('reprint')+' ×'+newCount,'warning');
  }catch(e){toast(t('printError'),'error');}
  closeSlipOverlay();
  const host=document.getElementById('slip-print-host');
  host.innerHTML=buildSlipHtml(tx,wm);
  const overlay=document.createElement('div');
  overlay.className='slip-overlay'; overlay.id='slip-overlay';
  overlay.innerHTML=`<div class="slip-toolbar">
      <div class="slip-toolbar__title"><i class="fas fa-receipt" style="color:var(--primary)"></i>${esc(t('slipPreview'))}
        <span class="tag ${newCount===1?'tag--print-orig':'tag--print-copy'}" style="margin-left:6px">${esc(wm)}</span></div>
      <button class="primary" id="slip-print-btn"><i class="fas fa-print"></i> ${esc(t('printSlip'))}</button>
      <button id="slip-close-btn"><i class="fas fa-times"></i> Close</button>
    </div>${buildSlipHtml(tx,wm)}`;
  document.body.appendChild(overlay);
  document.getElementById('slip-print-btn').addEventListener('click',()=>{host.innerHTML=buildSlipHtml(tx,wm);setTimeout(()=>window.print(),60);});
  document.getElementById('slip-close-btn').addEventListener('click',closeSlipOverlay);
  overlay.addEventListener('click',(e)=>{if(e.target===overlay)closeSlipOverlay();});
  escHandler=(e)=>{if(e.key==='Escape')closeSlipOverlay();};
  document.addEventListener('keydown',escHandler);
}
function closeSlipOverlay(){
  const el=document.getElementById('slip-overlay'); if(el) el.remove();
  if(escHandler){document.removeEventListener('keydown',escHandler);escHandler=null;}
  const host=document.getElementById('slip-print-host'); if(host) host.innerHTML='';
}

function attachListeners(){
  stopListeners();
  const watch=(coll,key,orderField)=>{
    let ref=collection(db,coll);
    if(orderField) ref=query(ref,orderBy(orderField,'desc'),limit(2000));
    const unsub=onSnapshot(ref,
      (snap)=>{APP[key]=snap.docs.map(d=>({id:d.id,...d.data()}));renderMain();},
      (err)=>{console.warn('[listen]',coll,err.code,err.message);renderMain();}
    );
    APP.unsubs.push(unsub);
  };
  watch('customers','customers');
  watch('districts','districts');
  watch('branches','branches');
  watch('transactions','transactions','createdAt');
  watch('loans','loans');
}
function stopListeners(){
  APP.unsubs.forEach(u=>{try{u();}catch(e){}});
  APP.unsubs=[];
}

(async function boot(){
  let saved=null;
  try{saved=localStorage.getItem(LANG_KEY);}catch(e){}
  const b=(navigator.language||'en').slice(0,2);
  LANG=SUPPORTED.includes(saved)?saved:(SUPPORTED.includes(b)?b:'en');
  document.documentElement.lang=LANG;
  document.body.classList.toggle('lang-am',LANG==='am');

  const sess=readSession();
  if(!isSessionRecordValid(sess)){
    try{sessionStorage.setItem('__redirectReason','expired');}catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }
  const user=await new Promise((resolve)=>{
    const unsub=onAuthStateChanged(auth,(u)=>{unsub();resolve(u);});
  });
  if(!user||user.uid!==sess.uid){
    try{sessionStorage.setItem('__redirectReason','expired');}catch(e){}
    clearSession();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user=user;
  try{
    const snap=await getDoc(doc(db,'users',user.uid));
    if(!snap.exists()) throw new Error('no-user-doc');
    const d=snap.data();
    if(d.status==='inactive') throw new Error('inactive');
    APP.profile={id:snap.id,...d,email:user.email||''};
  }catch(e){
    try{sessionStorage.setItem('__redirectReason','expired');}catch(e){}
    clearSession();
    try{await signOut(auth);}catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }
  const allowed=['super_admin','admin','manager','cashier','teller','accountant','auditor'];
  if(!allowed.includes(APP.profile.role)){
    window.location.replace('dashboard.html');
    return;
  }
  await loadSessionTimeout();
  await loadDashboardSettings();

  try{
    const cfg=await getDoc(doc(db,'settings','system'));
    if(cfg.exists()){
      const d=cfg.data();
      if(d.currency) APP.currency=d.currency;
      if(d.saccoName&&String(d.saccoName).trim()) APP.saccoName=String(d.saccoName).trim();
      loansPenaltyRate=d.loansPenaltyRate!==undefined?num(d.loansPenaltyRate)/100:(num(d.penaltyRate)||5)/100;
    }
  }catch(e){}

  initWorkarea();
  renderShell();
  renderMain();
  setTimeout(()=>document.getElementById('loader')?.classList.add('hide'),150);
  attachListeners();
  startSessionWatcher();
})();
