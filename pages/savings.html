            <div class="field"><label>${esc(t('notesLabel'))}</label>
              <textarea data-field="notes" placeholder="${esc(t('notesPlaceholder'))}">${esc(d.notes || '')}</textarea>
            </div>
          `;
        },
        validate: (d) => {
          if (!num(d.amount) || num(d.amount) <= 0) return t('invalidAmount');
          if (d.type === 'deposit' && minSavingsAmount > 0 && num(d.amount) < minSavingsAmount)
            return `${t('amountTooSmall')} ETB ${minSavingsAmount.toFixed(2)}`;
          if (d.type === 'withdrawal') {
            const c = customerById(d.customerId);
            const bal = c ? customerBalance(c) : 0;
            if (num(d.amount) > bal) return t('insufficientBalance');
          }
          if (d._penaltyBlocked) return t('savingsBlocked');
          if (d.paymentMethod === 'bank') {
            if (!d.bankCode) return t('bankRequired');
            if (!d.transferDate) return t('transferDateRequired');
            if (!d.ttNumber || !d.ttNumber.trim()) return t('ttRequired');
            if (ttStatus.ok === false) {
              if (ttStatus.reason === 'duplicate') return t('duplicateTT');
              return 'Please wait — checking TT number.';
            }
          }
          if (d.paymentMethod === 'mobile') {
            if (!d.mobileProvider) return t('providerRequired');
            if (!d.transferDate) return t('transferDateRequired');
            if (!d.ttNumber || !d.ttNumber.trim()) return t('ttRequired');
            if (ttStatus.ok === false) {
              if (ttStatus.reason === 'duplicate') return t('duplicateTT');
              return 'Please wait — checking TT number.';
            }
          }
          return null;
        },
        after: (root, data, refresh) => {
          root.querySelectorAll('[data-set-type]').forEach(btn => {
            btn.addEventListener('click', () => { data.type = btn.dataset.setType; refresh(); });
          });
          const amt = root.querySelector('#wiz-amount');
          amt?.addEventListener('input', () => { data.amount = amt.value; });
          amt?.addEventListener('blur', () => refresh());
          const methodSel = root.querySelector('#wiz-method');
          methodSel?.addEventListener('change', () => { data.paymentMethod = methodSel.value; refresh(); });
          const bankSel = root.querySelector('#wiz-bank');
          bankSel?.addEventListener('change', () => { data.bankCode = bankSel.value; data.bankName = bankLabel(bankSel.value); });
          const mobileSel = root.querySelector('#wiz-mobile');
          mobileSel?.addEventListener('change', () => { data.mobileProvider = mobileSel.value; data.mobileProviderName = mobileProviderLabel(mobileSel.value); });
          if (data.paymentMethod === 'bank' || data.paymentMethod === 'mobile') {
            setupTTDuplicateCheck(root, 'wiz-tt', (status) => { Object.assign(ttStatus, status); }, isEdit ? t0.id : null);
          }
          const upload = root.querySelector('#wiz-receipt-upload');
          const fileIn = root.querySelector('#wiz-receipt-input');
          const btn = root.querySelector('#wiz-receipt-btn');
          const clear = root.querySelector('#wiz-receipt-clear');
          if (upload && fileIn) {
            const openPicker = (e) => { e.stopPropagation(); fileIn.click(); };
            upload.addEventListener('click', openPicker);
            btn?.addEventListener('click', openPicker);
            fileIn.addEventListener('change', async () => {
              const f = fileIn.files?.[0];
              if (!f) return;
              if (f.size > 3 * 1024 * 1024) { toast('Photo must be under 3 MB', 'error'); return; }
              if (!f.type.startsWith('image/')) { toast('Please choose an image file', 'error'); return; }
              try {
                const dataURL = await fileToDataURL(f);
                data._receiptPhoto = dataURL;
                refresh();
              } catch(e) { toast('Could not read image', 'error'); }
            });
          }
          clear?.addEventListener('click', (e) => {
            e.stopPropagation();
            data._receiptPhoto = null;
            if (fileIn) fileIn.value = '';
            refresh();
          });
        }
      },
      {
        label: t('stepReview'), title: t('stepReviewTitle'),
        render: (d) => {
          const c = customerById(d.customerId);
          const amt = num(d.amount);
          const isDep = d.type === 'deposit';
          const isBank = d.paymentMethod === 'bank';
          const isMobile = d.paymentMethod === 'mobile';
          const recBy = isEdit ? (t0.createdByName || recordedByName) : recordedByName;
          const appBy = (d.status === 'approved') ? (isEdit ? (t0.approvedByName || recBy) : recBy) : '';
          return `
            <div style="padding:16px;background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid var(--border);border-radius:14px;margin-bottom:18px;display:flex;align-items:center;gap:16px">
              <div style="width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px">
                ${c?.photoURL ? `<img src="${esc(c.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover">` : esc(initials(customerName(c)))}
              </div>
              <div style="min-width:0">
                <div style="font-size:16px;font-weight:800">${esc(customerName(c))}</div>
                ${c?.customerId ? `<div style="font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px">${esc(c.customerId)}</div>` : ''}
              </div>
              <div style="margin-left:auto;text-align:right">
                <div style="font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em">${esc(t('reviewAmount'))}</div>
                <div style="font-size:22px;font-weight:800;font-family:ui-monospace,monospace;color:${isDep ? '#067647' : '#b42318'}">
                  ${isDep ? '+' : '−'} ${esc(money(amt))}
                </div>
              </div>
            </div>

            <div class="review">
              <div class="review__row"><span class="review__k">${esc(t('reviewCustomer'))}</span><span class="review__v">${esc(customerName(c))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewType'))}</span><span class="review__v"><span class="tag ${isDep ? 'tag--green' : 'tag--red'}">${esc(txTypeLabel(d.type))}</span></span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewAmount'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(money(amt))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewDate'))}</span><span class="review__v">${esc(fmtDate(d.date))}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewMethod'))}</span><span class="review__v">${esc(methodLabel(d.paymentMethod))}</span></div>
              ${isBank && d.bankName ? `<div class="review__row"><span class="review__k">${esc(t('bank'))}</span><span class="review__v">${esc(d.bankName)}</span></div>` : ''}
              ${isMobile && d.mobileProviderName ? `<div class="review__row"><span class="review__k">${esc(t('provider'))}</span><span class="review__v">${esc(d.mobileProviderName)}</span></div>` : ''}
              ${(isBank || isMobile) && d.ttNumber ? `<div class="review__row"><span class="review__k">${esc(t('ttNumberLabel'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(d.ttNumber)}</span></div>` : ''}
              ${(isBank || isMobile) && d.transferDate ? `<div class="review__row"><span class="review__k">${esc(t('transferDateLabel'))}</span><span class="review__v">${esc(fmtDate(d.transferDate))}</span></div>` : ''}
              ${!isBank && !isMobile && d.reference ? `<div class="review__row"><span class="review__k">${esc(t('reviewRef'))}</span><span class="review__v" style="font-family:ui-monospace,monospace">${esc(d.reference)}</span></div>` : ''}
              <div class="review__row"><span class="review__k">${esc(t('reviewStatus'))}</span><span class="review__v"><span class="tag ${statusCls(d.status)}">${esc(statusLabel(d.status))}</span></span></div>
              ${d.notes ? `<div class="review__row"><span class="review__k">${esc(t('reviewNotes'))}</span><span class="review__v">${esc(d.notes)}</span></div>` : ''}
              <div class="review__row"><span class="review__k">${esc(t('reviewRecordedBy'))}</span>
                <span class="review__v" style="font-weight:800;color:#0b5cab"><i class="fas fa-user-edit" style="margin-right:6px"></i>${esc(recBy || '—')}</span></div>
              <div class="review__row"><span class="review__k">${esc(t('reviewApprovedBy'))}</span>
                <span class="review__v" style="font-weight:800;color:${appBy ? '#067647' : 'var(--muted)'}">
                  ${appBy ? `<i class="fas fa-check-circle" style="margin-right:6px"></i>${esc(appBy)}` : `<i class="fas fa-hourglass-half" style="margin-right:6px"></i>${esc(t('notApprovedYet'))}`}
                </span></div>
              ${d._receiptPhoto ? `<div class="review__row"><span class="review__k">${esc(t('receipt'))}</span>
                <span class="review__v"><img src="${esc(d._receiptPhoto)}" class="receipt-thumb" alt="receipt" onclick="window.open(this.src,'_blank')"></span></div>` : ''}
            </div>
          `;
        }
      }
    ],
    onFinish: async (d) => {
      const c = customerById(d.customerId);
      if (!c) throw new Error('Customer no longer exists.');
      const amt = num(d.amount);
      if (amt <= 0) throw new Error(t('invalidAmount'));
      if (d.type === 'deposit' && minSavingsAmount > 0 && amt < minSavingsAmount)
        throw new Error(`${t('amountTooSmall')} ETB ${minSavingsAmount.toFixed(2)}`);

      const isBank = d.paymentMethod === 'bank';
      const isMobile = d.paymentMethod === 'mobile';

      if (isBank || isMobile) {
        if (!d.transferDate) throw new Error(t('transferDateRequired'));
        if (!d.ttNumber || !d.ttNumber.trim()) throw new Error(t('ttRequired'));
        try {
          const snap = await getDocs(query(collection(db,'transactions'), where('ttNumber','==',d.ttNumber.trim()), limit(3)));
          for (const docSnap of snap.docs) {
            if (isEdit && docSnap.id === t0.id) continue;
            throw new Error(t('duplicateTT'));
          }
        } catch(e) { if (e.message === t('duplicateTT')) throw e; }
        if (isBank && !d.bankCode) throw new Error(t('bankRequired'));
        if (isMobile && !d.mobileProvider) throw new Error(t('providerRequired'));
      }

      const isDep = d.type === 'deposit';
      const type = isDep ? 'savings' : 'withdrawal';

      let running = 0;
      APP.transactions.forEach(tx => {
        if (isEdit && tx.id === t0.id) return;
        if (!isSavingsTx(tx)) return;
        const cid = c.customerId || c.id;
        const match = tx.customerId === cid || tx.memberId === cid || tx.customerId === c.id || tx.memberId === c.id;
        if (!match) return;
        const status = String(tx.status || '').toLowerCase();
        if (!['approved','completed','paid','printed','done'].includes(status)) return;
        const type2 = String(tx.type || '').toLowerCase();
        if (type2 === 'savings' || type2 === 'deposit') running += num(tx.amount);
        else if (type2 === 'withdrawal' || type2 === 'leaving_withdrawal') running -= num(tx.amount);
      });
      running = Math.max(0, running);
      const newBalAfter = isDep ? running + amt : Math.max(0, running - amt);

      const status = d.status || 'approved';
      const recordedByName = APP.profile?.fullName || APP.profile?.name || '';
      const payload = {
        type, amount: amt,
        customerId: c.customerId || c.id,
        memberId: c.customerId || c.id,
        customerDocId: c.id,
        customerName: customerName(c),
        date: d.date || new Date().toISOString().slice(0,10),
        paymentMethod: d.paymentMethod || 'cash',
        reference: (d.reference || '').trim(),
        notes: (d.notes || '').trim(),
        status, balanceAfter: newBalAfter,
        districtId: c.districtId || null,
        districtName: c.districtName || districtById(c.districtId)?.name || null,
        branchId: c.branchId || null,
        branchName: c.branchName || branchById(c.branchId)?.name || null,
        updatedAt: serverTimestamp(),
        bankCode: isBank ? d.bankCode : null,
        bankName: isBank ? (d.bankName || bankLabel(d.bankCode)) : null,
        mobileProvider: isMobile ? d.mobileProvider : null,
        mobileProviderName: isMobile ? (d.mobileProviderName || mobileProviderLabel(d.mobileProvider)) : null,
        ttNumber: (isBank || isMobile) ? d.ttNumber.trim() : null,
        transferDate: (isBank || isMobile) ? d.transferDate : null,
        receiptPhoto: d._receiptPhoto || null
      };

      if (status === 'approved') {
        if (isEdit) {
          if (!t0.approvedByName) {
            payload.approvedBy = APP.profile.id;
            payload.approvedByName = recordedByName;
            payload.approvedAt = serverTimestamp();
          }
        } else {
          payload.approvedBy = APP.profile.id;
          payload.approvedByName = recordedByName;
          payload.approvedAt = serverTimestamp();
        }
      }

      if (isEdit) {
        await updateDoc(doc(db,'transactions', t0.id), payload);
      } else {
        payload.createdAt = serverTimestamp();
        payload.createdBy = APP.profile.id;
        payload.createdByName = recordedByName;
        payload.printCount = 0;
        payload.printStatus = 'not_printed';
        await setDoc(doc(collection(db,'transactions')), payload);
      }
    }
  });
}

/* AMOUNT TO WORDS */
const ONES = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function numberToWords(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'Zero';
  const chunk = (x) => {
    let s = '';
    if (x >= 100) { s += ONES[Math.floor(x/100)] + ' Hundred'; x %= 100; if (x) s += ' '; }
    if (x >= 20) { s += TENS[Math.floor(x/10)]; x %= 10; if (x) s += '-' + ONES[x]; }
    else if (x > 0) s += ONES[x];
    return s;
  };
  const units = [{v:1e9,n:'Billion'},{v:1e6,n:'Million'},{v:1e3,n:'Thousand'},{v:1,n:''}];
  const parts = [];
  for (const u of units) {
    if (n >= u.v) {
      const c = Math.floor(n / u.v);
      n %= u.v;
      parts.push(chunk(c) + (u.n ? ' ' + u.n : ''));
    }
  }
  return parts.join(' ').replace(/\s+/g, ' ').trim();
}
function amountInWords(amount, currency) {
  const n = Number(amount) || 0;
  const birr = Math.floor(n);
  const cents = Math.round((n - birr) * 100);
  let s = numberToWords(birr) + ' ' + (currency || 'ETB');
  if (cents > 0) s += ' and ' + numberToWords(cents) + ' Cents';
  return s + ' Only';
}

async function printSlip(tx) {
  if (!tx) return;
  if (!canPrint()) { toast(t('noPermission'), 'error'); return; }
  const prevCount = Number(tx.printCount || 0);
  const newCount = prevCount + 1;
  const watermarkText = newCount === 1 ? t('original') : t('copy');
  try {
    await updateDoc(doc(db,'transactions', tx.id), {
      printCount: newCount,
      printStatus: 'printed',
      lastPrintedAt: serverTimestamp(),
      lastPrintedBy: APP.profile.id,
      lastPrintedByName: APP.profile.fullName || APP.profile.name || ''
    });
    tx.printCount = newCount;
    tx.printStatus = 'printed';
    tx.lastPrintedByName = APP.profile.fullName || APP.profile.name || '';
    tx.lastPrintedAt = new Date();
    if (newCount === 1) toast(t('firstPrint'), 'info');
    else toast(t('reprint') + ' ×' + newCount, 'warning');
  } catch(e) { console.warn('[print update]', e); toast(t('printError'), 'error'); }

  closeSlipOverlay();
  const host = document.getElementById('slip-print-host');
  host.innerHTML = buildSlipHtml(tx, watermarkText);

  const overlay = document.createElement('div');
  overlay.className = 'slip-overlay';
  overlay.id = 'slip-overlay';
  overlay.innerHTML = `
    <div class="slip-toolbar">
      <div class="slip-toolbar__title">
        <i class="fas fa-receipt" style="color:var(--primary)"></i>
        ${esc(t('slipPreview'))}
        <span class="tag ${newCount === 1 ? 'tag--print-orig' : 'tag--print-copy'}" style="margin-left:6px">${esc(watermarkText)}</span>
      </div>
      <button class="primary" id="slip-print-btn"><i class="fas fa-print"></i> ${esc(t('printSlip'))}</button>
      <button id="slip-close-btn"><i class="fas fa-times"></i> Close</button>
    </div>
    ${buildSlipHtml(tx, watermarkText)}`;
  document.body.appendChild(overlay);
  document.getElementById('slip-print-btn').addEventListener('click', () => {
    const h = document.getElementById('slip-print-host');
    h.innerHTML = buildSlipHtml(tx, watermarkText);
    setTimeout(() => window.print(), 60);
  });
  document.getElementById('slip-close-btn').addEventListener('click', closeSlipOverlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSlipOverlay(); });
  escHandler = (e) => { if (e.key === 'Escape') closeSlipOverlay(); };
  document.addEventListener('keydown', escHandler);
}
function closeSlipOverlay() {
  const el = document.getElementById('slip-overlay');
  if (el) el.remove();
  if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
  const host = document.getElementById('slip-print-host');
  if (host) host.innerHTML = '';
}

/* LISTENERS */
function attachListeners() {
  stopListeners();
  const watch = (coll, key, orderField) => {
    let ref = collection(db, coll);
    if (orderField) ref = query(ref, orderBy(orderField, 'desc'), limit(1000));
    const unsub = onSnapshot(ref,
      (snap) => {
        APP[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMain();
      },
      (err) => { console.warn('[listen]', coll, err.code, err.message); renderMain(); }
    );
    APP.unsubs.push(unsub);
  };
  watch('customers', 'customers');
  watch('districts', 'districts');
  watch('branches', 'branches');
  watch('transactions', 'transactions', 'createdAt');
  watch('shares', 'shares');
}
function stopListeners() {
  APP.unsubs.forEach(u => { try { u(); } catch(e){} });
  APP.unsubs = [];
}

/* BOOT */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  if (!isSessionRecordValid(sess)) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const user = await new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
  });
  if (!user || user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    const d = snap.data();
    if (d.status === 'inactive') throw new Error('inactive');
    APP.profile = { id: snap.id, ...d, email: user.email || '' };
  } catch(e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  // Guard: role must be allowed
  const allowed = ['super_admin','admin','manager','cashier','teller','accountant','auditor','member'];
  if (!allowed.includes(APP.profile.role)) {
    window.location.replace('dashboard.html');
    return;
  }

  await loadSessionTimeout();

  try {
    const cfg = await getDoc(doc(db, 'settings', 'system'));
    if (cfg.exists()) {
      const d = cfg.data();
      if (d.currency) APP.currency = d.currency;
      if (d.saccoName && String(d.saccoName).trim()) APP.saccoName = String(d.saccoName).trim();
      if (d.shortName && String(d.shortName).trim()) APP.shortName = String(d.shortName).trim();
      minSavingsAmount = Number(d.minSavingsAmount ?? d.minSavingsBalance ?? d.minSavings ?? 0);
      if (d.shareValue !== undefined) { const sv = Number(d.shareValue); if (isFinite(sv) && sv > 0) shareValue = sv; }
      savingsPenaltyRate = d.savingsPenaltyRate !== undefined ? Number(d.savingsPenaltyRate)/100 : (Number(d.penaltyRate)||5)/100;
      if (d.deductPenaltyFromSavings !== undefined) deductPenaltyFromSavings = !!d.deductPenaltyFromSavings;
      if (Array.isArray(d.penaltyPaymentSources) && d.penaltyPaymentSources.length) penaltyPaymentSources = d.penaltyPaymentSources.map(x => String(x).toLowerCase().trim());
    }
  } catch(e){}

  initWorkarea();

  renderShell();
  renderMain();

  setTimeout(() => document.getElementById('loader')?.classList.add('hide'), 150);

  attachListeners();
  startSessionWatcher();
})();
