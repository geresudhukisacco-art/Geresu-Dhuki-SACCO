    }
  });
}

/* ============ LOGOUT ============ */
function showLogoutModal() {
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  root.innerHTML = `
    <div class="modal" style="max-width:420px">
      <div class="modal__head">
        <div><div class="modal__title">${esc(t('logoutTitle'))}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body" style="padding-top:14px">
        <p style="color:var(--text-soft);font-size:14px">${esc(t('logoutText'))}</p>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="confirm-logout">
          <i class="fas fa-sign-out-alt"></i> ${esc(t('logout'))}
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(root);
  root.addEventListener('click', (e) => { if (e.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  document.getElementById('confirm-logout').addEventListener('click', async () => {
    if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
    awayStartedAt = null;
    try { sessionStorage.clear(); } catch(e){}
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
  });
}

/* ============ LANGUAGE ============ */
function setLang(lang) {
  if (!SUPPORTED.includes(lang)) lang = FALLBACK;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

/* ============ LISTENERS ============ */
function attachListeners() {
  stopListeners();
  const watch = (coll, key, orderField) => {
    let ref = collection(db, coll);
    if (orderField) ref = query(ref, orderBy(orderField, 'desc'), limit(1000));
    const unsub = onSnapshot(ref,
      (snap) => {
        APP[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMain();
      },
      (err) => { console.warn('[listen]', coll, err.code, err.message); renderMain(); }
    );
    APP.unsubs.push(unsub);
  };
  watch('customers',    'customers');
  watch('districts',    'districts');
  watch('branches',     'branches');
  watch('transactions', 'transactions', 'createdAt');
  watch('loans',        'loans',        'createdAt');
  watch('shares',       'shares');
}
function stopListeners() {
  APP.unsubs.forEach(u => { try { u(); } catch(e){} });
  APP.unsubs = [];
}

/* ============ SETTINGS ============ */
async function loadSettings() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const d = snap.data();
      APP.settings.defaultInterestRate = d.defaultInterestRate || 10;
      APP.settings.maxLoanAmount        = d.maxLoanAmount || 50000;
      APP.settings.maxLoanMultiplier    = d.maxLoanMultiplier || 3;
      APP.settings.penaltyRate          = d.penaltyRate || 5;
      APP.settings.gracePeriod          = d.gracePeriod || 7;
      if (d.defaultLoanType) APP.settings.defaultLoanType = String(d.defaultLoanType);
      const rawMaxLoans = d.maxLoansPerCustomer ?? d.maxLoansToBorrow;
      if (rawMaxLoans !== undefined && rawMaxLoans !== null && rawMaxLoans !== '') {
        const n = Number(rawMaxLoans);
        if (!isNaN(n) && n >= 1) APP.settings.maxLoansPerCustomer = Math.floor(n);
      }
      if (d.currency) APP.currency = d.currency;
      if (d.saccoName) APP.saccoName = d.saccoName;
      if (d.shortName) APP.shortName = d.shortName;
    }
  } catch(e){ console.warn('settings', e.message); }
}

/* ============ BOOT ============ */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  if (!isSessionRecordValid(sess)) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const user = await new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
  });
  if (!user || user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    APP.profile = { id: snap.id, ...snap.data(), email: user.email || '' };
    if (APP.profile.status === 'inactive') throw new Error('inactive');
  } catch (e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  await loadSessionTimeout();
  await loadSettings();

  renderShell();
  renderMain();

  setTimeout(() => document.getElementById('loader')?.classList.add('hide'), 150);

  attachListeners();
  startSessionWatcher();
})();

console.log('[sacco] loans page ready — interest types, active-loan guard, grid+table');
</script>
