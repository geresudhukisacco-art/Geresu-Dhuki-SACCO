<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>
<script type="importmap">
{ "imports": {
  "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --gold:#d4a845;--gold-light:#f0d68a;--gold-dark:#b8922f;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;--info:#2196f3;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;--violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px;--r-lg:20px;--r-full:999px;
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
html.theme-dark body{background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.14),transparent 35%),radial-gradient(circle at 90% 80%,rgba(25,169,116,.14),transparent 35%),var(--bg);}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar__brand{position:relative;display:flex;align-items:center;gap:14px;
  padding:22px;border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.97);
  display:grid;place-items:center;padding:5px;overflow:hidden;flex-shrink:0;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;transition:opacity .18s;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);
  border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer;z-index:10;}
.sidebar__collapse i{font-size:10px;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;
  font-size:14px;font-weight:600;color:rgba(255,255,255,.78);
  margin-bottom:3px;white-space:nowrap;cursor:pointer;position:relative;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;text-align:center;flex-shrink:0;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);
  position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);
  background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
.sidebar__logout i{width:20px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);
  align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;
  border-radius:var(--r-full);background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);white-space:nowrap;}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
html.theme-dark .dropdown__panel{background:#0f172a;border-color:#1e293b;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);
  text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
html.theme-dark .main{background:#0b1220;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 20px;margin-bottom:20px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
html.theme-dark .breadcrumb{background:#0f172a;border-color:#1e293b;}
.breadcrumb__item{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb__item.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb__item.is-link{cursor:pointer;}
.breadcrumb__item.is-link:hover{background:#dbeafe;color:var(--primary);}
.section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:"";flex:1;height:1px;background:var(--border);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px;}
.stats--compact{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
.stats--compact .stat{padding:14px 16px;}
html.theme-dark .stat{background:#0f172a;border-color:#1e293b;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue  {--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green {--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--gold  {--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#7c3aed,#a78bfa);--ic:#f0eaff;--ifc:#6d28d9;}
.stat--red   {--c1:linear-gradient(90deg,#dc2626,#e74c5c);--ic:#fef3f2;--ifc:#b42318;}
.stat--teal  {--c1:linear-gradient(90deg,#0e7490,#4dd4c4);--ic:#e0f5f7;--ifc:#0e7490;}
.stat--orange{--c1:linear-gradient(90deg,#e65100,#f57c00);--ic:#fff1e6;--ifc:#bf360c;}
.stat--indigo{--c1:linear-gradient(90deg,#3949ab,#5c6bc0);--ic:#e8eaf6;--ifc:#283593;}
.stat--pink  {--c1:linear-gradient(90deg,#db2777,#f472b6);--ic:#fdeef5;--ifc:#be185d;}
.stat--purple{--c1:linear-gradient(90deg,#6d28d9,#a78bfa);--ic:#f0eaff;--ifc:#5b21b6;}
.stat--gray  {--c1:linear-gradient(90deg,#4b5563,#6b7280);--ic:#f3f4f6;--ifc:#374151;}
.stat__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.stats--compact .stat__head{margin-bottom:8px;}
.stat__label{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.35;}
.stats--compact .stat__label{font-size:10.5px;}
.stat__icon{width:44px;height:44px;border-radius:13px;background:var(--ic);color:var(--ifc);
  display:grid;place-items:center;flex-shrink:0;font-size:18px;}
.stats--compact .stat__icon{width:34px;height:34px;border-radius:10px;font-size:14px;}
.stat__value{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--text);word-break:break-word;}
.stats--compact .stat__value{font-size:20px;}
.card{background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;}
html.theme-dark .card{background:#0f172a;border-color:#1e293b;}
.card__head{display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
html.theme-dark .card__head{border-bottom-color:#1e293b;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
html.theme-dark .toolbar{background:#111a2c;border-bottom-color:#1e293b;}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:320px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);
  border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
html.theme-dark .toolbar__search input{background:#1a2433;color:#e4e8f0;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:11px;
  background:#fff;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;min-width:140px;font-family:inherit;}
html.theme-dark .toolbar select{background:#1a2433;color:#e4e8f0;border-color:#1e293b;}
.toolbar select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:46px;padding:0 20px;border-radius:13px;
  border:1px solid #d9dee7;background:#fff;
  color:var(--text-soft);font-size:14px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:all .15s;}
html.theme-dark .btn{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;min-width:900px;}
.tbl thead th{background:#f8fafc;font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);padding:13px 20px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap;}
html.theme-dark .tbl thead th{background:#111a2c;border-bottom-color:#1e293b;}
.tbl tbody td{padding:14px 20px;border-bottom:1px solid var(--border-soft);
  font-size:13px;color:var(--text-soft);vertical-align:middle;}
html.theme-dark .tbl tbody td{border-bottom-color:#1a2433;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:#f8fafc;}
html.theme-dark .tbl tbody tr:hover td{background:#111a2c;}
.tbl .name{font-weight:800;color:var(--text);}
.tbl .muted{font-size:11.5px;color:var(--muted);}
.tbl .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;}
.cust-cell{display:flex;align-items:center;gap:12px;}
.cust-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;font-weight:800;font-size:12px;
  display:grid;place-items:center;overflow:hidden;position:relative;}
.cust-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-full);font-size:11px;font-weight:800;text-transform:uppercase;white-space:nowrap;}
.tag--green{background:#ecfdf3;color:#067647;}
.tag--gold{background:#fdf5e0;color:#b8860b;}
.tag--red{background:#fef3f2;color:#b42318;}
.tag--violet{background:#f0eaff;color:#5b21b6;}
.tag--gray{background:var(--border-soft);color:var(--text-soft);}
.tag--blue{background:#eaf3fc;color:#0b5cab;}
.tag--teal{background:#e0f5f7;color:#0e7490;}
.tag--orange{background:#fff1e6;color:#bf360c;}
.tag--pink{background:#fdeef5;color:#be185d;}
.tag--indigo{background:#e8eaf6;color:#283593;}
.tag--purple{background:#f3e8ff;color:#6b21a8;}
.tag--login{background:#e8eaf6;color:#1a237e;}
.tag--logout{background:#f3f4f6;color:#374151;}
.tag--created{background:#d1fae5;color:#065f46;}
.tag--updated{background:#dbeafe;color:#1e40af;}
.tag--deleted{background:#fee2e2;color:#991b1b;}
.tag--approved{background:#fef3c7;color:#92400e;}
.tag--rejected{background:#fce7f3;color:#831843;}
.tag--generated{background:#ede9fe;color:#6b21a8;}
.tag--printed{background:#ccfbf1;color:#115e59;}
.tag--penalty_paid{background:#dbeafe;color:#0d47a1;}
.tag--penalty_approved{background:#dcfce7;color:#15803d;}
.tag--penalty_rejected{background:#fecaca;color:#7f1d1d;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.row-actions button{height:34px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;gap:5px;
  color:var(--text-soft);background:var(--bg-soft);border:1px solid var(--border);transition:.15s;font-size:12px;font-weight:700;}
html.theme-dark .row-actions button{background:#111a2c;border-color:#1e293b;color:#c5cdd9;}
.row-actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.row-actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.empty{padding:56px 24px;text-align:center;}
.empty i{font-size:44px;color:#cbd5e1;margin-bottom:14px;display:block;}
.empty__title{font-size:16px;font-weight:800;margin-bottom:6px;}
.empty__text{font-size:13.5px;color:var(--muted);max-width:420px;margin:0 auto;line-height:1.6;}
.pagination{display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-top:1px solid var(--border-soft);gap:14px;flex-wrap:wrap;}
.pagination__info{font-size:12.5px;color:var(--muted);font-weight:600;}
.pagination__controls{display:flex;gap:6px;align-items:center;}
.pagination__controls button{height:34px;padding:0 12px;border:1px solid var(--border);background:#fff;
  border-radius:9px;font-size:12.5px;font-weight:700;color:var(--text-soft);transition:.15s;min-width:34px;}
html.theme-dark .pagination__controls button{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.pagination__controls button:hover:not(:disabled){background:var(--bg-soft);border-color:var(--primary);color:var(--primary);}
.pagination__controls button:disabled{opacity:.4;cursor:not-allowed;}
.pagination__controls button.is-current{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-color:transparent;}
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.55);
  backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;overflow-y:auto;}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:0 30px 60px rgba(20,40,70,.12);
  width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;margin:auto;}
html.theme-dark .modal{background:#0f172a;}
.modal--lg{max-width:760px;}
.modal--sm{max-width:440px;}
.modal__head{padding:24px 28px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
html.theme-dark .modal__head{border-bottom-color:#1e293b;}
.modal__title{font-size:20px;font-weight:800;letter-spacing:-.4px;}
.modal__sub{font-size:13.5px;color:var(--muted);margin-top:6px;}
.modal__close{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--muted);cursor:pointer;flex-shrink:0;}
.modal__close:hover{background:var(--border-soft);}
.modal__close i{font-size:16px;}
.modal__body{padding:24px 28px;overflow-y:auto;flex:1;}
.modal__foot{padding:18px 28px;border-top:1px solid var(--border-soft);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;}
html.theme-dark .modal__foot{border-top-color:#1e293b;}
.modal__foot .spacer{flex:1;}
.review{background:#f8fafc;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
html.theme-dark .review{background:#111a2c;}
.review__row{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid #eef2f7;font-size:13px;}
html.theme-dark .review__row{border-bottom-color:#1a2433;}
.review__row:last-child{border-bottom:0;}
.review__k{color:var(--muted);width:170px;flex-shrink:0;font-weight:700;font-size:12.5px;}
.review__v{font-weight:600;word-break:break-word;flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;}
.review__v.not-mono{font-family:inherit;}
.detail-user-head{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:16px;
  background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid var(--border);border-radius:14px;}
html.theme-dark .detail-user-head{background:linear-gradient(135deg,#111a2c,#0f172a);}
.detail-user-avatar{width:56px;height:56px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;overflow:hidden;position:relative;

html.theme-dark .detail-user-avatar{border-color:#1e293b;}

.detail-user-info{min-width:0;}
.detail-user-name{font-size:16px;font-weight:800;color:var(--text);line-height:1.2;word-break:break-word;}
.detail-user-meta{font-size:12px;color:var(--text-soft);margin-top:3px;font-weight:600;word-break:break-word;}
.changes-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.changes-table thead th{background:var(--bg-soft);padding:8px 12px;text-align:left;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);}
.changes-table tbody td{padding:8px 12px;border-bottom:1px solid var(--border-soft);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-word;}
.changes-table tbody tr:last-child td{border-bottom:none;}
.changes-table tbody td.key{font-family:inherit;font-weight:700;color:var(--text);}
.changes-table tbody td.old{color:var(--danger);}
.changes-table tbody td.new{color:var(--success);}
.alert{display:flex;gap:12px;padding:13px 16px;border-radius:11px;
  font-size:13px;line-height:1.55;margin-bottom:18px;border:1px solid transparent;}
.alert i{font-size:16px;flex-shrink:0;margin-top:2px;}
.alert--warning{background:#fdf5e0;color:#7a5210;border-color:#f0dcb0;}
.alert--info{background:#eaf3fc;color:#0b5cab;border-color:#bdd7f2;}
.spinner-sm{width:16px;height:16px;border:2px solid currentColor;
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
.toasts{position:fixed;top:24px;right:24px;z-index:300;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 48px);}
.toast{background:var(--text);color:#fff;padding:13px 18px;border-radius:12px;
  box-shadow:0 12px 32px rgba(20,40,70,.2);font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:12px;pointer-events:auto;
  animation:toastIn .22s cubic-bezier(.4,0,.2,1);max-width:400px;}
@keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
.toast--success{background:#067647;}
.toast--error{background:#b42318;}
.toast--warning{background:#b8860b;}
.toast--info{background:#0b5cab;}
.toast i{font-size:16px;flex-shrink:0;}
.overlay-mobile{display:none;position:fixed;inset:0;background:rgba(13,21,32,.45);z-index:25;}
body.sb-open .overlay-mobile{display:block;}
@media (max-width:900px){
  .app{grid-template-columns:1fr !important;grid-template-areas:"topbar" "main";}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w) !important;z-index:31;
    transform:translateX(-100%);transition:transform .28s;}
  body.sb-open .sidebar{transform:translateX(0);}
  body.sidebar-collapsed .sidebar{width:var(--sidebar-w) !important;}
  body.sidebar-collapsed .sidebar__identity{opacity:1;pointer-events:auto;}
  body.sidebar-collapsed .nav-item__label{opacity:1;pointer-events:auto;}
  body.sidebar-collapsed .nav-item{justify-content:flex-start;padding:11px 13px;}
  body.sidebar-collapsed .nav-item:hover::after{display:none;}
  body.sidebar-collapsed .sidebar__logout{justify-content:flex-start;padding:10px 13px;}
  body.sidebar-collapsed .sidebar__logout span{display:inline;}
  .sidebar__collapse{display:none;}
  .topbar__menu{display:inline-flex;}
  .user-btn__name,.user-btn__role{display:none;}
  .user-btn{padding:4px;}
  .main{padding:18px;}
  .page-head__title{font-size:24px;letter-spacing:-1px;}
  .lang-toggle button{padding:5px 9px;font-size:10px;}
  .toolbar__right{margin-left:0;width:100%;}
  .toolbar__right .btn{flex:1;}
  .modal__head, .modal__body, .modal__foot{padding-left:18px;padding-right:18px;}
  .stats,.stats--compact{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .stat{padding:16px;}
  .stats--compact .stat{padding:12px;}
  .stat__value{font-size:20px;}
  .review__row{flex-direction:column;gap:4px;}
  .review__v{text-align:left;}
}
@media (max-width:520px){
  .page-head__title{font-size:20px;}
  .toolbar{padding:14px 16px;}
  .tbl thead th,.tbl tbody td{padding:11px 14px;}
}

const SESSION_KEY = "sacco.session";
const DEFAULT_SESSION_MINUTES = 30;
let SESSION_MINUTES = null;
let awayStartedAt = null;
let awayCheckInterval = null;

function readSession() { try { const raw = sessionStorage.getItem(SESSION_KEY); if (!raw) return null; const s = JSON.parse(raw); return (s && s.uid) ? s : null; } catch (e) { return null; } }
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function isSessionRecordValid(s) { return !!(s && s.uid); }
function getSessionMs() {
  const s = readSession();
  const mins = (SESSION_MINUTES != null && SESSION_MINUTES > 0)
    ? SESSION_MINUTES
    : ((s && s.minutes) || DEFAULT_SESSION_MINUTES);
  return Math.max(1, mins) * 60 * 1000;
}
function readCachedProfile() { try { const raw = sessionStorage.getItem(PROFILE_CACHE_KEY); if (!raw) return null; const p = JSON.parse(raw); return (p && p.uid) ? p : null; } catch (e) { return null; } }
function writeCachedProfile() {
  if (!APP.profile) return;
  try {
    const payload = {
      uid: APP.profile.id || APP.user?.uid || '',
      role: APP.profile.role || 'viewer',
      email: APP.profile.email || '',
      name: APP.profile.fullName || APP.profile.name || 'User',
      photoURL: APP.profile.photoURL || null,
      districtId: APP.profile.districtId || '',
      districtName: APP.profile.districtName || '',
      branchId: APP.profile.branchId || '',
      branchName: APP.profile.branchName || ''
    };
    if (payload.uid) sessionStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(payload));
  } catch (e) {}
}
function clearCachedProfile() { try { sessionStorage.removeItem(PROFILE_CACHE_KEY); } catch (e) {} }
function hideLoaderNow() { const el = document.getElementById('loader'); if (el) el.classList.add('hide'); }
function forceLogout(reason) {
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  awayStartedAt = null;
  try { sessionStorage.clear(); sessionStorage.setItem('__redirectReason', reason || 'expired'); } catch (e) {}
  clearSession(); clearCachedProfile();
  try { signOut(auth); } catch (e) {}
  window.location.replace(LOGIN_URL);
}
function isWindowActive() { return document.visibilityState === 'visible' && document.hasFocus(); }
function startAwayTimer() {
  if (awayStartedAt) return;
  awayStartedAt = Date.now();
  if (awayCheckInterval) clearInterval(awayCheckInterval);
  awayCheckInterval = setInterval(() => {
    if (!awayStartedAt) return;
    if (Date.now() - awayStartedAt >= getSessionMs()) { forceLogout('expired'); return; }
  }, 1000);
}
function stopAwayTimer() { awayStartedAt = null; if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; } }
function evaluateActivity() {
  if (isWindowActive()) {
    if (awayStartedAt) { const away = Date.now() - awayStartedAt; if (away >= getSessionMs()) { forceLogout('expired'); return; } }
    stopAwayTimer();
  } else { startAwayTimer(); }
}
function startSessionWatcher() {
  document.addEventListener('visibilitychange', evaluateActivity);
  window.addEventListener('focus', evaluateActivity);
  window.addEventListener('blur', evaluateActivity);
  evaluateActivity();
}
async function loadSessionTimeout() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const data = snap.data();
      let mins = DEFAULT_SESSION_MINUTES;
      if (data.sessionTimeout != null) mins = Number(data.sessionTimeout);
      else if (data.sessionTimeoutMinutes != null) mins = Number(data.sessionTimeoutMinutes);
      if (!isFinite(mins) || mins < 1) mins = DEFAULT_SESSION_MINUTES;
      if (mins > 1440) mins = 1440;
      SESSION_MINUTES = Math.round(mins);
    } else {
      SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
    }
  } catch (e) {
    if (SESSION_MINUTES == null) SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
  }
  try {
    const s = readSession();
    if (s) { s.minutes = SESSION_MINUTES; sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  } catch (e) {}
}

const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
const toDate = (v) => { if (!v) return null; if (v.toDate) return v.toDate(); if (typeof v === 'string') return new Date(v); return v; };
const fmtDate = (v) => { if (!v) return '—'; const d = toDate(v); if (!d || isNaN(d)) return '—'; return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); };
const fmtTime = (v) => { if (!v) return '—'; const d = toDate(v); if (!d || isNaN(d)) return '—'; return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
const fmtDateTime = (v) => { if (!v) return '—'; const d = toDate(v); if (!d || isNaN(d)) return '—'; return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
function fmtDuration(ms) {
  if (ms == null || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const parts = [];
  if (d) parts.push(d + 'd');
  if (h) parts.push(h + 'h');
  if (m) parts.push(m + 'm');
  if (sec || !parts.length) parts.push(sec + 's');
  return parts.join(' ');
}

  wrap.appendChild(el);

}

/* ════════════════════════════════════════════════════════════
   Logout sub-kind: manual vs timeout (both still action='logout')
════════════════════════════════════════════════════════════ */
function logoutKind(entry) {
  if (!entry || entry.action !== 'logout') return '';
  const d = String(entry.details || '').toLowerCase();
  if (d.includes('timeout') || d.includes('auto logout')) return 'timeout';
  return 'manual';
}

/* ════════════════════════════════════════════════════════════
   Session duration — for every logout entry, find the most
   recent prior login for the same user and compute the delta.
   Falls back through userId → userEmail → userDisplayName → userName.
════════════════════════════════════════════════════════════ */
function computeSessionDurations() {
  APP.sessionDurations = new Map();
  const loginsByUser = new Map();

  APP.entries.forEach(e => {
    if (e.action !== 'login') return;
    const key = e.userId || e.userEmail || e.userDisplayName || e.userName;
    if (!key) return;
    if (!loginsByUser.has(key)) loginsByUser.set(key, []);
    loginsByUser.get(key).push(e);
  });
  loginsByUser.forEach(arr =>
    arr.sort((a, b) => (toDate(a.timestamp)?.getTime() || 0) - (toDate(b.timestamp)?.getTime() || 0))
  );

  APP.entries.forEach(e => {
    if (e.action !== 'logout') return;
    const key = e.userId || e.userEmail || e.userDisplayName || e.userName;
    if (!key) return;
    const logoutTime = toDate(e.timestamp)?.getTime() || 0;
    if (!logoutTime) return;
    const logins = loginsByUser.get(key) || [];
    let bestLoginTime = 0;
    for (const login of logins) {
      const lt = toDate(login.timestamp)?.getTime() || 0;
      if (lt && lt <= logoutTime && lt > bestLoginTime) bestLoginTime = lt;
    }
    if (bestLoginTime) APP.sessionDurations.set(e.id, logoutTime - bestLoginTime);
  });
}

function wireMainEvents() {
  document.getElementById('testConnectionBtn')?.addEventListener('click', testConnection);
  document.getElementById('refreshBtn')?.addEventListener('click', async () => {
    await loadUsersPhotoCache();
    await loadAuditEntries();
    toast(t('refreshed'), 'success');
  });
  const s = document.getElementById('fltSearch');
  s?.addEventListener('input', debounce(() => { APP.filters.search = s.value; APP.page = 1; applyFilters(); }, 220));
  document.getElementById('fltAction')?.addEventListener('change', (e) => { APP.filters.action = e.target.value; APP.page = 1; applyFilters(); });
  document.getElementById('fltCollection')?.addEventListener('change', (e) => { APP.filters.collection = e.target.value; APP.page = 1; applyFilters(); });
  document.getElementById('fltUser')?.addEventListener('change', (e) => { APP.filters.user = e.target.value; APP.page = 1; applyFilters(); });
  document.getElementById('prevPage')?.addEventListener('click', () => { if (APP.page > 1) goToPage(APP.page - 1); });
  document.getElementById('nextPage')?.addEventListener('click', () => { const tp = Math.ceil(APP.filtered.length / APP.pageSize); if (APP.page < tp) goToPage(APP.page + 1); });
  document.getElementById('pageNumbers')?.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-page]');
    if (btn) goToPage(Number(btn.dataset.page));
  });
  document.getElementById('auditBody')?.addEventListener('click', (e) => {
    const viewBtn = e.target.closest('[data-view]');
    if (viewBtn) { showDetails(viewBtn.dataset.view); return; }
    const delBtn = e.target.closest('[data-delete]');
    if (delBtn) { showDeleteModal(delBtn.dataset.delete); return; }
  });
}
let _debTimer;
function debounce(fn, ms) { return function (...args) { clearTimeout(_debTimer); _debTimer = setTimeout(() => fn.apply(this, args), ms); }; }

/* ── Populate user filter ─────────────────────────────── */
function populateUserFilter() {
  const sel = document.getElementById('fltUser');
  if (!sel) return;
  const users = new Set();
  APP.entries.forEach(e => {
    if (e.userName) users.add(e.userName);
    if (e.userEmail) users.add(e.userEmail);
    if (e.userDisplayName) users.add(e.userDisplayName);
  });
  const cur = APP.filters.user || 'all';
  sel.innerHTML = `<option value="all">${esc(t('allUsers'))}</option>` +
    Array.from(users).sort().map(u => `<option value="${esc(u)}" ${cur === u ? 'selected' : ''}>${esc(u)}</option>`).join('');
  if (cur !== 'all' && !users.has(cur)) sel.value = 'all';
}

/* ── Filters ──────────────────────────────────────────── */
function applyFilters() {
  const { search, action, collection, user } = APP.filters;
  const q = (search || '').toLowerCase().trim();
  APP.filtered = APP.entries.filter(e => {
    if (action !== 'all' && e.action !== action) return false;
    if (collection !== 'all' && e.collection !== collection) return false;
    if (user !== 'all' && e.userName !== user && e.userEmail !== user && e.userDisplayName !== user) return false;
    if (!q) return true;
    return (
      (e.userName && e.userName.toLowerCase().includes(q)) ||
      (e.userEmail && e.userEmail.toLowerCase().includes(q)) ||
      (e.userDisplayName && e.userDisplayName.toLowerCase().includes(q)) ||
      (e.action && e.action.toLowerCase().includes(q)) ||
      (e.collection && e.collection.toLowerCase().includes(q)) ||
      (e.documentId && e.documentId.toLowerCase().includes(q)) ||
      (e.details && e.details.toLowerCase().includes(q))
    );
  });
  paginate();
  updateStats();
}
function paginate() {
  const start = (APP.page - 1) * APP.pageSize;
  const items = APP.filtered.slice(start, start + APP.pageSize);
  renderTable(items);
  updatePagination();
}

/* ════════════════════════════════════════════════════════════
   Table rendering — logout rows show session duration inline
   and a "Manual" / "Timeout" sub-badge
════════════════════════════════════════════════════════════ */
function renderTable(items) {
  const tbody = document.getElementById('auditBody');
  if (!tbody) return;
  if (!items || !items.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><i class="fas fa-clipboard-list"></i><div class="empty__title">${esc(t('noAudit'))}</div></div></td></tr>`;
    return;
  }
  const actionCls = {
    login:'tag--login', logout:'tag--logout', created:'tag--created', updated:'tag--updated',
    deleted:'tag--deleted', approved:'tag--approved', rejected:'tag--rejected',
    generated:'tag--generated', printed:'tag--printed',
    penalty_paid:'tag--penalty_paid', penalty_approved:'tag--penalty_approved', penalty_rejected:'tag--penalty_rejected'
  };
  const actionLabel = (a) => t(a) || (a ? a.charAt(0).toUpperCase() + a.slice(1).replace(/_/g, ' ') : '—');
  const superAdmin = isSuper();

  tbody.innerHTML = items.map((e, i) => {
    const dt = toDate(e.timestamp);
    const dateRow = dt
      ? `<div style="font-weight:700;color:var(--text);">${dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}</div><div style="font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;">${dt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>`
      : '—';
    const uName = e.userDisplayName || e.userName || e.userEmail || t('unknown');
    const cached = e.userId ? APP.userCache.get(e.userId) : null;
    const photoURL = (cached && cached.photoURL) || e.userPhoto || e.photoURL || '';
    const avatar = photoURL ? `<img src="${esc(photoURL)}" alt="" onerror="this.style.display='none'">` : esc(initials(uName));
    const roleRaw = e.userRole || (cached && cached.role) || '';
    const roleTxt = roleLabel(roleRaw);
    const hasChanges = e.changes && Object.keys(e.changes).length > 0;

    // ⚡ logout sub-kind + inline session duration
    const kind = logoutKind(e);
    const durMs = APP.sessionDurations.get(e.id);
    const detailsBase = esc((e.details || '').slice(0, 60) || '—');
    const detailsCell = (e.action === 'logout' && durMs)
      ? `${detailsBase}<div style="font-size:11px;color:#0e7490;font-weight:700;margin-top:2px;"><i class="fas fa-clock" style="font-size:10px;"></i> ${esc(fmtDuration(durMs))}</div>`
      : detailsBase;

    const actionBase = `<span class="tag ${actionCls[e.action] || 'tag--gray'}">${esc(actionLabel(e.action))}</span>`;
    let actionCell = actionBase;
    if (kind === 'timeout') {
      actionCell = `${actionBase}<div style="font-size:9.5px;font-weight:800;color:#b8860b;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-clock" style="font-size:8px;"></i> ${esc(t('timeoutLogout'))}</div>`;
    } else if (kind === 'manual') {
      actionCell = `${actionBase}<div style="font-size:9.5px;font-weight:800;color:#0b5cab;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-hand-pointer" style="font-size:8px;"></i> ${esc(t('manualLogout'))}</div>`;
    }

    const actionsCell = `
      <div class="row-actions">
        ${hasChanges ? `<button data-view="${esc(e.id)}"><i class="fas fa-eye"></i> ${esc(t('detailsBtn'))}</button>` : ''}
        ${superAdmin ? `<button class="danger" data-delete="${esc(e.id)}"><i class="fas fa-trash"></i> ${esc(t('deleteBtn'))}</button>` : ''}
      </div>`;

    return `
      <tr>
        <td>${(APP.page - 1) * APP.pageSize + i + 1}</td>
        <td style="font-size:12px;color:var(--text-soft);">${dateRow}</td>
        <td><div class="cust-cell"><div class="cust-avatar">${avatar}</div><div style="min-width:0;"><div class="name" style="font-size:13px;">${esc(uName)}</div>${roleTxt ? `<div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;">${esc(roleTxt)}</div>` : ''}</div></div></td>
        <td>${actionCell}</td>
        <td><span class="tag tag--gray">${esc(e.collection || '—')}</span></td>
        <td class="mono">${esc((e.documentId || '—').slice(0, 12))}</td>
        <td style="font-size:12px;color:var(--muted);">${detailsCell}</td>
        <td style="text-align:right;">${actionsCell}</td>
      </tr>`;
  }).join('');
}
function updateStats() {
  const counts = { login:0, logout:0, created:0, updated:0, deleted:0, approved:0, rejected:0, generated:0, printed:0, penalty_paid:0, penalty_approved:0, penalty_rejected:0 };
  APP.filtered.forEach(e => { if (counts[e.action] !== undefined) counts[e.action]++; });
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('loginCount', counts.login);
  set('logoutCount', counts.logout);
  set('createdCount', counts.created);
  set('updatedCount', counts.updated);
  set('deletedCount', counts.deleted);
  set('approvedCount', counts.approved);
  set('rejectedCount', counts.rejected);
  set('generatedCount', counts.generated);
  set('printedCount', counts.printed);
  set('penaltyPaidCount', counts.penalty_paid);
  set('penaltyApprovedCount', counts.penalty_approved);
  set('penaltyRejectedCount', counts.penalty_rejected);
  set('totalAuditCount', APP.filtered.length);
  set('totalAuditCountPagination', APP.filtered.length);
}
function updatePagination() {
  const total = APP.filtered.length;
  const start = (APP.page - 1) * APP.pageSize + 1;
  const end = Math.min(APP.page * APP.pageSize, total);
  const ps = document.getElementById('pageStart');
  const pe = document.getElementById('pageEnd');
  const tp = document.getElementById('totalAuditCountPagination');
  if (ps) ps.textContent = total > 0 ? start : 0;
  if (pe) pe.textContent = total > 0 ? end : 0;
  if (tp) tp.textContent = total;
  const prev = document.getElementById('prevPage');
  const next = document.getElementById('nextPage');
  if (prev) prev.disabled = APP.page === 1;
  if (next) next.disabled = APP.page >= Math.ceil(total / APP.pageSize) || total === 0;
  const pages = Math.ceil(total / APP.pageSize);
  const container = document.getElementById('pageNumbers');
  if (!container) return;
  if (pages <= 1) { container.innerHTML = ''; return; }
  const maxV = 5;
  let sp = Math.max(1, APP.page - Math.floor(maxV / 2));
  let ep = Math.min(pages, sp + maxV - 1);
  if (ep - sp < maxV - 1) sp = Math.max(1, ep - maxV + 1);
  let html = '';
  if (sp > 1) {
    html += `<button data-page="1" class="${APP.page===1?'is-current':''}">1</button>`;
    if (sp > 2) html += `<button disabled>…</button>`;
  }
  for (let i = sp; i <= ep; i++) {
    html += `<button data-page="${i}" class="${i === APP.page ? 'is-current' : ''}">${i}</button>`;
  }
  if (ep < pages) {
    if (ep < pages - 1) html += `<button disabled>…</button>`;
    html += `<button data-page="${pages}" class="${APP.page===pages?'is-current':''}">${pages}</button>`;
  }
  container.innerHTML = html;
}
function goToPage(page) {
  const totalPages = Math.ceil(APP.filtered.length / APP.pageSize);
  if (page < 1 || page > totalPages) return;
  APP.page = page;
  paginate();
  document.querySelector('.card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── Details modal ───────────────────────────────────── */
function showDetails(entryId) {
  const e = APP.entries.find(x => x.id === entryId);
  if (!e) return;
  closeModal();
  const uName = e.userDisplayName || e.userName || e.userEmail || t('unknown');
  const cached = e.userId ? APP.userCache.get(e.userId) : null;
  const photoURL = (cached && cached.photoURL) || e.userPhoto || e.photoURL || '';
  const avatar = photoURL ? `<img src="${esc(photoURL)}" alt="" onerror="this.style.display='none'">` : esc(initials(uName));
  const roleTxt = roleLabel(e.userRole || (cached && cached.role) || '');
  const meta = [roleTxt, e.userEmail].filter(Boolean).join(' · ');

  // ⚡ always show duration row for logout entries
  let durationHtml = '';
  if (e.action === 'logout') {
    const durMs = APP.sessionDurations.get(e.id);
    durationHtml = `<div class="review__row"><span class="review__k">${esc(t('sessionDuration'))}</span><span class="review__v not-mono">${durMs ? esc(fmtDuration(durMs)) : '—'}</span></div>`;
  }

  let changesHtml = `<p style="color:var(--muted);font-size:13px;">${esc(t('noChanges'))}</p>`;
  const changes = e.changes || {};
  if (Object.keys(changes).length) {
    let rows = '';
    Object.entries(changes).forEach(([k, v]) => {
      let oldV = '—', newV = '—';
      if (v && typeof v === 'object' && ('old' in v || 'new' in v)) {
        oldV = (v.old !== undefined && v.old !== null) ? String(v.old) : '—';
        newV = (v.new !== undefined && v.new !== null) ? String(v.new) : '—';
      } else {
        newV = (v !== undefined && v !== null) ? (typeof v === 'object' ? JSON.stringify(v) : String(v)) : '—';
      }
      if (oldV.length > 240) oldV = oldV.slice(0, 240) + '…';
      if (newV.length > 240) newV = newV.slice(0, 240) + '…';
      rows += `<tr><td class="key">${esc(k)}</td><td class="old">${esc(oldV)}</td><td class="new">${esc(newV)}</td></tr>`;
    });
    changesHtml = `<table class="changes-table"><thead><tr><th>${esc(t('field'))}</th><th>${esc(t('oldValue'))}</th><th>${esc(t('newValue'))}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // ⚡ action cell with manual/timeout sub-badge
  const kind = logoutKind(e);
  let actionInlineBadge = '';
  if (kind === 'timeout') {
    actionInlineBadge = ` <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:#fdf5e0;color:#b8860b;margin-left:6px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-clock" style="font-size:8px;"></i> ${esc(t('timeoutLogout'))}</span>`;
  } else if (kind === 'manual') {
    actionInlineBadge = ` <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:#eaf3fc;color:#0b5cab;margin-left:6px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-hand-pointer" style="font-size:8px;"></i> ${esc(t('manualLogout'))}</span>`;
  }

  const root = document.createElement('div');
  root.className = 'modal-backdrop';
  root.id = 'modal-backdrop';
  root.innerHTML = `
    <div class="modal modal--lg">
      <div class="modal__head">
        <div><div class="modal__title">${esc(t('auditDetails'))}</div><div class="modal__sub">${esc(fmtDateTime(e.timestamp))}</div></div>
        <button class="modal__close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__body">
        <div class="detail-user-head">
          <div class="detail-user-avatar">${avatar}</div>
          <div class="detail-user-info">
            <div class="detail-user-name">${esc(uName)}</div>
            ${meta ? `<div class="detail-user-meta">${esc(meta)}</div>` : ''}
          </div>
        </div>
        <div class="review" style="margin-bottom:16px;">
          <div class="review__row"><span class="review__k">${esc(t('date'))}</span><span class="review__v not-mono">${esc(fmtDate(e.timestamp))}</span></div>
          <div class="review__row"><span class="review__k">${esc(t('time'))}</span><span class="review__v not-mono">${esc(fmtTime(e.timestamp))}</span></div>
          <div class="review__row"><span class="review__k">${esc(t('device'))}</span><span class="review__v not-mono">${esc(e.device || '—')}</span></div>
          ${durationHtml}
          <div class="review__row"><span class="review__k">${esc(t('action'))}</span><span class="review__v not-mono">${esc(t(e.action) || e.action || '—')}${actionInlineBadge}</span></div>
          <div class="review__row"><span class="review__k">${esc(t('collection'))}</span><span class="review__v">${esc(e.collection || '—')}</span></div>
          <div class="review__row"><span class="review__k">${esc(t('documentId'))}</span><span class="review__v">${esc(e.documentId || '—')}</span></div>
        </div>
        <div style="font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-soft);"><i class="fas fa-edit" style="color:var(--primary);margin-right:6px;"></i>${esc(t('changes'))}</div>
        <div>${changesHtml}</div>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  escHandler = (ev) => { if (ev.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  root.addEventListener('click', (ev) => { if (ev.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
}

let pendingDeleteId = null;
function showDeleteModal(entryId) {
  if (!isSuper()) { toast(t('unauthorized'), 'error'); return; }
  pendingDeleteId = entryId;
  closeModal();
  const root = document.createElement('div');
  root.className = 'modal-backdrop';

      </div>
      <div class="modal__body">
        <div class="alert alert--warning" style="margin:0;"><i class="fas fa-exclamation-triangle"></i><div><strong>⚠️ ${esc(t('deleteWarning'))}</strong></div></div>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>${esc(t('cancel'))}</button>
        <button class="btn btn--danger" id="confirmDel"><i class="fas fa-trash"></i> ${esc(t('delete'))}</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  escHandler = (ev) => { if (ev.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  root.addEventListener('click', (ev) => { if (ev.target === root) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  document.getElementById('confirmDel')?.addEventListener('click', confirmDelete);
}
async function confirmDelete() {
  if (!pendingDeleteId) return;
  if (!isSuper()) { toast(t('unauthorized'), 'error'); closeModal(); return; }
  const btn = document.getElementById('confirmDel');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  try {
    await deleteDoc(doc(db, 'audit', pendingDeleteId));
    toast(t('deleteSuccess'), 'success');
    closeModal();
    await loadAuditEntries();
  } catch (err) {
    toast(t('deleteError') + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

    <div class="modal modal--sm">

async function performLogout() {
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  awayStartedAt = null;
  try { sessionStorage.clear(); } catch (e) {}
  clearCachedProfile();
  try { await signOut(auth); } catch (e) {}
  window.location.replace(LOGIN_URL);
}

let escHandler = null;
function closeModal() { const el = document.getElementById('modal-backdrop'); if (el) el.remove(); if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; } }

/* ── Test connection ─────────────────────────────────── */
async function testConnection() {
  try {
    await getDocs(query(collection(db, 'audit'), limit(1)));
    toast(t('connectionSuccess'), 'success');
  } catch (e) {
    toast(t('connectionFailed') + e.message, 'error');
  }
}

/* ── Load data ───────────────────────────────────────── */
async function loadUsersPhotoCache() {
  try {
    const snap = await getDocs(collection(db, 'users'));
    snap.forEach(d => {
      const data = d.data();
      APP.userCache.set(d.id, {
        photoURL: data.photoURL || data.photo || data.avatar || '',
        displayName: data.fullName || data.displayName || data.name || '',
        role: data.role || 'viewer',
        email: data.email || ''
      });
    });
  } catch (e) { console.warn('[users cache]', e.message); }
}
async function loadAuditEntries() {
  try {
    const q = query(collection(db, 'audit'), orderBy('timestamp', 'desc'), limit(500));
    const snap = await getDocs(q);
    APP.entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (APP.userCache.size === 0) await loadUsersPhotoCache();
    computeSessionDurations();
    populateUserFilter();
    applyFilters();
  } catch (err) {
    console.error('[audit]', err);
    const msg = err.code === 'permission-denied' ? t('permissionsDenied') : err.message;
    toast(msg, 'error');
    APP.entries = [];
    applyFilters();
  }
}

/* ── Language ────────────────────────────────────────── */
function setLang(lang) {
  if (!SUPPORTED.includes(lang)) lang = FALLBACK;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

/* ── BOOT — instant render with cached profile ──────── */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  const hasMis = sessionStorage.getItem('loggedIn') === 'true' && sessionStorage.getItem('uid');
  if (!isSessionRecordValid(sess) && !hasMis) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const cachedProfile = readCachedProfile();
  let rendered = false;
  if (cachedProfile && cachedProfile.uid) {
    APP.profile = {
      id: cachedProfile.uid,
      role: cachedProfile.role || 'viewer',
      email: cachedProfile.email || '',
      fullName: cachedProfile.name || 'User',
      photoURL: cachedProfile.photoURL || null,
      districtId: cachedProfile.districtId || '',
      districtName: cachedProfile.districtName || '',
      branchId: cachedProfile.branchId || '',
      branchName: cachedProfile.branchName || ''
    };
    renderShell();
    renderMain();
    hideLoaderNow();
    rendered = true;
  } else if (hasMis) {
    APP.profile = {
      id: sessionStorage.getItem('uid'),
      role: sessionStorage.getItem('role') || 'viewer',
      email: sessionStorage.getItem('email') || '',
      fullName: sessionStorage.getItem('userName') || 'User',
      photoURL: null,
      districtId: '', districtName: '', branchId: '', branchName: ''
    };
    renderShell();
    renderMain();
    hideLoaderNow();
  }

  const user = await new Promise((resolve) => { const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); }); });
  if (!user) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  if (sess && user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession(); clearCachedProfile();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    const d = snap.data();
    if (d.status === 'inactive') throw new Error('inactive');
    APP.profile = { id: snap.id, ...d, email: user.email || '' };
    writeCachedProfile();
  } catch (e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e2){}
    clearSession(); clearCachedProfile();
    try { await signOut(auth); } catch(e2){}
    window.location.replace(LOGIN_URL);
    return;
  }

  if (APP.profile.role !== 'super_admin') {
    renderShell();
    renderMain();
    hideLoaderNow();
    toast(t('unauthorized'), 'error');
    setTimeout(() => window.location.replace('dashboard.html'), 2000);
    return;
  }

  const profileChanged = !rendered ||
    (cachedProfile && (
      (cachedProfile.name !== (APP.profile.fullName || APP.profile.name)) ||
      cachedProfile.role !== APP.profile.role ||
      cachedProfile.photoURL !== APP.profile.photoURL
    ));
  if (profileChanged) { renderShell(); renderMain(); }
  hideLoaderNow();

  await loadSessionTimeout();
  startSessionWatcher();

  try {
    const cfg = await getDoc(doc(db, 'settings', 'system'));
    if (cfg.exists()) {
      const d = cfg.data();
      if (d.saccoName && String(d.saccoName).trim()) APP.saccoName = String(d.saccoName).trim();
    }
  } catch (e) {}

  await loadUsersPhotoCache();
  await loadAuditEntries();
})();

console.log('[sacco] audit page ready — session duration inline, manual/timeout sub-badges');
</script>
